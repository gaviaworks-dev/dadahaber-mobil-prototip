<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>Açılış</title>
<!--
  AÇILIŞ (splash) · kök dili: marka sarısı tam ekran, ortada "dada" logosu, altta ince yükleniyor çubuğu.
  Parametreler:
    ?durum=yukleniyor  (varsayılan) logo + yükleniyor çubuğu + o anki baskının adı
    ?tema=koyu         koyu zemin, sarı logo (cerceve.js)
  (?durum=guncelleme bu dosyada değil; başka bir ekranın işi.)
  Notlar: iOS'ta sistemin durağan açılış görüntüsü yalnız zemin + logodur; çubuk ve baskı satırı uygulama yüklendikten sonra
  aynı zeminde belirir (geçiş görünmez). Android 12+ sistem açılış API'si: simge + zemin rengi aynı.
  Görsel yolu: bu klasör iki kat derinde, G() yerine ../../../assets kullanılır.
-->
<link rel="stylesheet" href="../../_ortak/cerceve.css">
<link rel="stylesheet" href="../../_ortak/marka.css">
<script src="../../_ortak/icerik.js"></script>
<script src="../../_ortak/cerceve.js"></script>
<script src="../../_ortak/icerik-ek.js"></script>
<style>
:root{--ac-zemin:var(--marka);--ac-yazi:var(--siyah);--ac-iz:rgba(18,18,18,.14);--ac-dolu:var(--siyah);
  --ac-logo:url("../../../assets/gorsel/logo/dada-beyaz.svg")}
html[data-tema="koyu"]{--ac-zemin:var(--siyah);--ac-yazi:var(--metin);--ac-iz:rgba(255,255,255,.12);--ac-dolu:var(--marka);
  --ac-logo:url("../../../assets/gorsel/logo/dada-beyaz.svg")}
html,body{background:var(--ac-zemin)}
.ekran{background:var(--ac-zemin);color:var(--ac-yazi);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.ac-logo{width:168px;aspect-ratio:2942/991;background:var(--ac-logo) center/contain no-repeat} /* sistem açılış görüntüsüyle aynı yerde, girişsiz: geçiş görünmez */
.ac-alt{position:absolute;left:var(--kenar);right:var(--kenar);bottom:calc(var(--alt-guvenli) + 40px);display:flex;flex-direction:column;align-items:center;gap:14px}
.ac-cubuk{width:72px;height:3px;border-radius:var(--k-cubuk);background:var(--ac-iz);overflow:hidden;position:relative}
.ac-cubuk::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;border-radius:var(--k-cubuk);background:var(--ac-dolu);animation:kos 1.2s -.5s ease-in-out infinite}
.ac-baski{display:inline-flex;align-items:center;gap:var(--ikon-bosluk);font-size:13px;font-weight:var(--y-orta);opacity:.72;white-space:nowrap}
@keyframes kos{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
</style>
</head>
<body>
<main class="ekran" id="ekran" aria-busy="true">
  <span class="ac-logo" role="img" aria-label="Dada Haber"></span>
  <div class="ac-alt" role="status">
    <span class="ac-cubuk" aria-hidden="true"></span>
    <span class="ac-baski" id="baski"></span>
  </div>
</main>
<script>
(function(){
  /* o anki baskı (K16): Sabah 07.00 · Öğleden Sonra 16.00 · Akşam 19.00; "şimdi" D.simdi.saat */
  var s = parseFloat(D.simdi.saat), b = s >= 19 ? ['Akşam', 'fa-moon'] : s >= 16 ? ['Öğleden Sonra', 'fa-sun'] : ['Sabah', 'fa-mug-hot'];
  document.getElementById('baski').innerHTML = '<i class="fa-solid ' + b[1] + '"></i>' + b[0] + ' Baskısı hazırlanıyor';
  /* durum çubuğu: sarı zeminde koyu, koyu temada açık */
  document.addEventListener('DOMContentLoaded', function(){
    var koyu = document.documentElement.getAttribute('data-tema') === 'koyu';
    document.body.setAttribute('data-durum', koyu ? 'acik' : 'koyu');
  });
})();
</script>
</body>
</html>

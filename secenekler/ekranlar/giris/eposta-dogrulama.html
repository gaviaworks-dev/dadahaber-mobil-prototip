<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>E-posta doğrulama</title>
<!-- Dada Haber Mobil · E-POSTA DOĞRULAMA (E-452–E-455). Üye ol'dan sonra; itme ekranı (geri), alt çubuk yok.
     Sorgu: (yok) E-452 bekliyor: adres gösterilir, E-posta uygulamasını aç, sayaçlı Yeniden gönder, Adresi değiştir, "Beklerken okumaya devam et"
            | ?durum=gonderildi (E-453) kısa bildirim "Doğrulama e-postası yeniden gönderildi" + sayaç 1:00'dan yeniden başlar
            | dogrulandi (E-454) onay → İlgi alanlarını seç (konu seçimi) ya da Ana sayfaya git (kaldığı yer)
            | gecersiz (E-455) bağlantının süresi dolmuş ya da kullanılmış: Yeni bağlantı gönder · ?tema=koyu
     Kaynak: public eposta-dogrula.html, eposta-dogrulandi.html (metinler; bağlantı 24 saat geçerli; örnek adres ece.yilmaz@eposta.com).
     Derin bağlantı: e-postadaki doğrulama bağlantısı uygulama yüklüyse ?durum=dogrulandi ile açar (Universal Links / App Links).
     Varsayım (onaylanmadı): yeniden gönderme sayacı 60 sn; "Adresi değiştir" Üye ol formuna e-posta alanı odakta döner. -->
<link rel="stylesheet" href="../../_ortak/cerceve.css">
<link rel="stylesheet" href="../../_ortak/marka.css">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../_ortak/icerik.js"></script>
<script src="../../_ortak/cerceve.js"></script>
<script src="../../_ortak/icerik-ek.js"></script>
<script src="../../kit/kit.js"></script>
<style>
/* yerleşim (bileşen biçimi değil): sonuç halleri üst çubukla alt güvenli alan arasında dikey ortalı */
.hk{min-height:calc(100% - var(--k-ub-h) - var(--alt-guvenli));display:flex;flex-direction:column;justify-content:center}
.hk .k-bos{padding-top:var(--b-24)}
.hk .k-bos p b{color:var(--metin)}
.hk .k-bag{margin-top:var(--b-16)}
.hk .k-bag+.k-bag{margin-top:0}
</style>
</head>
<body>
<div class="ekran" id="ekran"></div>
<script>
(function(){
  var DUR = K.durum, e = document.getElementById('ekran');
  var EP = 'ece.yilmaz@eposta.com'; /* kaynak: public eposta-dogrula.html */
  var YOL = 'ekranlar/giris/eposta-dogrulama.html', o;
  if (DUR === 'dogrulandi') o = { ikon: 'fa-circle-check', baslik: 'E-posta adresin doğrulandı', aciklama: 'Hesabın hazır. Ana sayfanı senin için doldurmak için birkaç seçim kaldı.',
    eylem: { metin: 'İlgi alanlarını seç', href: 'konuSecimi' }, ikinci: { metin: 'Ana sayfaya git', href: K.git('ana', 'uye=1') } };
  else if (DUR === 'gecersiz') o = { hata: true, ikon: 'fa-link-slash', baslik: 'Doğrulama bağlantısı geçersiz', aciklama: 'Bağlantının süresi dolmuş ya da daha önce kullanılmış. <b>' + EP + '</b> adresine yeni bir bağlantı gönderebiliriz.',
    eylem: { metin: 'Yeni bağlantı gönder', ikon: 'fa-paper-plane', href: K.u(YOL, 'durum=gonderildi') }, ikinci: { metin: 'Adresi değiştir', href: K.git('uyeOl') } };
  else o = { ikon: 'fa-envelope-open-text', baslik: 'E-postanı doğrula', aciklama: 'Üyeliğini tamamlamak için <b>' + EP + '</b> adresine gönderdiğimiz bağlantıya dokun. Bağlantı 24 saat geçerli.',
    eylem: { metin: 'E-posta uygulamasını aç', ikon: 'fa-envelope', attr: 'data-toast="E-posta uygulaması açılıyor"' }, ikinci: { metin: 'Yeniden gönder · ' + (DUR === 'gonderildi' ? '1:00' : '0:42'), tur: 'metin', pasif: true, attr: 'id="yg"' },
    ek: '<a class="k-bag" href="' + K.git('uyeOl') + '">Adresi değiştir</a><a class="k-bag" href="' + K.git('ana', 'uye=1') + '">Beklerken okumaya devam et' + K.I('fa-chevron-right') + '</a>' };
  e.innerHTML = '<div class="k-ust-bosluk"></div><div class="hk">' + K.bos(o) + '</div><div class="k-son yalin"></div>';
  K.ustCubuk({ geri: true, baslik: DUR === 'dogrulandi' ? 'Doğrulandı' : 'E-posta doğrulama' });

  /* yeniden gönder: sayaç; bitince açılır, dokununca kısa bildirim + sayaç yeniden başlar (E-453) */
  var yg = document.getElementById('yg'), s, z;
  function bas(sn){ s = sn; clearInterval(z); yg.setAttribute('disabled', ''); yaz();
    z = setInterval(function(){ s--; if (s > 0) return yaz(); clearInterval(z); yg.removeAttribute('disabled'); yg.querySelector('span').textContent = 'Yeniden gönder'; }, 1000); }
  function yaz(){ yg.querySelector('span').textContent = 'Yeniden gönder · ' + Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
  if (yg) { bas(DUR === 'gonderildi' ? 60 : 42);
    yg.addEventListener('click', function(){ K.toast('Doğrulama e-postası yeniden gönderildi', { tur: 'basari', alt: EP }); bas(60); });
    if (DUR === 'gonderildi') K.toast('Doğrulama e-postası yeniden gönderildi', { tur: 'basari', alt: EP, sure: 0 }); }
})();
</script>
</body>
</html>

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>Oynatıcı</title>
<!-- Dada Haber Mobil · SES OYNATICISI (E-545–E-550). Tek oynatıcı: Spiker (fa-radio, Spiker'ın yüzü), Dinle (fa-headphones, haber görseli), podcast (K39).
     Mini oynatıcı varsayılan kapalıdır; bu ekran "bir şey çalıyor" halini gösterir (alt çubuğun üstünde, sayfalar arasında sürer).
     Sorgu: (yok) E-545 mini oynatıcı çalıyor, ana sayfanın üstünde · &tur=spiker (varsayılan) | dinle
            ?durum=tam E-546 tam ekran: kapak, başlık, ilerleme, ±15 sn, hız, sıradaki, Deşifre, Sıradakiler · &tur=spiker | dinle | podcast
            ?durum=hiz E-547 tam ekran + Oynatma hızı alt sayfası (0,75× – 2×) · &tur=…
            ?durum=sira E-548 tam ekran + Sıradakiler: Dinle'de sesli haber sırası (sürükle sırala, kaldır; ikinci satır sürükleniyor), Spiker'da bültenin haberleri (sıra sabit) · &tur=dinle (varsayılan) | spiker
            ?durum=degisti E-549 başka ses başladı: Spiker çalarken Dinle sekmesinde bir haber başlatıldı → Spiker durdu, mini oynatıcı Dinle'ye geçti, "Dada Spiker duraklatıldı · Sürdür" kısa bildirimi
            ?durum=hata E-550 mini oynatıcıda "Ses yüklenemedi" + Yeniden dene · &tur=spiker | dinle · ?uye=0 · ?tema=koyu
     Tek oynatıcı kuralı (K39): aynı anda tek ses; Akış sesi, video ya da yeni ses başlayınca önceki duraklar (K.spikerDurdur). Yüzen Spiker balonu yok.
     Platform notu: tam ekran oynatıcı aşağı kaydırınca küçülür (iki platformda); Android'de sistem geri tuşu da küçültür. Arka planda ve kilit ekranında süren ses için bkz. kilit-ekrani.html?durum=medya.
     Veri: D.spiker (16.00 Bülteni), D.detay (Dinle · 4 dk), D.gunun5.liste (sesli haber süreleri, Dinle sırası), D.podcast[0]. -->
<link rel="stylesheet" href="../../_ortak/cerceve.css">
<link rel="stylesheet" href="../../_ortak/marka.css">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../_ortak/icerik.js"></script>
<script src="../../_ortak/cerceve.js"></script>
<script src="../../_ortak/icerik-ek.js"></script>
<script src="../../kit/kit.js"></script>
<style>
/* KİT ADAYI (düzeltme): mini oynatıcının başlık bağlantısı (.k-mo .t) 31 px yüksek kalıyor; çubuk yüksekliğini (58) kaplar, dokunma alanı ≥44 */
.k-mo .t{align-self:stretch;display:flex;flex-direction:column;justify-content:center}
/* KİT ADAYI: sıra satırı (.sr-s) — oynatıcı "Sıradakiler" listesi: görsel, başlık, künye, kaldır, sürükleme tutamağı; kitte sıra listesi bileşeni yok.
   Sürüklenen satır yüzey + gölgeyle kalkar. Yalnız jetonlar. */
.sr-b{margin:var(--b-4) 0 var(--b-8);font-size:13px;font-weight:var(--y-kalin);color:var(--metin-3)}
.sr-l{display:grid;gap:var(--b-4)}
.sr-s{display:grid;grid-template-columns:48px minmax(0,1fr) var(--dokun) var(--dokun);gap:var(--b-12);align-items:center;min-height:64px;padding:var(--b-8) 0 var(--b-8) var(--b-8);border-radius:var(--k-kontrol);background:var(--yuzey)}
.sr-s .gr{width:48px;height:48px;border-radius:var(--k-ic);background:var(--zemin-2) center/cover no-repeat}
.sr-s .t{min-width:0}
.sr-s .t b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14.5px;line-height:1.3}
.sr-s .t small{display:flex;align-items:center;gap:var(--ikon-bosluk);margin-top:var(--b-4);font-size:12.5px;color:var(--metin-3);white-space:nowrap;overflow:hidden}
.sr-s button{width:var(--dokun);height:var(--dokun);display:grid;place-items:center;font-size:16px;color:var(--metin-3)}
.sr-s button.tut{cursor:grab}
.sr-s.simdi{background:var(--marka-25)}
.sr-s.simdi .t small{color:var(--marka-metin);font-weight:var(--y-kalin)}
.sr-s.surukle{box-shadow:var(--golge-md);transform:scale(1.02);position:relative;z-index:1}
.sr-s.sabit{grid-template-columns:48px minmax(0,1fr)}
</style>
</head>
<body>
<div class="ekran" id="ekran"></div>
<script>
(function(){
  var e = document.getElementById('ekran'), DUR = K.durum, Q = K.q, d = D.detay, S = D.spiker;
  var TUR = Q.get('tur') || (DUR === 'sira' ? 'dinle' : 'spiker');
  if (['spiker', 'dinle', 'podcast'].indexOf(TUR) < 0) TUR = 'spiker';

  /* arka plan 1: ana sayfa kökü (hero, hikâye şeridi, Son Dakika), kit parçalarıyla */
  function arkaAna(){ var M = D.manset[0];
    e.innerHTML = '<div class="k-kubbe"><span class="k-hilal"></span><div class="k-hero" style="background-image:' + G(M.g) + '">' + K.katEt(M.kat, M.ikon, { foto: true, ek: M.sure }) + '<h2>' + M.baslik + '</h2><span class="k-yz">' + K.avatar(M.yazar) + M.yazar + '</span>' + K.noktalar(5, 0, true) + '<span class="k-sayac foto">1 / 5</span></div></div>' +
      K.hikayeSerit() + '<section class="k-bant ton">' + K.bb({ baslik: 'Son Dakika', canli: true, baglanti: { metin: 'Tümü', href: K.git('sonDakika') } }) + K.ray(D.sonDakika.slice(0, 4).map(function(s, i){ return K.sd(s, i === 0); }).join(''), 's10') + '</section><div class="k-son"></div>';
    K.ustCubuk({ tur: 'foto', logo: true, eylemler: ['ara', 'hesap', 'menu'] });
    K.altCubuk('ana'); }
  /* arka plan 2: Dinle sekmesi (Spiker + sesli haberler) */
  function arkaDinle(){
    /* K48 saat (sırayla Günün 5'i haberleri): sözlük haberler[] aynı başlık — 15.00, 13.10, 15.35, 22 Kas; "YKS 2027 başvuru tarihleri belli oldu" sözlükte yok → public gunun-5-i.html baskı saati 07.00.
     Not: baskı 07.00 olduğu hâlde sözlükte ilk üç haberin saati baskıdan sonra (kaynak çelişkisi, olduğu gibi). */
    var G5_SAAT = ['15.00', '13.10', '15.35', '22 Kas', D.gunun5.baski];
    var X = D.gunun5.liste.map(function(x, i){ return { alt: x.kat, saat: G5_SAAT[i], baslik: x.baslik, sure: x.ses, g: x.g }; });
    e.innerHTML = '<div class="k-ust-bosluk"></div><section class="k-bl sik">' + K.bb({ baslik: 'Dada Spiker', ikon: 'fa-radio' }) + '<div class="k-ic">' + K.spiker() + '</div></section>' +
      '<section class="k-bl">' + K.bb({ baslik: 'Sesli Haberler', ikon: 'fa-headphones', not: 'Günün 5\'i · ' + D.gunun5.dinleme }) + '<div class="k-satirlar">' + X.map(function(h){ return K.satir(h); }).join('') + '</div></section><div class="k-son"></div>';
    K.ustCubuk({ baslik: 'Haber Dinle', eylemler: ['ara', 'hesap'] });
    K.altCubuk('dinle'); }

  /* tam ekran oynatıcı: kit Spiker/podcast; Dinle içeriği haberle doldurulur (KİT ADAYI: K.oynaticiTam tur:'dinle') */
  function tam(){
    /* tam ekran bütün ekranı kaplar: sayfanın içeriği olarak (durum çubuğu görünür; alt sayfalar üstüne açılır) */
    e.innerHTML = K.oynaticiTam({ tur: TUR === 'podcast' ? 'podcast' : 'spiker', yerinde: true });
    var oy = e.querySelector('.k-oy');
    var sm = oy.querySelector('.bas small'), dalga = '<span class="k-dalga"><i></i><i></i><i></i></span>';
    if (TUR === 'dinle') {
      oy.querySelector('.kapak').style.backgroundImage = G(d.g); oy.querySelector('.kapak').innerHTML = '';
      oy.querySelector('.u .t').innerHTML = 'Dinle<b>' + d.yol.join(' · ') + '</b>';
      sm.innerHTML = dalga + K.I('fa-headphones') + 'Dinle · ' + d.dinle;
      oy.querySelector('.bas h2').textContent = d.baslik;
      oy.querySelector('.bas p').textContent = d.yazar + ' · Sıra 1 / ' + D.gunun5.liste.length;
      var su = oy.querySelectorAll('.sure span'); su[0].textContent = '1:10'; su[1].textContent = '4:00';
      oy.querySelector('.alt .k-btn:last-child span').textContent = 'Sıradakiler · ' + (D.gunun5.liste.length - 1);
    } else if (TUR === 'spiker') sm.innerHTML = dalga + K.I('fa-radio') + 'Dada Spiker';
    oy.querySelector('.dn .hiz').classList.add('k-dk44'); /* kit hız düğmesi 52×36: görünmez 44 alan */
    oy.querySelector('.alt .k-btn:last-child').setAttribute('data-href', K.u('ekranlar/sistem/oynatici.html', 'durum=sira&tur=' + TUR));
    var kc = oy.querySelector('.u .k-ikon'); kc.removeAttribute('data-kapat'); kc.setAttribute('data-href', K.u('ekranlar/sistem/oynatici.html', TUR === 'spiker' ? '' : 'tur=' + TUR)); /* küçült → mini oynatıcı */
    return oy; }

  /* sıradakiler alt sayfası */
  function sira(){
    if (TUR === 'spiker') {
      var l = S.sirada.map(function(b, i){ return '<div class="sr-s sabit' + (i === 0 ? ' simdi' : '') + '"><span class="gr" style="background-image:' + G([S.gorsel, 'faiz', 'kar-istanbul'][i]) + '"></span><span class="t"><b>' + b + '</b><small>' + (i === 0 ? '<span class="k-dalga"><i></i><i></i><i></i></span>Şimdi okunuyor' : (i + 1) + ' / ' + S.sirada.length) + '</small></span></div>'; }).join('');
      K.sayfa({ baslik: 'Bu bültende', alt: 'Dada Spiker · ' + S.bulten + ' · sıra sabit', icerik: '<div class="sr-l">' + l + '</div>', acik: true });
      return; }
    var X = D.gunun5.liste;
    var simdi = '<p class="sr-b">Şimdi çalıyor</p><div class="sr-s sabit simdi"><span class="gr" style="background-image:' + G(d.g) + '"></span><span class="t"><b>' + d.baslik + '</b><small><span class="k-dalga"><i></i><i></i><i></i></span>' + K.I('fa-headphones') + 'Dinle · ' + d.dinle + '</small></span></div>';
    var sir = X.slice(1).map(function(x, i){ return '<div class="sr-s' + (i === 1 ? ' surukle' : '') + '"><span class="gr" style="background-image:' + G(x.g) + '"></span><span class="t"><b>' + x.baslik + '</b><small>' + x.kat + ' · ' + x.ses + '</small></span>' +
      '<button type="button" data-kaldir aria-label="Sıradan kaldır">' + K.I('fa-circle-minus') + '</button><button type="button" class="tut" aria-label="Sürükleyerek sırala">' + K.I('fa-grip-lines') + '</button></div>'; }).join('');
    var s = K.sayfa({ baslik: 'Sıradakiler', alt: 'Sürükleyerek sırala, istemediğini kaldır', icerik: simdi + '<p class="sr-b" style="margin-top:var(--b-16)">Sırada · ' + (X.length - 1) + '</p><div class="sr-l">' + sir + '</div>',
      eylemler: [{ metin: 'Sırayı temizle', tur: 'sade', attr: 'data-temizle' }], acik: true });
    s.el.addEventListener('click', function(ev){ var k = ev.target.closest('[data-kaldir]'); if (!k) return; var r = k.closest('.sr-s'), sonra = r.nextSibling, ust = r.parentNode; r.remove();
      K.toast('Sıradan kaldırıldı', { ikon: 'fa-headphones', geriAl: true, yer: document.body, eylemFn: function(){ ust.insertBefore(r, sonra); } }); });
  }

  /* mini oynatıcının statik hali (hata): kit "yerinde" biçimi alt çubuğun üstüne oturtulur */
  function miniStatik(o){
    document.body.insertAdjacentHTML('beforeend', K.oynatici(Object.assign({ yerinde: true }, o)).replace('k-mo yerinde', 'k-mo acik'));
    var m = document.body.querySelector('.k-mo.acik:last-of-type');
    if (TUR === 'dinle') { m.querySelector('.yuz').style.backgroundImage = G(d.g); m.querySelector('.t b').textContent = d.baslik; m.setAttribute('aria-label', 'Dinle oynatıcı'); }
    return m; }

  if (DUR === 'tam' || DUR === 'hiz' || DUR === 'sira') {
    tam();
    if (DUR === 'hiz') K.sayfa('hiz', { acik: true });
    if (DUR === 'sira') sira();
  } else if (DUR === 'degisti') {
    TUR = 'dinle'; arkaDinle(); K.oynatici(); K.dinleBaslat();
    /* önceki ses (Spiker) durdu; mini oynatıcı yeni sese geçti */
    var t = K.toast('Dada Spiker duraklatıldı', { ikon: 'fa-radio', alt: 'Aynı anda tek ses çalar', eylem: 'Sürdür', sure: 0, eylemFn: function(){ K.spikerBaslat(); } });
  } else if (DUR === 'hata') {
    arkaAna();
    var m = miniStatik({ hata: true });
    m.querySelector('button').addEventListener('click', function(){ var b = this; b.innerHTML = K.I('fa-circle-notch', 'fa-spin'); setTimeout(function(){ b.innerHTML = K.I('fa-rotate-right'); }, 1200); });
  } else {
    arkaAna(); K.oynatici(); if (TUR === 'dinle') K.dinleBaslat(); else K.spikerBaslat();
  }
  /* mini oynatıcıya dokununca tam ekran (bu ekranda) */
  document.addEventListener('click', function(ev){ var t = ev.target.closest('.k-mo .t'); if (!t || DUR === 'tam') return; ev.preventDefault(); location.href = K.u('ekranlar/sistem/oynatici.html', 'durum=tam&tur=' + TUR); }, true);
  document.addEventListener('click', function(ev){ var a = ev.target.closest('.k-oy .dn .ana'); if (!a) return; var oyn = !!a.querySelector('.fa-pause'); a.innerHTML = K.I(oyn ? 'fa-play' : 'fa-pause'); a.closest('.k-oy').classList.toggle('dur', oyn); });
})();
</script>
</body>
</html>

<title>Yasal Metinler</title>
<!--
  YASAL METİNLER · E-526–E-539 · alt çubukta "Hesabım".
  Dizin: büyük başlık → iki grup (Kullanım ve Gizlilik · Yayın ve Kurumsal); her satırda sürüm ve son güncelleme.
  Metin (?metin=…): tek şablon: büyük başlık + giriş cümlesi → künye etiketleri (Yürürlük, Son güncelleme, Sürüm) → İçindekiler (başta açık; dokununca bölüme kayar)
        → numaralı bölümler (okuma gövdesi --mb; tablo yatay kayar) → ilgili metinler.
  Parametreler: ?metin=kullanim-kosullari|gizlilik-ve-kvkk|aydinlatma-metni|acik-riza-metni|telif-haklari|topluluk-kurallari|erisilebilirlik|yayin-ilkeleri|duzeltme-politikasi|kunye
    · &durum=yukleniyor | hata (&hata=zaman-asimi) | cevrimdisi (önbellekteki metin + bant; &onbellek=0 tam ekran) · ?uye=0 · ?tema=koyu · ?calan=1
  Veri: metinler public depodaki aynı adlı sayfalardan (dadahaber-prototip/<metin>.html; erisilebilirlik.html, kunye.html) aynen alındı — yasal metin uydurulmadı.
        Kısaltma: Künye'de "Masalar ve editörler" tablosunun ilk yedi satırı; Düzeltme Politikası'nda "Son düzeltmeler" ilk üç satırı. Sitedeki "Sayfa Dizini", çerez ve dil
        seçicisine yapılan göndermeler olduğu gibi duruyor (metin sahibi panelden günceller).
-->

/* KİT ADAYI: metin tablosu — yasal metinlerdeki bilgi tabloları satıra kırılır (kitteki .k-tablo puan/kur tablosu için tek satır ve yatay kayar) */
.ym-tablo .k-tablo{white-space:normal;font-variant-numeric:normal}
.ym-tablo .k-tablo th,.ym-tablo .k-tablo td{height:auto;padding:var(--b-12) var(--b-8);text-align:left;vertical-align:top;line-height:1.4}
.ym-tablo .k-tablo td{font-size:calc(var(--mb) - 2px)}
.ym-tablo .k-tablo th:first-child,.ym-tablo .k-tablo td:first-child{position:static;padding-left:0}
</style>

<script>

  /* kaynak: dadahaber-prototip/<metin>.html — başlık, giriş, künye ve bölümler aynen */
  var M = {
    'kullanim-kosullari': { b: 'Kullanım Koşulları', g: 'Dada Haber\'i kullanırken geçerli olan kuralları ve tarafların hak ve yükümlülüklerini açıklıyoruz.', k: ['1 Ocak 2026', '15 Kasım 2026', '1.2'], s: [
      ['Taraflar ve kapsam', '<p>Bu koşullar, Dada Medya Yayıncılık A.Ş. ("Dada Haber") ile dadahaber.com sitesini ve Dada Haber mobil uygulamasını kullanan herkes arasında geçerlidir.</p><p>Siteyi kullanmaya devam etmeniz bu koşulları kabul ettiğiniz anlamına gelir. Üye olmadan kullanılan bölümler için de aynı koşullar geçerlidir.</p>'],
      ['Hizmetin kullanımı', '<p>İçerikleri kişisel ve ticari olmayan amaçla okuyabilir, dinleyebilir ve paylaşabilirsiniz. Siteyi otomatik araçlarla toplu biçimde taramak, içerikleri izinsiz çoğaltmak ya da hizmetin işleyişini bozacak girişimlerde bulunmak yasaktır.</p>'],
      ['Üyelik ve hesap güvenliği', '<p>Üyelik için doğru bilgi vermeniz gerekir. Şifrenizin güvenliğinden siz sorumlusunuz; hesabınızda yetkisiz bir işlem fark ederseniz bize hemen bildirmelisiniz.</p><p>Bu koşulları ihlal eden hesaplar önceden bildirimde bulunularak askıya alınabilir ya da kapatılabilir.</p>'],
      ['Fikrî haklar', '<p>Sitedeki metin, görsel, video, ses ve tasarımlar üzerindeki haklar Dada Haber\'e ya da lisans verenlerine aittir. Alıntı ve paylaşım kuralları ' + y('telif-haklari', 'Telif Hakları') + ' sayfasında açıklanmıştır.</p>'],
      ['Kullanıcı içerikleri', '<p>Görüş, yorum ve başvurularınızda paylaştığınız içeriklerden siz sorumlusunuz. Bu içeriklerin ' + y('topluluk-kurallari', 'Topluluk Kuralları') + ' ile uyumlu olması gerekir.</p>'],
      ['Sorumluluğun sınırı', '<p>Haberlerimizi doğrulanmış bilgiye dayanarak hazırlıyoruz; buna karşın piyasa verileri ve benzeri bilgiler yatırım tavsiyesi değildir. Üçüncü taraf sitelere verilen bağlantıların içeriğinden Dada Haber sorumlu değildir.</p>'],
      ['Değişiklikler', '<p>Bu koşullar güncellendiğinde sürüm numarası ve güncelleme tarihi bu sayfada değişir. Önemli değişiklikler üyelere e-postayla bildirilir.</p>'],
      ['Uygulanacak hukuk', '<p>Bu koşullar Türkiye Cumhuriyeti hukukuna tabidir. Uyuşmazlıklarda İstanbul (Çağlayan) mahkemeleri ve icra daireleri yetkilidir.</p>']] },
    'gizlilik-ve-kvkk': { b: 'Gizlilik ve KVKK', g: 'Hangi kişisel verileri, hangi amaçla ve ne kadar süre işlediğimizi sade bir dille anlatıyoruz.', k: ['1 Ocak 2026', '18 Kasım 2026', '1.3'], s: [
      ['Bu metin neyi kapsar', '<p>Bu metin dadahaber.com sitesi, mobil uygulama ve e-posta bültenleri aracılığıyla işlenen kişisel verileri kapsar. 6698 sayılı Kişisel Verilerin Korunması Kanunu kapsamındaki ayrıntılı bilgilendirme ' + y('aydinlatma-metni', 'Aydınlatma Metni') + '\'nde yer alır.</p>'],
      ['Hangi verileri işliyoruz', tb(['Veri', 'Örnek', 'Ne zaman'], [['Kimlik ve iletişim', 'Ad, soyad, e-posta adresi', 'Üye olduğunuzda ya da bize yazdığınızda'], ['Hesap tercihleri', 'Takip edilen konular, dil, görünüm ayarları', 'Hesabınızda ayar yaptığınızda'],
        ['Kullanım verisi', 'Okunan haberler, oturum süresi', 'Siteyi kullandığınızda, çerez izninize bağlı olarak'], ['Teknik veri', 'IP adresi, tarayıcı ve cihaz bilgisi', 'Her ziyarette, güvenlik amacıyla']])],
      ['Hangi amaçlarla', ul(['Üyelik, kaydetme ve takip özelliklerini sunmak', 'Bülten ve bildirim tercihlerinize göre gönderim yapmak', 'Başvurularınızı yanıtlamak', 'Sitenin güvenliğini sağlamak ve kötüye kullanımı önlemek', 'İzin vermeniz halinde içerik önerilerini kişiselleştirmek'])],
      ['Kimlerle paylaşıyoruz', '<p>Kişisel verilerinizi satmıyoruz. Veriler; barındırma, e-posta gönderimi ve ölçümleme gibi hizmetleri aldığımız tedarikçilerle, yalnızca hizmetin gerektirdiği ölçüde ve sözleşmeyle güvence altına alınarak paylaşılır.</p><p>Yasal bir yükümlülük bulunduğunda yetkili kamu kurumlarına bilgi verilir.</p>'],
      ['Saklama süreleri', tb(['Veri', 'Saklama süresi'], [['Üyelik bilgileri', 'Hesap silinene kadar'], ['Başvuru ve yazışmalar', 'Sonuçlandıktan sonra 2 yıl'], ['Trafik kayıtları (5651)', '2 yıl'], ['Çerez verileri', 'Çerez Politikası\'ndaki süreler kadar']])],

      ['Haklarınız', '<p>Verilerinize erişme, düzeltilmesini ya da silinmesini isteme hakkına sahipsiniz. Başvurularınızı ' + il + ' sayfasındaki KVKK kanalıyla iletebilirsiniz.</p>']] },
    'aydinlatma-metni': { b: 'Aydınlatma Metni', g: '6698 sayılı Kişisel Verilerin Korunması Kanunu\'nun 10. maddesi uyarınca veri sorumlusu olarak sizi bilgilendiriyoruz.', k: ['1 Ocak 2026', '18 Kasım 2026', '1.2'], s: [
      ['Veri sorumlusu', '<p>Kişisel verileriniz, veri sorumlusu sıfatıyla Dada Medya Yayıncılık A.Ş. (Esentepe Mah. Yazı Sok. No: 14, Şişli / İstanbul) tarafından aşağıda açıklanan kapsamda işlenmektedir.</p>'],
      ['İşlenen kişisel veriler', ul(['Kimlik verisi: ad, soyad', 'İletişim verisi: e-posta adresi, telefon numarası (başvurularda)', 'Müşteri işlem verisi: üyelik, abonelik ve tercih kayıtları', 'İşlem güvenliği verisi: IP adresi, oturum ve giriş kayıtları', 'Pazarlama verisi: açık rızanız bulunması halinde ilgi alanları'])],

      ['Hukuki sebepler', '<p>Verileriniz Kanun\'un 5. maddesinde yer alan sözleşmenin kurulması ve ifası, hukuki yükümlülüğün yerine getirilmesi, meşru menfaat ve açık rıza hukuki sebeplerine dayanılarak işlenir.</p>'],

      ['Haklarınız', '<p>Kanun\'un 11. maddesi uyarınca:</p>' + ul(['Kişisel verilerinizin işlenip işlenmediğini öğrenme', 'İşlenmişse buna ilişkin bilgi talep etme', 'İşleme amacını ve amaca uygun kullanılıp kullanılmadığını öğrenme', 'Eksik ya da yanlış işlenmişse düzeltilmesini isteme', 'Silinmesini ya da yok edilmesini isteme', 'Otomatik sistemlerle analiz sonucu aleyhinize bir sonuca itiraz etme'])]] },
    'acik-riza-metni': { b: 'Açık Rıza Metni', g: 'Açık rızanıza dayanan veri işleme faaliyetlerini ve rızanızı nasıl geri alabileceğinizi açıklıyoruz.', k: ['1 Ocak 2026', '18 Kasım 2026', '1.1'], s: [
      ['Kapsam', '<p>Bu metin, yalnızca açık rızanız bulunması halinde yürütülen veri işleme faaliyetlerini kapsar. Diğer işleme faaliyetleri ' + y('aydinlatma-metni', 'Aydınlatma Metni') + '\'nde açıklanmıştır. Rıza vermemeniz haberlere erişiminizi etkilemez.</p>'],
      ['Kişiselleştirilmiş öneriler', '<p>Okuduğunuz haberler ve takip ettiğiniz konular, size daha ilgili haberler önermek amacıyla analiz edilir. Rıza vermezseniz öneriler kişiselleştirilmeden, genel gündeme göre gösterilir.</p>'],
      ['Tanıtım iletileri', '<p>Yeni formatlarımız ve etkinliklerimizle ilgili e-posta ve bildirim gönderilmesi için iletişim bilgileriniz kullanılır. Haber bültenleri bu kapsamda değildir; onlar ayrıca abone olduğunuzda gönderilir.</p>'],
      ['Yurt dışına aktarım', '<p>Ölçümleme ve e-posta gönderimi hizmetlerinin bir bölümü yurt dışında bulunan sunucular üzerinden sağlanır. Bu hizmetler için verilerinizin yurt dışına aktarılması açık rızanıza bağlıdır.</p>'],
      ['Rızanızı geri alma', '<p>Verdiğiniz rızayı Hesabım › Gizlilik ve Veriler bölümünden ya da çerez tercihleri penceresinden istediğiniz zaman geri alabilirsiniz. Geri alma, o tarihten sonraki işlemleri etkiler.</p>']] },

      ['İçeriklerin sahipliği', '<p>Dada Haber\'de yayımlanan haber metinleri, fotoğraflar, videolar, podcast bölümleri ve infografikler 5846 sayılı Fikir ve Sanat Eserleri Kanunu kapsamında korunur. Haklar Dada Haber\'e ya da içeriği lisansla sağlayan kişi ve kurumlara aittir.</p>'],
      ['Alıntı ve paylaşım', '<p>Haberlerimizin başlığını ve ilk paragrafını, kaynak olarak "Dada Haber" adı ve habere bağlantı verilerek alıntılayabilirsiniz. Metnin tamamının ya da önemli bir bölümünün kopyalanması yazılı izne bağlıdır.</p><p>Sosyal medyada paylaşım düğmeleriyle yapılan paylaşımlar serbesttir.</p>'],
      ['Görseller ve lisanslı içerikler', '<p>Fotoğraf ve videolarımızın bir bölümü lisansla kullanılmaktadır; bu içerikler hiçbir koşulda izinsiz yeniden yayımlanamaz. Görsel künyesi her görselin altında yer alır.</p>'],
      ['İhlal bildirimi', '<p>Hakkınız olan bir içeriğin sitemizde izinsiz kullanıldığını düşünüyorsanız içeriğin adresini, hak sahipliğinizi gösteren belgeyi ve iletişim bilgilerinizi ' + il + ' sayfasından ya da telif@dadahaber.com adresinden iletebilirsiniz. Bildirimler en geç üç iş günü içinde incelenir.</p>'],
      ['Logo ve marka', '<p>Dada Haber adı ve logosu tescilli markadır. Logo, yalnızca Dada Haber içeriğine yapılan atıflarda ve değiştirilmeden kullanılabilir.</p>']] },
    'topluluk-kurallari': { b: 'Topluluk Kuralları', g: 'Görüş, yorum ve başvurularda herkesin güvenle katılabileceği bir ortam için uyduğumuz kurallar.', k: ['1 Ocak 2026', '16 Kasım 2026', '1.1'], s: [
      ['Neden kurallar var', '<p>Okurlarımızın görüşleri haberlerimizi geliştirir. Bu kurallar, farklı görüşlerin saygı içinde dile getirilebilmesi ve kimsenin hedef alınmaması için vardır.</p>'],
      ['Saygılı dil', '<p>Fikirleri eleştirebilirsiniz; kişileri aşağılayamazsınız. Hakaret, küfür ve kişisel saldırı içeren katkılar yayımlanmaz.</p>'],
      ['Nefret ve taciz', '<p>Bir kişiyi ya da grubu etnik köken, din, cinsiyet, engellilik ya da cinsel yönelimi nedeniyle hedef alan içerikler ve tehdit içeren mesajlar kaldırılır; gerektiğinde yetkili makamlara bildirilir.</p>'],
      ['Yanlış bilgi', '<p>Doğrulanmamış iddiaları kesin bilgi gibi paylaşmayın. Bir haberde hata olduğunu düşünüyorsanız düzeltme talebi kanalını kullanın.</p>'],
      ['Kişisel veriler', '<p>Kendinizin ya da başkalarının telefon numarası, adresi, kimlik bilgisi gibi kişisel verilerini paylaşmayın. Bu tür içerikler yayımlanmadan silinir.</p>'],

    erisilebilirlik: { b: 'Erişilebilirlik Beyanı', g: 'Dada Haber\'i herkesin rahatça kullanabilmesi için neler yaptığımızı ve bilinen eksiklerimizi paylaşıyoruz.', k: ['Hedef: WCAG 2.2 AA', '21 Kasım 2026', '1.0'], s: [
      ['Hedefimiz', '<p>Sitemizi Web İçeriği Erişilebilirlik Yönergeleri (WCAG) 2.2 AA düzeyine uygun olacak biçimde geliştiriyoruz. Yeni her sayfa yayına alınmadan önce klavye ve ekran okuyucuyla denetlenir.</p>'],
      ['Neler yaptık', ul(['Bütün sayfalar yalnızca klavyeyle kullanılabilir; odak her zaman görünür.', 'Görsellerde açıklayıcı alternatif metin, videolarda Türkçe altyazı bulunur.', 'Metin ve arka plan renkleri en az 4,5:1 kontrast oranını sağlar.', 'Haber metinleri Haber Dinle ile seslendirilebilir.', 'Sayfa başlıkları anlam sırasına göre düzenlenir; ekran okuyucular bölümler arasında gezinebilir.'])],
      ['Görünüm ayarları', '<p>Karanlık mod, yazı boyutu ve hareketli öğeleri durduran Sakin mod görünüm penceresinden ayarlanabilir. Yazı boyutu büyütüldüğünde sayfa düzeni bozulmaz.</p>' + K.btn({ metin: 'Görünüm ayarlarını aç', ikon: 'fa-circle-half-stroke', tur: 'sade', href: K.git('gorunum') })],
      ['Bilinen eksikler', ul(['Bazı eski infografiklerin metin karşılığı henüz eklenmedi; bu infografikler 2026 sonuna kadar güncellenecek.', 'Canlı yayınlarda anlık altyazı henüz bulunmuyor.'])],
      ['Geri bildirim', '<p>Erişimde zorlandığınız bir sayfa ya da öğe varsa bize bildirin; geri bildirimler erişilebilirlik ekibine iletilir ve en geç beş iş günü içinde yanıtlanır.</p>' + K.btn({ metin: 'Geri bildirim gönder', ikon: 'fa-message', tur: 'sade', href: K.git('geriBildirim') })]] },
    'yayin-ilkeleri': { b: 'Yayın İlkeleri', g: 'Haberi nasıl doğruladığımızı, kaynakla nasıl çalıştığımızı ve hata yaptığımızda ne yaptığımızı anlatıyoruz.', k: ['1 Ocak 2026', '20 Kasım 2026', '1.4'], s: [
      ['Doğruluk ve doğrulama', '<p>Bir bilgi, en az iki bağımsız kaynakla doğrulanmadan haber olarak yayımlanmaz. Kaynağın gizli tutulması gereken durumlarda gerekçe yayın yönetmenine yazılı olarak bildirilir.</p><p>Doğrulanamayan iddialar haber diliyle değil, iddia diliyle aktarılır; başlıkta metnin desteklemediği bir yargı yer almaz.</p>'],
      ['Kaynak kullanımı', '<p>Haberin dayandığı kurum, belge ya da kişi mümkün olan her durumda adıyla ve unvanıyla belirtilir. Okur, bilginin nereden geldiğini aynı sayfada görebilmelidir.</p><p>Ajans ve kurum açıklamalarından alınan içerikte kaynak, haberin sonundaki Kaynaklar bölümünde bağlantısıyla gösterilir.</p>'],
      ['Tarafsızlık ve çoğulculuk', '<p>Bir tarafın iddiası aktarılıyorsa diğer tarafın yanıtı aynı haber içinde verilir. Yanıt alınamamışsa bu durum açıkça yazılır.</p><p>Köşe yazıları yazarın görüşüdür; kurumun yayın çizgisini bağlamaz ve haberden görsel olarak ayrı sunulur.</p>'],
      ['Düzeltme ve cevap hakkı', '<p>Hata yapıldığında düzeltilir ve düzeltildiği görünür kılınır. Maddi hatalarda metin düzeltilir, haberin altına düzeltme notu ve saati eklenir.</p><p>Haberin özünü değiştiren düzeltmelerde başlık da güncellenir; değişiklik notta açıklanır. Ayrıntılar ' + y('duzeltme-politikasi', 'Düzeltme Politikası') + ' sayfasındadır.</p>'],
      ['Mahremiyet ve çocukların korunması', '<p>Kamu yararı bulunmadıkça kişilerin özel hayatına ilişkin bilgi yayımlanmaz. Çocukların kimliği, yüzü ve okulu hiçbir haberde gösterilmez.</p>'],
      ['Yapay zekâ kullanımı', '<p>Seslendirme ve özet gibi yapay zekâ ile üretilen her içerik okura açıkça belirtilir. Haber metni, editör onayından geçmeden yayımlanmaz.</p>'],

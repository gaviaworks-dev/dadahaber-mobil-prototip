<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>Takım</title>
<!-- Dada Haber Mobil · TAKIM SAYFASI (E-392–E-398 + yeni haller). Liste kökünden: görselli başlık (Galatasaray: kendi stadı; öteki kulüplerin konuya uygun fotoğrafı yok → koyu marka zemini, K43),
     Takip et (üye: yerinde; misafir: giriş tetik paneli), sıra · puan · galibiyet (sözlük puan tablosu, 13 hafta), yapışkan sekmeler Özet · Maçlar · Kadro · Puan Durumu · Haberler (yerinde değişir).
     Özet: canlı maç (Galatasaray ve Fenerbahçe: derbi, K.mac) ya da son maç, sıradaki maç, puan durumu ilk 5, son haberler. Maçlar: son 4 maç + fikstür (3). Kadro: 12 oyuncu (no, mevki, yaş, maç, gol).
     Puan Durumu: Genel · İç saha · Dış saha, takımın satırı vurgulu. Haberler: kulüp haberleri (K44 satırı), sayfa sonu yükleme.
     Sorgu: ?takim=galatasaray|fenerbahce|besiktas|trabzonspor · ?sekme=ozet|maclar|kadro|puan|haberler · ?uye=0 misafir
            ?durum=yukleniyor | yenileniyor (&hal=cekiliyor|birak|bitti) | daha-fazla (&hal=son|hata; Haberler sekmesi) | bos (Haberler sekmesi boş) | hata (&hata=zaman-asimi) | cevrimdisi (&onbellek=0) | bulunamadi
     Veri: spor.js (public galatasaray.html, fenerbahce.html, besiktas.html, trabzonspor.html: künye, son maçlar, kadro, fikstür, haberler; sözlük puan_tablosu ve haber saatleri).
     Varsayım: başlıktaki sıra/puan/galibiyet sözlük puan tablosundan (13 hafta); public takım başlığındaki sayılar canlı derbiyi de sayıyor ve tabloyla çelişiyor. -->
<link rel="stylesheet" href="../../_ortak/cerceve.css">
<link rel="stylesheet" href="../../_ortak/marka.css">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../_ortak/icerik.js"></script>
<script src="../../_ortak/cerceve.js"></script>
<script src="../../_ortak/icerik-ek.js"></script>
<script src="../../kit/kit.js"></script>
<script src="spor.js"></script>
<style>
/* KİT ADAYI: lig başlığı (katlanır) — Maçkolik tarzı skor listesinde maçlar lige göre gruplanır; lig adına dokununca lig sayfası, sağdaki sayı + ok düğmesi grubu katlar (spor.js ligGrup) */
.sp-lig{margin-top:var(--b-16)}
.sp-lig-b{display:flex;align-items:center;gap:var(--b-8);min-height:56px;border-bottom:1px solid var(--cizgi)}
.sp-lig-a{flex:1;min-width:0;display:flex;align-items:center;gap:var(--b-12);min-height:var(--dokun);color:inherit}
.sp-lig-i{width:32px;height:32px;flex:none;border-radius:var(--k-ic);background:var(--k-yuzey);display:grid;place-items:center;font-size:14px;color:var(--marka-metin)}
.sp-lig-t{min-width:0;display:flex;flex-direction:column;gap:var(--b-4)}
.sp-lig-t b{font-size:15px;font-weight:var(--y-kalin);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-lig-t small{font-size:12.5px;line-height:1.2;color:var(--metin-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-lig-ac{flex:none;min-width:var(--dokun);height:var(--dokun);display:inline-flex;align-items:center;justify-content:flex-end;gap:var(--ikon-bosluk);font-size:13px;font-weight:var(--y-kalin);color:var(--metin-3);font-variant-numeric:tabular-nums}
.sp-lig-ac i{font-size:12px;transition:transform .2s}
.sp-lig.kapali .sp-lig-ac i{transform:rotate(-90deg)}
.sp-lig.kapali .sp-lig-l{display:none}
/* KİT ADAYI: transfer satırı — kulüp kısaltması (puan tablosundaki daire), hareket, kulüp, durum etiketi (Resmî · Görüşme · Söylenti); satırın tamamı habere gider */
.sp-tr{display:flex;align-items:center;gap:var(--b-12);min-height:68px;padding:var(--b-12) 0;border-bottom:1px solid var(--cizgi);color:inherit}
.sp-tr .ar{width:40px;height:40px;flex:none;border-radius:var(--k-daire);display:grid;place-items:center;font-size:11px;font-weight:var(--y-kalin);color:#fff;background:var(--k-koyu)}
.sp-tr .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--b-4)}
.sp-tr b{font-size:15px;font-weight:var(--y-kalin);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sp-tr small{font-size:12.5px;color:var(--metin-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-tr .k-etiket{flex:none}
/* yapışkan denetim bandı (branş segmenti + gün sekmeleri) */
.sp-yapis{position:sticky;top:var(--k-ub-h);z-index:60;background:var(--zemin)}
.sp-sw{padding:var(--b-12) var(--kenar) 0}
</style>
</head>
<body>
<div class="ekran" id="ekran"></div>
<script>
(function(){
  var Q = K.q, DUR = K.durum, HAL = Q.get('hal'), e = document.getElementById('ekran'), TAM = document.documentElement.classList.contains('tam'), S = SPOR;
  var slug = Q.get('takim') || 'galatasaray', YOK = !S.TAKIM[slug] || DUR === 'bulunamadi'; if (YOK) slug = 'galatasaray';
  var TK = S.TAKIM[slug], TAKIPTE = D.uye.takip.indexOf(TK.ad) > -1;
  var SEK = [['ozet', 'Özet'], ['maclar', 'Maçlar'], ['kadro', 'Kadro'], ['puan', 'Puan Durumu'], ['haberler', 'Haberler']], KOD = SEK.map(function(x){ return x[0]; });
  var sek = DUR === 'daha-fazla' || DUR === 'bos' ? 'haberler' : (KOD.indexOf(Q.get('sekme')) > -1 ? Q.get('sekme') : 'ozet');
  var gor = 'genel';
  var T = S.LIG['super-lig'].tablo, si = T.map(function(r){ return r[1]; }).indexOf(TK.kod), R = T[si];
  var M = S.takimMaclari(TK.ad), SON = S.sirala(M.filter(function(m){ return m.hal !== 'b'; }), true).slice(0, 4), SIRA = S.sirala(M.filter(function(m){ return m.hal === 'b'; })).slice(0, 3);
  var CANLI = SON.filter(function(m){ return m.hal === 'c'; })[0];
  var X = DUR === 'bos' ? [] : S.HABER[slug];
  function ligSag(m){ return S.LIG[m.lig].ad + (m.hafta ? ' · ' + m.hafta : ''); }
  function bolum(bb, ic, cls){ return '<section class="k-bl sik">' + K.bb(bb) + '<div class="' + (cls || 'k-ic') + '">' + ic + '</div></section>'; }

  var takip = K.uye ? K.btn({ metin: TAKIPTE ? 'Takipte' : 'Takip et', ikon: TAKIPTE ? 'fa-check' : 'fa-plus', tur: 'birincil', tam: true, secili: TAKIPTE, attr: 'data-takip' })
    : K.btn({ metin: 'Takip et', ikon: 'fa-plus', tur: 'birincil', tam: true, attr: 'data-sayfa="tetik" data-eylem="takip"' });
  var bas = '<header class="k-kapak"' + (TK.g ? ' style="background-image:' + G(TK.g) + '"' : '') + '><h1>' + TK.ad + '</h1><p>' + TK.ust + '</p></header>';
  function puanKisa(){ return S.tablo('super-lig', TK.kod, { ilk: 5 }) + '<p class="k-not">' + K.I('fa-circle-info') + '<span>Süper Lig, 13 hafta sonunda · ilk 5</span></p>'; }
  function ozet(){
    return (CANLI && D.mac.ev === TK.ad || CANLI && D.mac.dep === TK.ad ? bolum({ baslik: 'Canlı Maç', canli: true, baglanti: { metin: 'Canlı Skor', href: K.git('canliSkor') } }, K.mac())
      : bolum({ baslik: 'Son Maç', ikon: 'fa-flag-checkered' }, S.gunListe(SON.slice(0, 1), { sag: ligSag }))) +
      bolum({ baslik: 'Sıradaki Maç', ikon: 'fa-calendar-day', baglanti: { metin: 'Bütün maçlar', href: '#', attr: '' } }, S.gunListe(SIRA.slice(0, 1), { sag: ligSag })) +
      bolum({ baslik: 'Puan Durumu', ikon: 'fa-ranking-star', baglanti: { metin: 'Tümü', href: '#' } }, '<div data-puan-kisa>' + puanKisa() + '</div>') +
      '<section class="k-bl sik">' + K.bb({ baslik: 'Son Haberler', ikon: 'fa-futbol', sayi: TK.toplam, baglanti: { metin: 'Tümü', href: '#' } }) + S.haberler(X.slice(0, 3)) + '</section>';
  }
  function maclar(){ return bolum({ baslik: 'Son Maçlar', ikon: 'fa-flag-checkered', sayi: SON.length }, S.gunListe(SON, { sag: ligSag })) +
    bolum({ baslik: 'Fikstür', ikon: 'fa-calendar-day', sayi: SIRA.length, baglanti: { metin: 'Süper Lig', href: K.u('ekranlar/icerik/lig.html', 'lig=super-lig&sekme=fikstur') } }, S.gunListe(SIRA, { sag: ligSag })); }
  function kadro(){ return bolum({ baslik: 'Kadro', ikon: 'fa-shirt', sayi: TK.kadro.length, not: '2026-27 sezonu' }, K.tablo({ sutunlar: ['Oyuncu', 'No', 'Mevki', 'Yaş', 'Maç', 'Gol'], satirlar: TK.kadro, sonKalin: true })); }
  function puan(){ return '<div style="padding-top:var(--b-16)">' + '<div style="padding-bottom:var(--b-12)">' + K.segment(['Genel', 'İç saha', 'Dış saha'], 0) + '</div><div data-tablo>' + S.tablo('super-lig', TK.kod, { gor: gor }) + '</div>' +
    '<p class="k-not">' + K.I('fa-circle-info') + '<span>Süper Lig, 13 hafta sonunda · 2026-27</span></p><div style="padding-top:var(--b-16)">' + K.btn({ metin: 'Süper Lig sayfası', ikon: 'fa-trophy', tur: 'ikincil', tam: true, href: K.u('ekranlar/icerik/lig.html', 'lig=super-lig') }) + '</div></div>'; }
  function haberler(){ if (!X.length) return K.bos({ ikon: 'fa-newspaper', baslik: TK.ad + ' için haber yok', aciklama: 'Kulübe dair yeni haber gelince burada görünür; takip edersen bildirimle gelir.' });
    var l = S.haberler(X); if (DUR === 'daha-fazla') l += (HAL === 'son' || HAL === 'hata' ? '' : '<div class="k-satirlar">' + K.iskelet('satir', 1) + '</div>') + K.dahaFazla(HAL === 'son' || HAL === 'hata' ? HAL : 'yukleniyor');
    return '<section class="k-bl sik">' + K.bb({ baslik: TK.ad + ' Haberleri', ikon: 'fa-futbol', sayi: TK.toplam, not: 'En yeni' }) + l + '</section>'; }
  var PANEL = { ozet: ozet, maclar: maclar, kadro: kadro, puan: puan, haberler: haberler };
  var ustu = '<div class="k-ic" style="padding-top:var(--b-16)">' + takip + '</div>' + K.istat([[(si + 1) + '.', 'Sıra'], [String(3 * R[2] + R[3]), 'Puan'], [String(R[2]), 'Galibiyet']]);
  var sekmeler = '<div class="sp-yapis" style="margin-top:var(--b-12)">' + K.sekmeler(SEK.map(function(x){ return { metin: x[1] }; }), KOD.indexOf(sek)) + '</div>';
  var paneller = KOD.map(function(x){ return '<div data-panel="' + x + '"' + (x === sek ? '' : ' hidden') + (x === 'puan' ? ' class="k-ic"' : '') + '>' + PANEL[x]() + '</div>'; }).join('');

  var DUZ = DUR === 'hata' || YOK || (DUR === 'cevrimdisi' && Q.get('onbellek') === '0');
  if (DUR === 'yukleniyor') e.innerHTML = K.iskelet('liste') + '<div class="k-son"></div>';
  else if (DUZ) e.innerHTML = '<div class="k-ust-bosluk"></div>' + K.hata({ tur: YOK ? 'bulunamadi' : DUR === 'cevrimdisi' ? 'cevrimdisi' : (Q.get('hata') === 'zaman-asimi' ? 'zaman-asimi' : 'sunucu') }) + '<div class="k-son"></div>';
  else e.innerHTML = (DUR === 'yenileniyor' ? '<div class="k-ust-bosluk"></div>' + K.yenile(['cekiliyor', 'birak', 'bitti'].indexOf(HAL) > -1 ? HAL : 'yenileniyor') : '') +
    bas + '<div class="k-yaprak">' + ustu + sekmeler + paneller + '<div class="k-son"></div></div>';

  if (DUZ) K.ustCubuk({ geri: true, baslik: YOK ? 'Takım' : TK.ad });
  else K.ustCubuk({ tur: 'foto', geri: true, baslik: TK.ad, gorsel: TK.g || null, eylemler: ['paylas'], dar: DUR === 'yenileniyor' });
  K.altCubuk('bolum');
  K.oynatici();

  e.querySelectorAll('[data-tablo],[data-puan-kisa]').forEach(function(t){ S.tabloBagla(t, 'super-lig'); });
  function sekmeAc(x){ var sb = e.querySelectorAll('.sp-yapis .k-sekmeler button'), i = KOD.indexOf(x);
    sb.forEach(function(b, j){ b.setAttribute('aria-selected', j === i); }); e.querySelectorAll('[data-panel]').forEach(function(p){ p.hidden = p.getAttribute('data-panel') !== x; });
    var y = e.querySelector('.sp-yapis'); if (y && e.scrollTop > y.offsetTop) e.scrollTop = y.offsetTop; }
  /* Özet'teki "Tümü / Bütün maçlar" bağlantıları ilgili sekmeyi açar */
  e.querySelectorAll('[data-panel="ozet"] .k-bb a').forEach(function(a, i){ var h = ['maclar', 'puan', 'haberler'][i - (CANLI && (D.mac.ev === TK.ad || D.mac.dep === TK.ad) ? 1 : 0)]; if (!h) return;
    a.removeAttribute('href'); a.setAttribute('role', 'button'); a.setAttribute('data-sekme-git', h); a.style.cursor = 'pointer'; });
  e.addEventListener('click', function(ev){ var b = ev.target.closest('.sp-yapis .k-sekmeler button');
    if (b) { sekmeAc(KOD[[].indexOf.call(b.parentNode.querySelectorAll('button'), b)]); return; }
    var g = ev.target.closest('[data-sekme-git]'); if (g) { ev.preventDefault(); sekmeAc(g.getAttribute('data-sekme-git')); return; }
    var sg = ev.target.closest('[data-panel="puan"] .k-segment button');
    if (sg) setTimeout(function(){ gor = ['genel', 'ic', 'dis'][[].indexOf.call(sg.parentNode.querySelectorAll('button'), sg)]; var t = e.querySelector('[data-tablo]'); t.innerHTML = S.tablo('super-lig', TK.kod, { gor: gor }); S.tabloBagla(t, 'super-lig'); }, 300); });
  if (DUR === 'daha-fazla' && !TAM) e.scrollTop = e.scrollHeight;
  if (DUR === 'cevrimdisi' && !DUZ) {
    var bt = K.toast('Çevrimdışısın', { bant: true, eylem: 'Kaydedilenler', eylemFn: function(){ location.href = K.git('kaydedilenler'); } });
    bt.querySelector('button').classList.add('k-dk44');
  }
  document.addEventListener('click', function(ev){ var y = ev.target.closest('[data-yeniden]'); if (!y) return;
    y.classList.add('is-yukleniyor'); y.innerHTML = K.I('fa-circle-notch', 'fa-spin') + '<span>Deneniyor</span>';
    setTimeout(function(){ var q = new URLSearchParams(location.search); ['durum', 'hata', 'hal', 'onbellek'].forEach(function(x){ q.delete(x); }); location.search = q.toString(); }, 1200); });
})();
</script>
</body>
</html>

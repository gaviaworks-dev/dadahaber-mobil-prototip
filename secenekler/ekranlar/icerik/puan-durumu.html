<title>Puan Durumu</title>
<!-- Dada Haber Mobil · PUAN DURUMU (E-379–E-382). Liste kökünden: büyük başlık, lig seçici çipleri, Süper Lig'de Genel · İç saha · Dış saha segmenti, puan tablosu
     (sütun önceliği: Takım O G B M AV P; A ve Y mobilde gösterilmez; tablo kap içinde yatay kayar, ilk sütun yapışık). Üyede takımın satırı (Galatasaray) vurgulu.
     Sorgu: ?lig=super|1lig|basket|sultanlar|efeler|premier · ?gor=genel|ic|dis (Süper Lig) · ?uye=0 · ?durum=yukleniyor | hata (&hata=zaman-asimi) | cevrimdisi (&onbellek=0)
     Veri: Süper Lig sözlük puan_tablosu (araclar/ornek_veri.json; G, B, M, A, Y, iç ve dış saha); öteki ligler public puan-durumu.html (1. Lig ve Efeler Ligi'nde sitede de ilk 6). -->
<link rel="stylesheet" href="../../_ortak/cerceve.css">
<link rel="stylesheet" href="../../_ortak/marka.css">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../_ortak/icerik.js"></script>
<script src="../../_ortak/cerceve.js"></script>
<script src="../../_ortak/icerik-ek.js"></script>

</head>
<body>
<div class="ekran" id="ekran"></div>
<script>
(function(){
  var Q = K.q, DUR = K.durum, e = document.getElementById('ekran');
  /* kaynak: sözlük puan_tablosu · [ad, kod, G, B, M, A, Y, iç saha [G,B,M,A,Y], dış saha [G,B,M,A,Y]] */
  var SL = [
    ['Galatasaray', 'GS', 10, 2, 1, 33, 10, [6, 1, 0, 18, 4], [4, 1, 1, 15, 6]], ['Fenerbahçe', 'FB', 9, 3, 1, 30, 11, [5, 1, 0, 17, 5], [4, 2, 1, 13, 6]],
    ['Beşiktaş', 'BJK', 7, 4, 2, 25, 13, [5, 2, 0, 14, 6], [2, 2, 2, 11, 7]], ['Trabzonspor', 'TS', 7, 3, 3, 21, 13, [4, 1, 1, 12, 6], [3, 2, 2, 9, 7]],
    ['Başakşehir', 'BAŞ', 6, 4, 3, 19, 14, [4, 2, 1, 11, 6], [2, 2, 2, 8, 8]], ['Samsunspor', 'SAM', 6, 3, 4, 17, 14, [3, 1, 2, 10, 6], [3, 2, 2, 7, 8]],
    ['Göztepe', 'GÖZ', 5, 5, 3, 16, 15, [3, 3, 1, 9, 7], [2, 2, 2, 7, 8]], ['Kasımpaşa', 'KAS', 5, 3, 5, 19, 19, [4, 1, 1, 11, 8], [1, 2, 4, 8, 11]],
    ['Eyüpspor', 'EYP', 4, 5, 4, 15, 16, [3, 3, 1, 8, 6], [1, 2, 3, 7, 10]], ['Antalyaspor', 'ANT', 4, 4, 5, 14, 18, [1, 3, 2, 8, 8], [3, 1, 3, 6, 10]],
    ['Konyaspor', 'KON', 3, 6, 4, 13, 16, [2, 3, 2, 7, 7], [1, 3, 2, 6, 9]], ['Alanyaspor', 'ALN', 3, 5, 5, 13, 18, [2, 2, 2, 7, 8], [1, 3, 3, 6, 10]],
    ['Rizespor', 'RİZ', 3, 4, 6, 15, 20, [2, 2, 3, 8, 9], [1, 2, 3, 7, 11]], ['Gaziantep FK', 'GFK', 3, 3, 7, 12, 20, [2, 1, 3, 7, 9], [1, 2, 4, 5, 11]],
    ['Kocaelispor', 'KOC', 2, 5, 6, 11, 18, [1, 3, 3, 6, 8], [1, 2, 3, 5, 10]], ['Amedspor', 'AMD', 2, 4, 7, 11, 21, [1, 2, 3, 6, 9], [1, 2, 4, 5, 12]],
    ['Kayserispor', 'KAY', 2, 3, 8, 10, 23, [1, 2, 4, 6, 10], [1, 1, 4, 4, 13]], ['Gençlerbirliği', 'GB', 1, 4, 8, 9, 24, [1, 2, 3, 5, 11], [0, 2, 5, 4, 13]]
  ];
  /* kaynak: public puan-durumu.html · beraberlikli ligler [ad, kod, G, B, M, A, Y]; beraberliksiz [ad, kod, O, G, M, A(AS), Y(VS), P] */
  var LIG = {
    super: { ad: 'Süper Lig', not: '13 hafta sonunda · Süper Lig 2026-27' },
    '1lig': { ad: '1. Lig', not: '13 hafta sonunda · ilk 6 takım', b: [['Bodrum FK', 'BOD', 8, 3, 2, 22, 11], ['Erzurumspor', 'ERZ', 8, 2, 3, 24, 13], ['Sakaryaspor', 'SAK', 7, 4, 2, 20, 12], ['Bandırmaspor', 'BAN', 7, 3, 3, 19, 14], ['Pendikspor', 'PEN', 6, 4, 3, 18, 14], ['Iğdır FK', 'IĞD', 6, 3, 4, 17, 15]] },
    basket: { ad: 'Basketbol Süper Ligi', not: '9 hafta sonunda · galibiyet 2, mağlubiyet 1 puan', s: ['A', 'Y'], n: [['Fenerbahçe Beko', 'FBB', 9, 8, 1, 812, 701, 17], ['Anadolu Efes', 'AEF', 9, 7, 2, 798, 712, 16], ['Beşiktaş', 'BJK', 9, 6, 3, 765, 718, 15], ['Türk Telekom', 'TTK', 9, 6, 3, 741, 709, 15], ['Bahçeşehir Koleji', 'BAH', 9, 5, 4, 735, 724, 14], ['Galatasaray', 'GS', 9, 5, 4, 720, 717, 14], ['Tofaş', 'TOF', 9, 5, 4, 728, 730, 14], ['Karşıyaka', 'KSK', 9, 4, 5, 702, 711, 13], ['Manisa Basket', 'MAN', 9, 4, 5, 698, 715, 13], ['Trabzonspor', 'TS', 9, 3, 6, 690, 728, 12], ['Mersinspor', 'MRS', 9, 3, 6, 684, 731, 12], ['Büyükçekmece', 'BÜY', 9, 2, 7, 671, 744, 11]] },
    sultanlar: { ad: 'Sultanlar Ligi', not: '7 hafta sonunda · AS alınan, VS verilen set', s: ['AS', 'VS'], n: [['VakıfBank', 'VKF', 7, 7, 0, 21, 4, 20], ['Eczacıbaşı', 'ECZ', 7, 6, 1, 19, 6, 18], ['Fenerbahçe Medicana', 'FEN', 7, 6, 1, 18, 7, 17], ['Türk Hava Yolları', 'THY', 7, 5, 2, 16, 9, 15], ['Galatasaray Daikin', 'GS', 7, 4, 3, 14, 12, 12], ['Aras Kargo', 'ARS', 7, 4, 3, 13, 12, 11], ['Nilüfer Belediyespor', 'NİL', 7, 3, 4, 12, 14, 9], ['Beşiktaş', 'BJK', 7, 3, 4, 11, 14, 9], ['Kuzeyboru', 'KZB', 7, 2, 5, 10, 16, 7], ['Göztepe', 'GÖZ', 7, 2, 5, 9, 17, 6], ['Bahçelievler', 'BHÇ', 7, 1, 6, 7, 19, 4], ['İlbank', 'İLB', 7, 1, 6, 6, 19, 3]] },
    efeler: { ad: 'Efeler Ligi', not: '7 hafta sonunda · ilk 6 takım', s: ['AS', 'VS'], n: [['Halkbank', 'HAL', 7, 6, 1, 19, 6, 18], ['Ziraat Bankkart', 'ZRT', 7, 6, 1, 18, 7, 17], ['Arkas Spor', 'ARK', 7, 5, 2, 16, 9, 15], ['Fenerbahçe', 'FB', 7, 4, 3, 14, 11, 12], ['Galatasaray', 'GS', 7, 4, 3, 13, 12, 11], ['Spor Toto', 'TOT', 7, 3, 4, 12, 13, 9]] },
    premier: { ad: 'Premier Lig', not: '13 hafta sonunda · ilk 12 takım', b: [['Arsenal', 'ARS', 9, 3, 1, 27, 9], ['Manchester City', 'MCI', 9, 0, 4, 28, 15], ['Liverpool', 'LIV', 8, 2, 3, 25, 15], ['Chelsea', 'CHE', 7, 4, 2, 24, 13], ['Aston Villa', 'AVL', 7, 2, 4, 19, 16], ['Newcastle', 'NEW', 6, 4, 3, 21, 14], ['Tottenham', 'TOT', 6, 3, 4, 22, 18], ['Manchester United', 'MUN', 6, 2, 5, 20, 19], ['Brighton', 'BHA', 5, 4, 4, 19, 18], ['Nottingham Forest', 'NFO', 5, 3, 5, 16, 17], ['Fulham', 'FUL', 4, 5, 4, 17, 18], ['Brentford', 'BRE', 4, 4, 5, 18, 20]] }
  };
  var KODLAR = ['super', '1lig', 'basket', 'sultanlar', 'efeler', 'premier'];
  var lig = LIG[Q.get('lig')] ? Q.get('lig') : 'super', gor = ['genel', 'ic', 'dis'].indexOf(Q.get('gor')) > -1 ? Q.get('gor') : 'genel';
  var VURGU = K.uye ? 'GS' : null; /* üyenin takımı (D.uye.takip: Galatasaray) */

  function nesne(r){ return { ad: r[0], kod: r[1], G: r[2], B: r[3], M: r[4], A: r[5], Y: r[6] }; }
  function superTablo(){
    var t = SL.map(function(r){ var x = gor === 'ic' ? r[7] : gor === 'dis' ? r[8] : r.slice(2, 7); return nesne([r[0], r[1]].concat(x)); });
    if (gor !== 'genel') t.sort(function(a, b){ return (3 * b.G + b.B) - (3 * a.G + a.B) || (b.A - b.Y) - (a.A - a.Y) || b.A - a.A; });
    return K.puanTablosu(t, VURGU);
  }
  /* beraberliksiz ligler: kitin tablo bileşeni, takım hücresi puan tablosuyla aynı biçimde */
  function ikiliTablo(L){ var v = -1;
    var r = L.n.map(function(x, i){ if (x[1] === VURGU) v = i; var av = x[5] - x[6];
      return ['<span class="tk"><em>' + (i + 1) + '</em><span class="ar">' + x[1] + '</span>' + x[0] + '</span>', x[2], x[3], x[4], (av > 0 ? '+' : '') + av, x[7]]; });
    return K.tablo({ sutunlar: ['Takım', 'O', 'G', 'M', 'AV', 'P'], satirlar: r, vurgu: v, sonKalin: true }); }
  function tablo(){ var L = LIG[lig];
    var t = lig === 'super' ? superTablo() : L.b ? K.puanTablosu(L.b.map(nesne), VURGU) : ikiliTablo(L);
    return (lig === 'super' ? '<div class="k-ic" style="padding-bottom:var(--b-12)">' + K.segment(['Genel', 'İç saha', 'Dış saha'], ['genel', 'ic', 'dis'].indexOf(gor)) + '</div>' : '') +
      '<div class="k-ic">' + t + '<p class="k-not">' + K.I('fa-circle-info') + '<span>' + L.not + '</span></p></div>'; }

  var bas = '<div class="k-bbas"><h1>Puan Durumu</h1><p>Futbol, basketbol ve voleybol · 2026-27</p></div>';
  var cip = '<div data-lig style="padding-bottom:var(--b-16)">' + K.cipler(KODLAR.map(function(k){ return LIG[k].ad; }), KODLAR.indexOf(lig)) + '</div>';

  var DUZ = DUR === 'hata' || DUR === 'bulunamadi' || (DUR === 'cevrimdisi' && Q.get('onbellek') === '0');
  if (DUR === 'yukleniyor') e.innerHTML = '<div class="k-ust-bosluk"></div>' + bas + cip + '<div class="k-ic">' + K.iskelet('metin', 16) + '</div><div class="k-son"></div>';
  else if (DUZ) e.innerHTML = '<div class="k-ust-bosluk"></div>' + K.hata({ tur: DUR === 'bulunamadi' ? 'bulunamadi' : DUR === 'cevrimdisi' ? 'cevrimdisi' : (Q.get('hata') === 'zaman-asimi' ? 'zaman-asimi' : 'sunucu') }) + '<div class="k-son"></div>';
  else e.innerHTML = '<div class="k-ust-bosluk"></div>' + bas + cip + '<div data-tablo>' + tablo() + '</div><div class="k-son"></div>';

  K.ustCubuk({ geri: true, baslik: 'Puan Durumu', buyuk: !DUZ, eylemler: DUZ ? [] : [{ ikon: 'fa-calendar-day', etiket: 'Fikstür', href: K.u('ekranlar/icerik/fikstur.html') }] });
  K.altCubuk('bolum');
  K.oynatici();

  /* lig çipi ve Genel/İç/Dış segmenti: tablo yerinde değişir; satıra dokununca takım sayfası (yalnız Galatasaray örneği var) */
  function bagla(){ e.querySelectorAll('[data-tablo] tbody tr').forEach(function(tr){ tr.setAttribute('data-href', K.u('ekranlar/icerik/takim.html')); tr.style.cursor = 'pointer'; }); }
  bagla();
  var cp = e.querySelector('[data-lig]');
  /* seçili lig çipi görünür yere kayar */
  if (cp && lig !== 'super') { var ce = cp.querySelector('[aria-pressed="true"]'), ry = cp.querySelector('.k-ray'); ry.scrollLeft = ce.offsetLeft - ry.offsetLeft - parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--kenar')); }
  if (cp) cp.addEventListener('click', function(ev){ var c = ev.target.closest('.k-cip'); if (!c) return; lig = KODLAR[[].indexOf.call(cp.querySelectorAll('.k-cip'), c)]; gor = 'genel'; e.querySelector('[data-tablo]').innerHTML = tablo(); bagla(); });
  e.addEventListener('click', function(ev){ var b = ev.target.closest('[data-tablo] .k-segment button'); if (!b) return;
    setTimeout(function(){ gor = ['genel', 'ic', 'dis'][[].indexOf.call(b.parentNode.querySelectorAll('button'), b)]; e.querySelector('[data-tablo]').innerHTML = tablo(); bagla(); }, 300); });
  if (DUR === 'cevrimdisi' && !DUZ) {
    var bt = K.toast('Çevrimdışısın', { bant: true, eylem: 'Kaydedilenler', eylemFn: function(){ location.href = K.git('kaydedilenler'); } });
    bt.querySelector('button').classList.add('k-dk44');
  }
  document.addEventListener('click', function(ev){ var y = ev.target.closest('[data-yeniden]'); if (!y) return;
    y.classList.add('is-yukleniyor'); y.innerHTML = K.I('fa-circle-notch', 'fa-spin') + '<span>Deneniyor</span>';
    setTimeout(function(){ var q = new URLSearchParams(location.search); ['durum', 'hata', 'hal', 'onbellek'].forEach(function(x){ q.delete(x); }); location.search = q.toString(); }, 1200); });
})();
</script>
</body>
</html>

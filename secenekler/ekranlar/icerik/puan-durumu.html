<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>Puan Durumu</title>
<!-- Dada Haber Mobil · PUAN DURUMU (E-379–E-382). Liste kökünden: görselli banner (K43, K.banner), lig seçici çipleri, Süper Lig'de Genel · İç saha · Dış saha segmenti, puan tablosu
     (sütun önceliği: Takım O G B M AV P; A ve Y mobilde gösterilmez; tablo kap içinde yatay kayar, ilk sütun yapışık), takımlar arma ile (K.arma s). Üyede takımın satırı (Galatasaray) vurgulu;
     futbol tablolarında sayfası olan dört kulübün satırı takım sayfasını açar.
     Site sırası (public puan-durumu.html: banner → Puan Durumu → Tüm Lig Haberleri): tablonun ardından Lig Haberleri (sitedeki 8 haber, K44 satırı).
     Sorgu: ?lig=super|1lig|basket|sultanlar|efeler|premier · ?gor=genel|ic|dis (Süper Lig) · ?uye=0 · ?durum=yukleniyor | hata (&hata=zaman-asimi) | cevrimdisi (&onbellek=0)
     Veri: spor.js (Süper Lig sözlük puan_tablosu: G, B, M, A, Y, iç ve dış saha; öteki ligler public puan-durumu.html, 1. Lig ve Efeler Ligi'nde sitede de ilk 6; haberler public puan-durumu.html). -->
<link rel="stylesheet" href="../../_ortak/cerceve.css">
<link rel="stylesheet" href="../../_ortak/marka.css">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../_ortak/icerik.js"></script>
<script src="../../_ortak/cerceve.js"></script>
<script src="../../_ortak/icerik-ek.js"></script>
<script src="../../kit/kit.js"></script>
<script src="spor.js"></script>
</head>
<body>
<div class="ekran" id="ekran"></div>
<script>
(function(){
  var Q = K.q, DUR = K.durum, e = document.getElementById('ekran');
  var S = SPOR;
  /* ?lig kısa kodu → spor.js lig anahtarı (adres uyumu için kısa kodlar korunur) */
  var KODLAR = ['super', '1lig', 'basket', 'sultanlar', 'efeler', 'premier'], ANAHTAR = { super: 'super-lig', '1lig': '1-lig', basket: 'bsl', sultanlar: 'sultanlar', efeler: 'efeler', premier: 'premier-lig' };
  var lig = ANAHTAR[Q.get('lig')] ? Q.get('lig') : 'super', gor = ['genel', 'ic', 'dis'].indexOf(Q.get('gor')) > -1 ? Q.get('gor') : 'genel';
  var VURGU = K.uye ? 'GS' : null; /* üyenin takımı (D.uye.takip: Galatasaray) */
  function tablo(){ var k = ANAHTAR[lig], L = S.LIG[k];
    return (lig === 'super' ? '<div class="k-ic" style="padding-bottom:var(--b-12)">' + K.segment(['Genel', 'İç saha', 'Dış saha'], ['genel', 'ic', 'dis'].indexOf(gor)) + '</div>' : '') +
      '<div class="k-ic">' + S.tablo(k, VURGU, { gor: lig === 'super' ? gor : null }) + '<p class="k-not">' + K.I('fa-circle-info') + '<span>' + L.not + '</span></p></div>'; }
  var haber = '<section class="k-bl">' + K.bb({ baslik: 'Lig Haberleri', ikon: 'fa-newspaper', sayi: S.TOPLAM['puan-durumu'], not: 'En yeni' }) + S.haberler(S.HABER['puan-durumu']) + '</section>';

  var bas = '<div class="k-bbas"><h1>Puan Durumu</h1><p>Futbol, basketbol ve voleybol · 2026-27</p></div>';
  var cip = '<div data-lig style="padding-bottom:var(--b-16)">' + K.cipler(KODLAR.map(function(k){ return S.LIG[ANAHTAR[k]].ad; }), KODLAR.indexOf(lig)) + '</div>';

  var DUZ = DUR === 'hata' || DUR === 'bulunamadi' || (DUR === 'cevrimdisi' && Q.get('onbellek') === '0');
  if (DUR === 'yukleniyor') e.innerHTML = '<div class="k-ust-bosluk"></div>' + bas + cip + '<div class="k-ic">' + K.iskelet('metin', 16) + '</div><div class="k-son"></div>';
  else if (DUZ) e.innerHTML = '<div class="k-ust-bosluk"></div>' + K.hata({ tur: DUR === 'bulunamadi' ? 'bulunamadi' : DUR === 'cevrimdisi' ? 'cevrimdisi' : (Q.get('hata') === 'zaman-asimi' ? 'zaman-asimi' : 'sunucu') }) + '<div class="k-son"></div>';
  else e.innerHTML = '<div class="k-ust-bosluk"></div>' + bas + cip + '<div data-tablo>' + tablo() + '</div>' + haber + '<div class="k-son"></div>';

  K.ustCubuk({ geri: true, baslik: 'Puan Durumu', buyuk: !DUZ, eylemler: DUZ ? [] : [{ ikon: 'fa-calendar-day', etiket: 'Fikstür', href: K.u('ekranlar/icerik/fikstur.html') }, { ikon: 'fa-trophy', etiket: 'Lig sayfası', href: K.u('ekranlar/icerik/lig.html', 'lig=super-lig') }] });
  K.altCubuk('bolum');
  K.oynatici();

  /* lig çipi ve Genel/İç/Dış segmenti: tablo yerinde değişir; futbol tablolarında sayfası olan dört kulübün satırı takım sayfasını açar (spor.js) */
  function bagla(){ S.tabloBagla(e.querySelector('[data-tablo]'), ANAHTAR[lig]); }
  bagla();
  var cp = e.querySelector('[data-lig]');
  /* seçili lig çipi görünür yere kayar */
  if (cp && lig !== 'super') { var ce = cp.querySelector('[aria-pressed="true"]'), ry = cp.querySelector('.k-ray'); ry.scrollLeft = ce.offsetLeft - ry.offsetLeft - parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--kenar')); }
  if (cp) cp.addEventListener('click', function(ev){ var c = ev.target.closest('.k-cip'); if (!c) return; lig = KODLAR[[].indexOf.call(cp.querySelectorAll('.k-cip'), c)]; gor = 'genel'; e.querySelector('[data-tablo]').innerHTML = tablo(); bagla(); });
  e.addEventListener('click', function(ev){ var b = ev.target.closest('[data-tablo] .k-segment button'); if (!b) return;
    setTimeout(function(){ gor = ['genel', 'ic', 'dis'][[].indexOf.call(b.parentNode.querySelectorAll('button'), b)]; e.querySelector('[data-tablo]').innerHTML = tablo(); bagla(); }, 300); });
  if (DUR === 'cevrimdisi' && !DUZ) {
    var bt = K.toast('Çevrimdışısın', { bant: true, eylem: 'Kaydedilenler', eylemFn: function(){ location.href = K.git('kaydedilenler'); } });
    bt.querySelector('button').classList.add('k-dk44');
  }
  document.addEventListener('click', function(ev){ var y = ev.target.closest('[data-yeniden]'); if (!y) return;
    y.classList.add('is-yukleniyor'); y.innerHTML = K.I('fa-circle-notch', 'fa-spin') + '<span>Deneniyor</span>';
    setTimeout(function(){ var q = new URLSearchParams(location.search); ['durum', 'hata', 'hal', 'onbellek'].forEach(function(x){ q.delete(x); }); location.search = q.toString(); }, 1200); });
})();
</script>
</body>
</html>

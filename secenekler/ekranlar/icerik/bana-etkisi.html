<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>Bana Etkisi</title>
<!--
  BANA ETKİSİ · E-280–E-285 · kök: Liste (büyük başlık) · alt çubukta "Bölümler" seçili.
  Üye: büyük başlık → profil çipleri (Öğrenci, Çalışan, Emekli, Ev sahibi, Kiracı, Esnaf; panelle aynı) → "Yapay zekâ ile hazırlandı" →
  Senin İçin Ne Değişti? (6 kart; kitin bölüm kartı: başlık, metin, kaynak satırı) → Profiline Göre Haberler (96).
  Misafir (?uye=0): K44 kural 6 — yalnız tek giriş çağrısı (K.bos, "Giriş yap"); Bana Etkisi içeriği yalnız üyeye.
  Parametreler: ?uye=0 · ?durum=yukleniyor | bos | hata (&hata=zaman-asimi) | cevrimdisi (&onbellek=0 → önbellek yok) · ?tema=koyu · ?calan=1
  Kaynak: public bana-etkisi.html (profiller ve ikonları, "Kiracı" profilinin altı başlığı ve kaynakları, haber listesi aynen); panel tasarim-kararlari "Bana etkisi · profile göre".
  Varsayımlar (onaylanmadı): örnek üye Ece'nin profili Kiracı (sitede yalnız Kiracı profilinin içeriği var); profil metinleri AI ile üretilir (panelde "AI ile üret" varsayılanı) ve etiketlenir;
  haber satırındaki profil etiketi haberin başlığından çıkarıldı. Misafire tek giriş çağrısı (K44).
-->
<link rel="stylesheet" href="../../_ortak/cerceve.css">
<link rel="stylesheet" href="../../_ortak/marka.css">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../_ortak/icerik.js"></script>
<script src="../../_ortak/cerceve.js"></script>
<script src="../../_ortak/icerik-ek.js"></script>
<script src="../../kit/kit.js"></script>
</head>
<body>
<div class="ekran" id="ekran"></div>
<script>
(function(){
  var e = document.getElementById('ekran'), Q = K.q, DUR = K.durum, I = K.I;
  var PROFIL = [['Öğrenci', 'fa-user-graduate'], ['Çalışan', 'fa-briefcase'], ['Emekli', 'fa-person-cane'], ['Ev sahibi', 'fa-house-user'], ['Kiracı', 'fa-key'], ['Esnaf', 'fa-store']];
  var PIK = {}; PROFIL.forEach(function(p){ PIK[p[0]] = p[1]; });
  /* kaynak: public bana-etkisi.html "Senin İçin Ne Değişti?" · Kiracı */
  var KART = [['fa-percent', 'Kira artış sınırı', 'Kasım\'da yenilenen sözleşmelerde artış, 12 aylık TÜFE ortalaması olan yüzde 39,2\'yi geçemez.', 'TÜİK · 3 Kasım'],
    ['fa-sack-dollar', 'Depozito kuralları', 'Depozito en fazla üç aylık kira tutarında olabilir; iadesi tahliye tarihinden itibaren 30 gün içinde yapılmalı.', 'Türk Borçlar Kanunu'],
    ['fa-fire-flame-simple', 'Doğalgaz tarifesi', 'Konutlarda doğalgaza aralıkta zam yapılmadı; kış dönemi tarifesi mart sonuna kadar geçerli.', 'Enerji düzenleyicisi · 21 Kasım'],
    ['fa-building', 'Aidat ve ortak gider', 'Kiracı yalnızca ortak kullanım giderlerini öder; çatı onarımı gibi esaslı tamirler ev sahibine aittir.', 'Kat Mülkiyeti Kanunu'],
    ['fa-hand-holding-dollar', 'Konut kredisi', 'İlk evini alacaklar için faiz destekli kredi başvuruları 1 Aralık\'ta açılıyor.', 'Hazine duyurusu · 22 Kasım'],
    ['fa-truck', 'Taşınma ve adres', 'Yeni adresini 20 gün içinde e-Devlet\'ten bildirmen gerekiyor; gecikmede idari para cezası uygulanıyor.', 'Nüfus Hizmetleri Kanunu']];
  /* kaynak: public bana-etkisi.html "Bana Etkisi Haberleri" (96; ilk sayfa) */
  var HABER = [['Kiracı', 'Kiracıysan kasımda neler değişti? Altı başlıkta özet', 'Ozan Er', '2 dk', '14,8 B'], ['Çalışan', 'Asgari ücret görüşmeleri bordroya ne zaman yansır?', 'Nilay Ersoy', '5 dk', '8,8 B', 'asgari'],
    ['Emekli', 'Emekli ocak zammı hesabı: hangi veriler belirleyici?', 'Ozan Er', '3 dk', '14,1 B'], ['Öğrenci', 'KYK bursu ve kredi ödemeleri için yeni takvim', 'Ozan Er', '6 dk', '7,4 B', 'osym', '22 Kas'],
    ['Esnaf', 'Esnafa yönelik kredi destek paketi kimleri kapsıyor?', 'Nilay Ersoy', '4 dk', '12,7 B', 'carsi', '22 Kas'], ['Ev sahibi', 'Ev sahipleri için kira geliri beyan takvimi', 'Nilay Ersoy', '2 dk', '6,0 B', '', '22 Kas'],
    ['', 'Kış lastiği zorunluluğu servis ve ticari araçları nasıl etkiliyor?', 'İrem Su', '5 dk', '11,3 B', 'kar-sokak', '21 Kas'], ['', 'Elektrik faturasında kademe sınırı değişti: kim etkilenir?', 'İrem Su', '3 dk', '4,6 B', 'ruzgar', '21 Kas']];
  /* K44 kural 8: KYK → üniversite (osym), esnaf → çarşı (carsi), elektrik → enerji santrali (ruzgar); kiracı, emekli ve ev sahibi haberlerine uygun görsel yok, yazılı */
  var SECILI = 'Kiracı';

  var bas = '<div class="k-ust-bosluk"></div><div class="k-bbas"><h1>Bana Etkisi</h1><p>Gündemdeki kararların öğrenci, çalışan, emekli ya da kiracı için anlamı</p></div>';
  var cipler = '<div class="k-ic"><span class="k-grup-b" style="margin-top:0">Profilin</span></div><div class="k-ray s8" data-tek>' +
    PROFIL.map(function(p){ return K.cip(p[0], { ikon: p[1], secili: p[0] === SECILI }); }).join('') + '</div>';
  var kartlar = '<section class="k-bl sik">' + K.bb({ baslik: 'Senin İçin Ne Değişti?', ikon: 'fa-user', sayi: KART.length }) +
    '<div class="k-ic"><div style="display:flex;align-items:center;gap:var(--b-12);margin-bottom:var(--b-12)"><span class="k-ai">' + I('fa-wand-magic-sparkles') + 'Yapay zekâ ile hazırlandı</span>' + K.meta([SECILI + ' için', '10.45 Güncellendi']).replace('k-meta"', 'k-meta" style="margin-top:0"') + '</div>' +
    '<div style="display:grid;gap:var(--b-12)">' + KART.map(function(k, i){ return K.bolumKart({ ikon: k[0], baslik: k[1], sira: i + 1, toplam: KART.length, icerik: '<p class="duz">' + k[2] + '</p><p class="not">' + k[3] + '</p>' }); }).join('') + '</div></div></section>';
  var haber = function(b){ return '<section class="k-bl">' + K.bb({ baslik: b, ikon: 'fa-newspaper', sayi: 96 }) + '<div class="k-satirlar">' +
    HABER.map(function(h){ return K.satir({ alt: h[0] || 'Bana Etkisi', saat: h[6], baslik: h[1], yazar: h[2], sure: h[3], izlenme: h[4], g: h[5] }, { ikon: PIK[h[0]] || 'fa-user' }); }).join('') + '</div></section>'; };
  /* K44 kural 6 (Yasin Bey): Bana Etkisi yalnız üyeye; misafire yalnız tek giriş çağrısı (profil seçimi, kartlar ve haberler gösterilmez) */
  var misafir = K.bos({ ikon: 'fa-user', baslik: 'Bana Etkisi üyelere özel', aciklama: 'Giriş yap, profilini seç; gündemdeki kararların sana etkisini burada görelim.', eylem: { metin: 'Giriş yap', ikon: 'fa-right-to-bracket', href: K.git('giris') } });
  var hata = DUR === 'hata' ? (Q.get('hata') === 'zaman-asimi' ? 'zaman-asimi' : 'sunucu') : (DUR === 'cevrimdisi' && Q.get('onbellek') === '0') ? 'cevrimdisi' : '';
  if (DUR === 'yukleniyor') e.innerHTML = bas + '<div class="k-ic"><div style="display:flex;gap:var(--b-8)">' + [96, 92, 88].map(function(w){ return '<i class="k-isk" style="width:' + w + 'px;height:36px;flex:none"></i>'; }).join('') + '</div>' +
    '<div style="display:grid;gap:var(--b-12);margin-top:var(--b-24)"><i class="k-isk kart" style="height:150px"></i><i class="k-isk kart" style="height:150px"></i><i class="k-isk kart" style="height:150px"></i></div></div><div class="k-son"></div>';
  else if (hata) e.innerHTML = '<div class="k-ust-bosluk"></div>' + K.hata({ tur: hata }) + '<div class="k-son"></div>';
  else if (!K.uye) e.innerHTML = bas + misafir + '<div class="k-son"></div>';
  else if (DUR === 'bos') e.innerHTML = bas + cipler + K.bos({ ikon: 'fa-user', baslik: 'Bugün profilin için yeni başlık yok', aciklama: 'Kiracıları ilgilendiren bir karar ya da düzenleme olunca burada görürsün.', eylem: { metin: 'Bütün Bana Etkisi haberleri', tur: 'sade', href: K.u('hibrit/liste.html', 'bolum=kesfet') } }) + '<div class="k-son"></div>';
  else e.innerHTML = bas + cipler + kartlar + haber('Profiline Göre Haberler') + '<div class="k-son"></div>';

  /* seçili profil çipi görünür yere kayar */
  var sc = e.querySelector('.k-ray[data-tek] .k-cip[aria-pressed="true"]'); if (sc) sc.parentNode.scrollLeft = sc.offsetLeft - sc.parentNode.offsetLeft - parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--kenar'));
  K.ustCubuk({ geri: K.git('kesfet'), baslik: 'Bana Etkisi', buyuk: !hata, eylemler: K.uye ? ['paylas'] : [] });
  K.altCubuk('bolum');
  K.oynatici();
  if (DUR === 'cevrimdisi' && !hata) {
    var bt = K.toast('Çevrimdışısın', { bant: true, eylem: 'Kaydedilenler', eylemFn: function(){ location.href = K.git('kaydedilenler'); } });
    bt.querySelector('button').classList.add('k-dk44');
  }
  document.addEventListener('click', function(ev){ var y = ev.target.closest('[data-yeniden]'); if (!y) return;
    y.classList.add('is-yukleniyor'); y.innerHTML = I('fa-circle-notch', 'fa-spin') + '<span>Deneniyor</span>';
    setTimeout(function(){ var q = new URLSearchParams(location.search); ['durum', 'hata', 'onbellek'].forEach(function(x){ q.delete(x); }); location.search = q.toString(); }, 1200); });
})();
</script>
</body>
</html>

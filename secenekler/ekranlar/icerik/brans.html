<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>Branş</title>
<!-- Dada Haber Mobil · BRANŞ MERKEZİ (yeni; public futbol.html, basketbol.html, voleybol.html karşılığı). Liste kökünden: görselli başlık (branşın fotoğrafı; kapak kitin k-kapak'ı),
     ligler şeridi (çip → lig sayfası), sonra public branş sayfasının sırası (banner → Canlı Maçlar ve Son Skorlar → Puan Durumu → Fikstür → Transfer → Tüm X Haberleri):
     Canlı ve Son Skorlar (bugün; lige göre gruplu, katlanır başlık → lig sayfası; Canlı Skor'un branş süzgeci), Puan Durumu (segment: branşın tablolu ligleri; ilk 6, Tümü → lig sayfası),
     Fikstür (yaklaşan maçlar, gün ayraçlı), Transfer (son hareketler → Transfer), Haberler (bölüm haberleri, K44 satırı). Takımlar arma ile (K.arma: skor xs, tablo s, transfer m).
     Sorgu: ?brans=basketbol|voleybol|futbol (varsayılan basketbol) · ?uye=0 (fark yok; satırlarda kaydet giriş tetiği kitten)
            ?durum=yukleniyor | yenileniyor (&hal=cekiliyor|birak|bitti) | bos (bugün bu branşta maç yok) | hata (&hata=zaman-asimi) | cevrimdisi (&onbellek=0) | bulunamadi
     Veri: spor.js (public branş sayfaları: canlı maçlar, puan durumu, fikstür, transfer, haberler; saatler sözlükten). -->
<link rel="stylesheet" href="../../_ortak/cerceve.css">
<link rel="stylesheet" href="../../_ortak/marka.css">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../_ortak/icerik.js"></script>
<script src="../../_ortak/cerceve.js"></script>
<script src="../../_ortak/icerik-ek.js"></script>
<script src="../../kit/kit.js"></script>
<script src="spor.js"></script>
<style>
/* KİT ADAYI: lig başlığı (katlanır) — Maçkolik tarzı skor listesinde maçlar lige göre gruplanır; lig adına dokununca lig sayfası, sağdaki sayı + ok düğmesi grubu katlar (spor.js ligGrup) */
.sp-lig{margin-top:var(--b-16)}
.sp-lig-b{display:flex;align-items:center;gap:var(--b-8);min-height:56px;border-bottom:1px solid var(--cizgi)}
.sp-lig-a{flex:1;min-width:0;display:flex;align-items:center;gap:var(--b-12);min-height:var(--dokun);color:inherit}
.sp-lig-i{width:32px;height:32px;flex:none;border-radius:var(--k-ic);background:var(--k-yuzey);display:grid;place-items:center;font-size:14px;color:var(--marka-metin)}
.sp-lig-t{min-width:0;display:flex;flex-direction:column;gap:var(--b-4)}
.sp-lig-t b{font-size:15px;font-weight:var(--y-kalin);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-lig-t small{font-size:12.5px;line-height:1.2;color:var(--metin-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-lig-ac{flex:none;min-width:var(--dokun);height:var(--dokun);display:inline-flex;align-items:center;justify-content:flex-end;gap:var(--ikon-bosluk);font-size:13px;font-weight:var(--y-kalin);color:var(--metin-3);font-variant-numeric:tabular-nums}
.sp-lig-ac i{font-size:12px;transition:transform .2s}
.sp-lig.kapali .sp-lig-ac i{transform:rotate(-90deg)}
.sp-lig.kapali .sp-lig-l{display:none}
/* KİT ADAYI: transfer satırı — kulüp arması (K.arma m), hareket, kulüp, durum etiketi (Resmî · Görüşme · Söylenti); satırın tamamı habere gider */
.sp-tr{display:flex;align-items:center;gap:var(--b-12);min-height:68px;padding:var(--b-12) 0;border-bottom:1px solid var(--cizgi);color:inherit}
.sp-tr .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--b-4)}
.sp-tr b{font-size:15px;font-weight:var(--y-kalin);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sp-tr small{font-size:12.5px;color:var(--metin-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-tr .k-etiket{flex:none}
/* yapışkan denetim bandı (branş segmenti + gün sekmeleri) */
.sp-yapis{position:sticky;top:var(--k-ub-h);z-index:60;background:var(--zemin)}
.sp-sw{padding:var(--b-12) var(--kenar) 0}
</style>
</head>
<body>
<div class="ekran" id="ekran"></div>
<script>
(function(){
  var Q = K.q, DUR = K.durum, HAL = Q.get('hal'), e = document.getElementById('ekran'), S = SPOR;
  /* kaynak: public futbol.html, basketbol.html, voleybol.html (başlık altı açıklama) */
  var BR = {
    futbol: { ad: 'Futbol', alt: 'Süper Lig, alt ligler, Avrupa kupaları ve millî takım', g: 'superlig' },
    basketbol: { ad: 'Basketbol', alt: 'Basketbol Süper Ligi, EuroLeague, kadın basketbolu ve millî takım', g: 'basket' },
    voleybol: { ad: 'Voleybol', alt: 'Sultanlar Ligi, Efeler Ligi, Avrupa kupaları ve Filenin Sultanları', g: 'voleybol' }
  };
  var b = Q.get('brans') || 'basketbol', YOK = !BR[b] || DUR === 'bulunamadi'; if (YOK) b = 'basketbol';
  var B = BR[b], BOS = DUR === 'bos';
  var LIGLER = S.SIRA.filter(function(k){ var l = S.LIG[k]; return l.b === b && !l.milli; });
  var TABLOLU = LIGLER.filter(function(k){ return S.LIG[k].tablo; });
  var bugun = BOS ? [] : S.M.filter(function(m){ return m.b === b && m.t === S.BUGUN && !m.gizli; });
  var gelecek = S.sirala(S.M.filter(function(m){ return m.b === b && m.hal === 'b' && m.t > S.BUGUN && !m.gizli; })).slice(0, 6);
  var TR = S.TRANSFER[b];

  var bas = '<header class="k-kapak" style="background-image:' + G(B.g) + '"><h1>' + B.ad + '</h1><p>' + B.alt + '</p></header>';
  var ligRay = '<div class="k-ray s8" style="padding-top:var(--b-16)">' + LIGLER.map(function(k){ return K.cip(S.LIG[k].ad, { ikon: S.ligIkon(k), attr: 'data-href="' + S.ligHref(k) + '"' }); }).join('') +
    K.cip('Millî Takım', { ikon: 'fa-flag', attr: 'data-href="' + K.u('ekranlar/icerik/milli-takim.html') + '"' }) + '</div>';
  function bolum(bb, ic, cls){ return '<section class="k-bl sik">' + K.bb(bb) + '<div class="' + (cls || 'k-ic') + '">' + ic + '</div></section>'; }
  var cl = bugun.filter(function(m){ return m.hal === 'c'; }).length;
  var skorlar = bolum({ baslik: 'Canlı ve Son Skorlar', canli: cl > 0, ikon: cl ? null : 'fa-futbol', sayi: bugun.length || null, baglanti: { metin: 'Canlı Skor', href: K.u('ekranlar/icerik/canli-skor.html', 'spor=' + b) } },
    bugun.length ? S.ligGruplari(bugun) : K.bos({ ikon: S.BRANS[b].ikon, baslik: 'Bugün ' + B.ad.toLocaleLowerCase('tr') + ' maçı yok', aciklama: 'Yaklaşan maçlar aşağıda; başlayınca skorlar burada canlı akar.' }));
  var fikstur = gelecek.length ? bolum({ baslik: 'Fikstür', ikon: 'fa-calendar-day', baglanti: { metin: 'Tümü', href: K.u('ekranlar/icerik/canli-skor.html', 'spor=' + b + '&gun=yarin') } },
    S.gunListe(gelecek, { sag: function(m, n){ return S.LIG[m.lig].ad; } })) : '';
  var puan = TABLOLU.length ? bolum({ baslik: 'Puan Durumu', ikon: 'fa-ranking-star', baglanti: { metin: 'Tümü', href: K.u('ekranlar/icerik/lig.html', 'lig=' + TABLOLU[0] + '&sekme=puan'), attr: '' } },
    (TABLOLU.length > 1 ? '<div style="padding-bottom:var(--b-12)" data-puan-sec>' + K.segment(TABLOLU.slice(0, 3).map(function(k){ return { bsl: 'BSL', euroleague: 'EuroLeague', kbsl: 'Kadınlar', sultanlar: 'Sultanlar', efeler: 'Efeler', 'cev-sl': 'CEV ŞL', 'super-lig': 'Süper Lig', '1-lig': '1. Lig', 'premier-lig': 'Premier Lig' }[k] || S.LIG[k].ad; }), 0) + '</div>' : '') +
    '<div data-tablo>' + puanTablo(TABLOLU[0]) + '</div>') : '';
  function puanTablo(k){ return S.tablo(k, K.uye ? 'GS' : null, { ilk: 6 }) + '<p class="k-not">' + K.I('fa-circle-info') + '<span>' + S.LIG[k].ad + ' · ' + S.LIG[k].not + '</span></p>'; }
  var transfer = bolum({ baslik: 'Transfer', ikon: 'fa-right-left', sayi: TR.length, baglanti: { metin: 'Tümü', href: K.u('ekranlar/icerik/transfer.html', 'brans=' + b) } }, TR.map(S.transfer).join(''));
  var haber = '<section class="k-bl">' + K.bb({ baslik: B.ad + ' Haberleri', ikon: S.BRANS[b].ikon, sayi: S.TOPLAM[b], not: 'En yeni' }) + S.haberler(S.HABER[b]) + '</section>';
  var govde = ligRay + skorlar + puan + fikstur + transfer + haber;

  var DUZ = DUR === 'hata' || YOK || (DUR === 'cevrimdisi' && Q.get('onbellek') === '0');
  if (DUR === 'yukleniyor') e.innerHTML = K.iskelet('liste') + '<div class="k-son"></div>';
  else if (DUZ) e.innerHTML = '<div class="k-ust-bosluk"></div>' + K.hata({ tur: YOK ? 'bulunamadi' : DUR === 'cevrimdisi' ? 'cevrimdisi' : (Q.get('hata') === 'zaman-asimi' ? 'zaman-asimi' : 'sunucu') }) + '<div class="k-son"></div>';
  else e.innerHTML = (DUR === 'yenileniyor' ? '<div class="k-ust-bosluk"></div>' + K.yenile(['cekiliyor', 'birak', 'bitti'].indexOf(HAL) > -1 ? HAL : 'yenileniyor') : '') +
    bas + '<div class="k-yaprak">' + govde + '<div class="k-son"></div></div>';

  if (DUZ) K.ustCubuk({ geri: true, baslik: YOK ? 'Spor' : B.ad });
  else K.ustCubuk({ tur: 'foto', geri: true, baslik: B.ad, gorsel: B.g, eylemler: [{ ikon: 'fa-bolt', etiket: 'Canlı Skor', href: K.u('ekranlar/icerik/canli-skor.html', 'spor=' + b) }, 'paylas'], dar: DUR === 'yenileniyor' });
  K.altCubuk('bolum');
  K.oynatici();

  S.tabloBagla(e.querySelector('[data-tablo]'), TABLOLU[0]);
  /* puan durumu segmenti: tablo yerinde değişir; Tümü bağlantısı seçili lige gider */
  e.addEventListener('click', function(ev){ var s = ev.target.closest('[data-puan-sec] .k-segment button'); if (!s) return;
    var k = TABLOLU[[].indexOf.call(s.parentNode.querySelectorAll('button'), s)], t = e.querySelector('[data-tablo]'); t.innerHTML = puanTablo(k); S.tabloBagla(t, k);
    var a = t.closest('section').querySelector('.k-bb a'); if (a) a.href = K.u('ekranlar/icerik/lig.html', 'lig=' + k + '&sekme=puan'); });
  if (DUR === 'cevrimdisi' && !DUZ) {
    var bt = K.toast('Çevrimdışısın', { bant: true, eylem: 'Kaydedilenler', eylemFn: function(){ location.href = K.git('kaydedilenler'); } });
    bt.querySelector('button').classList.add('k-dk44');
  }
  document.addEventListener('click', function(ev){ var y = ev.target.closest('[data-yeniden]'); if (!y) return;
    y.classList.add('is-yukleniyor'); y.innerHTML = K.I('fa-circle-notch', 'fa-spin') + '<span>Deneniyor</span>';
    setTimeout(function(){ var q = new URLSearchParams(location.search); ['durum', 'hata', 'hal', 'onbellek'].forEach(function(x){ q.delete(x); }); location.search = q.toString(); }, 1200); });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>Trafik ve Ulaşım</title>
<!-- Dada Haber Mobil · TRAFİK VE ULAŞIM (6. dalga, satırlar E-? · lider numaralar). Çekmece menüsünden açılan servis ekranı; kök: Liste (büyük başlık), alt çubukta "Bölümler" seçili.
     Yapı: büyük başlık → Yol Durumu (şehir çipleri + "Başka il" alt sayfası; güzergâh satırı: ad, yön · süre · not, durum etiketi) → Önemli Telefonlar (dokununca arar) →
     Duyurular (ulaşım kurumları, çizelge) → Trafik ve Ulaşım Haberleri.
     Sorgu: ?durum=yukleniyor | bos (seçilen ilde izlenen güzergâh yok; &il=Trabzon varsayılan) | hata (&hata=zaman-asimi) | cevrimdisi (&onbellek=0 → önbellek yok; telefonlar yine görünür)
     Veri: public trafik-ulasim.html (yol tablosu, telefonlar, duyurular, haber listesi); haber saat/yazar/okunma araclar/ornek_veri.json; "Başka il" listesi public akaryakit-fiyatlari.html il tablosu.
     Görsel yalnız konuya uyan anahtar (metro: M2 haberi; koy-yolu: D'de kış lastiği haberine verilmiş). -->
<link rel="stylesheet" href="../../_ortak/cerceve.css">
<link rel="stylesheet" href="../../_ortak/marka.css">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../_ortak/icerik.js"></script>
<script src="../../_ortak/cerceve.js"></script>
<script src="../../_ortak/icerik-ek.js"></script>
<script src="../../kit/kit.js"></script>
<style>
/* KİT ADAYI: durum satırı — güzergâh (ad iki satıra kadar, bilgi satırı tek satır) + sağda durum etiketi; yol tablosu telefonda sığmadığı için satır */
.x-yol{display:flex;align-items:center;gap:var(--b-12);min-height:60px;padding:var(--b-12) var(--b-16)}
.x-yol+.x-yol{background-image:linear-gradient(var(--cizgi),var(--cizgi));background-size:calc(100% - 32px) 1px;background-position:center top;background-repeat:no-repeat}
.x-yol .t{flex:1;min-width:0}
.x-yol .t b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15.5px;line-height:1.3;font-weight:var(--y-orta)}
.x-yol .t .k-meta{margin-top:var(--b-4)}
</style>
</head>
<body>
<div class="ekran" id="ekran"></div>
<script>
(function(){
  var Q = K.q, DUR = K.durum, I = K.I, e = document.getElementById('ekran');
  var GUN = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'], AY = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];

  /* kaynak: public trafik-ulasim.html "Yol Durumu" — [güzergâh, yön, durum, süre, not, şehir çipi]; yön parantezden ayrıldı, "—" boş sayıldı */
  var YOL = [['15 Temmuz Şehitler Köprüsü', 'Anadolu → Avrupa', 'Yoğun', '24 dk', 'Altunizade girişinde kuyruk', 'İstanbul'],
    ['Fatih Sultan Mehmet Köprüsü', 'Avrupa → Anadolu', 'Yoğun', '31 dk', 'Kavacık bağlantısı yavaş', 'İstanbul'],
    ['Avrasya Tüneli', '', 'Akıcı', '8 dk', '', 'İstanbul'], ['D-100 Mecidiyeköy – Zincirlikuyu', '', 'Yoğun', '18 dk', 'Sağ şerit kapalı', 'İstanbul'],
    ['TEM Mahmutbey – Hasdal', '', 'Normal', '12 dk', '', 'İstanbul'], ['Kuzey Marmara Otoyolu', '', 'Akıcı', '', 'Yağışa dikkat', 'Şehirlerarası'],
    ['Anadolu Otoyolu, Bolu Dağı', '', 'Sis', '', 'Görüş 50 metre', 'Şehirlerarası'], ['Ankara, Eskişehir Yolu', '', 'Normal', '14 dk', '', 'Ankara'],
    ['İzmir, Çevre Yolu Bornova', '', 'Yoğun', '16 dk', 'Kaza nedeniyle tek şerit', 'İzmir'], ['Osmangazi Köprüsü', '', 'Akıcı', '', '', 'Şehirlerarası']];
  var ETK = { 'Yoğun': 'kirmizi', 'Akıcı': 'yesil', 'Normal': '', 'Sis': 'sari' };
  var SEHIR = ['Tümü', 'İstanbul', 'Ankara', 'İzmir', 'Şehirlerarası'];
  /* kaynak: public akaryakit-fiyatlari.html il tablosu (yol verisi olmayan iller) */
  var ILLER = ['Antalya', 'Bursa', 'Adana', 'Konya', 'Gaziantep', 'Trabzon'];
  /* kaynak: public trafik-ulasim.html "Önemli Telefonlar" */
  var TEL = [['Acil Çağrı Merkezi', '112', 'Kaza, yaralanma, acil durum'], ['Alo Karayolları', '159', 'Yol durumu ve bilgi'], ['Belediye', '153', 'Toplu taşıma ve yol bildirimleri']];
  /* kaynak: public trafik-ulasim.html "Duyurular" — [ay (0-11), gün, saat, kurum, başlık, ayrıntı, tür, önem] */
  var DUY = [[10, 23, '17.00', 'İBB', 'Metrobüs hattında ek sefer', 'Akşam yoğunluğu için', 'Duyuru', ''],
    [10, 28, '00.00', 'Metro İstanbul', 'M2 hattında bakım', 'Cumartesi gece seferleri yok', 'Kesinti', 'sari'],
    [11, 1, '00.00', 'Emniyet', 'Kış lastiği zorunluluğu başlıyor', "Ticari araçlar, 1 Nisan'a kadar", 'Kural', 'sari'],
    [11, 3, '10.00', 'KGM', "Bolu Tüneli'nde bakım çalışması", 'Gece 01.00–05.00 arası', 'Çalışma', '']];
  /* kaynak: public trafik-ulasim.html haber listesi (etiketler) + araclar/ornek_veri.json (saat, yazar, süre, okunma) */
  var HAB = [['Trafik', "İstanbul'da akşam trafiğinde yoğunluk yüzde 68'e çıktı", 'Ayşe Yıldız', '07.35', '2 dk', '9,4 B', 'kar-sokak'],
    ['Kış lastiği', "Ticari araçlarda kış lastiği zorunluluğu 1 Aralık'ta başlıyor", 'Sibel Arslan', '15.10', '3 dk', '3,6 B', 'koy-yolu'],
    ['Bolu Dağı', 'Sis nedeniyle görüş mesafesi 50 metreye düştü', 'Ayşe Yıldız', '07.10', '4 dk', '2,9 B'],
    ['Metro', 'M2 hattında hafta sonu bakım çalışması', 'Sibel Arslan', '22 Kas', '3 dk', '14,2 B', 'metro'],
    ['Havalimanı', 'Havalimanlarında kasım ayı yolcu sayısı açıklandı', 'Sibel Arslan', '22 Kas', '4 dk', '9,6 B'],
    ['Toplu taşıma', "Ankara'da yeni otobüs hatları hizmete girdi", 'Hakan Uysal', '22 Kas', '2 dk', '8,1 B', 'ankara-kar'],
    ['Demiryolu', 'Hızlı trende yeni sefer saatleri yürürlükte', 'Hakan Uysal', '21 Kas', '3 dk', '6,7 B', 'metro'],
    ['Deniz ulaşımı', 'Fırtına nedeniyle bazı vapur seferleri iptal edildi', 'Sibel Arslan', '21 Kas', '5 dk', '5,9 B', 'balikci']];
  /* K44 kural 8: konuya uygun görsel (KAYNAK.txt): İstanbul trafiği → İstanbul sokağı, Ankara otobüs → Ankara caddesi, hızlı tren → raylı sistem (metro), vapur → Galata (balikci); sis ve havalimanı yazılı */

  function yol(y){ return '<div class="x-yol" data-sehir="' + y[5] + '"><span class="t"><b>' + y[0] + '</b>' + (y[1] || y[3] || y[4] ? K.meta([y[1], y[3], y[4]]) : '') + '</span>' + K.etiket(y[2], { tur: ETK[y[2]] }) + '</div>'; }
  function gunAd(a, g){ return a === 10 && g === 23 ? 'Bugün' : g + ' ' + AY[a] + ' ' + GUN[new Date(2026, a, g).getDay()]; }
  function duyuru(L){ var dl = null;
    return L.map(function(x, i){ var k = x[0] + '-' + x[1], a = k !== dl ? '<div class="k-ayrac"><span>' + gunAd(x[0], x[1]) + '</span><span>' + (k === '10-23' ? '23 Kasım ' + GUN[1] : '') + '</span></div>' : ''; dl = k;
      return a + '<div class="k-cz' + (i === 0 ? ' ilk' : '') + '"><span class="sa">' + x[2] + '</span><span class="ci"></span><span class="no"></span><div class="yazi"><div>' +
        '<span class="k-ustsatir"><span class="sol"><span class="s">' + x[3] + '</span></span></span><h3>' + x[4] + '</h3><div class="k-ab">' + K.meta([x[5]]) + K.etiket(x[6], { tur: x[7] }) + '</div></div></div></div>'; }).join(''); }
  function haber(x){ return { alt: x[0], ikon: 'fa-car', baslik: x[1], yazar: x[2], saat: x[3], sure: x[4], izlenme: x[5], g: x[6] }; }

  var BOS = DUR === 'bos', IL = BOS ? (Q.get('il') || 'Trabzon') : '';
  var HATA = DUR === 'hata' ? (Q.get('hata') === 'zaman-asimi' ? 'zaman-asimi' : 'sunucu') : (DUR === 'cevrimdisi' && Q.get('onbellek') === '0') ? 'cevrimdisi' : '';
  var bas = '<div class="k-ust-bosluk"></div><div class="k-bbas"><h1>Trafik ve Ulaşım</h1><p>Yol durumu, toplu taşıma duyuruları ve önemli telefonlar</p></div>';
  var yogun = YOL.filter(function(y){ return y[2] === 'Yoğun'; }).length;

  var cipler = '<div class="k-ray s8" data-tek role="group">' + SEHIR.map(function(s, i){ return K.cip(s, { secili: !IL && i === 0, attr: 'data-sec="' + (i ? s : '') + '"' }); }).join('') +
    K.cip(IL || 'Başka il', { ikon: 'fa-location-dot', secili: !!IL, attr: 'data-il' }) + '</div>';
  var bosB = function(il){ return K.bos({ ikon: 'fa-road', baslik: il + ' için yol verisi yok', aciklama: 'Şimdilik büyükşehirlerdeki ana güzergâhlar ve otoyollar izleniyor.', eylem: { metin: 'Bütün güzergâhlar', tur: 'sade', attr: 'data-tum' } }); };
  var yolB = '<section class="k-bl sik">' + K.bb({ baslik: 'Yol Durumu', ikon: 'fa-road', not: 'Şu an · ' + yogun + ' yoğun' }) + cipler +
    '<div class="k-ic" style="padding-top:var(--b-12)"><div data-liste' + (IL ? ' hidden' : '') + '><div class="k-grup-k">' + YOL.map(yol).join('') + '</div>' +
    '<p class="k-grup-n">Karayolları Genel Müdürlüğü ve büyükşehir belediyeleri verisi · ' + D.simdi.saat + '</p></div><div data-bos' + (IL ? '' : ' hidden') + '>' + (IL ? bosB(IL) : '') + '</div></div></section>';
  var tel = '<section class="k-bl">' + K.bb({ baslik: 'Önemli Telefonlar', ikon: 'fa-phone', not: 'Resmî' }) +
    K.grup('', TEL.map(function(t){ return { ikon: 'fa-phone', baslik: t[0], alt: t[2], sag: 'deger', deger: t[1], href: 'tel:' + t[1] }; }), 'Dokununca arar.').replace('k-grup"', 'k-grup" style="margin-top:0"') + '</section>';
  var duy = '<section class="k-bl">' + K.bb({ baslik: 'Duyurular', ikon: 'fa-bullhorn', not: 'Ulaşım kurumlarından' }) + '<div class="k-ic">' + duyuru(DUY) + '</div></section>';
  var hab = '<section class="k-bl">' + K.bb({ baslik: 'Trafik ve Ulaşım Haberleri', ikon: 'fa-newspaper', sayi: 96 }) + '<div class="k-satirlar">' + HAB.map(function(x){ return K.satir(haber(x)); }).join('') + '</div>' + K.dahaFazla('yukleniyor') + '</section>';
  var cevrim = DUR === 'cevrimdisi' ? '<div class="k-ic">' + K.serit({ tur: 'uyari', ikon: 'fa-plug-circle-xmark', metin: 'Çevrimdışısın', alt: 'Yol durumu son veri; bağlantı gelince yenilenir.' }) + '</div>' : '';

  if (DUR === 'yukleniyor') e.innerHTML = bas + '<div class="k-ic" style="padding-top:var(--b-16)">' + K.iskelet('metin', 8) + '</div><div class="k-satirlar" style="padding-top:var(--b-24)">' + K.iskelet('satir', 3) + '</div><div class="k-son"></div>';
  else if (HATA === 'cevrimdisi') e.innerHTML = '<div class="k-ust-bosluk"></div>' + K.hata({ tur: 'cevrimdisi' }) + tel + '<div class="k-son"></div>';
  else if (HATA) e.innerHTML = '<div class="k-ust-bosluk"></div>' + K.hata({ tur: HATA }) + '<div class="k-son"></div>';
  else e.innerHTML = bas + cevrim + yolB + tel + duy + hab + '<div class="k-son"></div>';

  var ray = e.querySelector('[data-il]'); if (ray && IL) ray.parentNode.scrollLeft = ray.parentNode.scrollWidth;
  K.ustCubuk({ geri: true, baslik: 'Trafik ve Ulaşım', buyuk: !HATA, eylemler: HATA ? [] : ['paylas'] });
  K.altCubuk('bolum');
  K.oynatici();

  /* şehir süzgeci: çip ya da "Başka il" alt sayfası; veri yoksa boş durum */
  function suz(s, il){ var l = e.querySelector('[data-liste]'), b = e.querySelector('[data-bos]'); if (!l) return;
    if (il) { l.hidden = true; b.hidden = false; b.innerHTML = bosB(il); return; }
    l.hidden = false; b.hidden = true; e.querySelectorAll('.x-yol').forEach(function(r){ r.hidden = !!s && r.getAttribute('data-sehir') !== s; }); }
  function secCip(c){ [].forEach.call(c.parentNode.children, function(x){ x.setAttribute('aria-pressed', x === c); }); }
  e.addEventListener('click', function(ev){ var t = ev.target, x;
    if ((x = t.closest('[data-sec]'))) { var ilc = e.querySelector('[data-il]'); ilc.innerHTML = I('fa-location-dot') + 'Başka il'; suz(x.getAttribute('data-sec')); }
    if (t.closest('[data-tum]')) { var c0 = e.querySelector('[data-sec=""]'); secCip(c0); e.querySelector('[data-il]').innerHTML = I('fa-location-dot') + 'Başka il'; suz(''); }
    if ((x = t.closest('[data-il]'))) {
      var s = K.sayfa({ baslik: 'İl seç', alt: 'Yol verisi büyükşehirler ve otoyollar için', icerik: K.ara({ yer: 'İl ara', ses: false }) + '<p class="k-sayfa-b">İller</p>' +
        SEHIR.slice(1, 4).concat(ILLER).map(function(il){ return K.secim('il', il, { satir: true, secili: il === IL }).replace('<input', '<input data-il-sec="' + il + '"'); }).join('') });
      s.el.addEventListener('change', function(v){ var il = v.target.getAttribute('data-il-sec'); if (!il) return; s.kapat();
        var cip = e.querySelector('[data-il]'), ciq = e.querySelector('[data-sec="' + il + '"]');
        if (ciq) { secCip(ciq); cip.innerHTML = I('fa-location-dot') + 'Başka il'; suz(il); }
        else { secCip(cip); cip.innerHTML = I('fa-location-dot') + il; suz('', il); } }); } });

  if (DUR === 'cevrimdisi' && !HATA) {
    var bt = K.toast('Çevrimdışısın', { bant: true, eylem: 'Kaydedilenler', eylemFn: function(){ location.href = K.git('kaydedilenler'); } });
    bt.querySelector('button').classList.add('k-dk44');
  }
  document.addEventListener('click', function(ev){ var y = ev.target.closest('[data-yeniden]'); if (!y) return;
    y.classList.add('is-yukleniyor'); y.innerHTML = I('fa-circle-notch', 'fa-spin') + '<span>Deneniyor</span>';
    setTimeout(function(){ var q = new URLSearchParams(location.search); ['durum', 'hata', 'onbellek', 'il'].forEach(function(x){ q.delete(x); }); location.search = q.toString(); }, 1200); });
})();
</script>
</body>
</html>

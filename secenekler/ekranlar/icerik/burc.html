<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>Koç burcu rehberi</title>
<!-- Dada Haber Mobil · BURÇ DETAYI (6. dalga, K41; site B-24). Astroloji ızgarasından ya da "Koç burcu rehberi"nden açılır; yazılı detay (uygun görsel yok), haber detayının dili:
     kategori etiketi, başlık, imza, bilgi satırı, açıklama, "Burcum yap" → element · nitelik · yönetici gezegen · sembol → Bugün (dört akordeon) → metin → burç yorumları notu
     → Konuları Takip Et → Öteki Burçlar (yatay kayar) → İlgili Haberler; altta okuma çubuğu (Dinle · Paylaş · Aa; yorum ve hikâye modu bu içerikte yok), sağ üstte Kaydet (K28).
     Sorgu: ?burc=<id> (koc boga ikizler yengec aslan basak terazi akrep yay oglak kova balik; yalnız Koç'un rehberi var, ötekilerde "rehber henüz yayımlanmadı")
            ?durum=bos (rehberi olmayan burç, varsayılan boga) · ?durum=bulunamadi (ya da tanınmayan id) · ?durum=yukleniyor | hata (&hata=zaman-asimi) | cevrimdisi (önbellekteki rehber + bant; &onbellek=0)
            ?uye=0 misafir: "Burcum yap" ve konu takibi giriş ister · ?tema=koyu
     Veri: public burc.html (Koç: başlık, açıklama, Seda Uslu · Yaşam Muhabiri, 23 Kasım 2026 · 08.00, 4 dk, sayılar, günlük yorum, metin, not, etiketler, ilgili haberler); ızgara public astroloji.html;
           ornek_veri.json (koc-burcu-rehberi). Varsayımlar (onaylanmadı): öteki burçlarda yalnız ızgaradaki bilgi (tarih, element); üye örneğinin burcu Koç. -->
<link rel="stylesheet" href="../../_ortak/cerceve.css">
<link rel="stylesheet" href="../../_ortak/marka.css">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../_ortak/icerik.js"></script>
<script src="../../_ortak/cerceve.js"></script>
<script src="../../_ortak/icerik-ek.js"></script>
<script src="../../kit/kit.js"></script>
<style>
/* yazılı detay başlığı: dada-dogrula.html incelemesindeki ölçü (detay kökü kapak başlığı 31) */
.x-bas{padding-top:var(--b-8)}
.x-bas h1{margin-top:var(--b-12);font-size:31px;line-height:1.1;font-weight:var(--y-kalin);letter-spacing:-.028em}
.x-bas>p.t{margin-top:var(--b-8);font-size:15px;color:var(--metin-3)}
.x-bas .k-zamansatir{margin-top:var(--b-16)}
.x-bas .k-spot{margin-top:var(--b-16)}
.x-bas .x-eylem{display:flex;gap:var(--b-8);margin-top:var(--b-16)}
.k-istat.iki{grid-template-columns:repeat(2,1fr)}
.x-gun{padding:0 var(--kenar)}
.x-gun .k-akordeon:first-child{border-top:1px solid var(--cizgi)}
/* KİT ADAYI: burç kutusu — astroloji.html ile aynı; rayda sabit genişlik */
.x-burc{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:var(--b-4);min-height:var(--dokun);padding:var(--b-12);border-radius:var(--k-kontrol);background:var(--k-yuzey);transition:transform .14s var(--k-egri)}
.x-burc:active{transform:scale(.97)}
.x-burc .ik{width:32px;height:32px;margin-bottom:var(--b-4);border-radius:var(--k-ic);display:grid;place-items:center;background:var(--marka-25);color:var(--marka-metin);font-size:14px}
.x-burc b{font-size:15px;line-height:1.2;white-space:nowrap}
.x-burc small{font-size:12px;color:var(--metin-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.k-ray .x-burc{width:128px;flex:none;scroll-snap-align:start}
</style>
</head>
<body>
<div class="ekran" id="ekran"></div>
<script>
(function(){
  var Q = K.q, DUR = K.durum, e = document.getElementById('ekran'), I = K.I;
  var ANA = K.u('ekranlar/icerik/astroloji.html'), BZ = function(id){ return K.u('ekranlar/icerik/burc.html', { burc: id }); };
  /* kaynak: public astroloji.html burç ızgarası (fa-wind yerine fa-feather, K32); element adı ikondan */
  var BURC = [['koc', 'Koç', 'fa-fire', '21 Mar – 19 Nis'], ['boga', 'Boğa', 'fa-mountain', '20 Nis – 20 May'], ['ikizler', 'İkizler', 'fa-feather', '21 May – 20 Haz'],
    ['yengec', 'Yengeç', 'fa-droplet', '21 Haz – 22 Tem'], ['aslan', 'Aslan', 'fa-fire', '23 Tem – 22 Ağu'], ['basak', 'Başak', 'fa-mountain', '23 Ağu – 22 Eyl'],
    ['terazi', 'Terazi', 'fa-feather', '23 Eyl – 22 Eki'], ['akrep', 'Akrep', 'fa-droplet', '23 Eki – 21 Kas'], ['yay', 'Yay', 'fa-fire', '22 Kas – 21 Ara'],
    ['oglak', 'Oğlak', 'fa-mountain', '22 Ara – 19 Oca'], ['kova', 'Kova', 'fa-feather', '20 Oca – 18 Şub'], ['balik', 'Balık', 'fa-droplet', '19 Şub – 20 Mar']];
  var ELEMENT = { 'fa-fire': 'Ateş', 'fa-mountain': 'Toprak', 'fa-feather': 'Hava', 'fa-droplet': 'Su' };
  var id = Q.get('burc') || (DUR === 'bos' ? 'boga' : 'koc'), B = BURC.filter(function(b){ return b[0] === id; })[0];
  var REHBER = !!B && id === 'koc' && DUR !== 'bos', BENIM = K.uye && id === 'koc';
  /* kaynak: public burc.html (Koç) */
  var R = { baslik: 'Koç burcu rehberi', yazar: 'Seda Uslu', unvan: 'Yaşam Muhabiri', tarih: '23 Kasım 2026', saat: '08.00', sure: '4 dk',
    spot: '21 Mart – 19 Nisan arasında doğanların burcu Koç; günlük yorum, genel özellikler ve uyumlu burçlar.',
    istat: [['Ateş', 'Element'], ['Öncü', 'Nitelik'], ['Mars', 'Yönetici gezegen'], ['Koç', 'Sembol']],
    gun: [['Genel', 'Gün, yarım kalan işleri toparlamak için uygun. Planladığın bir konuşmayı ertelemek yerine sakin bir dille başlatabilirsin.'],
      ['Aşk ve ilişkiler', 'Yakın çevrende biriyle aranızdaki küçük bir yanlış anlaşılma netleşebilir. Dinlemeye ayırdığın zaman ilişkiyi rahatlatır.'],
      ['İş ve para', 'Ekip içinde sorumluluk paylaşımı gündeme gelebilir. Harcamalarda acele etmemek bu hafta için iyi bir tercih.'],
      ['Sağlık ve enerji', 'Enerjin yüksek ama dağınık. Kısa yürüyüşler ve düzenli uyku günü dengelemene yardımcı olur.']],
    govde: '<p>Koç, zodyak kuşağının ilk burcudur ve 21 Mart ile 19 Nisan arasında doğanları kapsar. Geleneksel astrolojide ateş elementiyle ve Mars gezegeniyle ilişkilendirilir.</p>' +
      '<h2>Koç burcunun genel özellikleri</h2><p>Astroloji geleneğinde Koç burcu girişkenlik, cesaret ve yeni bir işe ilk adımı atma isteğiyle tanımlanır. Aynı gelenek, sabırsızlığı ve acele karar vermeyi bu burcun zorlandığı yönler olarak sayar.</p>' +
      '<h2>Aşkta ve ilişkilerde</h2><p>Burç yorumlarında Koç, ilişkilerde açık sözlü ve doğrudan olarak anlatılır. Ateş grubundaki Aslan ve Yay burçlarıyla uyumlu kabul edilir.</p>' +
      '<h2>İş hayatında</h2><p>Liderlik gerektiren, hızlı karar verilen ve rekabetin yüksek olduğu alanlar Koç burcuyla ilişkilendirilen çalışma ortamları arasında sayılır.</p>',
    etiket: ['Astroloji', 'Koç burcu', 'Burç yorumları'],
    ilgili: [['Yay sezonu', 'Güneş 22 Kasım\'da Yay burcuna geçti', 'Deniz Kara', '2 dk', '4,8 B', '10.05'], ['Gökyüzü', 'Aralığın ilk dolunayı 24 Kasım\'da', 'Deniz Kara', '3 dk', '3,6 B', '13.45'],
      ['Bilim', 'Astronomi ile astroloji arasındaki fark ne', 'Gülşen Ateş', '3 dk', '14,2 B', '12.05'], ['Haftalık', 'Haftanın burç yorumları: 23–29 Kasım', 'Burcu Yaman', '3 dk', '14,2 B', 'Dün']] };
  var NOT = 'Burç yorumları eğlence ve kültür içeriğidir; bilimsel bir öngörü sunmaz. Sağlık, para ve ilişki kararlarını burç yorumlarına göre verme.';

  function istat(l){ return K.istat(l).replace('class="k-istat"', 'class="k-istat iki" style="margin-top:var(--b-24)"').replace(/<a>/g, '<div>').replace(/<\/a>/g, '</div>'); }
  function burcum(sec){ return K.btn({ metin: sec ? 'Burcun' : 'Burcum yap', ikon: sec ? 'fa-check' : 'fa-star', boy: 'kucuk', tur: sec ? '' : 'sade', secili: !!sec, attr: 'data-burcum' }); }
  function kutu(b){ return '<a class="x-burc" href="' + BZ(b[0]) + '"><span class="ik">' + I(b[2]) + '</span><b>' + b[1] + '</b><small>' + b[3] + '</small></a>'; }
  var oteki = B ? '<section class="k-bl">' + K.bb({ baslik: 'Öteki Burçlar', ikon: 'fa-star', baglanti: { metin: 'Hepsi', href: ANA } }) +
    '<div class="k-ray s8">' + BURC.filter(function(b){ return b[0] !== id; }).map(kutu).join('') + '</div></section>' : '';

  var bas = REHBER
    ? '<div class="k-ust-bosluk"></div><div class="k-ic x-bas">' + K.katEt('Astroloji', 'fa-star', { ek: B[3] }) + '<h1>' + R.baslik + '</h1>' +
      '<div class="k-imza">' + K.avatar(R.yazar, 'm') + '<span class="t"><b>' + R.yazar + '</b><small>' + R.unvan + '</small></span></div>' +
      K.zamanSatir({ tarih: R.tarih, saat: R.saat, sure: R.sure }) + '<p class="k-spot">' + R.spot + '</p><div class="x-eylem">' + burcum(BENIM) + '</div></div>'
    : B ? '<div class="k-ust-bosluk"></div><div class="k-ic x-bas">' + K.katEt('Astroloji', 'fa-star', { ek: B[3] }) + '<h1>' + B[1] + ' burcu</h1><div class="x-eylem">' + burcum(false) + '</div></div>' : '';
  var rehber = istat(R.istat) +
    '<section class="k-bl">' + K.bb({ baslik: 'Bugün', ikon: 'fa-sun', not: '23 Kasım · Günlük' }) + '<div class="x-gun">' + R.gun.map(function(x, i){ return K.akordeon(x[0], x[1], i === 0); }).join('') + '</div></section>' +
    '<div class="k-ic k-govde" style="margin-top:var(--b-32)">' + R.govde + '</div>' +
    '<div class="k-ic">' + K.serit({ ikon: 'fa-circle-info', metin: 'Burç yorumları hakkında', alt: NOT }) + '</div>' +
    '<section class="k-bl">' + K.bb({ baslik: 'Konuları Takip Et', ikon: 'fa-heart' }) + '<div class="k-ray s8" data-konular>' + R.etiket.map(function(t){ return K.cip(t, { ikon: 'fa-plus' }); }).join('') + '</div></section>' +
    oteki +
    '<section class="k-bl">' + K.bb({ baslik: 'İlgili Haberler', ikon: 'fa-newspaper' }) + '<div class="k-satirlar">' +
      R.ilgili.map(function(x){ return K.satir({ alt: x[0], ikon: 'fa-star', baslik: x[1], yazar: x[2], sure: x[3], izlenme: x[4], saat: x[5] }); }).join('') + '</div></section>';
  var yok = B ? istat([[ELEMENT[B[2]], 'Element'], [B[1], 'Sembol']]) +
    K.bos({ ikon: 'fa-star', baslik: 'Bu burcun rehberi henüz yayımlanmadı', aciklama: B[1] + ' burcunun günlük yorumu ve rehberi yayımlanınca burada görünür.',
      eylem: { metin: 'Astroloji\'ye dön', href: ANA }, ikinci: { metin: 'Koç burcu rehberini oku', href: BZ('koc') } }) + oteki : '';

  var hata = !B || DUR === 'bulunamadi' ? 'bulunamadi' : DUR === 'hata' ? (Q.get('hata') === 'zaman-asimi' ? 'zaman-asimi' : 'sunucu') : (DUR === 'cevrimdisi' && Q.get('onbellek') === '0') ? 'cevrimdisi' : '';
  if (DUR === 'yukleniyor') e.innerHTML = '<div class="k-ust-bosluk"></div><div class="k-ic x-bas"><div class="k-isk-grup"><i class="k-isk" style="width:38%;height:14px"></i><i class="k-isk" style="height:30px"></i><i class="k-isk" style="width:64%;height:30px"></i></div>' +
    '<div style="margin-top:var(--b-24)">' + K.iskelet('metin', 3) + '</div><div style="margin-top:var(--b-24)"><i class="k-isk kontrol" style="display:block;height:120px"></i></div><div style="margin-top:var(--b-24)">' + K.iskelet('metin', 6) + '</div></div><div class="k-son okuma"></div>';
  else if (hata) e.innerHTML = '<div class="k-ust-bosluk"></div>' + K.hata({ tur: hata }) + '<div class="k-son yalin"></div>';
  else e.innerHTML = bas + (REHBER ? rehber + '<div class="k-son okuma"></div>' : yok + '<div class="k-son yalin"></div>');
  document.title = hata ? 'Astroloji' : REHBER ? R.baslik : B[1] + ' burcu';

  K.ustCubuk({ geri: ANA, baslik: 'Astroloji', eylemler: REHBER && !hata && DUR !== 'yukleniyor' ? ['kaydet'] : [] });
  if (!hata && REHBER) {
    var ok = K.okuma({ dinle: R.sure });
    /* yorum ve hikâye modu bu içerikte yok: okuma çubuğunun Dinle · Paylaş · Aa hali */
    ['.hmd', '[data-yorumlara]'].forEach(function(s){ var b = ok.querySelector(s); if (b) b.remove(); });
    if (DUR === 'yukleniyor') ok.classList.add('is-pasif');
  }
  K.oynatici();

  document.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-burcum]');
    if (b) { ev.preventDefault(); if (!K.uye) { K.sayfa('tetik', { eylem: 'takip' }); return; }
      var on = b.getAttribute('aria-pressed') !== 'true'; b.outerHTML = burcum(on);
      if (on) K.toast('Burcun: ' + B[1], { ikon: 'fa-star', alt: 'Günlük yorumun Astroloji\'de ilk sırada' }); }
    var c = ev.target.closest('[data-konular] .k-cip'); if (!c) return;
    if (!K.uye) { ev.stopPropagation(); K.sayfa('tetik', { eylem: 'takip' }); return; }
    setTimeout(function(){ var on2 = c.getAttribute('aria-pressed') === 'true'; c.innerHTML = I(on2 ? 'fa-check' : 'fa-plus') + c.textContent; if (on2) K.toast('Takip ediliyor: ' + c.textContent, { ikon: 'fa-heart' }); }, 0);
  }, true);
  if (DUR === 'cevrimdisi' && !hata) {
    var bt = K.toast('Çevrimdışısın', { bant: true, eylem: 'Kaydedilenler', eylemFn: function(){ location.href = K.git('kaydedilenler'); } });
    bt.querySelector('button').classList.add('k-dk44');
  }
  document.addEventListener('click', function(ev){ var y = ev.target.closest('[data-yeniden]'); if (!y) return;
    y.classList.add('is-yukleniyor'); y.innerHTML = K.I('fa-circle-notch', 'fa-spin') + '<span>Deneniyor</span>';
    setTimeout(function(){ var q = new URLSearchParams(location.search); ['durum', 'hata', 'onbellek'].forEach(function(x){ q.delete(x); }); location.search = q.toString(); }, 1200); });
})();
</script>
</body>
</html>

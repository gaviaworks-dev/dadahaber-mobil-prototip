<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>Astroloji</title>
<!-- Dada Haber Mobil · ASTROLOJİ (6. dalga, K41; site B-24). Menü çekmecesi › Servisler ve araçlar › Astroloji'den açılan itme ekranı (geri çubuğu; alt çubukta Bölümler, Kadın'ın alt konusu).
     Sıra: büyük başlık → Burçlar (12'li ızgara; dokununca burç detayı) → Koç Burcu Bugün (Genel · Aşk ve ilişkiler · İş ve para · Sağlık ve enerji) → burç yorumları notu → Astroloji Haberleri.
     Sorgu: (yok) üye; burcu Koç (ızgarada "Burcun") · ?uye=0 misafir: burç işaretsiz, "Burcunu kaydet" çağrısı (giriş), günlük yorum sitedeki gibi Koç
            ?durum=bos üye, burç seçilmemiş: ızgara işaretsiz, günlük yorumun yerinde "Burcunu seç" · ?durum=yukleniyor | hata (&hata=zaman-asimi) | cevrimdisi (son içerik + bant; &onbellek=0) · ?tema=koyu
     Veri: public astroloji.html (12 burç, tarih aralıkları, element ikonları, Koç günlük yorumu 23 Kasım 2026, "Burç yorumları hakkında" notu, haber kartı etiketleri);
           haberler ornek_veri.json (alt_konu Astroloji). Uygun haber görseli yok → yazılı satırlar.
     Varsayımlar (onaylanmadı): Hava elementi için sitedeki fa-wind çizgi göründüğünden (K32) dolu fa-feather; element adları sitedeki ikonlardan (ateş, toprak, hava, su); üye örneğinin burcu Koç (sitede seçili burç). -->
<link rel="stylesheet" href="../../_ortak/cerceve.css">
<link rel="stylesheet" href="../../_ortak/marka.css">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../_ortak/icerik.js"></script>
<script src="../../_ortak/cerceve.js"></script>
<script src="../../_ortak/icerik-ek.js"></script>
<script src="../../kit/kit.js"></script>
<style>
/* KİT ADAYI: burç kutusu — 12'li ızgara ve "Öteki burçlar" rayı için ikon + ad + tarih aralığı kutusu; seçili (üyenin burcu) marka sarısı; kartın tamamı dokunulur */
.x-burclar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--b-8);padding:0 var(--kenar)}
.x-burc{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:var(--b-4);min-height:var(--dokun);padding:var(--b-12);border-radius:var(--k-kontrol);background:var(--k-yuzey);transition:transform .14s var(--k-egri)}
.x-burc:active{transform:scale(.97)}
.x-burc .ik{width:32px;height:32px;margin-bottom:var(--b-4);border-radius:var(--k-ic);display:grid;place-items:center;background:var(--marka-25);color:var(--marka-metin);font-size:14px}
.x-burc b{font-size:15px;line-height:1.2;white-space:nowrap}
.x-burc small{font-size:12px;color:var(--metin-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.x-burc .bn{position:absolute;top:var(--b-12);right:var(--b-12);font-size:11px;font-weight:var(--y-kalin);color:var(--siyah)}
.x-burc[aria-current="true"]{background:var(--marka);color:var(--siyah)}
.x-burc[aria-current="true"] .ik{background:var(--siyah);color:var(--marka)}
.x-burc[aria-current="true"] small{color:var(--siyah);opacity:.72}
.x-gun{padding:0 var(--kenar)}
.x-gun .k-akordeon:first-child{border-top:1px solid var(--cizgi)}
</style>
</head>
<body>
<div class="ekran" id="ekran"></div>
<script>
(function(){
  var Q = K.q, DUR = K.durum, e = document.getElementById('ekran'), I = K.I;
  var BZ = function(id){ return K.u('ekranlar/icerik/burc.html', { burc: id }); };
  /* kaynak: public astroloji.html burç ızgarası (ad, tarih aralığı, element ikonu; fa-wind yerine fa-feather, K32) */
  var BURC = [['koc', 'Koç', 'fa-fire', '21 Mar – 19 Nis'], ['boga', 'Boğa', 'fa-mountain', '20 Nis – 20 May'], ['ikizler', 'İkizler', 'fa-feather', '21 May – 20 Haz'],
    ['yengec', 'Yengeç', 'fa-droplet', '21 Haz – 22 Tem'], ['aslan', 'Aslan', 'fa-fire', '23 Tem – 22 Ağu'], ['basak', 'Başak', 'fa-mountain', '23 Ağu – 22 Eyl'],
    ['terazi', 'Terazi', 'fa-feather', '23 Eyl – 22 Eki'], ['akrep', 'Akrep', 'fa-droplet', '23 Eki – 21 Kas'], ['yay', 'Yay', 'fa-fire', '22 Kas – 21 Ara'],
    ['oglak', 'Oğlak', 'fa-mountain', '22 Ara – 19 Oca'], ['kova', 'Kova', 'fa-feather', '20 Oca – 18 Şub'], ['balik', 'Balık', 'fa-droplet', '19 Şub – 20 Mar']];
  var BENIM = K.uye && DUR !== 'bos' ? 'koc' : '';
  /* kaynak: public astroloji.html "Koç Burcu Bugün" · 23 Kasım 2026 · Günlük */
  var GUN = [['Genel', 'Gün, yarım kalan işleri toparlamak için uygun. Planladığın bir konuşmayı ertelemek yerine sakin bir dille başlatabilirsin.'],
    ['Aşk ve ilişkiler', 'Yakın çevrende biriyle aranızdaki küçük bir yanlış anlaşılma netleşebilir. Dinlemeye ayırdığın zaman ilişkiyi rahatlatır.'],
    ['İş ve para', 'Ekip içinde sorumluluk paylaşımı gündeme gelebilir. Harcamalarda acele etmemek bu hafta için iyi bir tercih.'],
    ['Sağlık ve enerji', 'Enerjin yüksek ama dağınık. Kısa yürüyüşler ve düzenli uyku günü dengelemene yardımcı olur.']];
  var NOT = 'Burç yorumları eğlence ve kültür içeriğidir; bilimsel bir öngörü sunmaz. Sağlık, para ve ilişki kararlarını burç yorumlarına göre verme.';
  /* kaynak: ornek_veri.json haberler (alt_konu Astroloji) · etiketler public astroloji.html kartlarından */
  var HABER = [['Gökyüzü', 'Aralık ayında gökyüzünde öne çıkan olaylar', 'Gülşen Ateş', '5 dk', '5,9 B', '07.25'],
    ['Yay sezonu', 'Güneş 22 Kasım\'da Yay burcuna geçti', 'Deniz Kara', '2 dk', '4,8 B', '10.05'],
    ['Gökyüzü', 'Aralığın ilk dolunayı 24 Kasım\'da', 'Deniz Kara', '3 dk', '3,6 B', '13.45'],
    ['Kültür', 'Astrolojinin tarihine kısa bir bakış', 'Gülşen Ateş', '4 dk', '2,9 B', 'Dün'],
    ['Bilim', 'Astronomi ile astroloji arasındaki fark ne', 'Gülşen Ateş', '3 dk', '14,2 B', '12.05'],
    ['Gözlem', 'Kış aylarında gökyüzü gözlemi için en iyi yerler', 'Gülşen Ateş', '4 dk', '9,6 B', 'Dün', 'balon'], /* K44 kural 8: gözlem yeri → Kapadokya gökyüzü (balon); öteki astroloji haberlerine uygun görsel yok, yazılı */
    ['Kültür', 'Anadolu\'da yıldızlarla ilgili halk inanışları', 'Gülşen Ateş', '2 dk', '8,1 B', '21 Kas'],
    ['Haftalık', 'Haftanın burç yorumları: 23–29 Kasım', 'Burcu Yaman', '3 dk', '14,2 B', 'Dün']];

  function kutu(b){ var sec = b[0] === BENIM;
    return '<a class="x-burc" href="' + BZ(b[0]) + '"' + (sec ? ' aria-current="true"' : '') + '><span class="ik">' + I(b[2]) + '</span><b>' + b[1] + '</b><small>' + b[3] + '</small>' + (sec ? '<span class="bn">Burcun</span>' : '') + '</a>'; }
  var bas = '<div class="k-ust-bosluk"></div><div class="k-bbas">' + K.katEt('Kadın', 'fa-person-dress', { ek: 'Astroloji' }) +
    '<h1 style="margin-top:var(--b-8)">Astroloji</h1><p>Burçlar, günlük yorumlar ve gökyüzü takvimi</p></div>';
  var izgara = '<section class="k-bl sik">' + K.bb({ baslik: 'Burçlar', ikon: 'fa-star', not: '12 burç' }) + '<div class="x-burclar">' + BURC.map(kutu).join('') + '</div></section>';
  var cagri = !K.uye ? '<div class="k-ic" style="margin-top:var(--b-16)">' + K.cagri({ ikon: 'fa-star', baslik: 'Burcunu kaydet', aciklama: 'Günlük yorumun her gün ilk burada olsun.', eylem: { metin: 'Giriş yap', href: K.git('giris') } }) + '</div>' : '';
  var gunluk = DUR === 'bos'
    ? '<section class="k-bl">' + K.bos({ ikon: 'fa-star', baslik: 'Burcunu seç', aciklama: 'Yukarıdan burcuna dokun ve "Burcum yap"ı seç; günlük yorumun her gün burada görünür.' }) + '</section>'
    : '<section class="k-bl">' + K.bb({ baslik: 'Koç Burcu Bugün', ikon: 'fa-sun', not: '23 Kasım · Günlük' }) +
      '<div class="x-gun">' + GUN.map(function(x, i){ return K.akordeon(x[0], x[1], i === 0); }).join('') +
      '<div style="margin-top:var(--b-16)">' + K.btn({ metin: 'Koç burcu rehberi', sagIkon: 'fa-chevron-right', tur: 'sade', boy: 'buyuk', tam: true, href: BZ('koc') }) + '</div></div></section>';
  var not = '<section class="k-bl sik"><div class="k-ic">' + K.serit({ ikon: 'fa-circle-info', metin: 'Burç yorumları hakkında', alt: NOT }) + '</div></section>';
  var haberler = '<section class="k-bl">' + K.bb({ baslik: 'Astroloji Haberleri', ikon: 'fa-newspaper', sayi: 54, baglanti: { metin: 'Tümü', href: K.u('hibrit/liste.html', { bolum: 'kadin' }) } }) +
    '<div class="k-satirlar">' + HABER.map(function(x){ return K.satir({ alt: x[0], ikon: 'fa-star', baslik: x[1], yazar: x[2], sure: x[3], izlenme: x[4], saat: x[5], g: x[6] }); }).join('') + '</div></section>';

  var DUZ = DUR === 'hata' || (DUR === 'cevrimdisi' && Q.get('onbellek') === '0');
  if (DUR === 'yukleniyor') { var isk = ''; for (var i = 0; i < 12; i++) isk += '<i class="k-isk kontrol" style="display:block;height:92px"></i>';
    e.innerHTML = bas + '<section class="k-bl sik"><div class="x-burclar" role="status" aria-label="Yükleniyor">' + isk + '</div></section><div class="k-ic" style="padding-top:var(--b-32)">' + K.iskelet('metin', 5) + '</div><div class="k-son"></div>'; }
  else if (DUZ) e.innerHTML = '<div class="k-ust-bosluk"></div>' + K.hata({ tur: DUR === 'cevrimdisi' ? 'cevrimdisi' : (Q.get('hata') === 'zaman-asimi' ? 'zaman-asimi' : 'sunucu') }) + '<div class="k-son"></div>';
  else e.innerHTML = bas + izgara + cagri + gunluk + not + haberler + '<div class="k-son"></div>';

  K.ustCubuk({ geri: true, baslik: 'Astroloji', buyuk: !DUZ });
  K.altCubuk('bolum');
  K.oynatici();

  if (DUR === 'cevrimdisi' && !DUZ) {
    var bt = K.toast('Çevrimdışısın', { bant: true, eylem: 'Kaydedilenler', eylemFn: function(){ location.href = K.git('kaydedilenler'); } });
    bt.querySelector('button').classList.add('k-dk44');
  }
  document.addEventListener('click', function(ev){ var y = ev.target.closest('[data-yeniden]'); if (!y) return;
    y.classList.add('is-yukleniyor'); y.innerHTML = K.I('fa-circle-notch', 'fa-spin') + '<span>Deneniyor</span>';
    setTimeout(function(){ var q = new URLSearchParams(location.search); ['durum', 'hata', 'onbellek'].forEach(function(x){ q.delete(x); }); location.search = q.toString(); }, 1200); });
})();
</script>
</body>
</html>

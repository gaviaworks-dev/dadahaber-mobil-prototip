<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>Takımlar</title>
<!-- Dada Haber Mobil · TAKIMLAR (E-388–E-391). Liste kökünden: büyük başlık, Süper Lig'in 18 takımı ızgarada (kit takım hücresi), üyenin takımı işaretli (Galatasaray);
     misafirde üstte "Takımını seç · Giriş yap" çağrısı, işaret yok. Sayfası olan dört kulübün (public'te bağlantılı: Galatasaray, Fenerbahçe, Beşiktaş, Trabzonspor)
     hücresi takım sayfasını (takim.html?takim=…) açar; öteki 14 takımın sitede sayfası yok → hücre Süper Lig puan durumunu o takımın satırı vurgulu açar (lig.html?vurgu=KOD). Altta Kulüp Gündemi (K44 satırı).
     Sorgu: ?uye=0 · ?durum=yukleniyor | hata (&hata=zaman-asimi) | cevrimdisi (&onbellek=0)
     Veri: sözlük puan_tablosu takımları ve kodları (public takimlar.html ile aynı sıra). -->
<link rel="stylesheet" href="../../_ortak/cerceve.css">
<link rel="stylesheet" href="../../_ortak/marka.css">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../_ortak/icerik.js"></script>
<script src="../../_ortak/cerceve.js"></script>
<script src="../../_ortak/icerik-ek.js"></script>
<script src="../../kit/kit.js"></script>
<script src="spor.js"></script>
</head>
<body>
<div class="ekran" id="ekran"></div>
<script>
(function(){
  var Q = K.q, DUR = K.durum, e = document.getElementById('ekran');
  /* kaynak: sözlük puan_tablosu (ad, kod) */
  var T = [['Galatasaray', 'GS'], ['Fenerbahçe', 'FB'], ['Beşiktaş', 'BJK'], ['Trabzonspor', 'TS'], ['Başakşehir', 'BAŞ'], ['Samsunspor', 'SAM'], ['Göztepe', 'GÖZ'], ['Kasımpaşa', 'KAS'], ['Eyüpspor', 'EYP'],
    ['Antalyaspor', 'ANT'], ['Konyaspor', 'KON'], ['Alanyaspor', 'ALN'], ['Rizespor', 'RİZ'], ['Gaziantep FK', 'GFK'], ['Kocaelispor', 'KOC'], ['Amedspor', 'AMD'], ['Kayserispor', 'KAY'], ['Gençlerbirliği', 'GB']];
  function hedef(t){ return SPOR.takimHref(t[0]) || K.u('ekranlar/icerik/lig.html', 'lig=super-lig&sekme=puan&vurgu=' + encodeURIComponent(t[1])); }
  /* hücre dokununca takım sayfasına (ya da puan durumundaki satırına) gider (kitin takım hücresi seçim düğmesi; burada gezinme) */
  var izgara = '<div class="k-takimlar">' + T.map(function(t){ return K.takim({ kod: t[1], ad: t[0], secili: K.uye && D.uye.takip.indexOf(t[0]) > -1 }).replace('<button type="button" class="k-takim"', '<button type="button" class="k-takim" data-href="' + hedef(t) + '"'); }).join('') + '</div>';
  var bas = '<div class="k-bbas"><h1>Takımlar</h1><p>Süper Lig · 2026-27 · kulüp sayfaları ve haberleri</p></div>';
  var govde = (K.uye ? '' : '<div class="k-ic">' + K.cagri({ ikon: 'fa-futbol', baslik: 'Takımını seç', aciklama: 'Takımının maçları ve haberleri ana sayfanda öne çıksın.', eylem: { metin: 'Giriş yap', href: K.git('giris') } }) + '</div>') +
    '<section class="k-bl sik">' + K.bb({ baslik: 'Süper Lig', ikon: 'fa-futbol', sayi: T.length, not: K.uye ? 'İşaretli: takımın' : '' }) + '<div class="k-ic">' + izgara + '</div></section>' +
    '<section class="k-bl">' + K.bb({ baslik: 'Kulüp Gündemi', ikon: 'fa-newspaper', sayi: 164 }) + SPOR.haberler(SPOR.HABER.takimlar) + '</section>';

  var DUZ = DUR === 'hata' || DUR === 'bulunamadi' || (DUR === 'cevrimdisi' && Q.get('onbellek') === '0');
  if (DUR === 'yukleniyor') e.innerHTML = '<div class="k-ust-bosluk"></div>' + bas + '<div class="k-ic" style="padding-top:var(--b-16)">' + K.iskelet('metin', 16) + '</div><div class="k-son"></div>';
  else if (DUZ) e.innerHTML = '<div class="k-ust-bosluk"></div>' + K.hata({ tur: DUR === 'bulunamadi' ? 'bulunamadi' : DUR === 'cevrimdisi' ? 'cevrimdisi' : (Q.get('hata') === 'zaman-asimi' ? 'zaman-asimi' : 'sunucu') }) + '<div class="k-son"></div>';
  else e.innerHTML = '<div class="k-ust-bosluk"></div>' + bas + govde + '<div class="k-son"></div>';

  K.ustCubuk({ geri: true, baslik: 'Takımlar', buyuk: !DUZ, eylemler: DUZ ? [] : ['ara'] });
  K.altCubuk('bolum');
  K.oynatici();

  if (DUR === 'cevrimdisi' && !DUZ) {
    var bt = K.toast('Çevrimdışısın', { bant: true, eylem: 'Kaydedilenler', eylemFn: function(){ location.href = K.git('kaydedilenler'); } });
    bt.querySelector('button').classList.add('k-dk44');
  }
  document.addEventListener('click', function(ev){ var y = ev.target.closest('[data-yeniden]'); if (!y) return;
    y.classList.add('is-yukleniyor'); y.innerHTML = K.I('fa-circle-notch', 'fa-spin') + '<span>Deneniyor</span>';
    setTimeout(function(){ var q = new URLSearchParams(location.search); ['durum', 'hata', 'hal', 'onbellek'].forEach(function(x){ q.delete(x); }); location.search = q.toString(); }, 1200); });
})();
</script>
</body>
</html>

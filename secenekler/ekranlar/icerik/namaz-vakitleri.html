<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>Namaz Vakitleri</title>
<!-- Dada Haber Mobil · NAMAZ VAKİTLERİ (E-368–E-372). Büyük başlık, şehir seçici, sıradaki vakit + kalan süre (ilerleme), günün altı vakti, 14 gün · Kasım · Aralık tablosu (yatay kayar).
     Ana sayfadaki kompakt kutu (K25, K30: sıradaki vakit · kalan) buraya açılır.
     Sorgu: ?durum=konum-yok (şehri elle seç) | yukleniyor | hata (&hata=zaman-asimi) | cevrimdisi (&onbellek=0) · ?ay=14|kasim|aralik
     Veri: sıradaki vakit ve günün vakitleri D.namaz; aylık tablo public namaz-vakitleri.html (Diyanet vakit hesabı, İstanbul). -->
<link rel="stylesheet" href="../../_ortak/cerceve.css">
<link rel="stylesheet" href="../../_ortak/marka.css">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../_ortak/icerik.js"></script>
<script src="../../_ortak/cerceve.js"></script>
<script src="../../_ortak/icerik-ek.js"></script>
<script src="../../kit/kit.js"></script>
<style>
/* KİT ADAYI: büyük değer bloğu — kit tipografi ölçeğindeki "52 / ince" büyük rakamın bileşeni yok (sıcaklık, kalan süre, enstrüman değeri) */
.x-deger small{display:block;font-size:14px;color:var(--metin-3)}
.x-deger .s{display:block;margin-top:var(--b-4);font-size:52px;line-height:1;font-weight:var(--y-ince);letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.x-deger b{display:block;margin-top:var(--b-8);font-size:17px}
.x-deger .k-ilerleme{margin-top:var(--b-16)}
.x-deger .uc{display:flex;justify-content:space-between;margin-top:var(--b-8);font-size:12.5px;color:var(--metin-3);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="ekran" id="ekran"></div>
<script>
(function(){
  var Q = K.q, DUR = K.durum, e = document.getElementById('ekran');
  var N = D.namaz, V = N.vakitler, SA = D.simdi.saat;
  /* kaynak: public namaz-vakitleri.html (Kasım ve Aralık 2026, İstanbul); gün adı tarihten */
  var KAS = '06.13 07.43 12.50 15.34 17.59 19.24|06.15 07.45 12.50 15.33 17.57 19.22|06.16 07.46 12.51 15.32 17.56 19.21|06.17 07.47 12.51 15.32 17.55 19.20|06.18 07.48 12.51 15.31 17.53 19.18|' +
    '06.19 07.49 12.51 15.31 17.52 19.17|06.21 07.51 12.51 15.30 17.51 19.16|06.22 07.52 12.51 15.30 17.50 19.15|06.23 07.53 12.52 15.29 17.49 19.14|06.24 07.54 12.52 15.29 17.48 19.13|' +
    '06.25 07.55 12.52 15.28 17.46 19.11|06.26 07.56 12.52 15.28 17.45 19.10|06.27 07.57 12.52 15.27 17.44 19.10|06.28 07.58 12.53 15.27 17.44 19.09|06.29 07.59 12.53 15.26 17.43 19.08|' +
    '06.30 08.00 12.53 15.26 17.42 19.07|06.31 08.01 12.53 15.26 17.41 19.06|06.32 08.02 12.54 15.26 17.40 19.05|06.33 08.03 12.54 15.25 17.40 19.05|06.34 08.04 12.54 15.25 17.39 19.04|' +
    '06.35 08.05 12.54 15.25 17.38 19.03|06.36 08.06 12.55 15.25 17.38 19.03|06.37 08.07 12.55 15.24 17.37 19.02|06.38 08.08 12.55 15.24 17.36 19.01|06.39 08.09 12.56 15.24 17.36 19.01|' +
    '06.40 08.10 12.56 15.24 17.36 19.01|06.40 08.10 12.56 15.24 17.35 19.00|06.41 08.11 12.57 15.24 17.35 19.00|06.42 08.12 12.57 15.24 17.34 18.59|06.43 08.13 12.57 15.24 17.34 18.59';
  var ARA = '06.44 08.14 12.58 15.24 17.34 18.59|06.44 08.14 12.58 15.24 17.34 18.59|06.45 08.15 12.58 15.24 17.34 18.58|06.46 08.16 12.59 15.24 17.33 18.58|06.47 08.17 12.59 15.24 17.33 18.58|' +
    '06.47 08.17 13.00 15.25 17.33 18.58|06.48 08.18 13.00 15.25 17.33 18.58|06.49 08.19 13.00 15.25 17.33 18.58|06.49 08.19 13.01 15.25 17.33 18.58|06.50 08.20 13.01 15.26 17.33 18.58|' +
    '06.51 08.21 13.02 15.26 17.34 18.59|06.51 08.21 13.02 15.26 17.34 18.59|06.52 08.22 13.03 15.26 17.34 18.59|06.52 08.22 13.03 15.27 17.34 18.59|06.53 08.23 13.04 15.27 17.35 19.00|' +
    '06.53 08.23 13.04 15.28 17.35 19.00|06.54 08.24 13.05 15.28 17.35 19.00|06.54 08.24 13.05 15.28 17.36 19.01|06.55 08.25 13.06 15.29 17.36 19.01|06.55 08.25 13.06 15.29 17.37 19.02|' +
    '06.56 08.26 13.07 15.30 17.37 19.02|06.56 08.26 13.07 15.31 17.38 19.03|06.57 08.27 13.08 15.31 17.38 19.04|06.57 08.27 13.08 15.32 17.39 19.04|06.58 08.28 13.09 15.32 17.40 19.05|' +
    '06.58 08.28 13.09 15.33 17.41 19.06|06.58 08.28 13.10 15.34 17.41 19.06|06.59 08.29 13.10 15.34 17.42 19.07|06.59 08.29 13.11 15.35 17.43 19.08|06.59 08.29 13.12 15.36 17.44 19.09|07.00 08.30 13.12 15.37 17.45 19.10';
  var GA = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
  function ay(s, m, ad){ return s.split('|').map(function(r, i){ return { t: (i + 1) + ' ' + ad + ' ' + GA[new Date(2026, m, i + 1).getDay()], bugun: m === 10 && i === 22, v: r.split(' ') }; }); }
  var KASIM = ay(KAS, 10, 'Kas'), ARALIK = ay(ARA, 11, 'Ara');
  var AYLAR = { '14': KASIM.slice(22).concat(ARALIK.slice(0, 6)), kasim: KASIM, aralik: ARALIK };
  var AK = ['14', 'kasim', 'aralik'], ai = Math.max(0, AK.indexOf(Q.get('ay') || '14'));
  function tablo(k){ var L = AYLAR[k], v = -1; L.forEach(function(r, i){ if (r.bugun) v = i; });
    return K.tablo({ cls: 'sol', vurgu: v, sutunlar: ['Tarih', 'İmsak', 'Güneş', 'Öğle', 'İkindi', 'Akşam', 'Yatsı'], satirlar: L.map(function(r){ return [r.t].concat(r.v); }) }); }

  /* sıradaki vakit: Akşam 17.37; önceki vakit İkindi 15.24; şimdi 16.05 → ilerleme */
  function dk(s){ var p = s.split('.'); return +p[0] * 60 + +p[1]; }
  var si = V.map(function(x){ return x[0]; }).indexOf(N.siradaki), once = V[si - 1];
  var yuzde = Math.round((dk(SA) - dk(once[1])) / (dk(N.saat) - dk(once[1])) * 100);
  var kalan = N.kalan.replace(':', ' sa ') + ' dk';

  var sehir = '<div class="k-ic">' + K.btn({ metin: N.sehir, ikon: 'fa-location-dot', sagIkon: 'fa-chevron-down', tur: 'sade', tam: true, attr: DUR === 'konum-yok' ? 'data-sehir' : 'data-sayfa="sehir"' }) + '</div>';
  var sira = '<section class="k-bl sik"><div class="k-ic"><div class="x-deger"><small>' + N.siradaki + ' ezanına</small><span class="s">' + kalan + '</span><b>' + N.saat + ' · ' + N.sehir + '</b>' +
    K.ilerleme(yuzde) + '<div class="uc"><span>' + once[0] + ' ' + once[1] + '</span><span>' + N.siradaki + ' ' + N.saat + '</span></div></div></div></section>';
  var bugun = '<section class="k-bl">' + K.bb({ baslik: 'Bugün', ikon: 'fa-mosque', not: D.simdi.tarih.replace(' 2026', '') + ' ' + D.simdi.gun }) + '<div class="k-ic">' +
    K.tablo({ cls: 'sol', vurgu: si, sutunlar: ['Vakit', 'Saat', ''], satirlar: V.map(function(x, i){ return [x[0], x[1], i < si ? 'Geçti' : i === si ? kalan + ' kaldı' : '']; }) }) + '</div></section>';
  var aylik = '<section class="k-bl">' + K.bb({ baslik: 'Vakit Çizelgesi', ikon: 'fa-calendar-day' }) + '<div class="k-ic">' + K.segment(['14 gün', 'Kasım', 'Aralık'], ai) +
    '<div id="aylik" style="padding-top:var(--b-12)">' + tablo(AK[ai]) + '</div><p class="k-grup-n">Diyanet İşleri Başkanlığı vakit hesabı · ' + N.sehir + '</p></div></section>';

  var bas = '<div class="k-bbas"><h1>Namaz Vakitleri</h1><p>' + N.sehir + ' · ' + D.simdi.tarih + ' ' + D.simdi.gun + '</p></div>';
  var govde = DUR === 'konum-yok'
    ? K.bos({ ikon: 'fa-location-dot', baslik: 'Konum izni kapalı', aciklama: 'Vakitleri görmek için şehrini elle seç ya da izni telefonun ayarlarından aç.', eylem: { metin: 'Şehir seç', ikon: 'fa-location-dot', attr: 'data-sehir' }, ikinci: { metin: 'Ayarlar\'a git' } })
    : sehir + sira + bugun + aylik;

  var DUZ = DUR === 'hata' || (DUR === 'cevrimdisi' && Q.get('onbellek') === '0');
  if (DUR === 'yukleniyor') e.innerHTML = '<div class="k-ust-bosluk"></div>' + bas + '<div class="k-ic">' + K.iskelet('metin', 3) + '<div style="padding-top:var(--b-24)">' + K.iskelet('metin', 10) + '</div></div><div class="k-son"></div>';
  else if (DUZ) e.innerHTML = '<div class="k-ust-bosluk"></div>' + K.hata({ tur: DUR === 'cevrimdisi' ? 'cevrimdisi' : (Q.get('hata') === 'zaman-asimi' ? 'zaman-asimi' : 'sunucu') }) + '<div class="k-son"></div>';
  else e.innerHTML = '<div class="k-ust-bosluk"></div>' + bas + govde + '<div class="k-son"></div>';

  K.ustCubuk({ geri: true, baslik: 'Namaz Vakitleri', buyuk: !DUZ });
  K.altCubuk('ana');
  K.oynatici();

  document.addEventListener('click', function(ev){
    if (ev.target.closest('[data-sehir]')) { ev.preventDefault(); K.sayfa('sehir', { red: true }); }
    var b = ev.target.closest('.k-segment button'), k = document.getElementById('aylik');
    if (b && k) { var i = [].indexOf.call(b.parentNode.querySelectorAll('button'), b); k.innerHTML = tablo(AK[i]);
      var q = new URLSearchParams(location.search); q.set('ay', AK[i]); history.replaceState(null, '', '?' + q.toString()); }
  });
  if (DUR === 'cevrimdisi' && !DUZ) {
    var bt = K.toast('Çevrimdışısın', { bant: true, eylem: 'Kaydedilenler', eylemFn: function(){ location.href = K.git('kaydedilenler'); } });
    bt.querySelector('button').classList.add('k-dk44');
  }
  document.addEventListener('click', function(ev){ var y = ev.target.closest('[data-yeniden]'); if (!y) return;
    y.classList.add('is-yukleniyor'); y.innerHTML = K.I('fa-circle-notch', 'fa-spin') + '<span>Deneniyor</span>';
    setTimeout(function(){ var q = new URLSearchParams(location.search); ['durum', 'hata', 'hal', 'onbellek'].forEach(function(x){ q.delete(x); }); location.search = q.toString(); }, 1200); });
})();
</script>
</body>
</html>

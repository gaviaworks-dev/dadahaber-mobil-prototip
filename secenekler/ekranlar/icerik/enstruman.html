<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>Enstrüman</title>
<!-- Dada Haber Mobil · ENSTRÜMAN DETAYI (E-358–E-362 + yeni kodlar ve haller). Detay kökünden: büyük başlık, değer + değişim, Takip et · Fiyat alarmı, gün içi aralık çubuğu,
     sade grafik (yalnız gerçek kapanışlar; yalnız BIST 100'de var), gün içi tablosu, künye, bağlı enstrümanlar, ilgili haberler.
     Sorgu: ?kod=xu100 (varsayılan, BIST 100; public enstruman-detay.html) | xu030 | xbank | xusin (endeks) | dolar | euro | sterlin | frank | yen | riyal | yuan | ruble (usd, eur… da olur)
            | gram-altin | ceyrek-altin | yarim-altin | tam-altin | cumhuriyet-altini | bilezik | ons-altin | gumus | btc | eth | … (public kripto-para.html'deki 50 kripto, küçük harf kod)
            | brent | wti | dogal-gaz | gumus-ons | bakir | bugday (emtia). BIST 100 dışındakilerde geçmiş veri yok: grafik yerine dürüst "Geçmiş veri yok" şeridi.
            ?durum=alarm (fiyat alarmı alt sayfası; misafirde giriş paneli) | yukleniyor | bos (ilgili haber yok) | hata (&hata=zaman-asimi) | bulunamadi (bilinmeyen kod da) | cevrimdisi (&onbellek=0) · ?uye=0 misafir
     Veri: BIST 100 public enstruman-detay.html (gün içi, son 8 işlem günü kapanışları, künye, bağlı enstrümanlar, haberler + sözlük saatleri);
     öteki enstrümanlar piyasa-veri.js (public doviz, altin, kripto-para, borsa, piyasa-ekrani + sözlük piyasa.araclar). Uydurma seri yok. Hisseler hisse.html'de. -->
<link rel="stylesheet" href="../../_ortak/cerceve.css">
<link rel="stylesheet" href="../../_ortak/marka.css">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../_ortak/icerik.js"></script>
<script src="../../_ortak/cerceve.js"></script>
<script src="../../_ortak/icerik-ek.js"></script>
<script src="../../kit/kit.js"></script>
<script src="piyasa-veri.js"></script>
<style>
/* KİT ADAYI: büyük değer bloğu — kit tipografi ölçeğindeki "52 / ince" büyük rakamın bileşeni yok (sıcaklık, kalan süre, enstrüman değeri) */
.x-deger{display:flex;align-items:baseline;gap:var(--b-12);flex-wrap:wrap}
.x-deger .s{font-size:52px;line-height:1;font-weight:var(--y-ince);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.x-deger .k-yon{font-size:16px;font-weight:var(--y-kalin)}
/* KİT ADAYI: sade çizgi grafiği — kitte grafik yok; yalnız gerçek kapanışlar, eksen yok, uç noktalar etiketli */
.x-grafik{display:block;width:100%;height:140px;color:var(--azalis)}
.x-grafik.y{color:var(--artis)}
/* KİT ADAYI: gün içi aralık çubuğu — en düşük ile en yüksek arasında son fiyatın yeri (public .sw-ar); kitte yok, .k-ilerleme ölçüsüyle (hisse.html ile aynı) */
.x-aralik{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:var(--b-12);font-size:13px;color:var(--metin-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.x-aralik .c{position:relative;height:4px;border-radius:var(--k-cubuk);background:var(--cizgi)}
.x-aralik .c i{position:absolute;top:50%;left:var(--p);width:12px;height:12px;border-radius:var(--k-daire);background:var(--metin);transform:translate(-50%,-50%);border:2px solid var(--zemin)}
/* KİT ADAYI: iki eşit eylem düğmesi (Takip et · Fiyat alarmı); kitte tek tam genişlik düğme var */
.x-eylem{display:grid;grid-template-columns:1fr 1fr;gap:var(--b-8);padding-top:var(--b-16)}
.x-grafik-e{display:flex;justify-content:space-between;margin-top:var(--b-8);font-size:12.5px;color:var(--metin-3);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="ekran" id="ekran"></div>
<script>
(function(){
  var Q = K.q, DUR = K.durum, e = document.getElementById('ekran'), V = window.PV, P = D.piyasa;
  function yon(v, y){ return '<span class="k-yon ' + y + '">' + (y === 'y' ? '▲' : y === 'd' ? '▼' : '') + (y ? ' ' : '') + v + '</span>'; }
  function not(m){ return '<p class="k-grup-n">' + m + '</p>'; }
  function py(x, h){ return (h ? '<a class="k-py" href="' + h + '">' : '<div class="k-py">') + '<small>' + x[0] + '</small><b>' + x[1] + '</b><em class="' + x[3] + '">' + (x[3] === 'y' ? '▲' : x[3] === 'd' ? '▼' : '') + ' ' + x[2] + '</em>' + (h ? '</a>' : '</div>'); }

  /* kaynak: public enstruman-detay.html (BIST 100) */
  var XU = { ad: 'BIST 100', alt: 'XU100 · Borsa İstanbul · TL', son: '10.248,62', deg: '%0,43', yon: 'd', onceki: '10.292,87', gun: ['10.214,35', '10.318,90'],
    tablo: [['Açılış', '10.301,14'], ['En düşük', '10.214,35'], ['En yüksek', '10.318,90'], ['Hacim', '98,4 mr TL'], ['Önceki kapanış', '10.292,87']],
    /* son 8 işlem günü (eskiden yeniye) + bugün */
    kap: [['12 Kas', '10.158,24', '10.131,92', '10.236,08', '90,4 mr'], ['13 Kas', '10.167,39', '10.120,44', '10.203,70', '86,1 mr'], ['14 Kas', '10.281,27', '10.142,60', '10.294,81', '112,6 mr'],
      ['17 Kas', '10.194,92', '10.170,06', '10.301,53', '101,3 mr'], ['18 Kas', '10.216,34', '10.140,77', '10.230,15', '88,9 mr'], ['19 Kas', '10.180,58', '10.154,31', '10.262,40', '91,5 mr'],
      ['20 Kas', '10.229,45', '10.150,20', '10.241,88', '96,8 mr'], ['21 Kas', '10.292,87', '10.198,40', '10.305,12', '104,2 mr']],
    kunye: [['Kod', 'XU100'], ['Piyasa', 'Borsa İstanbul Pay Piyasası'], ['Hisse sayısı', '100'], ['Baz tarih ve değer', '2 Ocak 1986 · 1'], ['52 haftalık aralık', '8.912,40 – 10.884,27'],
      ['Yıl başından bu yana', '%4,12'], ['İşlem saatleri', '10.00–18.00'], ['Veri gecikmesi', '15 dakika']],
    haber: [
      { alt: 'Bilanço', baslik: 'Borsa şirketlerinin dokuz aylık kârı yüzde 18 geriledi', yazar: 'Nazlı Öztürk', sure: '5 dk', izlenme: '8,8 B', saat: '15.35', g: 'borsa' },
      { alt: 'Teknik', baslik: 'BIST 100\'de 10.000 puan seviyesi neden izleniyor', yazar: 'Tolga Bayram', sure: '2 dk', izlenme: '6,9 B', saat: '12.30', g: 'borsa' },
      { alt: 'Borsa', baslik: 'Borsa İstanbul öğleden önce bankacılık hisseleriyle geriledi', yazar: 'Can Demir', sure: '3 dk', izlenme: '13,7 B', saat: '08.00', g: 'borsa' },
      { alt: 'Yabancı', baslik: 'Yabancı yatırımcılar geçen hafta 142 milyon dolarlık hisse aldı', yazar: 'Elif Aras', sure: '3 dk', izlenme: '7,7 B', saat: '07.05', g: 'borsa' },
      { alt: 'Bankacılık', baslik: 'Bankacılık endeksi faiz kararı sonrası yön arıyor', yazar: 'Nazlı Öztürk', sure: '3 dk', izlenme: '5,8 B', saat: '22 Kas', g: 'borsa' },
      { alt: 'SPK', baslik: 'Sermaye Piyasası Kurulu açığa satış kurallarını güncelledi', yazar: 'Tolga Bayram', sure: '4 dk', izlenme: '4,9 B', saat: '22 Kas', g: 'borsa' }
    ] };
  XU.haber.forEach(function(h){ h.ikon = 'fa-chart-column'; });
  var kod = (Q.get('kod') || 'xu100').toLowerCase(), XUM = kod === 'xu100', O = XUM ? null : V.bul(kod);
  var YOK = !XUM && !O;
  var R = XUM ? XU : O;
  /* grup haberleri (public bölüm sayfalarının ilk sayfası); emtia: piyasa ekranının Brent haberi */
  var GH = { doviz: ['doviz', 'Döviz Haberleri'], altin: ['altin', 'Altın Haberleri'], kripto: ['kripto', 'Kripto Para Haberleri'], endeks: ['borsa', 'Borsa Haberleri'], emtia: ['akaryakit', 'Emtia ve Akaryakıt Haberleri'] };
  var GAD = { doviz: 'Döviz', altin: 'Altın', kripto: 'Kripto Para', endeks: 'Endeksler', emtia: 'Emtia' };

  /* sade grafik: 9 gerçek kapanış (son 8 işlem günü + bugün), min–maks aralığına ölçeklenir */
  function grafik(){
    var v = XU.kap.map(function(x){ return x[1]; }).concat([XU.son]).map(V.sayi);
    var mn = Math.min.apply(0, v), mx = Math.max.apply(0, v), W = 358, H = 140, p = 8;
    var pt = v.map(function(x, i){ return [(i / (v.length - 1)) * (W - 2 * p) + p, H - p - (x - mn) / (mx - mn) * (H - 2 * p)]; });
    var son = pt[pt.length - 1], y = v[v.length - 1] >= v[0] ? 'y' : 'd';
    return '<svg class="x-grafik ' + y + '" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="BIST 100 son 8 işlem günü kapanışları, ' + XU.kap[0][1] + ' ile ' + XU.son + ' arası">' +
      '<polyline fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" points="' + pt.map(function(q){ return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' ') + '"/>' +
      '<circle cx="' + son[0].toFixed(1) + '" cy="' + son[1].toFixed(1) + '" r="4" fill="currentColor"/></svg>' +
      '<div class="x-grafik-e"><span>' + XU.kap[0][0] + ' · ' + XU.kap[0][1] + '</span><span>Bugün · ' + XU.son + '</span></div>';
  }
  function gecmis(){
    var r = [], L = XU.kap;
    for (var i = L.length - 1; i >= 0; i--) {
      var a = V.sayi(L[i][1]), b = i > 0 ? V.sayi(L[i - 1][1]) : null;
      r.push([L[i][0], L[i][1], b == null ? '–' : yon('%' + Math.abs((a - b) / b * 100).toFixed(2).replace('.', ','), a >= b ? 'y' : 'd'), L[i][2], L[i][3], L[i][4]]);
    }
    return r;
  }
  /* gün içi aralık çubuğu: son fiyatın en düşük–en yüksek arasındaki yeri */
  function aralik(gun, son){ var lo = V.sayi(gun[0]), hi = V.sayi(gun[1]), p = hi > lo ? Math.round((V.sayi(son) - lo) / (hi - lo) * 100) : 50;
    return '<div class="x-aralik" role="img" aria-label="Gün içi aralık ' + gun[0] + ' – ' + gun[1] + ', son ' + son + '"><span>' + gun[0] + '</span><span class="c"><i style="--p:' + Math.max(0, Math.min(100, p)) + '%"></i></span><span>' + gun[1] + '</span></div>'; }
  /* Takip et · Fiyat alarmı: üyede düğme kendisi (kit data-takip) ve alarm alt sayfası; misafirde giriş paneli */
  function eylem(){
    return '<div class="x-eylem">' + (K.uye ? K.btn({ metin: 'Takip et', ikon: 'fa-plus', tur: 'birincil', tam: true, secili: false, attr: 'data-takip' }) : K.btn({ metin: 'Takip et', ikon: 'fa-plus', tur: 'birincil', tam: true, attr: 'data-sayfa="tetik" data-eylem="takip"' })) +
      K.btn({ metin: 'Fiyat alarmı', ikon: 'fa-bell', tur: 'sade', tam: true, attr: 'data-alarm' }) + '</div>';
  }
  function ust(r, alt2){
    return '<div class="k-bbas"><h1>' + r.ad + '</h1><p>' + r.alt + '</p></div>' +
      '<div class="k-ic"><div class="x-deger"><span class="s">' + r.son + '</span>' + yon(r.deg, r.yon) + '</div>' + K.meta(alt2) + eylem() + '</div>' +
      '<section class="k-bl sik">' + K.bb({ baslik: 'Gün İçi', ikon: 'fa-clock', not: 'en düşük – en yüksek' }) + '<div class="k-ic">' + aralik(r.gun, r.son) + '</div></section>';
  }
  function haberBlok(liste, baslik, sayi){
    return '<section class="k-bl">' + K.bb({ baslik: baslik, ikon: 'fa-newspaper', sayi: DUR === 'bos' ? null : sayi }) +
      (DUR === 'bos' ? K.bos({ ikon: 'fa-newspaper', baslik: 'Bu enstrümanla ilgili haber yok', aciklama: 'Yeni haber gelince burada görünür.', eylem: { metin: 'Piyasalar', ikon: 'fa-chart-column', tur: 'sade', href: K.git('piyasalar') } })
        : '<div class="k-satirlar">' + liste.map(function(h){ return K.satir(h); }).join('') + '</div>') +
      '<div class="k-ic">' + not('Fiyat ve yorumlar yatırım danışmanlığı değildir; veriler bilgilendirme amaçlıdır.') + '</div></section>';
  }

  function sayfaXU(){
    var bagli = V.END.slice(1).map(function(x){ return py([x[0], x[1], x[2], x[3]], V.href(x[0])); }).concat([py(['Dolar', V.DVZ[0][3], V.DVZ[0][4], V.DVZ[0][5]], V.href('USD'))]);
    return ust(XU, ['Önceki kapanış ' + XU.onceki, P.guncelleme + ' · 15 dk gecikmeli']) +
      '<section class="k-bl">' + K.bb({ baslik: 'Son 8 İşlem Günü', ikon: 'fa-chart-column', not: 'kapanış' }) + '<div class="k-ic">' + grafik() + '</div></section>' +
      '<section class="k-bl">' + K.bb({ baslik: 'Bugün', ikon: 'fa-clock' }) + '<div class="k-ic">' + K.tablo({ cls: 'sol', sutunlar: ['Bugün', 'Değer'], satirlar: XU.tablo }) + '</div></section>' +
      '<section class="k-bl">' + K.bb({ baslik: 'Geçmiş Fiyatlar', ikon: 'fa-calendar-day' }) + '<div class="k-ic">' +
        K.tablo({ cls: 'sol', sutunlar: ['Tarih', 'Kapanış', 'Değişim', 'En düşük', 'En yüksek', 'Hacim (TL)'], satirlar: gecmis() }) + '</div></section>' +
      '<section class="k-bl">' + K.bb({ baslik: 'Künye', ikon: 'fa-circle-info' }) + '<div class="k-ic">' + K.tablo({ cls: 'sol', sutunlar: ['Bilgi', 'Değer'], satirlar: XU.kunye }) + '</div></section>' +
      '<section class="k-bl">' + K.bb({ baslik: 'Bağlı Enstrümanlar', ikon: 'fa-chart-column' }) + '<div class="k-ray s10">' + bagli.join('') + '</div></section>' +
      haberBlok(XU.haber, 'BIST 100 Gündemi', 132);
  }
  function sayfaDiger(){
    var g = O.grup, kripto = g === 'kripto';
    var alt2 = kripto ? [O.tl + ' TL', P.guncelleme + ' · anlık'] : [O.alis ? 'Alış ' + O.alis : (O.onceki ? 'Önceki kapanış ' + O.onceki : ''), P.guncelleme + ' · 15 dk gecikmeli'];
    var es = V.grup(g).filter(function(x){ return x.kod !== O.kod; }).slice(0, 6);
    var bagli = (es.map(function(x){ return py(x.py, K.u('ekranlar/icerik/enstruman.html', 'kod=' + x.kod)); }));
    var h = GH[g], hl = V.HABER[h[0]].slice(0, 4);
    return ust(O, alt2) +
      '<div class="k-ic" style="padding-top:var(--b-16)">' + K.serit({ ikon: 'fa-chart-column', metin: 'Geçmiş veri yok', alt: 'Bu enstrüman için grafik ve geçmiş fiyat yayımlanmıyor.' }) + '</div>' +
      '<section class="k-bl">' + K.bb({ baslik: 'Bugün', ikon: 'fa-clock' }) + '<div class="k-ic">' + K.tablo({ cls: 'sol', sutunlar: ['Bugün', 'Değer'], satirlar: O.tablo.concat([['Değişim', yon(O.deg, O.yon)]]) }) + '</div></section>' +
      '<section class="k-bl">' + K.bb({ baslik: g === 'endeks' ? 'Öteki Endeksler' : 'Bağlı Enstrümanlar', ikon: 'fa-chart-column', baglanti: { metin: GAD[g], href: K.u('ekranlar/icerik/piyasalar.html', 'sekme=' + ({ doviz: 'doviz', altin: 'altin', kripto: 'kripto', endeks: 'borsa', emtia: 'ekran' })[g]) } }) +
        '<div class="k-ray s10">' + bagli.join('') + '</div></section>' +
      haberBlok(hl, h[1], V.HABER_SAYI[h[0]]);
  }

  var ad = YOK ? 'Enstrüman' : R.ad;
  var BUL = DUR === 'bulunamadi' || YOK;
  var DUZ = DUR === 'hata' || BUL || (DUR === 'cevrimdisi' && Q.get('onbellek') === '0');
  if (DUR === 'yukleniyor') e.innerHTML = '<div class="k-ust-bosluk"></div><div class="k-ic" style="padding-top:var(--b-8)">' + K.iskelet('metin', 3) +
    '<div style="padding-top:var(--b-24)"><i class="k-isk kontrol" style="width:100%;height:140px"></i></div><div style="padding-top:var(--b-24)">' + K.iskelet('metin', 8) + '</div></div><div class="k-son"></div>';
  else if (DUZ) e.innerHTML = '<div class="k-ust-bosluk"></div>' + K.hata({ tur: BUL ? 'bulunamadi' : DUR === 'cevrimdisi' ? 'cevrimdisi' : (Q.get('hata') === 'zaman-asimi' ? 'zaman-asimi' : 'sunucu') }) + '<div class="k-son"></div>';
  else e.innerHTML = '<div class="k-ust-bosluk"></div>' + (O ? sayfaDiger() : sayfaXU()) + '<div class="k-son"></div>';

  K.ustCubuk({ geri: true, baslik: BUL ? 'Enstrüman' : ad, buyuk: !DUZ && DUR !== 'yukleniyor', eylemler: DUZ ? [] : ['paylas'] });
  K.altCubuk('ana');
  K.oynatici();

  /* fiyat alarmı: üyede hedef fiyat alt sayfası (gün içi en yüksek önerilir), misafirde giriş paneli (kit tetik paneliyle aynı yapı) */
  function alarm(){
    if (!K.uye) return K.sayfa({ kapat: false, icerik: '<div class="k-bos" style="padding:var(--b-8) 0 var(--b-4)"><span class="ik">' + K.I('fa-bell') + '</span><h2>Fiyat alarmı için giriş yap</h2><p>Hedef fiyata gelince bildirim gönderelim; alarmların her cihazında seninle olsun.</p></div>',
      eylemler: ['<div style="display:grid;gap:var(--b-8)">' + K.btn({ metin: 'Giriş yap', ikon: 'fa-right-to-bracket', tur: 'birincil', boy: 'buyuk', tam: true, href: K.git('giris') }) + K.btn({ metin: 'Üye ol', tur: 'sade', boy: 'buyuk', tam: true, href: K.git('uyeOl') }) + K.btn({ metin: 'Şimdi değil', tur: 'metin', tam: true, attr: 'data-kapat' }) + '</div>'] });
    return K.sayfa({ baslik: 'Fiyat alarmı', alt: R.ad + ' · son ' + R.son, icerik: K.segment(['Üstüne çıkınca', 'Altına inince'], 0) +
        '<div style="padding-top:var(--b-16)">' + K.alan({ etiket: 'Hedef fiyat', deger: R.gun[1], odak: true }).replace('<input ', '<input inputmode="decimal" ').replace('class="k-alan-e"', 'class="k-alan-e k-dk44"') + '</div>' +
        '<div style="padding-top:var(--b-16)">' + K.serit({ ikon: 'fa-bell', metin: 'Hedefe gelince bildirim gelir', alt: 'Veriler 15 dakika gecikmeli; alarm da gecikmeli çalışır.' }) + '</div>',
      eylemler: [{ metin: 'Alarmı kur', ikon: 'fa-bell', tur: 'birincil', attr: 'data-kapat data-toast="Alarm kuruldu · ' + R.ad + ' ' + R.gun[1] + '"' }] });
  }
  document.addEventListener('click', function(ev){ if (ev.target.closest('[data-alarm]')) alarm(); });
  if (DUR === 'alarm' && !DUZ) alarm();

  if (DUR === 'cevrimdisi' && !DUZ) {
    var bt = K.toast('Çevrimdışısın', { bant: true, eylem: 'Kaydedilenler', eylemFn: function(){ location.href = K.git('kaydedilenler'); } });
    bt.querySelector('button').classList.add('k-dk44');
  }
  document.addEventListener('click', function(ev){ var y = ev.target.closest('[data-yeniden]'); if (!y) return;
    y.classList.add('is-yukleniyor'); y.innerHTML = K.I('fa-circle-notch', 'fa-spin') + '<span>Deneniyor</span>';
    setTimeout(function(){ var q = new URLSearchParams(location.search); ['durum', 'hata', 'hal', 'onbellek'].forEach(function(x){ q.delete(x); }); location.search = q.toString(); }, 1200); });
})();
</script>
</body>
</html>

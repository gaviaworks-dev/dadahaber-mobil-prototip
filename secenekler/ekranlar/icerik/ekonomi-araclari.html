<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>Ekonomi Araçları</title>
<!-- Dada Haber Mobil · EKONOMİ ARAÇLARI (6. dalga, satırlar E-? · lider numaralar). Çekmece menüsünden (Finans altında) açılan araç dizini; kök: Liste (büyük başlık), alt çubukta "Bölümler" seçili.
     Yapı: büyük başlık → Araçlar (altı hesaplayıcı; her satır ekonomi-araci.html?arac=<id> açar) → Piyasalar şeridi (hesaplamada kullanılan kurlar, D.piyasa) → Ekonomi Araçları Haberleri → yatırım uyarısı.
     Sorgu: ?durum=yukleniyor | bos (bu bölümde haber yok; araçlar yerinde) | hata (&hata=zaman-asimi) | cevrimdisi (&onbellek=0 → önbellek yok)
     Veri: public ekonomi-araclari.html (araç kartları: ad, açıklama, ikon; haber listesi etiketleri; yatırım uyarısı); haber saat/yazar/okunma araclar/ornek_veri.json;
     görsel yalnız D'de aynı konuya verilmiş anahtarlar (asgari: asgari ücret; carsi: enflasyon sepeti). -->
<link rel="stylesheet" href="../../_ortak/cerceve.css">
<link rel="stylesheet" href="../../_ortak/marka.css">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../_ortak/icerik.js"></script>
<script src="../../_ortak/cerceve.js"></script>
<script src="../../_ortak/icerik-ek.js"></script>
<script src="../../kit/kit.js"></script>
</head>
<body>
<div class="ekran" id="ekran"></div>
<script>
(function(){
  var Q = K.q, DUR = K.durum, I = K.I, e = document.getElementById('ekran');

  /* kaynak: public ekonomi-araclari.html "Araçlar" kartları — [id, ad, açıklama, ikon] (id'ler ekonomi-araci.html ile aynı) */
  var ARAC = [['doviz', 'Döviz Çevirici', 'Güncel kurlarla sekiz para birimini liraya çevir.', 'fa-money-bill-transfer'],
    ['kredi', 'Kredi Hesaplayıcı', 'Tutar, vade ve faiz oranıyla aylık taksiti hesapla.', 'fa-calculator'],
    ['enflasyon', 'Enflasyon Hesaplayıcı', 'Bir tutarın bugünkü karşılığını TÜFE ile bul.', 'fa-arrow-trend-up'],
    ['maas', 'Maaş Hesaplayıcı', 'Brüt maaştan nete, kesintileriyle birlikte hesapla.', 'fa-wallet'],
    ['altin', 'Altın Hesaplayıcı', 'Gram, çeyrek ve cumhuriyet altınının TL karşılığı.', 'fa-coins'],
    ['yakit', 'Yakıt Maliyeti', 'Mesafe ve tüketimle yol maliyetini hesapla.', 'fa-gas-pump']];
  /* kaynak: public ekonomi-araclari.html haber listesi (etiketler) + araclar/ornek_veri.json (saat, yazar, süre, okunma) */
  var HAB = [['Emeklilik', 'Emeklilere yılbaşı zammı için ilk hesaplamalar', 'Nazlı Öztürk', '14.10', '3 dk', '6,9 B'],
    ['Kira', 'Kira artışında yasal sınır ve sözleşme yenileme süreci', 'Elif Aras', '10.35', '4 dk', '6,1 B'],
    ['Vergi', 'Gelir vergisi dilimleri 2027 için güncellendi', 'Nazlı Öztürk', '10.05', '2 dk', '5,8 B'],
    ['Kredi', 'İhtiyaç kredisinde toplam maliyet oranı nasıl okunur', 'Elif Aras', '10.45', '5 dk', '9,2 B'],
    ['Birikim', 'Acil durum fonu kaç aylık gidere denk gelmeli', 'Nazlı Öztürk', '22 Kas', '3 dk', '4,9 B'],
    ['Asgari Ücret', 'Asgari ücret tespit komisyonu ilk toplantısını aralıkta yapacak', 'Tolga Bayram', '06.30', '3 dk', '13,1 B', 'asgari'],
    ['Enflasyon', "Ekim'de yıllık enflasyon yüzde 32,9 oldu", 'Can Demir', '11.55', '4 dk', '6,9 B', 'carsi'],
    ['Maaş', 'Fazla mesai ücreti nasıl hesaplanıyor', 'Elif Aras', '22 Kas', '3 dk', '14,6 B']];
  function haber(x){ return { alt: x[0], ikon: 'fa-calculator', baslik: x[1], yazar: x[2], saat: x[3], sure: x[4], izlenme: x[5], g: x[6] }; }

  var HATA = DUR === 'hata' ? (Q.get('hata') === 'zaman-asimi' ? 'zaman-asimi' : 'sunucu') : (DUR === 'cevrimdisi' && Q.get('onbellek') === '0') ? 'cevrimdisi' : '';
  var bas = '<div class="k-ust-bosluk"></div><div class="k-bbas"><h1>Ekonomi Araçları</h1><p>Kur, kredi, enflasyon ve maaş hesaplama araçları</p></div>';
  var cevrim = DUR === 'cevrimdisi' ? '<div class="k-ic">' + K.serit({ tur: 'uyari', ikon: 'fa-plug-circle-xmark', metin: 'Çevrimdışısın', alt: 'Araçlar son kurlarla (' + D.piyasa.guncelleme + ') hesaplar.' }) + '</div>' : '';
  var araclar = K.grup('Araçlar', ARAC.map(function(a){ return { ikon: a[3], baslik: a[1], alt: a[2], href: K.u('ekranlar/icerik/ekonomi-araci.html', 'arac=' + a[0]) }; }), 'Hesaplamalar bilgilendirme amaçlıdır; vergi ve masraflar bankaya ve kişiye göre değişebilir.');
  var piyasa = '<section class="k-bl">' + K.piyasa() + '</section>';
  var hab = '<section class="k-bl">' + K.bb({ baslik: 'Ekonomi Araçları Haberleri', ikon: 'fa-newspaper', sayi: DUR === 'bos' ? 0 : 134 }) +
    (DUR === 'bos' ? K.bos({ ikon: 'fa-newspaper', baslik: 'Bu bölümde bugün haber yok', aciklama: 'Yeni haber gelince burada görünür. Araçları kullanmaya devam edebilirsin.', eylem: { metin: 'Piyasalar', ikon: 'fa-chart-column', tur: 'sade', href: K.git('piyasalar') } })
      : '<div class="k-satirlar">' + HAB.map(function(x){ return K.satir(haber(x)); }).join('') + '</div>' + K.dahaFazla('yukleniyor')) + '</section>';
  /* kaynak: public ekonomi-araclari.html "Yatırım uyarısı" */
  var uyari = '<div class="k-ic k-bl sik">' + K.serit({ ikon: 'fa-triangle-exclamation', metin: 'Yatırım uyarısı', alt: 'Fiyat, oran ve yorumlar yatırım danışmanlığı kapsamında değildir; veriler 15 dakika gecikmeli ve bilgilendirme amaçlıdır.' }) + '</div>';

  if (DUR === 'yukleniyor') e.innerHTML = bas + '<div class="k-ic" style="padding-top:var(--b-16)">' + K.iskelet('metin', 10) + '</div><div class="k-satirlar" style="padding-top:var(--b-24)">' + K.iskelet('satir', 3) + '</div><div class="k-son"></div>';
  else if (HATA) e.innerHTML = '<div class="k-ust-bosluk"></div>' + K.hata({ tur: HATA }) + '<div class="k-son"></div>';
  else e.innerHTML = bas + cevrim + araclar + piyasa + hab + uyari + '<div class="k-son"></div>';

  K.ustCubuk({ geri: true, baslik: 'Ekonomi Araçları', buyuk: !HATA, eylemler: HATA ? [] : ['paylas'] });
  K.altCubuk('bolum');
  K.oynatici();

  if (DUR === 'cevrimdisi' && !HATA) {
    var bt = K.toast('Çevrimdışısın', { bant: true, eylem: 'Kaydedilenler', eylemFn: function(){ location.href = K.git('kaydedilenler'); } });
    bt.querySelector('button').classList.add('k-dk44');
  }
  document.addEventListener('click', function(ev){ var y = ev.target.closest('[data-yeniden]'); if (!y) return;
    y.classList.add('is-yukleniyor'); y.innerHTML = I('fa-circle-notch', 'fa-spin') + '<span>Deneniyor</span>';
    setTimeout(function(){ var q = new URLSearchParams(location.search); ['durum', 'hata', 'onbellek'].forEach(function(x){ q.delete(x); }); location.search = q.toString(); }, 1200); });
})();
</script>
</body>
</html>

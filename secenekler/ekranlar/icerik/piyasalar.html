        tablo({ cls: 'sol', sutunlar: ['Vade', 'Oran', 'Önceki hafta', 'Değişim'], satirlar: FZ2 }) + '</div></section>' +
        '<section class="k-bl">' + K.bb({ baslik: 'Kredi', ikon: 'fa-building-columns', not: 'Aylık, ortalama' }) + '<div class="k-ic">' +
        tablo({ cls: 'sol', sutunlar: ['Kredi', 'Oran', 'Önceki hafta', 'Değişim'], satirlar: FZ3 }) +
        not('Banka ortalamaları, 15 Kasım 2026 haftası · TCMB kararı 23 Kasım\'daki olağanüstü PPK toplantısında alındı') + '</div></section>';
    }
    if (k === 'akaryakit') {
      HREF = [];
      s = '<section class="k-bl sik">' + K.bb({ baslik: 'Pompa Fiyatları', ikon: 'fa-gas-pump' }) + '<div class="k-ic">' +
        K.btn({ metin: 'İstanbul (Avrupa)', ikon: 'fa-location-dot', sagIkon: 'fa-chevron-down', tur: 'sade', tam: true, attr: 'data-sayfa="sehir"' }) +
        '<div style="padding-top:var(--b-12)">' + tablo({ cls: 'sol', vurgu: 0, sutunlar: ['İl', 'Benzin', 'Motorin', 'LPG'], satirlar: YKT }) + '</div>' +
        not('Pompa fiyatı, TL/litre · 23 Kasım 2026, 06.00 itibarıyla · dağıtım şirketine göre değişebilir') + '</div></section>';
    }
    return s;
  }
  /* satırın tamamı dokunulabilir: ayrıntısı olan satırlar enstrüman ekranını açar */
  function bagla(kap){ var tb = kap.querySelector('.k-tablo tbody'); if (!tb) return;
    [].forEach.call(tb.querySelectorAll('tr'), function(tr, i){ if (HREF[i]) tr.setAttribute('data-href', HREF[i]); }); }

  var bas = '<div class="k-bbas"><h1>Piyasalar</h1><p>Güncelleme ' + P.guncelleme + ' · 15 dk gecikmeli · satış</p></div>';
  /* alt çizgili sekmeler: yazı 16'dan başlar (kit .k-sekmeler iç boşluğu); denetimde tam genişlik sayılır */
  var sek = K.sekmeler(SK.map(function(x){ return x[1]; }), si).replace('class="k-sekmeler"', 'class="k-sekmeler" data-tam-genis');
  var DUZ = DUR === 'hata' || (DUR === 'cevrimdisi' && Q.get('onbellek') === '0');
  if (DUR === 'yukleniyor') e.innerHTML = '<div class="k-ust-bosluk"></div>' + bas + sek + '<div class="k-ic" style="padding-top:var(--b-24)">' + K.iskelet('metin', 12) + '</div><div class="k-son"></div>';
  else if (DUZ) e.innerHTML = '<div class="k-ust-bosluk"></div>' + K.hata({ tur: DUR === 'cevrimdisi' ? 'cevrimdisi' : (Q.get('hata') === 'zaman-asimi' ? 'zaman-asimi' : 'sunucu') }) + '<div class="k-son"></div>';
  else e.innerHTML = '<div class="k-ust-bosluk"></div>' + (DUR === 'yenileniyor' ? K.yenile(['cekiliyor', 'birak', 'bitti'].indexOf(HAL) > -1 ? HAL : 'yenileniyor') : '') + bas + sek +
    (DUR === 'cevrimdisi' ? '<div class="k-ic" style="padding-top:var(--b-16)">' + K.serit({ tur: 'uyari', ikon: 'fa-plug-circle-xmark', metin: 'Çevrimdışısın', alt: 'Son veri ' + P.guncelleme + '; bağlantı gelince yenilenir.' }) + '</div>' : '') +
    '<div id="sekme">' + icerik(SK[si][0]) + '</div><div class="k-son"></div>';
  var kap = document.getElementById('sekme');
  if (kap) bagla(kap);
  /* seçili sekme görünür yere kayar */
  var ss = e.querySelector('.k-sekmeler [aria-selected="true"]');
  if (ss && si > 2) ss.parentNode.scrollLeft = ss.offsetLeft - ss.parentNode.offsetLeft;

  K.ustCubuk({ geri: true, baslik: 'Piyasalar', buyuk: !DUZ, eylemler: DUZ ? [] : ['paylas'] });
  K.altCubuk('ana');
  K.oynatici();

  /* sekme yerinde değişir; adres güncellenir (geri ile kaybolmaz) */
  document.addEventListener('click', function(ev){
    var b = ev.target.closest('.k-sekmeler button');
    if (b && kap) { var i = [].indexOf.call(b.parentNode.children, b); kap.innerHTML = icerik(SK[i][0]); bagla(kap);
      var q = new URLSearchParams(location.search); q.set('sekme', SK[i][0]); q.delete('durum'); history.replaceState(null, '', '?' + q.toString()); }
    var c = ev.target.closest('.x-suz .k-cip');
    if (c && kap) { var j = [].indexOf.call(c.parentNode.children, c), S = [null, 'Döviz', 'Altın', 'Borsa', 'Kripto', 'Emtia'][j], t = kap.querySelector('[data-tablo="ekran"]');
      HREF = satirHref(EKR.filter(function(r){ return S ? r[6] === S : r[7]; })); t.outerHTML = piyasaEkrani(S); bagla(kap); }
    if (ev.target.closest('[data-temizle]')) { var q2 = new URLSearchParams(location.search); q2.delete('durum'); q2.set('sekme', 'borsa'); location.search = q2.toString(); }
    if (ev.target.closest('[data-cevir]')) cevirici(document.querySelector('.k-sekmeler [aria-selected="true"]').textContent === 'Kripto Para');
  });

  /* çevirici alt sayfası (E-352): tutar + iki birim; sistem sayısal klavyesi açılır (çizilmez) */
  function cevirici(kripto){
    var a = kripto ? ['0,05', 'BTC', '169.981,14', '1 BTC = 3.399.623 TRY · 98.412 $ üzerinden'] : ['1.000', 'USD', '34.544,80', '1 USD = 34,5448 TRY · satış kuru'];
    var alan = function(et, d, b, odak){ return K.alan({ etiket: et, deger: d, odak: odak, sag: K.etiket(b) }).replace('<input ', '<input inputmode="decimal" ').replace('class="k-alan-e"', 'class="k-alan-e k-dk44"'); };
    K.sayfa({ baslik: kripto ? 'Kripto çevirici' : 'Döviz çevirici', alt: kripto ? 'Borsalar ortalaması · ' + P.guncelleme : 'Satış kuru · 15 dk gecikmeli',
      icerik: alan('Tutar', a[0], a[1], true) +
        '<div style="display:flex;justify-content:center;padding:var(--b-8) 0">' + K.ikonBtn({ ikon: 'fa-right-left', etiket: 'Birimleri değiştir', tur: 'dolu' }) + '</div>' +
        alan('Karşılığı', a[2], 'TRY') + '<div style="padding-top:var(--b-16)">' + K.serit({ ikon: 'fa-calculator', metin: a[3] }) + '</div>' +
        '<p class="k-grup-n">Tutara dokununca telefonun sayısal klavyesi açılır.</p>' });
  }
  if (DUR === 'cevirici') cevirici(sec === 'kripto');

  if (DUR === 'cevrimdisi' && !DUZ) {
    var bt = K.toast('Çevrimdışısın', { bant: true, eylem: 'Kaydedilenler', eylemFn: function(){ location.href = K.git('kaydedilenler'); } });
    bt.querySelector('button').classList.add('k-dk44');
  }
  document.addEventListener('click', function(ev){ var y = ev.target.closest('[data-yeniden]'); if (!y) return;
    y.classList.add('is-yukleniyor'); y.innerHTML = K.I('fa-circle-notch', 'fa-spin') + '<span>Deneniyor</span>';
    setTimeout(function(){ var q = new URLSearchParams(location.search); ['durum', 'hata', 'hal', 'onbellek'].forEach(function(x){ q.delete(x); }); location.search = q.toString(); }, 1200); });
})();
</script>

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>Piyasalar</title>
<!-- Dada Haber Mobil · PİYASALAR (E-345–E-357 + borsa/kripto/hesaplayıcı halleri). Liste kökünden: büyük başlık, sekmeler (Piyasa Ekranı · Döviz · Altın · Borsa · Kripto Para · Faiz Oranları · Akaryakıt);
     her sekme doğrudan açılır ve public sayfasının bütün içeriğini taşır: tablo (kap içinde yatay kayar), hesaplayıcı alt sayfası, sekmenin haberleri, yatırım uyarısı.
     Borsa: endeks kartları → enstrüman, Günün Hareketlileri (artan · düşen · hacim, 5'er), 50 hisselik aramalı ve sıralanabilir tablo; her hisse satırı hisse.html'i açar.
     Kripto: 50 kripto, aramalı ve sıralanabilir; satır enstruman.html?kod=btc… açar (kripto Borsa İstanbul payı değil; hisse ekranının takip/alarm kalıbı enstrümanda da var).
     Satırın tamamı dokunulabilir: Piyasa Ekranı, Döviz, Altın, Kripto satırları enstrüman, hisse satırları hisse ekranını açar. Sektör süzgeci yok (public borsa.html'de yok).
     Sorgu: ?sekme=ekran|doviz|altin|borsa|kripto|faiz|akaryakit · &sira=artan|azalan|hacim (Borsa, Kripto) · &ara=<metin> (Borsa, Kripto arama dolu) · &tum=1 (uzun liste açık; varsayılan ilk 20 satır + "hepsini göster")
            ?durum=cevirici (sekmenin hesaplayıcı alt sayfası: Döviz/Kripto çevirici, Altın hesaplayıcı, Kredi hesaplayıcı, Yakıt maliyeti) | yukleniyor | yenileniyor (&hal=cekiliyor|birak|bitti)
            | bos (aramada sonuç yok; sekme yoksa Borsa) | hata (&hata=zaman-asimi) | cevrimdisi (&onbellek=0)
     KONU SAYFASI KİPİ (Yasin Bey, 25 Kasım: finans alt sayfaları sitedeki mantıkla açılır; menü, Bölümler ve bölüm listesinden K.altYol ile gelinir):
     ?konu=doviz|altin|borsa|kripto|faiz|akaryakit → sekme çubuğu yok; görselli banner (başlık = sitedeki sayfa adı, altında sitedeki banner alt metni + güncelleme saati) →
     konunun bilgi blokları sitedeki sırayla, hesaplayıcı sayfada açık kart (alt sayfa düğmesi değil) → konunun haberleri (sitenin ilk sayfası, 8 haber; "Tümü" bölüm listesini o konuyla açar) → yatırım uyarısı.
       doviz: Döviz Kurları tablosu → Döviz Çevirici → 4 haber → Bu Hafta Takvimde → 4 haber (public doviz.html'deki gibi takvim haber akışının arasında)
       altin: Altın Fiyatları tablosu → Altın Hesaplayıcı → haberler · kripto: Kripto Para Fiyatları (Piyasa değeri/Artan/Azalan, arama) → Kripto Çevirici → haberler
       borsa: Endeksler ve Hisseler (endeks kartları) → Hisseler (En aktif/Artan/Azalan/Hacim, arama) → Endeksler paneli (BİST 100/30/Banka/Sınai) → haberler; Günün Hareketlileri yalnız sekmeli kipte (sitenin borsa.html'inde yok)
       faiz: Politika · Mevduat · Kredi tabloları → Kredi Hesaplayıcı → haberler · akaryakit: Pompa Fiyatları (il seçici, tablo) → Yakıt Maliyeti → haberler
     Konu kipinde de &sira, &ara, &tum ve ?durum= (yukleniyor, yenileniyor, cevirici, bos, hata, cevrimdisi) aynı işlevlerle çalışır; banner fotoğrafı .k-bbas[data-g] (akaryakıtta uygun fotoğraf yok: koyu zemin).
     Veri: piyasa-veri.js (window.PV; public sayfalar + sözlük, kaynakları orada); güncelleme saati D.piyasa. -->
<link rel="stylesheet" href="../../_ortak/cerceve.css">
<link rel="stylesheet" href="../../_ortak/marka.css">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../_ortak/icerik.js"></script>
<script src="../../_ortak/cerceve.js"></script>
<script src="../../_ortak/icerik-ek.js"></script>
<script src="../../kit/kit.js"></script>
<script src="piyasa-veri.js"></script>
<style>
/* hesaplayıcı alanlarının arası (kit alanı tek başına) */
.x-hesap > * + *{margin-top:var(--b-12)}
/* KİT ADAYI: araç kartı — hamilelik.html'deki x-arac ile aynı (sayfada açık hesaplayıcı kabı; kitte k-grup-k yalnız satır taşıyor) */
.x-arac{padding:var(--b-16);border-radius:var(--k-kart);background:var(--k-yuzey)}
.x-arac .k-kutu-b{margin-bottom:var(--b-12)}
.x-arac .k-girdi{background:var(--zemin)}
.x-arac .k-serit{margin-top:var(--b-16);background:var(--zemin)}
.x-arac .k-serit>i{color:var(--marka-metin)}
/* Endeksler paneli: iki sütunlu sayı ızgarası (hamilelik.html ile aynı yerel ek) */
.k-istat.iki{grid-template-columns:repeat(2,1fr)}
</style>
</head>
<body>
<div class="ekran" id="ekran"></div>
<script>
(function(){
  var Q = K.q, DUR = K.durum, HAL = Q.get('hal'), e = document.getElementById('ekran');
  var P = D.piyasa, V = window.PV;
  var SK = [['ekran', 'Piyasa Ekranı'], ['doviz', 'Döviz'], ['altin', 'Altın'], ['borsa', 'Borsa'], ['kripto', 'Kripto Para'], ['faiz', 'Faiz Oranları'], ['akaryakit', 'Akaryakıt']];
  var sec = Q.get('sekme') || (DUR === 'bos' ? 'borsa' : 'ekran');
  var si = Math.max(0, SK.map(function(x){ return x[0]; }).indexOf(sec));
  sec = SK[si][0];
  /* konu sayfası kipi: ad, banner alt metni (public sayfanın banner görev satırının kısaltması; banner alt satırı tek satır), banner fotoğrafı (assets/gorsel/haber/KAYNAK.txt), liste konusu (K.altYol biçimi) */
  var KONUL = {
    doviz: { ad: 'Döviz', alt: 'Kurlar, çevirici, haberler', g: 'faiz', kod: 'doviz' },
    altin: { ad: 'Altın', alt: 'Gram, çeyrek, cumhuriyet, ons', g: 'altin', kod: 'altin' },
    borsa: { ad: 'Borsa', alt: 'Endeksler, hisseler, şirketler', g: 'borsa', kod: 'borsa' },
    kripto: { ad: 'Kripto Para', alt: 'Fiyatlar, çevirici, haberler', g: 'veri-merkezi', kod: 'kripto-para' },
    faiz: { ad: 'Faiz Oranları', alt: 'Politika, mevduat ve kredi', g: 'faiz', kod: 'faiz-oranlari' },
    akaryakit: { ad: 'Akaryakıt Fiyatları', alt: 'İllere göre pompa fiyatları', g: '', kod: 'akaryakit-fiyatlari', saat: '06.00' } };
  var KONU = KONUL[Q.get('konu')] ? Q.get('konu') : '';
  if (KONU) { sec = KONU; si = SK.map(function(x){ return x[0]; }).indexOf(sec); }
  /* arama ve sıralama (Borsa, Kripto) */
  var ARA = DUR === 'bos' ? 'XYZ' : (Q.get('ara') || ''), SIRA = Q.get('sira') || '', TUM = Q.get('tum') === '1', ILK = 20;

  function yon(v, y){ return '<span class="k-yon ' + y + '">' + (y === 'y' ? '▲' : y === 'd' ? '▼' : '') + (y ? ' ' : '') + v + '</span>'; }
  function ad(a, alt){ return '<b>' + a + '</b>' + (alt ? K.meta([alt]) : ''); }
  function not(m){ return '<p class="k-grup-n">' + m + '</p>'; }
  /* tablo + satır adresleri: satırın tamamı dokunulabilir (kit [data-href]) */
  function tablo(o, hrefs){ var h = K.tablo(o), i = h.indexOf('<tbody>'), n = 0;
    return h.slice(0, i) + h.slice(i).replace(/<tr/g, function(m){ var u = hrefs && hrefs[n++]; return u ? '<tr data-href="' + u + '"' : m; }); }
  function py(x, h){ return (h ? '<a class="k-py" href="' + h + '">' : '<div class="k-py">') + '<small>' + x[0] + '</small><b>' + x[1] + '</b><em class="' + x[3] + '">' + (x[3] === 'y' ? '▲' : x[3] === 'd' ? '▼' : '') + ' ' + x[2] + '</em>' + (h ? '</a>' : '</div>'); }
  /* hesaplayıcı alanları: sekmeli kipte alt sayfada (hesap), konu kipinde sayfada açık kartta (hesapKart); public sayfadaki örnek değerlerle */
  function hesapAlanlar(k, sayfa){
    var h = V.HESAP[k];
    var alan = function(a){ return K.alan({ etiket: a[0], deger: a[1], odak: !!sayfa && !!a[3], sag: K.etiket(a[2]) }).replace('<input ', '<input inputmode="decimal" ').replace('class="k-alan-e"', 'class="k-alan-e k-dk44"'); };
    var al = h.alanlar.map(alan);
    if (h.degis) al.splice(1, 0, '<div style="display:flex;justify-content:center">' + K.ikonBtn({ ikon: 'fa-right-left', etiket: 'Birimleri değiştir', tur: 'dolu' }) + '</div>');
    return '<div class="x-hesap">' + al.join('') + '</div>';
  }
  /* public sayfadaki kart başlıkları */
  var HBAS = { doviz: 'Döviz Çevirici', kripto: 'Kripto Çevirici', altin: 'Altın Hesaplayıcı', faiz: 'Kredi Hesaplayıcı', akaryakit: 'Yakıt Maliyeti' };
  function hesapKart(k){ var h = V.HESAP[k];
    return '<div class="x-arac"><div class="k-kutu-b">' + K.I('fa-calculator') + HBAS[k] + '<em>' + h.alt + '</em></div>' + hesapAlanlar(k) + K.serit({ ikon: 'fa-calculator', metin: h.not }) + '</div>'; }
  function hesapBtn(k){ return '<div style="padding-top:var(--b-16)">' + (KONU ? hesapKart(k) : K.btn({ metin: V.HESAP[k].baslik.charAt(0).toUpperCase() + V.HESAP[k].baslik.slice(1), ikon: 'fa-calculator', tur: 'sade', tam: true, attr: 'data-hesap="' + k + '"' })) + '</div>'; }
  var BASLIK = { ekran: 'Piyasa Haberleri', doviz: 'Döviz Haberleri', altin: 'Altın Haberleri', borsa: 'Borsa Haberleri', kripto: 'Kripto Para Haberleri', faiz: 'Faiz Haberleri', akaryakit: 'Akaryakıt Haberleri' };
  function satirlar(L){ return '<div class="k-satirlar">' + L.map(function(h){ return K.satir(h); }).join('') + '</div>'; }
  var UYARI = '<div class="k-ic" style="padding-top:var(--b-16)">' + K.serit({ ikon: 'fa-circle-info', metin: 'Yatırım uyarısı', alt: 'Fiyat, oran ve yorumlar yatırım danışmanlığı değildir; veriler 15 dakika gecikmeli ve bilgilendirme amaçlıdır.' }) + '</div>';
  /* sekmeli kip: 5 haber, Tümü → Finans · konu kipi: sitenin ilk sayfası (8 haber), Tümü → bölüm listesi o konuyla; Döviz'de "Bu Hafta Takvimde" 4. haberden sonra (public doviz.html) */
  function haberler(k){
    var bb = K.bb({ baslik: BASLIK[k], ikon: 'fa-newspaper', sayi: V.HABER_SAYI[k], baglanti: { metin: 'Tümü', href: K.git('liste', 'bolum=finans' + (KONU ? '&konu=' + KONUL[KONU].kod : '')) } });
    if (!KONU) return '<section class="k-bl">' + bb + satirlar(V.HABER[k].slice(0, 5)) + UYARI + '</section>';
    if (k !== 'doviz') return '<section class="k-bl">' + bb + satirlar(V.HABER[k]) + UYARI + '</section>';
    return '<section class="k-bl">' + bb + satirlar(V.HABER[k].slice(0, 4)) + '</section>' + takvimBlok() + '<section class="k-bl">' + satirlar(V.HABER[k].slice(4)) + UYARI + '</section>';
  }
  function takvimBlok(){
    return '<section class="k-bl">' + K.bb({ baslik: 'Bu Hafta Takvimde', ikon: 'fa-calendar-day', baglanti: { metin: 'Takvim', href: K.git('takvim', 'tur=ekonomik') } }) + '<div class="k-ic">' +
      K.tablo({ cls: 'sol', sutunlar: ['Zaman', 'Olay', 'Önem'], satirlar: V.TAKVIM.map(function(r){ return [ad(r[1], r[0]), ad(r[3], r[2] + ' · ' + r[4]), K.etiket(r[5], { tur: r[5] === 'Yüksek' ? 'kirmizi' : '' })]; }) }) +
      not('Kuru etkileyebilecek veri ve kararlar · Türkiye saatiyle') + '</div></section>';
  }
  /* uzun liste ilk 20 satırla açılır; haberler gömülmesin (public 50 satırı tek sayfada gösterir) */
  function tumBtn(n, ne){ return '<div style="padding-top:var(--b-12)">' + K.btn({ metin: n + ' ' + ne + ' hepsini göster', ikon: 'fa-chevron-down', tur: 'sade', tam: true, attr: 'data-tum' }) + '</div>'; }
  function trUst(s){ return String(s).toLocaleUpperCase('tr'); }

  /* ---------- Borsa ---------- */
  function hisseler(){
    var q = trUst(ARA.trim()), L = V.HIS.filter(function(r){ return !q || trUst(r[0]).indexOf(q) > -1 || trUst(r[1]).indexOf(q) > -1; });
    if (SIRA === 'artan') L.sort(function(a, b){ return V.isaretli(b[3], b[4]) - V.isaretli(a[3], a[4]); });
    if (SIRA === 'azalan') L.sort(function(a, b){ return V.isaretli(a[3], a[4]) - V.isaretli(b[3], b[4]); });
    if (SIRA === 'hacim') L.sort(function(a, b){ return V.sayi(b[5]) - V.sayi(a[5]); });
    return L;
  }
  function hisseTablo(){
    var L = hisseler(), say = document.querySelector('[data-say]');
    if (say) say.textContent = L.length + ' / 592 hisse';
    if (!L.length) return K.bos({ ikon: 'fa-magnifying-glass', baslik: 'Aramana uyan hisse bulunamadı', aciklama: 'Kodu ya da şirket adını kontrol et.', eylem: { metin: 'Aramayı temizle', tur: 'sade', attr: 'data-temizle' } });
    var kes = !ARA && !TUM && L.length > ILK, n = L.length; if (kes) L = L.slice(0, ILK);
    return '<div class="k-ic" style="padding-top:var(--b-12)">' + tablo({ cls: 'sol', sutunlar: ['Hisse', 'Son', 'Değişim', 'Hacim (TL)', 'Gün içi en düşük – en yüksek'],
      satirlar: L.map(function(r){ return [ad(r[0], r[1]), r[2], yon(r[3], r[4]), r[5], r[6] + ' – ' + r[7]]; }) }, L.map(function(r){ return V.href(r[0]); })) +
      (kes ? tumBtn(n, 'hissenin') : '') + not((ARA ? '"' + ARA + '" araması · ' : 'En çok işlem gören 50 hisse · ötekiler için ara · ') + '15 dakika gecikmeli · 23 Kasım 2026, ' + P.guncelleme) + '</div>';
  }
  var HRK = ['Artan', 'Düşen', 'Hacim'];
  function hareketli(i){
    var L = V.HIS.slice();
    if (i === 0) L = L.filter(function(r){ return r[4] === 'y'; }).sort(function(a, b){ return V.sayi(b[3]) - V.sayi(a[3]); });
    if (i === 1) L = L.filter(function(r){ return r[4] === 'd'; }).sort(function(a, b){ return V.sayi(b[3]) - V.sayi(a[3]); });
    if (i === 2) L.sort(function(a, b){ return V.sayi(b[5]) - V.sayi(a[5]); });
    return L.slice(0, 5).map(function(r){ return py([r[0], r[2], r[3], r[4]], V.href(r[0])); }).join('');
  }
  var SIRALAR = ['', 'artan', 'azalan', 'hacim'];
  function endeksRay(baslik){ return '<section class="k-bl sik">' + K.bb({ baslik: baslik, ikon: 'fa-chart-column', not: 'Borsa İstanbul' }) +
        '<div class="k-ray s10">' + V.END.map(function(x){ return py([x[0], x[1], x[2], x[3]], V.href(x[0])); }).join('') + '</div></section>'; }
  function hisseBlok(){ return '<section class="k-bl">' + K.bb({ baslik: 'Hisseler', ikon: 'fa-chart-column', not: '<span data-say>' + hisseler().length + ' / 592 hisse</span>' }) +
        '<div class="k-ic" data-ara>' + K.ara({ yer: 'Hisse kodu ya da şirket', ses: false, deger: ARA }) + '</div>' +
        '<div style="padding-top:var(--b-12)">' + K.cipler(['En aktif', 'Artan', 'Azalan', 'Hacim'], Math.max(0, SIRALAR.indexOf(SIRA)), { cls: 'x-sira' }) + '</div>' +
        '<div id="x-liste">' + hisseTablo() + '</div></section>'; }
  function borsa(){
    return endeksRay('Endeksler') +
      '<section class="k-bl">' + K.bb({ baslik: 'Günün Hareketlileri', ikon: 'fa-chart-column', not: 'İlk 50 hisse içinden' }) +
        '<div class="k-ic" data-hrk>' + K.segment(HRK, 0) + '</div><div class="k-ray s10" id="x-hrk" style="padding-top:var(--b-12)">' + hareketli(0) + '</div></section>' +
      hisseBlok() + haberler('borsa');
  }
  /* konu kipi (public borsa.html sırası): endeks kartları → hisse tablosu → Endeksler paneli (açılış, önceki kapanış, işlem hacmi, gün içi aralık) → haberler */
  var ESEG = ['BİST 100', 'BİST 30', 'Banka', 'Sınai'];
  function endeksDetay(i){ var x = V.END[i];
    return K.istat([[x[1], 'Son · puan'], [x[9], 'Açılış'], [x[6], 'Önceki kapanış'], [x[10], 'İşlem hacmi']]).replace('class="k-istat"', 'class="k-istat iki"').replace(/<a>/g, '<div>').replace(/<\/a>/g, '</div>') +
      '<div class="k-ic">' + not('Değişim ' + yon(x[2], x[3]) + ' · gün içi en düşük ' + x[7] + ', en yüksek ' + x[8]) +
      '<div style="padding-top:var(--b-12)">' + K.btn({ metin: x[0] + ' ayrıntısı', sagIkon: 'fa-chevron-right', tur: 'sade', tam: true, href: V.href(x[0]) }) + '</div></div>'; }
  function borsaKonu(){
    return endeksRay('Endeksler ve Hisseler') + hisseBlok() +
      '<section class="k-bl">' + K.bb({ baslik: 'Endeksler', ikon: 'fa-chart-column', not: '23 Kasım · ' + P.guncelleme }) +
        '<div class="k-ic" data-end>' + K.segment(ESEG, 0) + '</div><div id="x-end">' + endeksDetay(0) + '</div></section>' + haberler('borsa');
  }
  /* ---------- Kripto ---------- */
  function kriptolar(){
    var q = trUst(ARA.trim()), L = V.KRP.filter(function(r){ return !q || trUst(r[0]).indexOf(q) > -1 || trUst(r[1]).indexOf(q) > -1; });
    if (SIRA === 'artan') L.sort(function(a, b){ return V.isaretli(b[4], b[5]) - V.isaretli(a[4], a[5]); });
    if (SIRA === 'azalan') L.sort(function(a, b){ return V.isaretli(a[4], a[5]) - V.isaretli(b[4], b[5]); });
    return L;
  }
  function kriptoTablo(){
    var L = kriptolar(), say = document.querySelector('[data-say]');
    if (say) say.textContent = L.length + ' / 12.480 kripto';
    if (!L.length) return K.bos({ ikon: 'fa-magnifying-glass', baslik: 'Aramana uyan kripto bulunamadı', aciklama: 'Kodu ya da adı kontrol et.', eylem: { metin: 'Aramayı temizle', tur: 'sade', attr: 'data-temizle' } });
    var kes = !ARA && !TUM && L.length > ILK, n = L.length; if (kes) L = L.slice(0, ILK);
    return '<div class="k-ic" style="padding-top:var(--b-12)">' + tablo({ cls: 'sol', sutunlar: ['Kripto', 'Fiyat ($)', 'Fiyat (TL)', '24 saat', 'Gün içi en düşük – en yüksek ($)'],
      satirlar: L.map(function(r){ return [ad(r[0], r[1]), r[2], r[3], yon(r[4], r[5]), r[6] + ' – ' + r[7]]; }) }, L.map(function(r){ return V.href(r[0]); })) +
      (kes ? tumBtn(n, 'kriptonun') : '') + not((ARA ? '"' + ARA + '" araması · ' : 'Piyasa değerine göre ilk 50 · ') + 'borsalar ortalaması · 23 Kasım 2026, ' + P.guncelleme) + '</div>';
  }
  var KSIRA = ['', 'artan', 'azalan'];
  function kripto(){
    return '<section class="k-bl sik">' + K.bb({ baslik: KONU ? 'Kripto Fiyatları' : 'Kripto Para', ikon: 'fa-chart-column', not: '<span data-say>' + kriptolar().length + ' / 12.480 kripto</span>' }) +
        '<div class="k-ic" data-ara>' + K.ara({ yer: 'Kripto kodu ya da adı', ses: false, deger: ARA }) + '</div>' +
        '<div style="padding-top:var(--b-12)">' + K.cipler(['Piyasa değeri', 'Artan', 'Azalan'], Math.max(0, KSIRA.indexOf(SIRA)), { cls: 'x-sira' }) + '</div>' +
        '<div id="x-liste">' + kriptoTablo() + '</div><div class="k-ic">' + hesapBtn('kripto') + '</div></section>' + haberler('kripto');
  }
  /* ---------- Piyasa Ekranı ---------- */
  function piyasaEkrani(suz){
    var L = V.EKR.filter(function(r){ return suz ? r[6] === suz : r[7]; });
    return '<div data-tablo="ekran">' + tablo({ cls: 'sol', sutunlar: ['Enstrüman', 'Son', 'Değişim', 'Gün içi'], satirlar: L.map(function(r){ return [ad(r[0], r[1]), r[2], yon(r[3], r[4]), r[5]]; }) },
      L.map(function(r){ return V.href(r[0]); })) + '</div>';
  }
  function icerik(k){
    if (k === 'ekran') return '<section class="k-bl sik">' + K.bb({ baslik: 'Bütün Piyasalar', ikon: 'fa-chart-column', not: 'Canlı · ' + P.guncelleme }) + K.cipler(['Tümü', 'Döviz', 'Altın', 'Borsa', 'Kripto', 'Emtia'], 0, { cls: 'x-suz' }) +
        '<div class="k-ic" style="padding-top:var(--b-12)">' + piyasaEkrani() + '</div></section>' +
      '<section class="k-bl">' + K.bb({ baslik: 'Piyasa Saatleri', ikon: 'fa-clock' }) + '<div class="k-ic">' + K.tablo({ cls: 'sol', sutunlar: ['Piyasa', 'Saat', 'Durum'], satirlar: V.SAAT.map(function(r){ return [r[0], r[1], K.etiket(r[2] ? 'Açık' : 'Kapalı', { tur: r[2] ? 'yesil' : 'kirmizi' })]; }) }) +
        not('Saatler Türkiye saatiyle · veriler 15 dakika gecikmeli · kripto anlık') + '</div></section>' + haberler('ekran');
    if (k === 'doviz') return '<section class="k-bl sik">' + K.bb({ baslik: 'Döviz Kurları', ikon: 'fa-chart-column', not: 'Serbest piyasa' }) + '<div class="k-ic">' +
        tablo({ cls: 'sol', sutunlar: ['Döviz', 'Alış', 'Satış', 'Değişim', 'Gün içi en düşük – en yüksek'], satirlar: V.DVZ.map(function(r){ return [ad(r[0], r[1]), r[2], r[3], yon(r[4], r[5]), r[6] + ' – ' + r[7]]; }) },
          V.DVZ.map(function(r){ return V.href(r[0]); })) + hesapBtn('doviz') + not('Serbest piyasa kurları · 15 dakika gecikmeli · 23 Kasım 2026, ' + P.guncelleme) + '</div></section>' +
      (KONU ? '' : takvimBlok()) + haberler('doviz');
    if (k === 'altin') return '<section class="k-bl sik">' + K.bb({ baslik: 'Altın Fiyatları', ikon: 'fa-chart-column', not: 'Kapalıçarşı' }) + '<div class="k-ic">' +
        tablo({ cls: 'sol', sutunlar: ['Tür', 'Alış', 'Satış', 'Değişim', 'Gün içi en düşük – en yüksek'], satirlar: V.ALT.map(function(r){ return [ad(r[0], r[1]), r[2], r[3], yon(r[4], r[5]), r[6] + ' – ' + r[7]]; }) },
          V.ALT.map(function(r){ return V.href(r[0]); })) + hesapBtn('altin') + not('Serbest piyasa fiyatları, TL · 15 dakika gecikmeli · 23 Kasım 2026, ' + P.guncelleme) + '</div></section>' + haberler('altin');
    if (k === 'borsa') return KONU ? borsaKonu() : borsa();
    if (k === 'kripto') return kripto();
    if (k === 'faiz') return '<section class="k-bl sik">' + K.bb({ baslik: 'Politika Faizleri', ikon: 'fa-building-columns' }) + '<div class="k-ic">' +
        K.tablo({ cls: 'sol', sutunlar: ['Faiz', 'Oran', 'Önceki', 'Karar'], satirlar: V.FZ1.map(function(r){ return [ad(r[0], r[1]), r[2], r[3], r[4]]; }) }) + '</div></section>' +
      '<section class="k-bl">' + K.bb({ baslik: 'Mevduat', ikon: 'fa-building-columns', not: 'Yıllık, ortalama' }) + '<div class="k-ic">' +
        K.tablo({ cls: 'sol', sutunlar: ['Vade', 'Oran', 'Önceki hafta', 'Değişim'], satirlar: V.FZ2.map(function(r){ return [r[0], r[1], r[2], yon(r[3], r[4])]; }) }) + '</div></section>' +
      '<section class="k-bl">' + K.bb({ baslik: 'Kredi', ikon: 'fa-building-columns', not: 'Aylık, ortalama' }) + '<div class="k-ic">' +
        K.tablo({ cls: 'sol', sutunlar: ['Kredi', 'Oran', 'Önceki hafta', 'Değişim'], satirlar: V.FZ3.map(function(r){ return [r[0], r[1], r[2], yon(r[3], r[4])]; }) }) + hesapBtn('faiz') +
        not('Banka ortalamaları, 15 Kasım 2026 haftası · TCMB kararı 23 Kasım\'daki olağanüstü PPK toplantısında alındı') + '</div></section>' + haberler('faiz');
    if (k === 'akaryakit') return '<section class="k-bl sik">' + K.bb({ baslik: 'Pompa Fiyatları', ikon: 'fa-gas-pump' }) + '<div class="k-ic">' +
        K.btn({ metin: 'İstanbul (Avrupa)', ikon: 'fa-location-dot', sagIkon: 'fa-chevron-down', tur: 'sade', tam: true, attr: 'data-sayfa="sehir"' }) +
        '<div style="padding-top:var(--b-12)">' + K.tablo({ cls: 'sol', vurgu: 0, sutunlar: ['İl', 'Benzin', 'Motorin', 'LPG'], satirlar: V.YKT }) + '</div>' + hesapBtn('akaryakit') +
        not('Pompa fiyatı, TL/litre · 23 Kasım 2026, 06.00 itibarıyla · dağıtım şirketine göre değişebilir') + '</div></section>' + haberler('akaryakit');
    return '';
  }

  var KB = KONUL[KONU];
  /* konu kipi: banner başlığı konu adı, fotoğrafı konuya göre (data-g; "" koyu zemin); sekme çubuğu yok */
  var bas = KONU ? '<div class="k-bbas" data-g="' + KB.g + '"><h1>' + KB.ad + '</h1><p>Güncelleme ' + (KB.saat || P.guncelleme) + ' · ' + KB.alt + '</p></div>'
    : '<div class="k-bbas"><h1>Piyasalar</h1><p>Güncelleme ' + P.guncelleme + ' · 15 dk gecikmeli · satış</p></div>';
  if (KONU) document.title = KB.ad;
  /* alt çizgili sekmeler: yazı 16'dan başlar (kit .k-sekmeler iç boşluğu); denetimde tam genişlik sayılır */
  var sek = KONU ? '' : K.sekmeler(SK.map(function(x){ return x[1]; }), si).replace('class="k-sekmeler"', 'class="k-sekmeler" data-tam-genis');
  var DUZ = DUR === 'hata' || (DUR === 'cevrimdisi' && Q.get('onbellek') === '0');
  if (DUR === 'yukleniyor') e.innerHTML = '<div class="k-ust-bosluk"></div>' + bas + sek + '<div class="k-ic" style="padding-top:var(--b-24)">' + K.iskelet('metin', 12) + '</div><div class="k-son"></div>';
  else if (DUZ) e.innerHTML = '<div class="k-ust-bosluk"></div>' + K.hata({ tur: DUR === 'cevrimdisi' ? 'cevrimdisi' : (Q.get('hata') === 'zaman-asimi' ? 'zaman-asimi' : 'sunucu') }) + '<div class="k-son"></div>';
  else e.innerHTML = '<div class="k-ust-bosluk"></div>' + (DUR === 'yenileniyor' ? K.yenile(['cekiliyor', 'birak', 'bitti'].indexOf(HAL) > -1 ? HAL : 'yenileniyor') : '') + bas + sek +
    (DUR === 'cevrimdisi' ? '<div class="k-ic" style="padding-top:var(--b-16)">' + K.serit({ tur: 'uyari', ikon: 'fa-plug-circle-xmark', metin: 'Çevrimdışısın', alt: 'Son veri ' + P.guncelleme + '; bağlantı gelince yenilenir.' }) + '</div>' : '') +
    '<div id="sekme">' + icerik(sec) + '</div><div class="k-son"></div>';
  var kap = document.getElementById('sekme');
  /* seçili sekme görünür yere kayar */
  var ss = e.querySelector('.k-sekmeler [aria-selected="true"]');
  if (ss && si > 2) ss.parentNode.scrollLeft = ss.offsetLeft - ss.parentNode.offsetLeft;

  K.ustCubuk({ geri: true, baslik: KONU ? KB.ad : 'Piyasalar', buyuk: !DUZ, eylemler: DUZ ? [] : ['paylas'] });
  /* konu sayfasına menü, Bölümler ve bölüm listesinden gelinir: alt çubukta Bölümler */
  K.altCubuk(KONU ? 'bolum' : 'ana');
  K.oynatici();

  function adres(){ var q = new URLSearchParams(location.search); if (!KONU) q.set('sekme', sec); q.delete('durum');
    if (SIRA) q.set('sira', SIRA); else q.delete('sira'); if (ARA) q.set('ara', ARA); else q.delete('ara'); history.replaceState(null, '', '?' + q.toString()); }
  function listeYenile(){ var l = document.getElementById('x-liste'); if (l) l.innerHTML = sec === 'kripto' ? kriptoTablo() : hisseTablo(); }

  /* sekme yerinde değişir; adres güncellenir (geri ile kaybolmaz) */
  document.addEventListener('click', function(ev){
    var b = ev.target.closest('.k-sekmeler button');
    if (b && kap) { sec = SK[[].indexOf.call(b.parentNode.children, b)][0]; SIRA = ''; ARA = ''; TUM = false; kap.innerHTML = icerik(sec); adres(); }
    var c = ev.target.closest('.x-suz .k-cip');
    if (c && kap) { var S = [null, 'Döviz', 'Altın', 'Borsa', 'Kripto', 'Emtia'][[].indexOf.call(c.parentNode.children, c)]; kap.querySelector('[data-tablo="ekran"]').outerHTML = piyasaEkrani(S); }
    var sr = ev.target.closest('.x-sira .k-cip');
    if (sr) { SIRA = (sec === 'kripto' ? KSIRA : SIRALAR)[[].indexOf.call(sr.parentNode.children, sr)]; listeYenile(); adres(); }
    var hk = ev.target.closest('[data-hrk] .k-segment button');
    if (hk) document.getElementById('x-hrk').innerHTML = hareketli([].indexOf.call(hk.parentNode.children, hk));
    var ek = ev.target.closest('[data-end] .k-segment button');
    if (ek) document.getElementById('x-end').innerHTML = endeksDetay([].indexOf.call(ek.parentNode.children, ek));
    if (ev.target.closest('[data-temizle], [data-ara] .temizle')) { ARA = ''; var inp = document.querySelector('[data-ara] input'); if (inp) inp.value = ''; var t0 = document.querySelector('[data-ara] .temizle'); if (t0) t0.remove(); listeYenile(); adres(); }
    if (ev.target.closest('[data-tum]')) { TUM = true; listeYenile(); var q1 = new URLSearchParams(location.search); q1.set('tum', '1'); history.replaceState(null, '', '?' + q1.toString()); }
    var hs = ev.target.closest('[data-hesap]');
    if (hs) hesap(hs.getAttribute('data-hesap'));
  });
  /* arama yazdıkça süzer (kod ya da ad) */
  document.addEventListener('input', function(ev){ if (!ev.target.closest('[data-ara]')) return; ARA = ev.target.value; listeYenile(); adres(); });

  /* hesaplayıcı alt sayfası (E-352 ve sekme hesaplayıcıları): public sayfadaki örnek değerlerle; sistem sayısal klavyesi açılır (çizilmez) */
  function hesap(k){
    var h = V.HESAP[k];
    K.sayfa({ baslik: h.baslik, alt: h.alt, icerik: hesapAlanlar(k, true) + '<div style="padding-top:var(--b-16)">' + K.serit({ ikon: 'fa-calculator', metin: h.not }) + '</div>' +
      '<p class="k-grup-n">Tutara dokununca telefonun sayısal klavyesi açılır.</p>' });
  }
  if (DUR === 'cevirici') hesap(V.HESAP[sec] ? sec : 'doviz');

  if (DUR === 'cevrimdisi' && !DUZ) {
    var bt = K.toast('Çevrimdışısın', { bant: true, eylem: 'Kaydedilenler', eylemFn: function(){ location.href = K.git('kaydedilenler'); } });
    bt.querySelector('button').classList.add('k-dk44');
  }
  document.addEventListener('click', function(ev){ var y = ev.target.closest('[data-yeniden]'); if (!y) return;
    y.classList.add('is-yukleniyor'); y.innerHTML = K.I('fa-circle-notch', 'fa-spin') + '<span>Deneniyor</span>';
    setTimeout(function(){ var q = new URLSearchParams(location.search); ['durum', 'hata', 'hal', 'onbellek'].forEach(function(x){ q.delete(x); }); location.search = q.toString(); }, 1200); });
})();
</script>
</body>
</html>

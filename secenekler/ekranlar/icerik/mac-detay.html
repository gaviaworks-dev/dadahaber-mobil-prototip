<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>Galatasaray – Fenerbahçe</title>
<!-- Dada Haber Mobil · MAÇ DETAYI (E-399–E-406). Detay kökünden (kendi düzeni, kit bileşenleri): düz üst çubuk, skor kutusu (kit maç kutusu, her iki temada koyu), künye satırı.
     Maç merkezi (Maçkolik tarzı yapı): yapışkan sekmeler (yerinde değişir, kaydırma değil; K18), altında maçla ilgili haberler (K44 satırı).
     Canlı (varsayılan): Anlatım · İstatistik · Kadrolar · Puan Durumu · Rekabet. Bitti (?durum=bitti): Özet (goller, maç haberi) · Kadrolar · Puan Durumu · Rekabet.
     Başlamadı (?durum=once): Kadrolar (ilk 11) · Rekabet · Puan Durumu. Puan Durumu: Süper Lig tablosu, iki takımın satırı vurgulu (maç öncesi, 13 hafta).
     Rekabet: iki takımın son maçları (form); aralarındaki maçların listesi sitede yok → dürüst "veri yok" şeridi + public'teki "son 10 maç" haberi.
     Sorgu: ?durum=once | bitti | yukleniyor | yenileniyor (&hal=cekiliyor|birak|bitti) | hata (&hata=zaman-asimi) | bulunamadi | cevrimdisi (&onbellek=0)
            ?sekme=anlatim|istatistik|kadrolar|puan|rekabet|ozet
     Veri: public mac-detay.html (anlatım, istatistik, goller, ilk 11, haberler), galatasaray.html ve fenerbahce.html (son maçlar), sözlük (haber saatleri), D.mac.
     Varsayımlar (onaylanmadı): başlama saati 14.45 (public bildirim "Takip ettiğin Galatasaray maçı başladı · 14.45"); "bitti" halinde sonuç 2–1 (kitin K.mac bitti haliyle aynı; veride maç sonu yok),
     67. dakika istatistikleri bitti halinde gösterilmez. -->
<link rel="stylesheet" href="../../_ortak/cerceve.css">
<link rel="stylesheet" href="../../_ortak/marka.css">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../_ortak/icerik.js"></script>
<script src="../../_ortak/cerceve.js"></script>
<script src="../../_ortak/icerik-ek.js"></script>
<script src="../../kit/kit.js"></script>
<script src="spor.js"></script>
<style>
/* KİT ADAYI: lig başlığı (katlanır) — Maçkolik tarzı skor listesinde maçlar lige göre gruplanır; lig adına dokununca lig sayfası, sağdaki sayı + ok düğmesi grubu katlar (spor.js ligGrup) */
.sp-lig{margin-top:var(--b-16)}
.sp-lig-b{display:flex;align-items:center;gap:var(--b-8);min-height:56px;border-bottom:1px solid var(--cizgi)}
.sp-lig-a{flex:1;min-width:0;display:flex;align-items:center;gap:var(--b-12);min-height:var(--dokun);color:inherit}
.sp-lig-i{width:32px;height:32px;flex:none;border-radius:var(--k-ic);background:var(--k-yuzey);display:grid;place-items:center;font-size:14px;color:var(--marka-metin)}
.sp-lig-t{min-width:0;display:flex;flex-direction:column;gap:var(--b-4)}
.sp-lig-t b{font-size:15px;font-weight:var(--y-kalin);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-lig-t small{font-size:12.5px;line-height:1.2;color:var(--metin-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-lig-ac{flex:none;min-width:var(--dokun);height:var(--dokun);display:inline-flex;align-items:center;justify-content:flex-end;gap:var(--ikon-bosluk);font-size:13px;font-weight:var(--y-kalin);color:var(--metin-3);font-variant-numeric:tabular-nums}
.sp-lig-ac i{font-size:12px;transition:transform .2s}
.sp-lig.kapali .sp-lig-ac i{transform:rotate(-90deg)}
.sp-lig.kapali .sp-lig-l{display:none}
/* KİT ADAYI: transfer satırı — kulüp kısaltması (puan tablosundaki daire), hareket, kulüp, durum etiketi (Resmî · Görüşme · Söylenti); satırın tamamı habere gider */
.sp-tr{display:flex;align-items:center;gap:var(--b-12);min-height:68px;padding:var(--b-12) 0;border-bottom:1px solid var(--cizgi);color:inherit}
.sp-tr .ar{width:40px;height:40px;flex:none;border-radius:var(--k-daire);display:grid;place-items:center;font-size:11px;font-weight:var(--y-kalin);color:#fff;background:var(--k-koyu)}
.sp-tr .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--b-4)}
.sp-tr b{font-size:15px;font-weight:var(--y-kalin);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sp-tr small{font-size:12.5px;color:var(--metin-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-tr .k-etiket{flex:none}
/* yapışkan denetim bandı (branş segmenti + gün sekmeleri) */
.sp-yapis{position:sticky;top:var(--k-ub-h);z-index:60;background:var(--zemin)}
.sp-sw{padding:var(--b-12) var(--kenar) 0}
</style>
</head>
<body>
<div class="ekran" id="ekran"></div>
<script>
(function(){
  var Q = K.q, DUR = K.durum, HAL = Q.get('hal'), e = document.getElementById('ekran'), m = D.mac;
  var KIP = DUR === 'once' ? 'once' : DUR === 'bitti' ? 'bitti' : 'canli';
  /* kaynak: public mac-detay.html "Maç Anlatımı" (yeni üstte) */
  var ANL = [
    ['67\'', 'Fenerbahçe\'de iki değişiklik', 'Teknik direktör orta sahada Taylan Er yerine Deniz Ateş\'i, sol kanatta Kerem Uslu yerine Youssef Amrani\'yi oyuna aldı.'],
    ['61\'', 'Galatasaray yeniden öne geçti: 2-1', 'Ilias Benali\'nin sağ kanattan ortasında Victor Mendes ceza alanında kafayla topu ağlara gönderdi.', 1],
    ['54\'', 'Sarı kart', 'Fenerbahçe\'de Nikola Petrović, kontra atağı faulle durdurduğu için sarı kart gördü.'],
    ['46\'', 'İkinci yarı başladı', 'İki takım da ikinci yarıya değişiklik yapmadan çıktı.'],
    ['45+2\'', 'İlk yarı sona erdi: 1-1', 'İlk yarıda Galatasaray topla daha çok oynadı, Fenerbahçe kontra ataklarla etkili oldu.'],
    ['38\'', 'Fenerbahçe beraberliği yakaladı: 1-1', 'Edin Hadžić, Rafael Costa\'nın ara pasında kaleciyle karşı karşıya kaldı ve topu uzak köşeye gönderdi.', 1],
    ['23\'', 'Galatasaray öne geçti: 1-0', 'Yunus Aydın ceza alanı dışından sol ayağıyla vurdu, top üst köşeden ağlara gitti.', 1],
    ['1\'', 'Maç başladı', 'Derbinin ilk düdüğünü hakem Cem Arıkan çaldı.']
  ];
  /* kaynak: public mac-detay.html "Goller" */
  var GOL = [['23\' · Galatasaray', 'Yunus Aydın · 1-0'], ['38\' · Fenerbahçe', 'Edin Hadžić · Asist: Rafael Costa · 1-1'], ['61\' · Galatasaray', 'Victor Mendes · Asist: Ilias Benali · 2-1']];
  /* kaynak: public mac-detay.html "İstatistikler" (67. dakika itibarıyla) */
  var IST = [['Topla oynama', '%54', '%46'], ['Şut', 12, 9], ['İsabetli şut', 6, 3], ['Korner', 5, 4], ['Faul', 9, 11], ['Sarı kart', 2, 3], ['Ofsayt', 1, 2], ['Pas isabeti', '%86', '%82'], ['Beklenen gol (xG)', '1,74', '0,92']];
  /* kaynak: public mac-detay.html "İlk 11" [oyuncu, no, mevki] */
  var GS11 = [['Emre Aksoy', 1, 'Kaleci'], ['Kaan Yıldırım', 2, 'Defans'], ['Davide Moretti', 4, 'Defans'], ['Burak Sezer', 5, 'Defans'], ['Lucas Ferreira', 3, 'Defans'], ['Arda Karaca', 6, 'Orta saha'],
              ['Mateo Rivas', 8, 'Orta saha'], ['Yunus Aydın', 10, 'Orta saha'], ['Oğuz Tan', 20, 'Orta saha'], ['Victor Mendes', 9, 'Forvet'], ['Barış Er', 11, 'Forvet']];
  var FB11 = [['Mert Doğan', 1, 'Kaleci'], ['Sami Okur', 2, 'Defans'], ['Nikola Petrović', 4, 'Defans'], ['Efe Çınar', 5, 'Defans'], ['Jonas Lindqvist', 3, 'Defans'], ['İsmail Kurt', 6, 'Orta saha'],
              ['Rafael Costa', 8, 'Orta saha'], ['Taylan Er', 10, 'Orta saha'], ['Deniz Ateş', 17, 'Orta saha'], ['Edin Hadžić', 9, 'Forvet'], ['Kerem Uslu', 11, 'Forvet']];
  /* kaynak: public galatasaray.html ve fenerbahce.html "Son Maçlar" [lig, ev, skor, dep, kazanan] */
  var SON = { Galatasaray: [['Şampiyonlar Ligi · 4. hafta', 'Galatasaray', '2 – 0', 'Club Brugge', 'ev'], ['Süper Lig · 13. hafta', 'Kayserispor', '0 – 3', 'Galatasaray', 'dep'], ['Süper Lig · 12. hafta', 'Galatasaray', '2 – 0', 'Antalyaspor', 'ev']],
              Fenerbahçe: [['Avrupa Ligi · 4. hafta', 'Fenerbahçe', '2 – 1', 'Lyon', 'ev'], ['Süper Lig · 13. hafta', 'Fenerbahçe', '3 – 1', 'Göztepe', 'ev'], ['Süper Lig · 12. hafta', 'Alanyaspor', '1 – 2', 'Fenerbahçe', 'dep']] };
  /* kaynak: public mac-detay.html "Maçla İlgili Haberler" + sözlük saatleri */
  var X = [
    { alt: 'Derbi', baslik: 'Galatasaray derbi öncesi son antrenmanını yaptı', yazar: 'Burak Tan', sure: '3 dk', izlenme: '14,2 B', saat: '15.10', g: 'antrenman' },
    { alt: 'Derbi', baslik: 'Fenerbahçe derbiye üç değişiklikle çıktı', yazar: 'Burak Tan', sure: '4 dk', izlenme: '9,6 B', saat: '13.55', g: 'antrenman' },
    { alt: 'Hakem', baslik: 'Derbinin VAR hakemi açıklandı', yazar: 'Emre Sönmez', sure: '5 dk', izlenme: '5,9 B', saat: '11.55', g: 'superlig' },
    { alt: 'Güvenlik', baslik: 'Derbi için stadyum çevresinde trafik düzenlemesi', yazar: 'Burak Tan', sure: '2 dk', izlenme: '4,8 B', saat: '22 Kas', g: 'superlig' },
    { alt: 'İstatistik', baslik: 'İki takım arasındaki son 10 maçta 4 galibiyet, 3 beraberlik', yazar: 'Gizem Aktaş', sure: '3 dk', izlenme: '3,6 B', saat: '22 Kas', g: 'superlig' },
    { alt: 'Taraftar', baslik: 'Derbi biletleri satışa çıktığı gün tükendi', yazar: 'Murat Tekin', sure: '4 dk', izlenme: '2,9 B', saat: '22 Kas', g: 'superlig' },
    { alt: 'Süper Lig', baslik: 'Derbi sonucu zirve yarışını nasıl etkiler', yazar: 'Burak Tan', sure: '3 dk', izlenme: '14,2 B', saat: '21 Kas', g: 'superlig' },
    { alt: 'Kadro', baslik: 'İki takım da ilk 11\'ini açıkladı', yazar: 'Gizem Aktaş', sure: '4 dk', izlenme: '9,6 B', saat: '21 Kas', g: 'antrenman' }
  ];
  X.forEach(function(h){ h.ikon = 'fa-futbol'; });

  function kadro(ad, l){ return '<div class="k-ayrac"><span>' + ad + '</span><span>İlk 11</span></div>' + K.tablo({ sutunlar: ['Oyuncu', 'No', 'Mevki'], satirlar: l }); }
  function kadrolar(){ return kadro(m.ev, GS11) + kadro(m.dep, FB11); }
  function sonMaclar(ad){ return '<div class="k-ayrac"><span>' + ad + '</span><span>Son 3 maç</span></div>' + SON[ad].map(function(x){ return K.skor({ dk: 'MS', ev: x[1], skor: x[2], dep: x[3], kazanan: x[4] }); }).join(''); }
  function bolum(bb, ic){ return '<section class="k-bl sik">' + K.bb(bb) + '<div class="k-ic">' + ic + '</div></section>'; }
  function haberler(l, bb){ return '<section class="k-bl sik">' + K.bb(bb) + '<div class="k-satirlar">' + l.map(function(h){ return K.satir(h); }).join('') + '</div></section>'; }

  /* skor kutusu: kitin maç kutusu; sayfanın kendisi olduğu için bağlantısı kaldırılır */
  var kutu = '<div class="k-ic" style="padding-top:var(--b-8)">' + K.mac({ hal: KIP === 'once' ? 'baslamadi' : KIP, saat: '14.45' }).replace(/ href="[^"]*"/, '') +
    K.meta(KIP === 'once' ? ['İstanbul', 'Hakem Cem Arıkan', 'Başlama 14.45'] : ['İstanbul', 'Hakem Cem Arıkan', '51.840 seyirci']) + '</div>';

  /* sekmeler: maç haline göre (Maçkolik tarzı maç merkezi) */
  var AD = { anlatim: 'Anlatım', istatistik: 'İstatistik', kadrolar: 'Kadrolar', puan: 'Puan Durumu', rekabet: 'Rekabet', ozet: 'Özet' };
  var SEK = KIP === 'canli' ? ['anlatim', 'istatistik', 'kadrolar', 'puan', 'rekabet'] : KIP === 'bitti' ? ['ozet', 'kadrolar', 'puan', 'rekabet'] : ['kadrolar', 'rekabet', 'puan'];
  var sk = Math.max(0, SEK.indexOf(Q.get('sekme')));
  function puan(){ var t = SPOR.tablo('super-lig', m.evKod); t = t.replace(/<tr>(<td><span class="tk"><em>\d+<\/em><span class="ar">FB<\/span>)/, '<tr class="is-vurgu">$1');
    return '<div data-tablo>' + t + '</div><p class="k-not">' + K.I('fa-circle-info') + '<span>Süper Lig, 13 hafta sonunda · maç öncesi durum; ' + (KIP === 'bitti' ? 'maç sonucu işlenince güncellenir' : 'maç bitince güncellenir') + '</span></p>'; }
  function rekabet(){ return '<div style="padding-top:var(--b-16)">' + K.serit({ ikon: 'fa-circle-info', metin: 'Aralarındaki maçların listesi yok', alt: 'Karşılaşma geçmişi sitede tablo olarak yayımlanmıyor; özeti aşağıdaki haberde.' }) + '</div>' +
    '<div class="k-satirlar" style="margin:0 calc(-1 * var(--kenar))">' + K.satir(X[4]) + '</div>' + sonMaclar(m.ev) + sonMaclar(m.dep); }
  var anl = ANL.map(function(a, i){ return K.canliGiris({ saat: a[0], baslik: a[1], metin: a[2], kilit: !!a[3], yeni: i === 0 }); }).join('');
  var ist = '<div class="k-ayrac"><span>Goller</span><span>3</span></div>' + K.adimlar(GOL) +
    '<div class="k-ayrac"><span>İstatistikler</span><span>67. dakika itibarıyla</span></div>' + K.tablo({ sutunlar: ['İstatistik', m.evKod, m.depKod], satirlar: IST });
  var ozet = '<div class="k-ayrac"><span>Goller</span><span>3</span></div>' + K.adimlar(GOL) + '<div class="k-ayrac"><span>Maç Haberi</span><span>' + X[6].saat + '</span></div>' +
    '<div class="k-satirlar" style="margin:0 calc(-1 * var(--kenar))">' + K.satir(X[6]) + '</div>';
  var PANEL = { anlatim: anl, istatistik: ist, kadrolar: kadrolar(), puan: puan(), rekabet: rekabet(), ozet: ozet };
  var govde = '<div class="sp-yapis" style="margin-top:var(--b-12)">' + K.sekmeler(SEK.map(function(x){ return { metin: AD[x] }; }), sk) + '</div>' +
    SEK.map(function(x, i){ return '<div class="k-ic" data-panel="' + i + '"' + (i === sk ? '' : ' hidden') + '>' + PANEL[x] + '</div>'; }).join('') +
    (KIP === 'once' ? haberler(X.filter(function(h){ return !/çıktı$/.test(h.baslik); }), { baslik: 'Maç Öncesi', ikon: 'fa-futbol', sayi: 42 }) : haberler(X, { baslik: 'Maçla İlgili Haberler', ikon: 'fa-futbol', sayi: 42 }));

  var DUZ = DUR === 'hata' || DUR === 'bulunamadi' || (DUR === 'cevrimdisi' && Q.get('onbellek') === '0');
  if (DUR === 'yukleniyor') e.innerHTML = '<div class="k-ust-bosluk"></div><div class="k-ic" style="padding-top:var(--b-8)">' + K.iskelet('metin', 4) + '</div><div class="k-satirlar">' + K.iskelet('satir', 4) + '</div><div class="k-son"></div>';
  else if (DUZ) e.innerHTML = '<div class="k-ust-bosluk"></div>' + K.hata({ tur: DUR === 'bulunamadi' ? 'bulunamadi' : DUR === 'cevrimdisi' ? 'cevrimdisi' : (Q.get('hata') === 'zaman-asimi' ? 'zaman-asimi' : 'sunucu') }) + '<div class="k-son"></div>';
  else e.innerHTML = '<div class="k-ust-bosluk"></div>' + (DUR === 'yenileniyor' ? K.yenile(['cekiliyor', 'birak', 'bitti'].indexOf(HAL) > -1 ? HAL : 'yenileniyor') : '') + kutu + govde + '<div class="k-son"></div>';

  K.ustCubuk({ geri: true, baslik: DUR === 'bulunamadi' ? 'Maç' : m.ev + ' – ' + m.dep, eylemler: DUZ ? [] : ['paylas'] });
  K.altCubuk('bolum');
  K.oynatici();

  /* sekmeler yerinde değişir (kaydırma değil) */
  SPOR.tabloBagla(e.querySelector('[data-tablo]'), 'super-lig');
  e.addEventListener('click', function(ev){ var b = ev.target.closest('.sp-yapis .k-sekmeler button'); if (!b) return;
    var i = [].indexOf.call(b.parentNode.querySelectorAll('button'), b);
    e.querySelectorAll('[data-panel]').forEach(function(p){ p.hidden = +p.getAttribute('data-panel') !== i; }); });
  if (DUR === 'cevrimdisi' && !DUZ) {
    var bt = K.toast('Çevrimdışısın', { bant: true, eylem: 'Kaydedilenler', eylemFn: function(){ location.href = K.git('kaydedilenler'); } });
    bt.querySelector('button').classList.add('k-dk44');
  }
  document.addEventListener('click', function(ev){ var y = ev.target.closest('[data-yeniden]'); if (!y) return;
    y.classList.add('is-yukleniyor'); y.innerHTML = K.I('fa-circle-notch', 'fa-spin') + '<span>Deneniyor</span>';
    setTimeout(function(){ var q = new URLSearchParams(location.search); ['durum', 'hata', 'hal', 'onbellek'].forEach(function(x){ q.delete(x); }); location.search = q.toString(); }, 1200); });
})();
</script>
</body>
</html>

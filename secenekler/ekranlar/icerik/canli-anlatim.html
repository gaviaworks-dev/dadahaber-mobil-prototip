<!--
  CANLI ANLATIM (Dakika Dakika) · E-074–E-082 · kök: Detay.
  Detay kökünün iskeleti kit bileşenleriyle: kapak (.k-kapak.detay) + panel (.k-yaprak) + okuma çubuğu (K.okuma; hikâye modu yok).
  Sıra: Canlı kapsülü ve başlık → zaman satırı (başlangıç, güncelleme, gelişme sayısı) → açıklama → Dada Özet (AI etiketi) → Kilit Anlar rayı (dokununca girişe iner)
  → Dakika Dakika (Tümü · Kilit anlar; yeni üstte, sıçrama yok: yeni girişler "N yeni gelişme" hapıyla gelir) → konunun sayfası → kaynaklar → yorumlar → ilgili haberler.
  Parametreler: ?durum=yeni (2 yeni gelişme hapı; dokununca başa ve girişler eklenir) | kilit (yalnız kilit anlar) | bitti (sona erdi: özet başta, girişler eskiden yeniye)
    | yukleniyor | yenileniyor (&hal=cekiliyor|birak|bitti) | hata (&hata=zaman-asimi) | bulunamadi (&hata=kaldirildi) | cevrimdisi (&onbellek=0) · ?uye=0 · ?tema=koyu
  Veri (satır içinde): sürüyor = public dakika-dakika.html (Marmara'da kar), sona erdi = public dakika-dakika-zirve.html (Türkiye–AB). Görseller: kar-istanbul (kapak), metro (toplu taşıma videosu), bruksel (AB kapağı).
  Varsayımlar (onaylanmadı): "Dinle" süresi veride yok, yalnız "Dinle"; sona eren anlatımın 15.05 videosunun görseli kütüphanede yok, girişte görsel yok.
-->

    bas: '22 Kasım · 10.00', son: '17.40’ta kapandı', izlenme: '15,3 B',

  var A = DUR === 'bitti' ? BITTI : CANLI, YENI = DUR === 'yeni' ? 2 : 0, KILIT = DUR === 'kilit';

  function giris(x, yeni){
    var s = K.canliGiris({ saat: x.saat, baslik: x.baslik, metin: x.metin, g: x.g, kilit: x.kilit, yeni: yeni });

    return s.replace('<div class="k-cg', '<div id="g' + x.saat.replace('.', '') + '" class="k-cg');
  }
  function girisler(){
    var L = A.girisler.slice(YENI).filter(function(x){ return !KILIT || x.kilit; });

  }

  var hata = DUR === 'hata' ? (Q.get('hata') === 'zaman-asimi' ? 'zaman-asimi' : 'sunucu') : DUR === 'bulunamadi' ? (Q.get('hata') === 'kaldirildi' ? 'kaldirildi' : 'bulunamadi') : (DUR === 'cevrimdisi' && Q.get('onbellek') === '0') ? 'cevrimdisi' : '';
  if (hata) { e.innerHTML = '<div class="k-ust-bosluk"></div>' + K.hata({ tur: hata }) + '<div class="k-son yalin"></div>'; K.ustCubuk({ geri: true }); bagla(); return; }

  }
  function okumaAyar(){ var o = document.querySelector('.k-okuma'); if (!o) return;
    var h = o.querySelector('.hmd'); if (h) h.remove();
    o.querySelector('.dinle').innerHTML = K.I('fa-headphones') + 'Dinle';
    var y = o.querySelector('[data-yorumlara]'); y.setAttribute('aria-label', 'Yorumlar, ' + A.yorumlar.length); y.querySelector('.k-rozet').textContent = A.yorumlar.length;
    y.addEventListener('click', function(){ var s = document.getElementById('yorumlar'); if (s) e.scrollTo({ top: s.offsetTop - 120, behavior: 'smooth' }); }); }
  bagla();
  function bagla(){ document.addEventListener('click', function(ev){ var y = ev.target.closest('[data-yeniden]'); if (!y) return;
    y.classList.add('is-yukleniyor'); y.innerHTML = K.I('fa-circle-notch', 'fa-spin') + '<span>Deneniyor</span>';
    setTimeout(function(){ var q = new URLSearchParams(location.search); ['durum', 'hata', 'hal', 'onbellek'].forEach(function(x){ q.delete(x); }); location.search = q.toString(); }, 1200); }); }
})();
</script>

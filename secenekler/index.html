<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dada Haber Mobil Kök Ekranlar</title>
<link rel="stylesheet" href="../assets/vendor/fontawesome-6.5.2/css/all.min.css">
<style>
/* Seçenek sayfası (TEK YAZAR: lider). K5: yalnız kod + ad, telefon, referans şeridi, tek cümle tavsiye. Üstte bölüm sekmeleri (Beyar). */
@font-face{font-family:"Gilroy";src:url("../assets/font/gilroy/Gilroy-Medium.woff2") format("woff2");font-weight:400 600;font-display:swap}
@font-face{font-family:"Gilroy";src:url("../assets/font/gilroy/Gilroy-ExtraBold.woff2") format("woff2");font-weight:700 800;font-display:swap}
:root{--marka:#FECC17;--marka-metin:#7A620B;--metin:#121212;--metin-2:#494949;--metin-3:#6B6B6B;--cizgi:#E4E4E2;--zemin:#F4F4F2;--yuzey:#fff;
  --yazi:"Gilroy",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--yazi);background:var(--zemin);color:var(--metin);-webkit-font-smoothing:antialiased;line-height:1.5}
.ust{position:sticky;top:0;z-index:10;background:rgba(244,244,242,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--cizgi)}
.ust-ic{max-width:1840px;margin:0 auto;padding:12px max(24px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{height:28px;aspect-ratio:2.97;background:url("../assets/gorsel/logo/dada.svg") center/contain no-repeat;flex:none}
.sekmeler{display:flex;gap:4px;background:#fff;border:1px solid var(--cizgi);border-radius:14px;padding:4px}
.sekmeler a{font-size:14px;font-weight:700;padding:9px 16px;border-radius:10px;color:var(--metin-2);text-decoration:none;white-space:nowrap;min-height:40px;display:inline-flex;align-items:center;gap:8px}
.sekmeler a span{font-size:11px;font-weight:800;color:var(--metin-3);background:var(--zemin);border-radius:6px;padding:1px 6px}
.sekmeler a[aria-current="page"]{background:var(--metin);color:#fff}
.sekmeler a[aria-current="page"] span{background:var(--marka);color:#121212}
.tema{margin-left:auto;display:flex;background:#fff;border:1px solid var(--cizgi);border-radius:12px;padding:4px;gap:4px}
.tema button{font:inherit;font-size:13px;font-weight:700;border:0;background:none;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--metin-2);min-height:36px}
.tema button[aria-pressed="true"]{background:var(--metin);color:#fff}
main{max-width:1840px;margin:0 auto;padding:32px max(24px,env(safe-area-inset-left,0px)) 64px}
.izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:48px 32px}
body.yan .izgara{grid-template-columns:repeat(auto-fill,minmax(860px,1fr))}
.alt-k{display:flex;flex-direction:column;gap:14px;min-width:0}
.alt-k header{display:flex;align-items:baseline;gap:10px}
.kod{font-size:12px;font-weight:800;letter-spacing:.06em;background:var(--marka);color:#121212;border-radius:8px;padding:4px 8px}
.alt-k h2{font-size:19px;font-weight:800;letter-spacing:-.01em}
.telefonlar{display:flex;gap:40px 24px;flex-wrap:wrap}
.tel{width:398px;height:852px;border-radius:56px;padding:4px;background:#111;flex:0 0 auto;position:relative;
  box-shadow:0 0 0 1.5px #b9b9bd,0 0 0 2.5px #e4e4e6,0 24px 48px -12px rgba(0,0,0,.22),0 8px 16px -8px rgba(0,0,0,.12)}
.tel::before,.tel::after{content:"";position:absolute;width:3px;border-radius:2px;background:linear-gradient(90deg,#c9c9cd,#a6a6ab)}
.tel::before{left:-5px;top:180px;height:56px;box-shadow:0 72px 0 #b5b5ba}
.tel::after{right:-5px;top:230px;height:88px}
.tel iframe{width:390px;height:844px;border:0;border-radius:52px;display:block;background:#fff}
.tel.koyu{display:none}
body.koyu .tel.acik{display:none} body.koyu .tel.koyu{display:block} body.yan .tel.koyu{display:block}
.ref{display:flex;align-items:center;gap:12px;max-width:398px}
body.yan .ref{max-width:820px}
.ref-bas{flex:0 0 auto;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--marka-metin)}
.ref-serit{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;min-width:0;padding:2px 0;
  -webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.ref-serit::-webkit-scrollbar{display:none}
.ref-serit span{flex:0 0 auto;scroll-snap-align:start;font-size:13px;font-weight:700;background:var(--yuzey);border:1px solid var(--cizgi);border-radius:10px;padding:7px 12px;white-space:nowrap}
.tavsiye{margin-top:56px;background:#121212;color:#fff;border-radius:24px;padding:28px 32px;max-width:1100px;position:relative;overflow:hidden}
.tavsiye::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--marka)}
.tavsiye h2{font-size:22px;letter-spacing:-.01em}
.tavsiye .eyb{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--marka);margin-bottom:6px}
.tavsiye p{color:rgba(255,255,255,.82);font-size:15px}
a:focus-visible,button:focus-visible{outline:2px solid var(--marka-metin);outline-offset:2px}
.izgara{grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr))}
/* Hibrit: ekran seçici; dört hibrit tek satırda (telefonlar sığacak kadar küçülür) */
.ekr{display:none;gap:4px;margin:0 0 24px;background:#fff;border:1px solid var(--cizgi);border-radius:12px;padding:4px;width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
.ekr::-webkit-scrollbar{display:none}
body.alt-ekr .ekr{display:flex}
.ekr a{font-size:13.5px;font-weight:700;padding:8px 14px;border-radius:8px;color:var(--metin-2);text-decoration:none;white-space:nowrap;min-height:36px;display:inline-flex;align-items:center}
.ekr a[aria-current="page"]{background:var(--marka);color:#121212}
body.dort .izgara{grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 24px}
body.dort .ref{max-width:none}
.tel{zoom:var(--olcek,1)}
@media (max-width:860px){
  .ust-ic{padding:10px max(16px,env(safe-area-inset-left,0px));gap:10px}
  .logo{height:22px}
  .sekmeler{order:3;width:100%;overflow-x:auto;scrollbar-width:none}
  .sekmeler::-webkit-scrollbar{display:none}
  .sekmeler a{padding:8px 12px;font-size:13.5px}
  .tema button{padding:6px 10px;font-size:12.5px}
  main{padding:20px max(16px,env(safe-area-inset-left,0px)) 48px}
  .izgara,body.yan .izgara{grid-template-columns:1fr;gap:36px}
  .telefonlar{justify-content:center}
  .alt-k header,.ref{max-width:none}
  .tavsiye{padding:22px 20px;margin-top:40px}
}
</style>
</head>
<body>
<div class="ust"><div class="ust-ic">
  <span class="logo" role="img" aria-label="Dada Haber"></span>
  <nav class="sekmeler" id="sekmeler" aria-label="Kök ekranlar"></nav>
  <div class="tema" role="group" aria-label="Tema">
    <button type="button" data-k="acik" aria-pressed="true">Açık</button>
    <button type="button" data-k="koyu" aria-pressed="false">Koyu</button>
    <button type="button" data-k="yan" aria-pressed="false">Yan yana</button>
  </div>
</div></div>
<main>
  <nav class="ekr" id="ekr" aria-label="Ekran"></nav>
  <div class="izgara" id="izgara"></div>
  <section class="tavsiye" id="tavsiye"></section>
</main>
<script src="ana-sayfa/notlar.js"></script>
<script src="alt-gezinme/notlar.js"></script>
<script src="liste/notlar.js"></script>
<script src="detay/notlar.js"></script>
<script src="hikaye/notlar.js"></script>
<script src="hibrit/notlar.js"></script>
<script>
var SIRA = ['hibrit', 'ana-sayfa', 'hikaye', 'alt-gezinme', 'liste', 'detay'];
var simdiK = 'hibrit', simdiE = 'ana';
function refAdlari(ref){
  var adlar = [];
  ref.forEach(function(r){
    var m = r.match(/<b>(.*?):?<\/b>/); if (!m) return;
    m[1].replace(/:$/, '').replace(/\s*\(.*?\)\s*/g, ' ').split(/,\s*/).forEach(function(x){ x = x.trim(); if (x && adlar.indexOf(x) < 0) adlar.push(x); });
  });
  return adlar;
}
function ciz(k, ek){
  var s = SEC[k]; if (!s) return;
  simdiK = k;
  document.querySelectorAll('#sekmeler a').forEach(function(a){ if (a.dataset.k === k) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  /* Hibrit: ekran seçici (Ana Sayfa · Liste · Detay · Akış ve Hikâye Modu) */
  var liste = s.alt;
  document.body.classList.toggle('alt-ekr', !!s.ekranlar);
  if (s.ekranlar) {
    ek = s.ekranlar.some(function(x){ return x[0] === ek; }) ? ek : s.ekranlar[0][0]; simdiE = ek;
    document.getElementById('ekr').innerHTML = s.ekranlar.map(function(x){ return '<a href="#' + k + '/' + x[0] + '"' + (x[0] === ek ? ' aria-current="page"' : '') + '>' + x[1] + '</a>'; }).join('');
    liste = ek === 'ortak' ? s.ortak : s.alt.map(function(a){ return { kod: a.kod, ad: a.ad, dosya: a.ekran[ek], ref: a.ref }; });
  }
  dort();
  document.getElementById('izgara').innerHTML = liste.map(function(a){
    var src = s.klasor + '/' + a.dosya;
    return '<article class="alt-k" id="' + a.kod.toLowerCase() + '">' +
      '<header><span class="kod">' + a.kod + '</span><h2>' + a.ad + '</h2></header>' +
      '<div class="telefonlar">' +
        '<div class="tel acik"><iframe loading="lazy" title="' + a.kod + ' açık" src="' + src + '"></iframe></div>' +
        '<div class="tel koyu"><iframe loading="lazy" title="' + a.kod + ' koyu" src="' + src + (src.indexOf('?') < 0 ? '?' : '&') + 'tema=koyu"></iframe></div>' +
      '</div>' +
      '<div class="ref"><span class="ref-bas">Referanslar</span><div class="ref-serit">' + refAdlari(a.ref).map(function(r){ return '<span>' + r + '</span>'; }).join('') + '</div></div>' +
      '</article>';
  }).join('');
  document.getElementById('tavsiye').innerHTML = s.tavsiye;
  if (window.olcek) olcek();
  window.scrollTo(0, 0);
}
document.getElementById('sekmeler').innerHTML = SIRA.filter(function(k){ return SEC[k]; }).map(function(k){
  return '<a href="#' + k + '" data-k="' + k + '">' + SEC[k].ad + '<span>' + SEC[k].alt.length + '</span></a>';
}).join('');
function yol(){ var p = (location.hash || '').slice(1).split('/'), k = p[0]; ciz(SEC[k] ? k : 'hibrit', p[1]); }
addEventListener('hashchange', yol);
/* dört hibrit yan yana: geniş ekranda tek satıra sığacak kadar küçült (Yan yana kipinde ve telefonda olağan düzen) */
function dort(){ var w = document.documentElement.clientWidth; document.body.classList.toggle('dort', !!SEC[simdiK].ekranlar && !document.body.classList.contains('yan') && w > 860 && (SEC[simdiK].ekranlar ? 4 : 0) === 4); }
function olcek(){
  var cw = Math.min(document.documentElement.clientWidth, innerWidth), w = cw - 32, o = Math.min(1, w / 406);
  if (document.body.classList.contains('dort')) { var m = document.querySelector('main'), ic = Math.min(1840, cw) - 48; o = Math.min(1, ((ic - 3 * 24) / 4) / 406); }
  document.documentElement.style.setProperty('--olcek', o.toFixed(3));
}
addEventListener('resize', function(){ dort(); olcek(); });
yol(); olcek();
document.querySelectorAll('.tema button').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('.tema button').forEach(function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    document.body.classList.remove('koyu', 'yan');
    if (b.dataset.k !== 'acik') document.body.classList.add(b.dataset.k);
    dort(); olcek();
  });
});
</script>
</body>
</html>

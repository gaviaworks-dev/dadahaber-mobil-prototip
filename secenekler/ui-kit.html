<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dada Haber · UI Kit</title>
<!--
  UI KIT VİTRİNİ (TEK YAZAR: kit yazarı). Her bileşen, her hali, 390 px genişlikte panellerde; açık · koyu · yan yana.
  Bileşenler kökten çıkarıldı (hibrit/kok, liste, detay, akis); stiller secenekler/kit/kit.css, kurucular secenekler/kit/kit.js.
  Sorgu: ?tema=koyu · ?gomulu=1 (yan yana çerçevesi içi) · ?bolum=<id> (yalnız o bölüm, denetim için) · ?uye=0 (misafir halleriyle).
  İçerik yalnız window.D; puan durumu örneği public sözlükten (araclar/ornek_veri.json › puan_tablosu, ilk altı takım).
-->
<link rel="stylesheet" href="_ortak/cerceve.css">
<link rel="stylesheet" href="_ortak/marka.css">
<link rel="stylesheet" href="kit/kit.css">
<script src="_ortak/icerik.js"></script>
<script src="_ortak/cerceve.js"></script>
<script src="_ortak/icerik-ek.js"></script>
<script src="kit/kit.js"></script>
<style>
/* vitrin sayfası (uygulama ekranı değil): masaüstü genişliğinde; değerler yine marka değişkenleri */
html,body{width:auto;height:auto;overflow:visible}
body{background:var(--zemin-2);color:var(--metin);overflow-x:hidden}
body>.dc,body>.ec{display:none}
.v-ust{position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:16px;height:64px;padding:0 24px;background:var(--zemin);border-bottom:1px solid var(--cizgi)}
.v-ust .logo{height:24px}
.v-ust h1{font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.v-ust .say{display:inline-flex;align-items:center;gap:var(--ikon-bosluk);height:32px;padding:0 12px;border-radius:var(--k-ic);background:var(--marka);color:var(--siyah);font-size:13px;font-weight:var(--y-kalin);white-space:nowrap}
.v-ust .tema{margin-left:auto;width:280px}
.v-gov{display:grid;grid-template-columns:232px minmax(0,1fr)}
.v-nav{position:sticky;top:64px;align-self:start;height:calc(100vh - 64px);overflow-y:auto;padding:16px 12px 40px;border-right:1px solid var(--cizgi);background:var(--zemin)}
.v-nav a{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 10px;border-radius:var(--k-ic);font-size:14px;color:var(--metin-2)}
.v-nav a i{width:16px;text-align:center;font-size:12px;color:var(--marka-metin)}
.v-nav a.on{background:var(--marka-25);color:var(--metin);font-weight:var(--y-kalin)}
.v-nav a small{margin-left:auto;font-size:11.5px;color:var(--metin-3)}
.v-nav .g{display:block;margin:16px 10px 4px;font-size:11px;font-weight:var(--y-kalin);letter-spacing:.12em;text-transform:uppercase;color:var(--metin-3)}
main{padding:8px 32px 120px;min-width:0}
.v-b{padding-top:40px;scroll-margin-top:64px}
.v-b>h2{font-size:30px;letter-spacing:-.025em;display:flex;align-items:center;gap:12px}
.v-b>h2 .bi{width:36px;height:36px;border-radius:var(--k-ic);display:grid;place-items:center;background:var(--marka);color:var(--siyah);font-size:15px}
.v-b>p{margin-top:8px;max-width:820px;font-size:15px;line-height:1.55;color:var(--metin-2)}
.v-bl{margin-top:28px}
.v-bl>h3{font-size:18px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.v-bl>h3 code{font-size:12.5px;font-weight:var(--y-orta);color:var(--metin-3)}
.v-bl>p{margin-top:4px;max-width:820px;font-size:13.5px;line-height:1.5;color:var(--metin-3)}
.v-iz{margin-top:14px;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.v-p{margin:0;width:390px;flex:none}
.v-p figcaption{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;font-weight:var(--y-kalin);color:var(--metin-3);letter-spacing:.02em}
.v-p figcaption::before{content:"";width:8px;height:8px;border-radius:var(--k-daire);background:var(--marka)}
.v-tel{position:relative;width:390px;overflow:hidden;background:var(--zemin);border:1px solid var(--cizgi);border-radius:var(--k-kart);isolation:isolate}
.v-tel.pad{padding:16px var(--kenar)}
.v-tel.pady{padding:16px 0}
.v-tel.ton{background:var(--zemin-2);--k-yuzey:var(--yuzey)}
.v-tel.siyah{background:#000}
.v-tel .ekran{position:absolute;inset:0}
.v-genis{width:100%;max-width:1220px}
.v-kod{margin-top:12px;padding:16px 18px;border-radius:var(--k-kontrol);background:var(--k-koyu);color:#E8E8E6;font:13px/1.6 ui-monospace,"SF Mono",Menlo,monospace;white-space:pre;overflow-x:auto;max-width:1000px}
.v-kod b{color:var(--marka);font-weight:var(--y-orta)}
.v-kart{padding:18px;border-radius:var(--k-kart);background:var(--zemin);border:1px solid var(--cizgi)}
.v-sz{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:14px;max-width:1220px}
.v-sz .v-kart b{display:flex;align-items:center;gap:var(--ikon-bosluk);font-size:15px}
.v-sz .v-kart b i{color:var(--marka-metin)}
.v-sz .v-kart p{margin-top:6px;font-size:13.5px;line-height:1.5;color:var(--metin-2)}
.v-renk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px;max-width:1220px}
.v-renk div{border-radius:var(--k-kontrol);overflow:hidden;background:var(--zemin);border:1px solid var(--cizgi)}
.v-renk span{display:block;height:64px}
.v-renk b{display:block;padding:8px 10px 0;font-size:12.5px}
.v-renk small{display:block;padding:0 10px 8px;font-size:11.5px;color:var(--metin-3);font-family:ui-monospace,Menlo,monospace}
.v-tablo{width:100%;max-width:1220px;border-collapse:collapse;margin-top:14px;background:var(--zemin);border-radius:var(--k-kart);overflow:hidden;font-size:13.5px}
.v-tablo th,.v-tablo td{padding:9px 14px;text-align:left;border-bottom:1px solid var(--cizgi);vertical-align:middle}
.v-tablo th{font-size:12px;color:var(--metin-3);background:var(--yuzey-2)}
.v-tablo td i{width:22px;text-align:center;font-size:16px}
.v-tablo code{font-size:12px;color:var(--metin-2)}
.v-ikon{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;margin-top:14px;max-width:1220px}
.v-ikon div{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;padding:8px 12px;border-radius:var(--k-ic);background:var(--zemin);border:1px solid var(--cizgi)}
.v-ikon div.kontrol{border-style:dashed}
.v-ikon i{font-size:17px;text-align:center}
.v-ikon b{display:block;font-size:13px}
.v-ikon code{display:block;font-size:11px;color:var(--metin-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-olcek{display:grid;gap:2px;margin-top:14px;max-width:1220px;background:var(--zemin);border:1px solid var(--cizgi);border-radius:var(--k-kart);overflow:hidden}
.v-olcek div{display:grid;grid-template-columns:200px 120px minmax(0,1fr);gap:16px;align-items:baseline;padding:12px 18px;border-bottom:1px solid var(--cizgi)}
.v-olcek small{font-size:12px;color:var(--metin-3)}
.v-olcek code{font-size:12px;color:var(--metin-2)}
.v-kose{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px}
.v-kose div{width:180px;padding:14px;background:var(--zemin);border:1px solid var(--cizgi);border-radius:var(--k-kontrol)}
.v-kose span{display:block;height:72px;background:var(--marka-25);border:2px solid var(--marka)}
.v-kose b{display:block;margin-top:10px;font-size:13.5px}
.v-kose small{display:block;font-size:12px;line-height:1.4;color:var(--metin-3)}
.v-bosluk{display:grid;gap:8px;margin-top:14px;max-width:700px}
.v-bosluk div{display:grid;grid-template-columns:70px 120px minmax(0,1fr);gap:12px;align-items:center;font-size:13px}
.v-bosluk span{height:14px;background:var(--marka);border-radius:var(--k-ic)}
.v-bosluk small{color:var(--metin-3)}
.v-yan{display:none;grid-template-columns:1fr 1fr;gap:0;height:calc(100vh - 64px)}
.v-yan iframe{width:100%;height:100%;border:0;background:var(--zemin-2)}
.v-yan iframe+iframe{border-left:1px solid var(--cizgi)}
body.yan .v-gov{display:none}
body.yan .v-yan{display:grid}
html.gomulu .v-ust,html.gomulu .v-nav{display:none}
html.gomulu .v-gov{grid-template-columns:minmax(0,1fr)}
html.gomulu main{padding:0 20px 80px}
.v-p .v-yatay{width:390px;height:180px;overflow:hidden;border-radius:var(--k-kart);border:1px solid var(--cizgi);background:#000}
.v-p .v-yatay .k-video{transform:scale(.4621);transform-origin:0 0}
@media (max-width:900px){.v-gov{grid-template-columns:1fr}.v-nav{display:none}main{padding:8px 16px 80px}.v-ust .tema{width:200px}.v-ust h1{display:none}}
</style>
</head>
<body>
<header class="v-ust">
  <span class="logo" role="img" aria-label="Dada Haber"></span>
  <h1>UI Kit · Mobil uygulama</h1>
  <span class="say" id="say"><i class="fa-solid fa-shapes"></i><span></span></span>

<div class="v-gov"><nav class="v-nav" id="nav" aria-label="Bölümler"></nav><main id="ic"></main></div>

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>Hibrit · Akış</title>
<link rel="stylesheet" href="../_ortak/cerceve.css">
<link rel="stylesheet" href="../_ortak/marka.css">
<link rel="stylesheet" href="../kit/kit.css">
<link rel="stylesheet" href="hibrit.css">
<script src="../_ortak/icerik.js"></script>
<script src="../_ortak/cerceve.js"></script>
<script src="../_ortak/icerik-ek.js"></script>
<script src="../kit/kit.js"></script>
<script src="hibrit.js"></script>
<style>
/* Akış sekmesi = dikey kısa video akışı (AS-D destesi): tam ekran video, yukarı kaydırınca sıradaki video. Kartta kaydet ve paylaş yok (Beyar).
   "Habere git" düğmesi yok (K23); habere geçiş başlığa dokunarak (varsayım, onaylanmadı). Akış ≠ hikâye: hikâye ana sayfadaki kategori daireleri.
   Bütün hibritlerde aynı. Akış videoları sesli olduğu için Spiker burada duraklar; mini oynatıcı gösterilmez. */
.ekran{scroll-snap-type:y mandatory;background:#000}
html.tam .ekran{scroll-snap-type:none}
.ust-a{position:absolute;left:0;right:0;top:var(--ust-guvenli);z-index:70;height:52px;padding:0 var(--kenar);display:flex;align-items:center;gap:10px;color:#fff;pointer-events:none}
.ust-a>*{pointer-events:auto}
.ust-a h1{font-size:22px;letter-spacing:-.02em}
.ust-a small{font-size:13px;color:rgba(255,255,255,.75);white-space:nowrap}
.ust-a .ses{margin-left:auto;width:44px;height:44px;border-radius:var(--k-daire);display:grid;place-items:center;font-size:16px;background:var(--cam);border:1px solid var(--cam-cizgi);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff}
.ust-a::before{content:"";position:absolute;left:0;right:0;top:calc(-1 * var(--ust-guvenli));height:calc(var(--ust-guvenli) + 110px);background:linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,0));z-index:-1;pointer-events:none}
.kart{position:relative;height:844px;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;color:#fff}
.kart>.gr{position:absolute;inset:0}
.kart::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.72) 68%,rgba(0,0,0,.92) 100%)}
.kart-ic{position:absolute;left:0;right:0;bottom:calc(var(--ac-h) + 22px);z-index:2;padding:0 56px 0 var(--kenar)}
.cip{display:inline-flex;align-items:center;gap:var(--ikon-bosluk);height:30px;padding:0 10px;border-radius:var(--k-ic);background:var(--cam);border:1px solid var(--cam-cizgi);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-size:12.5px;font-weight:var(--y-kalin);white-space:nowrap}
.cip i{color:var(--marka);font-size:11px}
.kart h2{margin-top:12px;font-size:26px;line-height:1.14;letter-spacing:-.02em;text-wrap:pretty}
.kart h2 a{display:block;min-height:44px}
.kart h2 a i{font-size:15px;margin-left:var(--ikon-bosluk);color:rgba(255,255,255,.7);vertical-align:2px}
.meta.meta-a{margin-top:12px;font-size:13px;color:rgba(255,255,255,.78)}
.meta-a i{color:var(--marka);font-size:11px}
.oy{position:absolute;left:var(--kenar);right:var(--kenar);bottom:calc(var(--ac-h) + 8px);z-index:3;height:3px;border-radius:var(--k-cubuk);background:rgba(255,255,255,.25);overflow:hidden}
.oy i{display:block;height:100%;width:38%;background:var(--marka)}
.sira{position:absolute;right:16px;top:calc(var(--ust-guvenli) + 64px);z-index:3;display:flex;flex-direction:column;gap:5px;align-items:center}
.sira i{display:block;width:4px;height:16px;border-radius:var(--k-cubuk);background:rgba(255,255,255,.35)}
.sira i.ok{background:var(--marka);height:26px}
.sira b{margin-top:4px;font-size:11px;letter-spacing:.04em}
/* yükleniyor kartı */
.yuk{position:relative;height:844px;scroll-snap-align:start;background:#141414;display:flex;flex-direction:column;justify-content:flex-end;padding:0 var(--kenar) calc(var(--ac-h) + 22px)}
.yuk i{display:block;border-radius:var(--k-ic);background:linear-gradient(90deg,#1E1E22 30%,#2A2A2E 50%,#1E1E22 70%);background-size:300% 100%;animation:pari 1.4s linear infinite}
.yuk .a{width:110px;height:30px}.yuk .b{height:26px;margin-top:14px}.yuk .c{height:26px;width:70%;margin-top:10px}
.yuk p{position:absolute;left:0;right:0;top:46%;text-align:center;font-size:14px;color:rgba(255,255,255,.6)}
@keyframes pari{from{background-position:100% 0}to{background-position:-100% 0}}
</style>
</head>
<body data-durum="acik" data-ec="acik">
<div class="ust-a"><h1>Akış</h1><small id="say"></small><button class="ses" type="button" aria-label="Sesi aç"><i class="fa-solid fa-volume-xmark"></i></button></div>
<main class="ekran" id="ekran" aria-label="Akış videoları"></main>
<script>
(function(){
  var A = D.akis, L = A.liste;
  document.title = 'Akış · ' + H.cfg.kod;
  document.getElementById('say').textContent = 'Günün ' + A.toplam + ' videosu';
  document.getElementById('ekran').innerHTML = L.map(function(v, i){
    var s = L.map(function(_, j){ return '<i class="' + (j === i ? 'ok' : '') + '"></i>'; }).join('');
    return '<article class="kart"><div class="gr" data-g="' + v.g + '"></div><div class="sira" aria-hidden="true">' + s + '<b class="tnum">' + (i + 1) + ' / ' + A.toplam + '</b></div>' +
      '<div class="kart-ic"><span class="cip"><i class="fa-solid ' + H.ikon(v.kat) + '"></i>' + v.kat + '</span><h2><a href="' + H.detay() + '">' + v.baslik + '<i class="fa-solid fa-chevron-right" aria-hidden="true"></i></a></h2>' +
      H.meta([H.vid(v.sure), v.izlenme], 'meta-a') +
      '</div><div class="oy"><i style="width:' + (i === 0 ? 38 : 0) + '%"></i></div></article>';
  }).join('') + '<section class="yuk" aria-label="Yükleniyor"><p>Sıradaki videolar yükleniyor</p><i class="a"></i><i class="b"></i><i class="c"></i></section>';
  /* ---------- haller (yayılım 1. dalga; yalnız kit bileşenleri; kit Akış kartının katmanları kökün kartına eklenir) ----------
     ?ses=1 · ?dur=1 · ?altyazi=1 · ?durum=mobil-veri|bitti|yukleniyor|daha-fazla|hata|cevrimdisi · ?calan=1 ile birlikte ?ses=1 Spiker'ın durduğunu gösterir */
  var Q = new URLSearchParams(location.search), DUR = K.durum, e = document.getElementById('ekran'), ses = document.querySelector('.ust-a .ses');
  var ilk = e.querySelector('.kart'), I = K.I, tam = document.documentElement.classList.contains('tam');
  function ort(html){ var o = ilk.querySelector('.k-akis-ort'); if (o) o.remove(); if (html) ilk.insertAdjacentHTML('beforeend', '<div class="k-akis-ort">' + html + '</div>'); }
  /* tek oynatıcı kuralı: Akış sesi açılınca Spiker duraklar (hibrit.js ve kit.js ile aynı oturum kaydı "dada-spiker") */
  function spikerDuraklat(){ try { var s = JSON.parse(sessionStorage.getItem('dada-spiker') || 'null');
    if (!s && Q.get('calan') === '1') s = { bas: Date.now() - 52000, dur: null };
    if (s && s.dur == null) { sessionStorage.setItem('dada-spiker', JSON.stringify({ bas: s.bas, dur: Date.now() - s.bas })); return true; } } catch (x) {} return false; }
  function sesAyarla(on){ ses.setAttribute('aria-label', on ? 'Sesi kapat' : 'Sesi aç'); ses.setAttribute('aria-pressed', on); ses.innerHTML = I(on ? 'fa-volume-high' : 'fa-volume-xmark');
    if (on && spikerDuraklat()) K.toast('Dada Spiker duraklatıldı', { ikon: 'fa-headphones' }).style.bottom = ''; }
  ses.addEventListener('click', function(){ sesAyarla(ses.getAttribute('aria-pressed') !== 'true'); });
  /* dokununca durur / sürer (bağlantı ve düğmeler kendi işini yapar) */
  e.addEventListener('click', function(ev){ var k = ev.target.closest('.kart'); if (!k || ev.target.closest('a,button') || DUR) return;
    var o = k.querySelector('.k-akis-ort'); if (o) o.remove(); else k.insertAdjacentHTML('beforeend', '<div class="k-akis-ort"><span class="k-ikon cam">' + I('fa-play') + '</span></div>'); });
  if (Q.get('ses') === '1') sesAyarla(true);
  if (Q.get('dur') === '1') ort('<span class="k-ikon cam">' + I('fa-play') + '</span>');
  if (Q.get('altyazi') === '1') ilk.querySelector('.kart-ic').insertAdjacentHTML('beforeend', '<p class="k-akis-alt">' + L[0].baslik + '</p>');
  if (DUR === 'mobil-veri') { ort('<button type="button" class="k-ikon sari" aria-label="Oynat">' + I('fa-play') + '</button>Dokun, oynat<small>Mobil veride videolar kendiliğinden oynamaz.</small>'); ilk.querySelector('.oy i').style.width = '0'; }
  if (DUR === 'hata') ort('<span class="k-ikon cam">' + I('fa-triangle-exclamation') + '</span>Video oynatılamadı<small>Yukarı kaydır, sıradakine geç.</small>');
  if (DUR === 'bitti') { e.querySelector('.yuk').outerHTML = K.akisBitti().replace('<section class="k-akis-bitti"', '<section class="k-akis-bitti" style="scroll-snap-align:start"'); if (!tam) e.scrollTop = e.scrollHeight; }
  if (DUR === 'daha-fazla' && !tam) e.scrollTop = e.scrollHeight;
  if (DUR === 'yukleniyor') e.innerHTML = K.iskelet('akis');
  if (DUR === 'cevrimdisi') {
    /* Akış çevrimdışı çalışmaz: düz kabuk, kit hata şablonu */
    document.querySelector('.ust-a').style.display = 'none'; document.body.removeAttribute('data-durum');
    e.style.background = 'var(--zemin)';
    e.innerHTML = '<div class="k-ust-bosluk"></div>' + K.bos({ hata: true, ikon: 'fa-plug-circle-xmark', baslik: 'Akış çevrimdışı çalışmaz', aciklama: 'Videolar için bağlantı gerekiyor. Bu arada indirdiğin haberleri okuyabilirsin.',
      eylem: { metin: 'Kaydedilenlere git', ikon: 'fa-bookmark', href: 'kaydedilenler' }, ikinci: { metin: 'Yeniden dene', attr: 'data-yeniden' } });
    K.ustCubuk({ baslik: 'Akış' });
  }
  document.addEventListener('click', function(ev){ var y = ev.target.closest('[data-yeniden]'); if (!y) return;
    y.classList.add('is-yukleniyor'); y.innerHTML = I('fa-circle-notch', 'fa-spin') + '<span>Deneniyor</span>';
    setTimeout(function(){ var q = new URLSearchParams(location.search); q.delete('durum'); location.search = q.toString(); }, 1200); });
  H.altCubuk('akis', DUR !== 'cevrimdisi');
})();
</script>
</body>
</html>

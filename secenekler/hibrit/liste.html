<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>Hibrit · Liste</title>
<link rel="stylesheet" href="../_ortak/cerceve.css">
<link rel="stylesheet" href="../_ortak/marka.css">
<link rel="stylesheet" href="../_ortak/hikaye.css">
<link rel="stylesheet" href="hibrit.css">
<script src="../_ortak/icerik.js"></script>
<script src="../_ortak/cerceve.js"></script>
<script src="../_ortak/icerik-ek.js"></script>
<script src="hibrit.js"></script>
<style>
/* Liste: LS-A daralan büyük başlık + birden fazla öne çıkan + Liste ↔ Çizelge (LS-C) + "Gelişen Olaylar" bloğu (LS-D) + hikâye şeridi.
   Yer ve ağırlık HB[n].liste'den. ?kip=cizelge çizelgede açar; ?dar=1 başlık daralmış halde açar. */
:root{--cam-z:rgba(255,255,255,.86)}
html[data-tema="koyu"]{--cam-z:rgba(14,14,16,.86)}
/* daralan üst çubuk */
.cb{position:absolute;left:0;right:0;top:0;z-index:70;height:calc(var(--ust-guvenli) + 48px);padding:var(--ust-guvenli) 8px 0;display:flex;align-items:center;border-bottom:1px solid transparent;transition:background .2s,border-color .2s}
.dar .cb{background:var(--cam-z);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border-bottom-color:var(--cizgi)}
.geri{height:44px;display:inline-flex;align-items:center;gap:6px;padding:0 8px;color:var(--marka-metin);font-size:16px}
.geri i{font-size:18px}
.cb .orta{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;font-size:16.5px;font-weight:var(--y-kalin);opacity:0;transition:opacity .2s}
.dar .cb .orta{opacity:1}
.cb .sag{margin-left:auto;display:flex}
/* büyük başlık */
.tepe{padding-top:calc(var(--ust-guvenli) + 46px)}
.tepe .hk{padding-bottom:6px}
.buyuk{padding:calc(var(--ust-guvenli) + 52px) var(--kenar) 4px}
.tepe+.buyuk{padding-top:10px}
.buyuk .eb{display:inline-flex;align-items:center;gap:var(--ikon-bosluk);font-size:12px;font-weight:var(--y-kalin);letter-spacing:.12em;text-transform:uppercase;color:var(--marka-metin)}
.buyuk h1{font-size:40px;line-height:1;font-weight:var(--y-kalin);letter-spacing:-.03em;margin-top:8px}
.buyuk p{margin-top:8px;font-size:14.5px;color:var(--metin-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk{margin-top:14px;display:flex;gap:8px}
.tk button{height:40px;padding:0 16px;border-radius:var(--k-kontrol);font-size:14px;font-weight:var(--y-kalin);display:inline-flex;align-items:center;gap:var(--ikon-bosluk)}
.tk .t1{background:var(--metin);color:var(--zemin)}
.tk .t2{background:var(--zemin-2)}
.hk-ust{padding-top:10px}
/* yapışkan çip satırı + Liste/Çizelge anahtarı */
.cr{position:sticky;top:calc(var(--ust-guvenli) + 48px);z-index:60;background:var(--zemin);display:flex;align-items:center;border-bottom:1px solid var(--cizgi);margin-top:10px}
.dar .cr{background:var(--cam-z);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.cr .ks{flex:1;min-width:0;gap:8px;padding:10px 8px 10px var(--kenar);-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.cp{height:36px;padding:0 14px;border-radius:var(--k-kontrol);border:1px solid var(--cizgi);font-size:14px;color:var(--metin-2);display:inline-flex;align-items:center;white-space:nowrap}
.cp.etkin{background:var(--marka);border-color:var(--marka);color:var(--siyah);font-weight:var(--y-kalin)}
.gc{flex:none;display:flex;padding:4px;margin-right:var(--kenar);border-radius:var(--k-kontrol);background:var(--zemin-2)}
.gc button{width:40px;height:36px;border-radius:var(--k-ic);display:grid;place-items:center;font-size:15px;color:var(--metin-3)}
.gc button[aria-pressed="true"]{background:var(--yuzey);color:var(--metin);box-shadow:var(--golge-sm)}
/* öne çıkanlar: büyük + iki orta ya da kaydırılan */
.one{padding:16px var(--kenar) 0}
.one .bk{display:block}
.one .bk .gr{aspect-ratio:16/10;border-radius:var(--k-kart);position:relative}
.one .bk h2{margin-top:6px;font-size:23px;line-height:1.18;font-weight:var(--y-kalin);letter-spacing:-.02em}
.one .ik{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;padding-bottom:18px;border-bottom:1px solid var(--cizgi)}
.one .ik a{display:block;min-width:0}
.one .ik .gr{aspect-ratio:4/3;border-radius:var(--k-kart)}
.one .ik h3{margin-top:4px;font-size:15.5px;line-height:1.26;font-weight:var(--y-kalin)}
.one-ray{padding-top:16px}
.one-ray .ks{gap:12px;padding:0 var(--kenar)}
.one-ray .ks>a{width:300px;display:block}
.one-ray .gr{aspect-ratio:16/10;border-radius:var(--k-kart)}
.one-ray h2{margin-top:6px;font-size:19px;line-height:1.22;font-weight:var(--y-kalin);letter-spacing:-.015em}
.mt{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;font-weight:var(--y-kalin);color:var(--marka-metin);white-space:nowrap;overflow:hidden}
.mt .s{color:var(--metin-3);font-weight:var(--y-orta)}
.mt .tur{color:var(--anlik);display:inline-flex;align-items:center;gap:6px}
.ab{display:flex;align-items:center;gap:14px;margin-top:8px;font-size:12.5px;color:var(--metin-3);white-space:nowrap}
.ab i{font-size:11px;margin-right:6px}
.ab .kay{margin-left:auto;width:44px;height:44px;margin-right:-12px;display:grid;place-items:center;font-size:16px;color:var(--metin-2)}
/* liste satırları */
.ls{padding:0 var(--kenar)}
.grup{display:flex;align-items:center;justify-content:space-between;padding:22px 0 4px;font-size:13px;font-weight:var(--y-kalin);color:var(--metin-3)}
.grup span:last-child{font-weight:var(--y-orta)}
.sat{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:14px;align-items:start;padding:16px 0;border-bottom:1px solid var(--cizgi)}
.sat.yazi{grid-template-columns:minmax(0,1fr)}
.sat h3{font-size:16.5px;line-height:1.28;font-weight:var(--y-kalin);letter-spacing:-.01em;margin-top:5px}
.sat .gr{width:96px;height:96px;border-radius:var(--k-kart)}
.sat .mt{margin-top:0}
/* Gelişen Olaylar (LS-D) */
.go{padding:28px 0 6px}
.go .bb{margin-bottom:10px}
.go .bb h2 small{font-size:13px;font-weight:var(--y-orta);color:var(--metin-3);letter-spacing:0}
.ol-d{display:grid;gap:12px;padding:0 var(--kenar)}
.ol-r{gap:12px;padding:0 var(--kenar)}
.ol-r>.olay{width:288px}
.olay{display:block;background:var(--yuzey-2);border-radius:var(--k-buyuk);overflow:hidden}
.olay-b{position:relative;height:118px;display:flex;align-items:flex-end;padding:12px 16px;color:#fff;background-size:cover;background-position:center;background-color:var(--koyu-y)}
.olay-b::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,10,12,.84),rgba(10,10,12,.1) 72%)}
.olay-b>*{position:relative}
.olay-b .us{position:absolute;top:10px;left:10px;display:flex;gap:6px}
.e{height:26px;padding:0 10px;border-radius:var(--k-kontrol);display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:var(--y-kalin);background:rgba(255,255,255,.92);color:var(--siyah);white-space:nowrap}
.e.canli{background:#C8102E;color:#fff}
.e.canli i{font-size:6px}
.e.tkp{background:var(--marka)}
.olay-b h3{font-size:20px;line-height:1.12;font-weight:var(--y-kalin);letter-spacing:-.02em}
.olay-b small{display:block;margin-top:3px;font-size:12.5px;color:rgba(255,255,255,.8);white-space:nowrap}
.gel{list-style:none;padding:4px 16px}
.gel li{display:grid;grid-template-columns:46px minmax(0,1fr);gap:8px;padding:10px 0}
.gel li+li{border-top:1px solid var(--cizgi)}
.gel time{font-size:13px;font-weight:var(--y-kalin);font-variant-numeric:tabular-nums}
.gel li:first-child time{color:var(--marka-metin)}
.gel h4{font-size:14.5px;line-height:1.3;font-weight:var(--y-kalin)}
.olay-a{display:flex;align-items:center;padding:2px 8px 8px 16px;gap:8px}
.olay-a span{flex:1;font-size:12.5px;font-weight:var(--y-kalin);color:var(--metin-3);white-space:nowrap;display:flex;align-items:center;gap:var(--ikon-bosluk)}
.olay-a span i{color:var(--marka-metin);font-size:11px}
.olay-a button{height:44px;padding:0 14px;border-radius:var(--k-kontrol);background:var(--yuzey);font-size:13.5px;font-weight:var(--y-kalin);display:inline-flex;align-items:center;gap:var(--ikon-bosluk)}
.olay-a button.acik{background:var(--marka);color:var(--siyah)}
.go-t{display:flex;justify-content:center;padding-top:4px}
.go-t a{height:44px;display:inline-flex;align-items:center;gap:var(--ikon-bosluk);font-size:14px;font-weight:var(--y-kalin);color:var(--marka-metin)}
/* Çizelge (LS-C) */
.cz{padding:0 var(--kenar)}
.cz .gun{display:flex;align-items:baseline;justify-content:space-between;padding:18px 0 4px;font-size:15px;font-weight:var(--y-kalin)}
.cz .gun small{font-size:12.5px;font-weight:var(--y-orta);color:var(--metin-3)}
.dl{display:grid;grid-template-columns:52px minmax(0,1fr);margin-top:10px}
.dl span{font-size:12px;font-weight:var(--y-kalin);color:var(--metin-3)}
.dl span b{display:inline-block;background:var(--zemin-2);border-radius:var(--k-ic);padding:3px 6px;font-weight:var(--y-kalin)}
.oc{display:grid;grid-template-columns:52px minmax(0,1fr);position:relative}
.oc .sa{font-size:14px;font-weight:var(--y-kalin);padding-top:15px;font-variant-numeric:tabular-nums}
.oc .ci{position:absolute;left:44px;top:0;bottom:0;width:2px;background:var(--cizgi)}
.oc .no{position:absolute;left:39px;top:19px;width:12px;height:12px;border-radius:var(--k-daire);background:var(--zemin);border:2.5px solid var(--metin-3)}
.oc.vur .no{border-color:var(--anlik);background:var(--anlik)}
.oc.ilk .no{border-color:var(--metin);background:var(--marka)}
.oc a{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:12px;padding:12px 0 14px 12px;border-bottom:1px solid var(--cizgi)}
.oc a.yazi{grid-template-columns:minmax(0,1fr)}
.oc .k{font-size:12px;font-weight:var(--y-kalin);color:var(--marka-metin);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;display:flex;gap:6px}
.oc .k .tur{color:var(--anlik)}
.oc h3{font-size:15.5px;line-height:1.3;font-weight:var(--y-kalin);margin-top:4px}
.oc .m{margin-top:6px;font-size:12.5px;color:var(--metin-3);white-space:nowrap;display:flex;gap:12px}
.oc .gr{width:64px;height:64px;border-radius:var(--k-kontrol);margin-top:4px}
.cizelge .liste-kip{display:none}
body:not(.cizelge) .cizelge-kip{display:none}
/* yükleniyor */
.isk{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:14px;padding:16px 0;border-bottom:1px solid var(--cizgi)}
.isk i{display:block;border-radius:var(--k-ic);background:linear-gradient(90deg,var(--zemin-2) 30%,var(--yuzey-2) 50%,var(--zemin-2) 70%);background-size:300% 100%;animation:pari 1.4s linear infinite}
.isk .a{height:12px;width:40%}.isk .b{height:16px;margin-top:10px}.isk .c{height:16px;width:70%;margin-top:8px}.isk .g{width:96px;height:96px;border-radius:var(--k-kart)}
@keyframes pari{from{background-position:100% 0}to{background-position:-100% 0}}
.yuk{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 0 0;font-size:13px;color:var(--metin-3)}
.yuk i{animation:don 1s linear infinite}
@keyframes don{to{transform:rotate(360deg)}}
.anlik *{transition:none!important}
</style>
</head>
<body>
<div class="ekran" id="ekran"></div>
<div class="cb">
  <a class="geri" id="geri"><i class="fa-solid fa-chevron-left"></i>Bölümler</a>
  <span class="orta" id="orta"></span>
  <span class="sag"><a class="dd" aria-label="Ara"><i class="fa-solid fa-magnifying-glass"></i></a><a class="dd" aria-label="Paylaş"><i class="fa-solid fa-arrow-up-from-bracket"></i></a></span>
</div>
<script>
(function(){
  var L = D.liste, X = L.haberler, C = H.cfg.liste, AY = H.AY, d = H.detay();
  document.title = H.cfg.kod + ' · ' + H.cfg.ad + ' · Liste';
  document.getElementById('orta').textContent = L.bolum;
  document.getElementById('geri').href = H.u('ana.html');
  function mt(h){ var v = h.tur === 'Canlı' || h.tur === 'Son Dakika'; return '<span class="mt">' + (h.tur ? (v ? '<span class="tur"><span class="canli-nokta"></span>' + h.tur + '</span>' : '<span class="s" style="font-weight:var(--y-kalin)">' + h.tur + '</span>') : '') + '<span>' + h.alt + '</span><span class="s">' + h.saat + '</span></span>'; }
  function ab(h){ return '<span class="ab"><span><i class="fa-solid fa-clock"></i>' + h.sure + '</span><span><i class="fa-solid fa-eye"></i>' + h.izlenme + '</span><span class="kay" aria-label="Kaydet"><i class="fa-solid fa-bookmark"></i></span></span>'; }

  /* Gelişen Olaylar: D.liste haberleri konuya göre (LS-D'deki gruplar; yeni haber yok) */
  var OLAY = [
    { ad: "Asgari ücret ve bütçe", g: "asgari", canli: true, i: [1, 3, 4] },
    { ad: "Kar ve ulaşım", g: "kar-istanbul", i: [0, 7, 9, 6] },
    { ad: "Afet ve çevre", g: "konteyner", i: [10, 8, 11] }
  ];
  function olay(o, j){
    var tkp = C.takip && j === 0;
    return '<article class="olay"><a class="olay-b" href="' + d + '" style="background-image:' + G(o.g) + '"><span class="us">' + (o.canli ? '<span class="e canli"><i class="fa-solid fa-circle"></i>Canlı</span>' : '') + (tkp ? '<span class="e tkp"><i class="fa-solid fa-check"></i>Takipte</span>' : '') + '</span>' +
      '<span><h3>' + o.ad + '</h3><small>' + o.i.length + ' gelişme · son ' + X[o.i[0]].saat + '</small></span></a>' +
      '<ol class="gel">' + o.i.slice(0, 2).map(function(k){ var x = X[k]; return '<li><time>' + x.saat + '</time><h4 class="iki">' + x.baslik + '</h4></li>'; }).join('') + '</ol>' +
      '<div class="olay-a"><span><i class="fa-solid fa-clock-rotate-left"></i>Olay dosyası</span><button type="button" data-takip class="' + (tkp ? 'acik' : '') + '">' + (tkp ? '<i class="fa-solid fa-check"></i>Takipte' : '<i class="fa-solid fa-plus"></i>Takip et') + '</button></div></article>';
  }
  var olaylar = C.takip ? OLAY : [OLAY[1], OLAY[0], OLAY[2]];
  var go = '<section class="go liste-kip"><div class="bb"><h2>Gelişen Olaylar</h2><a>' + (C.takip ? 'Takip ettiklerin önce' : '5 olay') + '<i class="fa-solid fa-chevron-right"></i></a></div>' +
    (C.olayBicim === 'ray' ? '<div class="ol-r ks">' + olaylar.map(olay).join('') + '</div>'
                           : '<div class="ol-d">' + olaylar.slice(0, 2).map(olay).join('') + '</div><div class="go-t"><a>Bütün olaylar · 5<i class="fa-solid fa-chevron-right"></i></a></div>') + '</section>';

  /* öne çıkanlar */
  var one = '', kul = [];
  if (C.one === 'uclu') {
    var b = X[0], m = [X[1], X[3]]; kul = [0, 1, 3];
    one = '<section class="one liste-kip"><a class="bk" href="' + d + '"><div class="gr" style="background-image:' + G(b.g) + '"></div><div style="margin-top:12px">' + mt(b) + '</div><h2>' + b.baslik + '</h2>' + ab(b) + '</a>' +
      '<div class="ik">' + m.map(function(h){ return '<a href="' + d + '"><div class="gr" style="background-image:' + G(h.g) + '"></div><div style="margin-top:10px">' + mt(h) + '</div><h3 class="uc">' + h.baslik + '</h3></a>'; }).join('') + '</div></section>';
  } else {
    kul = [0, 1, 3, 2, 4];
    one = '<section class="one-ray liste-kip"><div class="ks" data-ms>' + kul.map(function(k){ var h = X[k]; return '<a href="' + d + '"><div class="gr" style="background-image:' + G(h.g) + '"></div><div style="margin-top:12px">' + mt(h) + '</div><h2 class="uc">' + h.baslik + '</h2></a>'; }).join('') + '</div>' +
      '<div class="sayac" data-sayac>' + kul.map(function(_, i){ return '<span' + (i === 0 ? ' class="on"' : '') + '></span>'; }).join('') + '</div></section>';
  }

  /* satırlar (öne çıkanlar dışındakiler) */
  var kalan = X.filter(function(_, i){ return kul.indexOf(i) < 0; });
  function sat(h){ return '<a class="sat' + (h.g ? '' : ' yazi') + '" href="' + d + '"><div>' + mt(h) + '<h3 class="uc">' + h.baslik + '</h3>' + ab(h) + '</div>' + (h.g ? '<div class="gr" style="background-image:' + G(h.g) + '"></div>' : '') + '</a>'; }
  var sira = typeof C.olay === 'number' ? C.olay : -1, satirlar = '<div class="ls liste-kip"><div class="grup"><span>Son 1 saat</span><span>' + L.toplam + ' haber</span></div>';
  kalan.forEach(function(h, i){
    if (i === sira) satirlar += '</div>' + go + '<div class="ls liste-kip">';
    if (h.saat <= '15.00' && satirlar.indexOf('Daha önce') < 0) satirlar += '<div class="grup"><span>Daha önce</span><span>15.00 ve öncesi</span></div>';
    satirlar += sat(h);
  });
  satirlar += '<div class="isk"><div><i class="a"></i><i class="b"></i><i class="c"></i></div><i class="g"></i></div><div class="yuk"><i class="fa-solid fa-circle-notch"></i>Daha fazla haber yükleniyor</div></div>';

  /* çizelge */
  var cz = '<div class="cz cizelge-kip"><div class="gun"><span>Bugün</span><small>23 Kasım Pazartesi · ' + L.toplam + ' haber</small></div>', dl = '';
  X.forEach(function(h, i){
    var s = h.saat.split('.')[0] + '.00', v = h.tur === 'Canlı' || h.tur === 'Son Dakika';
    if (s !== dl){ dl = s; cz += '<div class="dl"><span><b>' + s + '</b></span><span></span></div>'; }
    cz += '<div class="oc' + (i === 0 ? ' ilk' : '') + (v ? ' vur' : '') + '"><span class="sa">' + h.saat + '</span><span class="ci"></span><span class="no"></span>' +
      '<a class="' + (h.g ? '' : 'yazi') + '" href="' + d + '"><div><span class="k">' + (h.tur ? '<span class="' + (v ? 'tur' : '') + '">' + h.tur + '</span>·' : '') + h.alt + '</span><h3 class="uc">' + h.baslik + '</h3>' +
      '<span class="m"><span>' + h.sure + '</span><span>' + h.izlenme + '</span><span>' + h.yazar + '</span></span></div>' + (h.g ? '<div class="gr" style="background-image:' + G(h.g) + '"></div>' : '') + '</a></div>';
  });
  cz += '</div>';

  var hk = '<div data-hikaye-serit></div>';
  var bas = '<header class="buyuk"><span class="eb"><i class="fa-solid ' + L.ikon + '"></i>Bölüm</span><h1>' + L.bolum + '</h1><p>' + L.aciklama + '</p>' +
    '<div class="tk"><button class="t1" type="button"><i class="fa-solid fa-plus"></i>Takip et</button><button class="t2" type="button"><i class="fa-solid fa-bell"></i>Bildirim</button></div></header>';
  var cr = '<nav class="cr" aria-label="Alt konular ve görünüm"><div class="ks">' + L.altKonular.map(function(k, i){ return '<a class="cp' + (i === 0 ? ' etkin' : '') + '">' + k + '</a>'; }).join('') + '</div>' +
    '<div class="gc" role="group" aria-label="Görünüm"><button type="button" data-kip="liste" aria-pressed="true" aria-label="Liste"><i class="fa-solid fa-list"></i></button><button type="button" data-kip="cizelge" aria-pressed="false" aria-label="Çizelge"><i class="fa-solid fa-timeline"></i></button></div></nav>';

  var o = '';
  if (C.hikaye === 'tepe') o += '<div class="tepe">' + hk + '</div>' + bas;
  else o += bas + '<div class="hk-ust">' + hk + '</div>';
  o += cr;
  if (C.olay === 'bas') o += go + one; else o += one;
  o += satirlar + cz + '<div class="son"></div>';
  var e = document.getElementById('ekran');
  e.innerHTML = o;

  function kip(k){
    document.body.classList.toggle('cizelge', k === 'cizelge');
    document.querySelectorAll('[data-kip]').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.kip === k); });
  }
  document.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-kip]'); if (b) kip(b.dataset.kip);
    var c = ev.target.closest('.cp'); if (c) document.querySelectorAll('.cp').forEach(function(x){ x.classList.toggle('etkin', x === c); });
    var t = ev.target.closest('[data-takip]'); if (t) { var a = t.classList.toggle('acik'); t.innerHTML = a ? '<i class="fa-solid fa-check"></i>Takipte' : '<i class="fa-solid fa-plus"></i>Takip et'; }
  });
  e.addEventListener('scroll', function(){ document.body.classList.toggle('dar', e.scrollTop > 70); }, { passive: true });
  var Q = new URLSearchParams(location.search);
  if (Q.get('kip') === 'cizelge') kip('cizelge');
  if (Q.get('dar') === '1') { document.body.classList.add('anlik', 'dar'); e.scrollTop = 300; }
  H.altCubuk('bolum');
  H.oynatici();
  H.raylar();
})();
</script>

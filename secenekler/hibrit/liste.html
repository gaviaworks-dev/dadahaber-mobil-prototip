<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>Hibrit · Liste</title>
<link rel="stylesheet" href="../_ortak/cerceve.css">
<link rel="stylesheet" href="../_ortak/marka.css">
<link rel="stylesheet" href="../kit/kit.css">
<link rel="stylesheet" href="hibrit.css">
<script src="../_ortak/icerik.js"></script>
<script src="../_ortak/cerceve.js"></script>
<script src="../_ortak/icerik-ek.js"></script>
<script src="../kit/kit.js"></script>
<script src="hibrit.js"></script>
<style>
/* Liste (K21: HB-3 "Bölümler önce" yapısı, dört hibritte aynı): görselli başlık (detay kapağının yarısı; üstünde bölüm adı ve açıklaması; Beyar: hikâye şeridi,
   Takip et ve Bildirim yok) → alt konu sekmeleri + Liste ↔ Çizelge (LS-C) → öne çıkanlar rayı → haberler, araya "Gelişen Olaylar" rayı (LS-D).
   Kaydırınca başlık daralır (LS-A). ?kip=cizelge çizelgede açar; ?dar=1 başlık daralmış halde açar. */
:root{--cam-z:rgba(255,255,255,.86)}
html[data-tema="koyu"]{--cam-z:rgba(14,14,16,.86)}
/* daralan üst çubuk */
.cb{position:absolute;left:0;right:0;top:0;z-index:70;height:calc(var(--ust-guvenli) + 48px);padding:var(--ust-guvenli) var(--kenar) 0;display:flex;align-items:center;gap:8px;border-bottom:1px solid transparent;transition:background .2s,border-color .2s}
.dar .cb{background:linear-gradient(rgba(10,10,10,.6),rgba(10,10,10,.6)),var(--ust-g) center 40%/cover;color:#fff} /* daralınca bölüm görseli (K30) */
/* üst çubuk düğmeleri detayla aynı: fotoğraf üstünde cam daire, daralınca saydam; geri yalnız ok (K35) */
.dar .cb .dd.cam{background:transparent;border-color:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.cb .orta{position:absolute;left:50%;top:var(--ust-guvenli);height:48px;max-width:180px;display:flex;align-items:center;transform:translateX(-50%);font-size:15px;font-weight:var(--y-kalin);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s}
.dar .cb .orta{opacity:1}
.cb .sag{margin-left:auto;display:flex;gap:8px}
/* görselli başlık: detay kapağının (400) yarısı */
header.buyuk{position:sticky;top:0;z-index:0;height:224px;display:flex;flex-direction:column;justify-content:flex-end;padding:0 var(--kenar) var(--b-40);color:#fff;isolation:isolate;background-size:cover;background-position:center}
header.buyuk::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(10,10,10,.9) 0%,rgba(10,10,10,.45) 55%,rgba(10,10,10,.5) 100%)}
header.buyuk h1{font-size:34px;line-height:1;font-weight:var(--y-kalin);letter-spacing:-.03em}
header.buyuk p{margin-top:var(--b-8);font-size:14px;color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb .dd{color:#fff}
/* içerik paneli görselin üstüne biner, yukarı kaydırınca görselin üzerinden geçer (K28) */
.yaprak{position:relative;z-index:1;margin-top:-24px;background:var(--zemin);border-radius:var(--k-kart) var(--k-kart) 0 0;border-top:3px solid var(--marka);padding-top:var(--b-12)}
.yaprak>.cr:first-child{margin-top:0;border-radius:var(--k-kart) var(--k-kart) 0 0}
/* yapışkan çip satırı + Liste/Çizelge anahtarı */
.cr{position:sticky;top:calc(var(--ust-guvenli) + 48px);z-index:60;background:var(--zemin);display:flex;align-items:center;border-bottom:1px solid var(--cizgi);margin-top:10px}
.dar .cr{background:var(--cam-z);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.cr .ks{flex:1;min-width:0;gap:8px;padding:10px 8px 10px var(--kenar);-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.cp{height:36px;padding:0 14px;border-radius:var(--k-ic);border:1px solid var(--cizgi);font-size:14px;color:var(--metin-2);display:inline-flex;align-items:center;white-space:nowrap}
.cp.etkin{background:var(--marka);border-color:var(--marka);color:var(--siyah);font-weight:var(--y-kalin)}
.gc{flex:none;display:flex;padding:4px;margin-right:var(--kenar);border-radius:var(--k-ic);background:var(--zemin-2)}
.gc button{width:40px;height:36px;border-radius:var(--k-ic);display:grid;place-items:center;font-size:15px;color:var(--metin-3)}
.gc button[aria-pressed="true"]{background:var(--yuzey);color:var(--metin);box-shadow:var(--golge-sm)}
/* öne çıkanlar: büyük + iki orta ya da kaydırılan */
.one{padding:16px var(--kenar) 0}
.one .bk{display:block}
.one .bk .gr{aspect-ratio:16/10;border-radius:var(--k-kontrol);position:relative}
.one .bk h2{margin-top:6px;font-size:23px;line-height:1.18;font-weight:var(--y-kalin);letter-spacing:-.02em}
.one .ik{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;padding-bottom:18px;border-bottom:1px solid var(--cizgi)}
.one .ik a{display:block;min-width:0}
.one .ik .gr{aspect-ratio:4/3;border-radius:var(--k-kontrol)}
.one .ik h3{margin-top:4px;font-size:15.5px;line-height:1.26;font-weight:var(--y-kalin)}
.one-ray{padding-top:16px}
.one-ray .ks{gap:12px;padding:0 var(--kenar)}
.one-ray .ks>a{width:300px;display:block}
.one-ray .gr{aspect-ratio:16/10;border-radius:var(--k-kontrol)}
.one-ray h2{margin-top:6px;font-size:19px;line-height:1.22;font-weight:var(--y-kalin);letter-spacing:-.015em}
/* üst satır: tür · kategori etiketi (.kat-et) · saat; ayraç .nk (K35) */
.mt{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:var(--y-kalin);color:var(--marka-metin);white-space:nowrap;overflow:hidden}
.mt .s{color:var(--metin-3);font-weight:var(--y-orta)}
.mt .tr{color:var(--metin-3)}
.mt .nk{color:var(--metin-3);font-weight:var(--y-orta)}
.mt .tur{color:var(--anlik);display:inline-flex;align-items:center;gap:var(--ikon-bosluk)}
.mtk{margin-top:12px}
/* alt satır: tek bilgi satırı (.meta) + Kaydet düğmesi */
.ab{display:flex;align-items:center;margin-top:8px}
.ab .meta{margin-top:0;flex:1;min-width:0}
/* liste satırları */
.ls{padding:0 var(--kenar)}
.grup{display:flex;align-items:center;justify-content:space-between;padding:22px 0 4px;font-size:13px;font-weight:var(--y-kalin);color:var(--metin-3)}
.grup span:last-child{font-weight:var(--y-orta)}
.sat{display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:14px;align-items:start;padding:16px 0;border-bottom:1px solid var(--cizgi)}
.sat.yazi{grid-template-columns:minmax(0,1fr)}
.sat h3{font-size:16.5px;line-height:1.28;font-weight:var(--y-kalin);letter-spacing:-.01em;margin-top:5px}
.sat .gr{width:88px;height:88px;border-radius:var(--k-ic)}
.sat .mt{margin-top:0}
/* Gelişen Olaylar (LS-D) */
.go{padding:28px 0 6px}
.go .bb{margin-bottom:10px}
.ol-d{display:grid;gap:12px;padding:0 var(--kenar)}
.ol-r{gap:12px;padding:0 var(--kenar)}
.ol-r>.olay{width:288px}
.olay{display:block;background:var(--yuzey-2);border-radius:var(--k-kart);overflow:hidden}
.olay-b{position:relative;height:118px;display:flex;align-items:flex-end;padding:12px 16px;color:#fff;background-size:cover;background-position:center;background-color:var(--koyu-y)}
.olay-b::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,10,12,.84),rgba(10,10,12,.1) 72%)}
.olay-b>*{position:relative}
.olay-b .us{position:absolute;top:10px;left:10px;display:flex;gap:8px}
.e{height:26px;padding:0 10px;border-radius:var(--k-ic);display:inline-flex;align-items:center;gap:var(--ikon-bosluk);font-size:11.5px;font-weight:var(--y-kalin);background:rgba(255,255,255,.92);color:var(--siyah);white-space:nowrap}
.e.tkp{background:var(--marka)}
.olay-b h3{font-size:20px;line-height:1.12;font-weight:var(--y-kalin);letter-spacing:-.02em}
.olay-b small{display:block;margin-top:3px;font-size:12.5px;color:rgba(255,255,255,.8);white-space:nowrap}
.gel{list-style:none;padding:4px 16px}
.gel li{display:grid;grid-template-columns:46px minmax(0,1fr);gap:8px;padding:10px 0}
.gel li+li{border-top:1px solid var(--cizgi)}
.gel time{font-size:13px;font-weight:var(--y-kalin);font-variant-numeric:tabular-nums}
.gel li:first-child time{color:var(--marka-metin)}
.gel h4{font-size:14.5px;line-height:1.3;font-weight:var(--y-kalin)}
.olay-a{display:flex;align-items:center;padding:2px 8px 8px 16px;gap:8px}
.olay-a span{flex:1;font-size:12.5px;font-weight:var(--y-kalin);color:var(--metin-3);white-space:nowrap;display:flex;align-items:center;gap:var(--ikon-bosluk)}
.olay-a span i{color:var(--marka-metin);font-size:11px}
.olay-a button{height:44px;padding:0 14px;border-radius:var(--k-kontrol);background:var(--yuzey);font-size:13.5px;font-weight:var(--y-kalin);display:inline-flex;align-items:center;gap:var(--ikon-bosluk)}
.olay-a button.acik{background:var(--marka);color:var(--siyah)}
.go-t{display:flex;justify-content:center;padding-top:4px}
.go-t a{height:44px;display:inline-flex;align-items:center;gap:var(--ikon-bosluk);font-size:14px;font-weight:var(--y-kalin);color:var(--marka-metin)}
/* Çizelge (LS-C) */
.cz{padding:0 var(--kenar)}
.cz .gun{display:flex;align-items:baseline;justify-content:space-between;padding:18px 0 4px;font-size:15px;font-weight:var(--y-kalin)}
.cz .gun small{font-size:12.5px;font-weight:var(--y-orta);color:var(--metin-3)}
.dl{display:grid;grid-template-columns:52px minmax(0,1fr);margin-top:10px}
.dl span{font-size:12px;font-weight:var(--y-kalin);color:var(--metin-3)}
.dl span b{display:inline-block;background:var(--zemin-2);border-radius:var(--k-ic);padding:3px 6px;font-weight:var(--y-kalin)}
.oc{display:grid;grid-template-columns:52px minmax(0,1fr);position:relative}
.oc .sa{font-size:14px;font-weight:var(--y-kalin);padding-top:15px;font-variant-numeric:tabular-nums}
.oc .ci{position:absolute;left:44px;top:0;bottom:0;width:2px;background:var(--cizgi)}
.oc .no{position:absolute;left:39px;top:19px;width:12px;height:12px;border-radius:var(--k-daire);background:var(--zemin);border:2.5px solid var(--metin-3)}
.oc.vur .no{border-color:var(--anlik);background:var(--anlik)}
.oc.ilk .no{border-color:var(--metin);background:var(--marka)}
.oc a{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:12px;padding:12px 0 14px 12px;border-bottom:1px solid var(--cizgi)}
.oc a.yazi{grid-template-columns:minmax(0,1fr)}
.oc h3{font-size:15.5px;line-height:1.3;font-weight:var(--y-kalin);margin-top:4px}
.oc .meta{margin-top:6px}
.oc .gr{width:64px;height:64px;border-radius:var(--k-ic);margin-top:4px}
.cizelge .liste-kip{display:none}
body:not(.cizelge) .cizelge-kip{display:none}
/* yükleniyor */
.isk{display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:14px;padding:16px 0;border-bottom:1px solid var(--cizgi)}
.isk i{display:block;border-radius:var(--k-ic);background:linear-gradient(90deg,var(--zemin-2) 30%,var(--yuzey-2) 50%,var(--zemin-2) 70%);background-size:300% 100%;animation:pari 1.4s linear infinite}
.isk .a{height:12px;width:40%}.isk .b{height:16px;margin-top:10px}.isk .c{height:16px;width:70%;margin-top:8px}.isk .g{width:88px;height:88px;border-radius:var(--k-ic)}
@keyframes pari{from{background-position:100% 0}to{background-position:-100% 0}}
.yuk{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 0 0;font-size:13px;color:var(--metin-3)}
.yuk i{animation:don 1s linear infinite}
@keyframes don{to{transform:rotate(360deg)}}
.anlik *{transition:none!important}
/* ---------- bölüm araçları (Beyar: "özel widget'lar … webten"): public bölüm sayfalarının modülleri, uygulama dilinde; yalnız Tümü görünümünde, liste kipinde ---------- */
.bl-a .k-ray[data-dal-sec]{margin-bottom:var(--b-4)}
.sg-p{padding-top:var(--b-8)}
.sg-p[hidden]{display:none}
.k-ky>.fa-chevron-right{margin-left:auto;font-size:12px;color:var(--metin-3)}
.ust16{margin-top:var(--b-16)}
.ad-iz{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--b-12);padding:0 var(--kenar)}
.ad-iz .ad{width:auto}
.fz td:first-child{max-width:184px;overflow:hidden;text-overflow:ellipsis}
.tkm{width:104px}
/* KİT ADAYI: lig / gün ayracı — skor satırlarının (.k-skor) üstünde lig ya da gün adı, sağda durum; tek satır */
.lg{display:flex;align-items:center;justify-content:space-between;gap:var(--b-8);padding-top:var(--b-16);font-size:12.5px;font-weight:var(--y-kalin);color:var(--metin-3);white-space:nowrap;overflow:hidden}
.lg span:first-child{overflow:hidden;text-overflow:ellipsis}
/* KİT ADAYI: araç döşemesi — ekranlar/icerik/kesfet.html "format döşemesi"nin raydaki sabit enli hali (zemin --k-yuzey, köşe --k-kontrol, ikon kutusu .k-bolum-satir .bi); ad ve tek satır canlı değer; kartın tamamı dokunulur */
.ad{width:168px;min-height:120px;display:flex;flex-direction:column;padding:var(--b-16);border-radius:var(--k-kontrol);background:var(--k-yuzey);transition:transform .14s var(--k-egri)}
.ad:active{transform:scale(.975)}
.ad .bi{width:40px;height:40px;border-radius:var(--k-ic);display:grid;place-items:center;background:var(--marka-25);color:var(--marka-metin);font-size:15px;flex:none}
.ad b{display:block;margin-top:var(--b-12);font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad p{margin-top:var(--b-4);font-size:12.5px;line-height:1.35;color:var(--metin-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ad small{margin-top:auto;padding-top:var(--b-8);font-size:12.5px;color:var(--metin-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* KİT ADAYI: transfer kartı — kulüp arması (K.arma m), kulüp adı, durum etiketi (.k-etiket), iki satırlık başlık */
.trk{width:256px;display:flex;flex-direction:column;padding:var(--b-16);border-radius:var(--k-kontrol);background:var(--k-yuzey)}
.trk .u{display:flex;align-items:center;gap:var(--b-8)}
.trk .t{flex:1;min-width:0;font-size:13.5px;font-weight:var(--y-kalin);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk h4{margin-top:var(--b-12);font-size:15px;line-height:1.3;font-weight:var(--y-kalin);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* KİT ADAYI: tarih satırı — ekranlar/icerik/takvim.html satırının kısa hali: gün kutusu (bugün sarı), konu · saat, başlık, ayrıntı, takvim etiketi */
.tr-s{display:flex;align-items:center;gap:var(--b-12);min-height:72px;padding:var(--b-12) 0;border-bottom:1px solid var(--cizgi)}
.tr-s .gn{width:48px;height:48px;border-radius:var(--k-ic);background:var(--k-yuzey);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--b-4);flex:none}
.tr-s .gn b{font-size:17px;line-height:1;font-variant-numeric:tabular-nums}
.tr-s .gn small{font-size:11px;line-height:1;font-weight:var(--y-kalin);color:var(--metin-3)}
.tr-s .gn.bugun{background:var(--marka);color:var(--siyah)}
.tr-s .gn.bugun small{color:var(--siyah)}
.tr-s .t{flex:1;min-width:0}
.tr-s .t small{display:block;font-size:12px;font-weight:var(--y-kalin);color:var(--marka-metin);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-s .t b{display:block;margin-top:var(--b-4);font-size:14.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-s .t span{display:block;margin-top:var(--b-4);font-size:12.5px;color:var(--metin-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* KİT ADAYI: geri sayım kutusu — .k-mac'in koyu zemini; solda sınav ve tarih, sağda marka sarısı büyük gün sayısı */
.gs{display:flex;align-items:center;gap:var(--b-16);padding:var(--b-16);border-radius:var(--k-kart);background:var(--k-koyu);color:#fff;margin-bottom:var(--b-4)}
.gs .t{flex:1;min-width:0}
.gs small{display:block;font-size:12.5px;font-weight:var(--y-kalin);color:rgba(255,255,255,.6);white-space:nowrap}
.gs .t b{display:block;margin-top:var(--b-4);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs .n{flex:none;text-align:right}
.gs .n b{display:block;font-size:34px;line-height:1;letter-spacing:-.02em;color:var(--marka);font-variant-numeric:tabular-nums}
.gs .n small{margin-top:var(--b-4)}
/* KİT ADAYI: Günün 5'i kutusu — numaralı beş başlık, altta Oku ve Dinle (K39: fa-headphones) */
.g5{margin:0 var(--kenar);padding:var(--b-4) var(--b-16) var(--b-16);border-radius:var(--k-kart);background:var(--k-yuzey)}
.g5 ol{list-style:none}
.g5 li a{display:grid;grid-template-columns:32px minmax(0,1fr);gap:var(--b-8);align-items:center;min-height:56px;padding:var(--b-8) 0;border-bottom:1px solid var(--cizgi)}
.g5 li em{font-style:normal;font-size:15px;font-weight:var(--y-kalin);color:var(--marka-metin);font-variant-numeric:tabular-nums}
.g5 li b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14.5px;line-height:1.3}
.g5 li small{display:block;margin-top:var(--b-4);font-size:12px;color:var(--metin-3);white-space:nowrap}
.g5 .a{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--b-8);margin-top:var(--b-16)}
</style>
</head>
<body>
<div class="ekran" id="ekran"></div>
<div class="cb">
  <a class="dd cam" id="geri" aria-label="Geri"><i class="fa-solid fa-chevron-left"></i></a>
  <span class="orta" id="orta"></span>
  <span class="sag"><a class="dd cam" id="ara" aria-label="Ara"><i class="fa-solid fa-magnifying-glass"></i></a><a class="dd cam" data-sayfa="paylas" aria-label="Paylaş"><i class="fa-solid fa-share-nodes"></i></a></span>
</div>
<script>
(function(){
  var Q = new URLSearchParams(location.search), DUR = K.durum, KOD = Q.get('bolum'), KONU = Q.get('konu'), TUR = Q.get('tur');
  /* ---------- öteki bölümler ve alt konular (yayılım 1. dalga) ----------
     Kaynak: public sözlük dadahaber-prototip/araclar/ornek_veri.json › haberler (tarih 2026-11-23; bölüm, alt_konu, tür, saat, yazar, süre, görüntülenme aynen).
     Görsel (g) yalnız aynı başlık window.D'de görselliyse (D.bolumler, D.manset, D.liste); öteki haberler görselsiz satır. t = sözlükte o gün o bölümdeki haber sayısı.
     puan: sözlük › puan_tablosu.takimlar (ilk dört). Yeni veri uydurulmadı. */
  var EK = {
    spor: { t: 156, h: [
      {"saat": "15.45", "alt": "Basketbol", "baslik": "Beşiktaş Türk Telekom'u 84-80 geçti", "yazar": "Murat Tekin", "sure": "2 dk", "izlenme": "4,8 B"},

    enstruman: { 'Dolar': 'dolar', 'Euro': 'euro', 'Gram altın': 'gram-altin', 'BIST 100': 'xu100' }, /* ana sayfa piyasa şeridiyle aynı (K46) */
    faiz: [['TCMB politika faizi (1 hafta repo)', '%42,50', 'Sabit', ''], ['TLREF (gecelik)', '%42,36', '−0,05 puan', 'd'], ['2 yıllık gösterge tahvil', '%38,74', '−0,22 puan', 'd'],
           ['10 yıllık gösterge tahvil', '%29,85', '+0,06 puan', 'y'], ['Mevduat, 92 güne kadar (ortalama)', '%44,10', '−0,25 puan', 'd']],
    yakit: [['Benzin (95 oktan)', '43,18 TL', '▲ 0,25 TL', 'y'], ['Motorin', '44,72 TL', 'Değişmedi', ''], ['LPG (otogaz)', '27,42 TL', 'Değişmedi', ''], ['Brent petrol (varil)', '74,82 $', '▼ %1,12', 'd']],
    takvim: [['23', 'Kas', 1, 'Türkiye · 14.00', 'TCMB Para Politikası Kurulu · Faiz kararı', 'Açıklandı %42,50 · Beklenti %42,50', 'Yüksek', 'sari'],
             ['23', 'Kas', 1, 'ABD · 15.30', 'Haftalık işsizlik başvuruları', 'Önceki 231 bin · Beklenti 228 bin', 'Orta', ''],
             ['24', 'Kas', 0, 'Türkiye · 10.00', 'Reel Kesim Güven Endeksi · Kasım', 'Önceki 101,8 · Beklenti 102,3', 'Orta', ''],
             ['26', 'Kas', 0, 'ABD · 16.30', 'GSYH · 3. çeyrek, ikinci tahmin', 'Önceki %2,8 · Beklenti %2,8', 'Yüksek', 'sari']]
  };
  function yon(m, y){ return y ? '<span class="k-yon ' + y + '">' + m + '</span>' : m; }
  function finPiyasa(){
    var p = D.piyasa;
    var py = K.ray(p.liste.map(function(x){ return '<a class="k-py" href="' + SY('enstruman', FIN.enstruman[x.ad] ? 'kod=' + FIN.enstruman[x.ad] : '') + '"><small>' + x.ad + '</small><b>' + x.deger + '</b><em class="' + x.yon + '">' + (x.yon === 'y' ? '▲' : '▼') + ' %' + x.degisim + '</em></a>'; }).join(''), 's10') +
      '<div class="k-ic"><p class="k-not">' + I('fa-clock') + '<span>Güncelleme ' + p.guncelleme + ' · ' + p.not + '</span></p></div>';
    var fz = '<div class="k-ic">' + K.tablo({ sutunlar: ['Gösterge', 'Oran', 'Değişim'], satirlar: FIN.faiz.map(function(r){ return [r[0], r[1], yon(r[2], r[3])]; }), cls: 'sol fz' }) +
      '<p class="k-not">' + I('fa-circle-info') + '<span>Yıllık basit oran · 23 Kasım 2026, 14.05 itibarıyla</span></p>' + bag('Bütün oranlar', K.altYol('Faiz Oranları')) + '</div>';
    var yk = '<div class="k-ic">' + K.tablo({ sutunlar: ['Ürün', 'Fiyat', 'Değişim'], satirlar: FIN.yakit.map(function(r){ return [r[0], r[1], yon(r[2], r[3])]; }), cls: 'sol fz' }) +
      '<p class="k-not">' + I('fa-circle-info') + '<span>İstanbul (Avrupa) pompa fiyatı · 23 Kasım 2026, 06.00 itibarıyla</span></p>' + bag('İllere göre fiyatlar', K.altYol('Akaryakıt Fiyatları')) + '</div>';
    return bl(K.bb({ baslik: 'Piyasalar', ikon: 'fa-chart-column', baglanti: { metin: 'Piyasa ekranı', href: K.altYol('Piyasa Ekranı') } }) + sekmeli(['Piyasalar', 'Faiz', 'Akaryakıt'], [py, fz, yk]) +
      '<div class="ust16"><a class="k-ky" href="' + SY('ekonomi-araclari') + '"><span class="ik">' + I('fa-calculator') + '</span><span class="t"><small>Ekonomi araçları</small><b>Kur, kredi ve maaş hesaplama</b></span>' + I('fa-chevron-right') + '</a></div>' +
      '<div class="k-ic"><p class="k-not">' + I('fa-circle-info') + '<span>Fiyat, oran ve yorumlar yatırım danışmanlığı kapsamında değildir; veriler 15 dakika gecikmelidir.</span></p></div>');
  }
  function finTakvim(){ var h = K.altYol('Ekonomik Takvim');
    return bl(K.bb({ baslik: 'Ekonomik Takvim', ikon: 'fa-calendar-day', sayi: 'Bu hafta', baglanti: { metin: 'Tümü', href: h } }) + '<div class="k-ic">' + FIN.takvim.map(function(x){ return tarihSat(x, h); }).join('') + '</div>'); }

  /* GÜNDEM · public afet-acil-durum.html / trafik-ulasim.html "Servisler" menüsü: hava ve namaz D'den; afet: "Son depremler" (Sındırgı 4,1 · 13.52); trafik ve takvim: sayfa görev satırları */
  function gundemServis(){ var hv = D.hava, n = D.namaz;
    return bl(K.bb({ baslik: 'Servisler', ikon: 'fa-toolbox' }) + K.ray([
      ad({ ikon: hv.ikon, ad: 'Hava Durumu', deger: hv.sehir + ' · ' + hv.derece + '° ' + hv.durum, href: K.git('havaDurumu') }),
      ad({ ikon: 'fa-mosque', ad: 'Namaz Vakitleri', deger: n.siradaki + ' ' + n.saat + ' · ' + n.kalan.replace(':', ' sa ') + ' dk', href: K.git('namaz') }),
      ad({ ikon: 'fa-triangle-exclamation', ad: 'Afet ve Acil Durum', deger: 'Sındırgı 4,1 · 13.52', href: K.git('afet') }),
      ad({ ikon: 'fa-car', ad: 'Trafik ve Ulaşım', deger: 'Yol durumu ve duyurular', href: K.git('trafik') }),
      ad({ ikon: 'fa-calendar-day', ad: 'Gündem Takvimi', deger: 'Bu haftanın tarihleri', href: K.git('takvim', 'tur=gundem') })
    ].join(''), 's10')); }

  /* KADIN · public kadin.html alt konu çiplerindeki araç sayfaları: hamilelik.html ("1–40. hafta", hesaplayıcı) ve astroloji.html (Yay sezonu, 22 Kas – 21 Ara) */
  function kadinServis(){ return bl(K.bb({ baslik: 'Servisler', ikon: 'fa-toolbox' }) + '<div class="ad-iz">' +
    ad({ ikon: 'fa-baby', ad: 'Hamilelik', acik: 'Hafta hafta gebelik, sağlık ve doğum hazırlığı', deger: 'Hesaplayıcı · 1–40. hafta', href: K.git('hamilelik') }) +
    ad({ ikon: 'fa-star', ad: 'Astroloji', acik: 'Burçlar, günlük yorumlar ve gökyüzü takvimi', deger: 'Yay · 22 Kas – 21 Ara', href: K.git('astroloji') }) + '</div>'); }

  /* KAMPÜS · public sinav-takvimi.html › "Önümüzdeki dört hafta" ve YKS 1. oturum (19 Haziran 2027); kalan gün D.simdi'den (23 Kasım 2026) hesaplanır */
  var SINAV = [['23', 'Kas', 1, 'e-YDS · 23.59', '2026-e-YDS/12 İngilizce başvuruları', 'Son gün · Sınav 6 Ara', 'Başvuru', ''],
               ['1', 'Ara', 0, 'KPSS · 10.00', 'KPSS-2026/7 tercih dönemi', 'Tercih 1–8 Ara · Sonuç 18 Ara', 'Tercih', ''],
               ['6', 'Ara', 0, 'e-YDS · 10.15', '2026-e-YDS/12 İngilizce sınavı', 'Sonuç 10 Ara', 'Sınav', 'sari'],
               ['18', 'Ara', 0, 'YÖKDİL · 14.00', '2026-YÖKDİL/2 sonuçları', 'Sonuçlar aday işlemleri sisteminde', 'Sonuç', 'yesil']];
  function kampusSinav(){ var h = K.altYol('Sınav Takvimi'), kalan = Math.round((new Date(2027, 5, 19) - new Date(2026, 10, 23)) / 864e5);
    return bl(K.bb({ baslik: 'Sınav Takvimi', ikon: 'fa-calendar-day', baglanti: { metin: 'Tümü', href: h } }) + '<div class="k-ic"><a class="gs" href="' + h + '"><span class="t"><small>YKS 1. oturum · TYT</small><b>19 Haziran 2027 Cumartesi</b></span>' +
      '<span class="n"><b>' + kalan + '</b><small>gün kaldı</small></span></a>' + SINAV.map(function(x){ return tarihSat(x, h); }).join('') + '</div>'); }

  /* KEŞFET · public kesfet.html › "Bugünün 5 Haberi" (D.gunun5) ve "Formatlar, Anlık Akış" (açıklama ve künye aynen; ekranlar/icerik/kesfet.html ile aynı ikonlar) */
  function kesfetG5(){ var g = D.gunun5;
    return bl(K.bb({ baslik: 'Günün 5\'i', ikon: 'fa-sun', sayi: g.baski, baglanti: { metin: 'Tümü', href: K.git('gununBesi') } }) + '<div class="g5"><ol>' +
      g.liste.map(function(x){ return '<li><a href="' + d + '"><em>' + x.no + '</em><span><b>' + x.baslik + '</b><small>' + x.kat + ' · ' + x.sure + '</small></span></a></li>'; }).join('') + '</ol><div class="a">' +
      K.btn({ metin: 'Oku · ' + g.okuma, ikon: 'fa-book-open', tur: 'birincil', href: K.git('gununBesi') }) + K.btn({ metin: 'Dinle · ' + g.dinleme, ikon: 'fa-headphones', tur: 'sade', href: K.git('gununBesi') }) + '</div></div>'); }
  var FORMAT = [['fa-gauge-high', 'Dada Özet', 'Her gün güncellenir', SY('dada-ozet')], ['fa-folder-open', 'Dada Bağlam', '24 dosya', SY('dada-baglam')], ['fa-clipboard-check', 'Dada Doğrula', '6 karar etiketi', SY('dada-dogrula')],
    ['fa-scale-balanced', 'Farklı Bakışlar', 'Haftalık', SY('farkli-bakislar')], ['fa-map-location-dot', 'Veri ve Harita', 'Resmî veri', SY('veri-ve-harita')], ['fa-leaf', 'Sakin Akış', 'Kişisel ayar', SY('sakin-akis')],
    ['fa-user', 'Bana Etkisi', '6 profil', SY('bana-etkisi'), true]];
  var ANLIK = [['fa-bolt', 'Son Dakika', 'Saat sırasıyla, teyitli', K.git('sonDakika')], ['fa-tower-broadcast', 'Canlı Gündem', 'Süren olaylar', K.git('canliGundem')],
    ['fa-stopwatch', 'Dakika Dakika', 'Seçim, maç ve oturumlar', K.git('canliAnlatim')], ['fa-moon', 'Bugün Ne Oldu?', 'Her akşam 19.00', SY('bugun-ne-oldu')], ['fa-calendar-day', 'Gündem Takvimi', 'Bu haftanın tarihleri', K.git('takvim', 'tur=gundem')]];
  function rayAd(b, ik, l){ return bl(K.bb({ baslik: b, ikon: ik }) + K.ray(l.filter(function(x){ return K.uye || !x[4]; }).map(function(x){ return ad({ ikon: x[0], ad: x[1], deger: x[2], href: x[3] }); }).join(''), 's10')); }

  /* yerleşim: üst = öne çıkanların altında; ARA = o sıradaki satırdan önce (haberleri itmemek için araya serpiştirilir) */
  var serit = '', ARA = {};
  if (!ALT) {
    if (GUNDEM) { ARA[3] = gundemServis(); ARA[C.olay] = go; }
    else if (L.bolum === 'Spor') { serit = sporCanli(); ARA[2] = sporPuan(); ARA[4] = sporFikstur(); ARA[6] = sporTransfer() + sporTakim(); }
    else if (L.bolum === 'Finans') { serit = finPiyasa(); ARA[3] = finTakvim(); }
    else if (L.bolum === 'Kadın') ARA[3] = kadinServis();
    else if (L.bolum === 'Kampüs') serit = kampusSinav();
    else if (L.bolum === 'Keşfet') { serit = kesfetG5(); ARA[3] = rayAd('Formatlar', 'fa-shapes', FORMAT); ARA[7] = rayAd('Anlık', 'fa-bolt', ANLIK); }
  }

  /* satırlar (öne çıkanlar dışındakiler) */
  var kalan = X.filter(function(_, i){ return kul.indexOf(i) < 0; });
  /* K44: liste satırı kitten (K.satir): görsel solda, yanında kategori · saat, altında başlık, ikonlu bilgi satırı ve Kaydet */
  function sat(h){ return K.satir(Object.assign({}, h, { g: gk(h) }), { ikon: L.ikon, href: d }); }
  var satirlar = '<div class="ls liste-kip"><div class="grup"><span>' + (ALT ? ALT.ad : 'Son 1 saat') + '</span><span>' + (ALT ? ALT.t : L.toplam) + ' haber</span></div>';
  kalan.forEach(function(h, i){
    if (ARA[i]) { satirlar += '</div>' + ARA[i] + '<div class="ls liste-kip">'; delete ARA[i]; }
    if (!ALT && h.saat <= '15.00' && satirlar.indexOf('Daha önce') < 0) satirlar += '<div class="grup"><span>Daha önce</span><span>15.00 ve öncesi</span></div>';
    satirlar += sat(h);
  });
  Object.keys(ARA).forEach(function(i){ satirlar += '</div>' + ARA[i] + '<div class="ls liste-kip">'; }); /* satır az kaldıysa kalan bloklar sona */
  /* sayfa sonu: kökte kendi iskeleti; ?durum=daha-fazla (&hal=son|hata) kitin sayfa sonu hali */
  var hal = Q.get('hal');
  if (DUR === 'daha-fazla') satirlar += (hal === 'son' || hal === 'hata' ? '' : K.iskelet('satir', 1)) + K.dahaFazla(hal === 'son' || hal === 'hata' ? hal : 'yukleniyor') + '</div>';
  else satirlar += '<div class="isk"><div><i class="a"></i><i class="b"></i><i class="c"></i></div><i class="g"></i></div><div class="yuk"><i class="fa-solid fa-circle-notch"></i>Daha fazla haber yükleniyor</div></div>';

  /* çizelge */
  var cz = '<div class="cz cizelge-kip"><div class="gun"><span>Bugün</span><small>23 Kasım Pazartesi · ' + (ALT ? ALT.t : L.toplam) + ' haber</small></div>', dl = '';
  X.forEach(function(h, i){
    var hs = h.cs || h.saat, s = h.cs ? h.saat : hs.split('.')[0] + '.00', v = h.tur === 'Canlı' || h.tur === 'Son Dakika'; /* önceki gün haberi (K49): ayraçta gün (22 Kas), satırda saat */
    if (s !== dl){ dl = s; cz += '<div class="dl"><span><b>' + s + '</b></span><span></span></div>'; }
    cz += '<div class="oc' + (i === 0 ? ' ilk' : '') + (v ? ' vur' : '') + '"><span class="sa">' + hs + '</span><span class="ci"></span><span class="no"></span>' +
      '<a class="' + (gk(h) ? '' : 'yazi') + '" href="' + d + '"><div>' + mt(h, true) + '<h3 class="uc">' + h.baslik + '</h3>' + H.meta([h.yazar, h.sure, h.izlenme]) + '</div>' + (gk(h) ? '<div class="gr" style="background-image:' + G(gk(h)) + '"></div>' : '') + '</a></div>';
  });
  cz += '</div>';

  /* alt konu çipleri: Tümü bölüm listesine, ötekiler kitteki eşlemeye (K.altYol; özel sayfa ya da bu liste ?konu=) */
  function cipYol(k, i){ return i === 0 ? K.bolumYol(L.bolum) : K.altYol(k, L.bolum); }
  var bas = '<header class="buyuk" style="background-image:' + G(GOR) + '"><h1>' + L.bolum + '</h1><p>' + L.aciklama + '</p></header>';
  var cr = '<nav class="cr" aria-label="Alt konular ve görünüm"><div class="ks">' + L.altKonular.map(function(k, i){ return '<a class="cp' + (i === SECILI ? ' etkin' : '') + '" href="' + cipYol(k, i) + '"' + (i === SECILI ? ' aria-current="page"' : '') + '>' + k + '</a>'; }).join('') + '</div>' +
    '<div class="gc" role="group" aria-label="Görünüm"><button type="button" data-kip="liste" aria-pressed="true" aria-label="Liste"><i class="fa-solid fa-newspaper"></i></button><button type="button" data-kip="cizelge" aria-pressed="false" aria-label="Çizelge"><i class="fa-solid fa-clock"></i></button></div></nav>';
  /* tür süzgeci (kit çipleri, tek seçim) ve şehir seç (kit alt sayfası, E-551) */
  var ek = '';
  if (ALT && ALT.tur) ek = '<div class="k-ray s8" data-tek style="padding-top:var(--b-12)" aria-label="Tür">' + ['Bütün türler', 'Analiz', 'Uzman Görüşü', 'Araştırma'].map(function(t){ return K.cip(t, { secili: t === 'Analiz' }); }).join('') + '</div>';
  if (KONU === 'yerel' && ALT) ek = '<div class="k-ic" style="padding-top:var(--b-12)">' + K.btn({ metin: 'Bütün şehirler', ikon: 'fa-location-dot', sagIkon: 'fa-chevron-down', tur: 'sade', attr: 'data-sayfa="sehir"' }) + '</div>';

  var o = '';
  o += bas + '<div class="yaprak">' + cr + ek;
  if (DUR === 'bos') o += K.bos('liste', { eylem: { metin: 'Tümü\'ne dön', tur: 'sade', href: K.u('hibrit/liste.html', KOD ? 'bolum=' + KOD : '') } }) + '<div class="son"></div></div>';
  else {
    if (C.olay === 'bas') o += go + one; else o += one;
    o += serit + satirlar + cz + '<div class="son"></div></div>';
  }
  var e = document.getElementById('ekran');
  e.innerHTML = o;
  /* seçili alt konu çipi görünür yere kayar */
  var ce = e.querySelector('.cr .cp.etkin');
  if (ce && SECILI > 0) ce.parentNode.scrollLeft = ce.offsetLeft - parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--kenar'));

  function kip(k){
    document.body.classList.toggle('cizelge', k === 'cizelge');
    document.querySelectorAll('[data-kip]').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.kip === k); });
  }
  document.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-kip]'); if (b) kip(b.dataset.kip);
    var t = ev.target.closest('[data-olay-takip]'); if (t) { var a = t.classList.toggle('acik'); t.innerHTML = a ? '<i class="fa-solid fa-check"></i>Takipte' : '<i class="fa-solid fa-plus"></i>Takip et'; }
  });
  /* bölüm araçları: sekmeli blokta panel geçişi (segment görünümü kitte); Canlı Skor'da dal süzgeci */
  document.addEventListener('click', function(ev){
    var sb = ev.target.closest('[data-sg] .k-segment button');
    if (sb) { var g = sb.closest('[data-sg]'), i = [].indexOf.call(sb.parentNode.querySelectorAll('button'), sb); g.querySelectorAll('.sg-p').forEach(function(p, j){ p.hidden = j !== i; }); }
    var dc = ev.target.closest('[data-dal-sec] [data-dal]');
    if (dc) { var v = dc.dataset.dal; dc.closest('section').querySelectorAll('.sk-l>[data-dal]').forEach(function(r){ r.hidden = !!v && r.dataset.dal !== v; }); }
  });
  /* düz üst çubuklu haller (hata, çevrimdışı önbelleksiz): durum çubuğu koyu yazı; yenilenirken üst çubuk görselli ve açık */
  var DUZ = DUR === 'hata' || (DUR === 'cevrimdisi' && Q.get('onbellek') === '0');
  function dar(){ var v = e.scrollTop > 130 || DUR === 'yenileniyor'; document.body.classList.toggle('dar', v); if (DUZ) document.body.removeAttribute('data-durum'); else document.body.setAttribute('data-durum', 'acik'); }
  e.addEventListener('scroll', dar, { passive: true }); dar();
  if (Q.get('kip') === 'cizelge') kip('cizelge');
  if (Q.get('kay')) { e.scrollTop = +Q.get('kay'); dar(); }
  if (Q.get('dar') === '1') { document.body.classList.add('anlik'); e.scrollTop = 300; dar(); }
  H.altCubuk('bolum');
  H.oynatici();
  H.raylar();

  /* ---------- haller (yayılım 1. dalga; yalnız kit bileşenleri; kabuk yerinde) ---------- */
  if (DUR === 'yukleniyor') e.innerHTML = K.iskelet('liste') + '<div class="son"></div>';
  if (DUR === 'yenileniyor') e.insertAdjacentHTML('afterbegin', '<div class="k-ust-bosluk"></div>' + K.yenile(['cekiliyor', 'birak', 'bitti'].indexOf(hal) > -1 ? hal : 'yenileniyor'));
  if (DUR === 'daha-fazla' && !document.documentElement.classList.contains('tam')) e.scrollTop = e.scrollHeight;
  if (DUZ) {
    document.querySelector('.cb').style.display = 'none';
    e.innerHTML = '<div class="k-ust-bosluk"></div>' + K.hata({ tur: DUR === 'cevrimdisi' ? 'cevrimdisi' : (Q.get('hata') === 'zaman-asimi' ? 'zaman-asimi' : 'sunucu') }) + '<div class="son"></div>';
    K.ustCubuk({ geri: H.ana(), baslik: L.bolum, eylemler: ['ara', 'paylas'] });
  } else if (DUR === 'cevrimdisi') {
    /* önbellekteki son liste + kalıcı çevrimdışı bandı (alt çubuğun ya da mini oynatıcının üstünde) */
    var bt = K.toast('Çevrimdışısın', { bant: true, eylem: 'Kaydedilenler', eylemFn: function(){ location.href = K.git('kaydedilenler'); } });
    bt.querySelector('button').classList.add('k-dk44'); /* kitin bant düğmesi 36: görünmez 44 alan */
    bt.style.bottom = document.querySelector('.mo.acik') ? 'calc(var(--ac-h) + 74px)' : '';
  }
  /* Yeniden dene: düğmede gösterge, sonra hal kalkar */
  document.addEventListener('click', function(ev){ var y = ev.target.closest('[data-yeniden]'); if (!y) return;
    y.classList.add('is-yukleniyor'); y.innerHTML = K.I('fa-circle-notch', 'fa-spin') + '<span>Deneniyor</span>';
    setTimeout(function(){ var q = new URLSearchParams(location.search); ['durum', 'hata', 'hal', 'onbellek'].forEach(function(x){ q.delete(x); }); location.search = q.toString(); }, 1200); });
})();

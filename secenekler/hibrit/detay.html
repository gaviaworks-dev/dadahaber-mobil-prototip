<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>Hibrit · Detay</title>
<link rel="stylesheet" href="../_ortak/cerceve.css">
<link rel="stylesheet" href="../_ortak/marka.css">
<link rel="stylesheet" href="hibrit.css">
<link rel="stylesheet" href="hikaye-modu.css">
<script src="../_ortak/icerik.js"></script>
<script src="../_ortak/cerceve.js"></script>
<script src="../_ortak/icerik-ek.js"></script>
<script src="hibrit.js"></script>
<script src="hikaye-modu.js"></script>
<style>
/* Detay (K19: HB-4 "Kişisel önce" tabanı, bütün hibritlerde aynı). Sıra Beyar'dan (K20; K28: içerik paneli kapağın üstüne biner, Kaydet sağ üstte, 15 sn'de 1 dk düğmesi yok): kapak + başlık → bilgi satırı (saat, güncelleme, süre)
   → açıklama (spot) → K17 derinlik sekmeleri 15 sn · 1 dk · Tam metin → K18 bölüm sekmeleri (Bana etkisi · Neden önemli · Bundan sonra; dokununca
   ya da yana kaydırınca yerinde değişir, aşağı kaydırma yok) → kaynaklar yatay şerit (vurgusuz) → yorum → sıradaki haberler.
   "Hikâye modunda oku" sayfaya serpiştirilir: açıklamanın altında, 15 sn sonunda, tam metnin ortasında, bölümlerin sonunda ve okuma çubuğunda.
   ?derinlik=15sn|1dk|tam · ?bolum=bana|neden|sonra · ?kay=px · ?mod=hikaye (?kart=n, ?dur=1) · ?aa=1 yazı ayarı açık. */
:root{--mb:16px} /* yazı ölçeği (K29): okuma metni --mb; öne çıkan +2; ara başlık +4; ikincil -2. Aa ayarı hepsini birlikte büyütür */
.ust-d{position:absolute;left:0;right:0;top:0;z-index:70;height:calc(var(--ust-guvenli) + 52px);padding:var(--ust-guvenli) 12px 0;display:flex;align-items:center;gap:8px;transition:background .25s,border-color .25s;border-bottom:1px solid transparent}
.ust-d .d{width:44px;height:44px;border-radius:var(--k-daire);display:grid;place-items:center;font-size:16px;color:#fff;background:var(--cam);border:1px solid var(--cam-cizgi);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);flex:none;transition:background .25s,color .25s}
.ust-d .bt{flex:1;min-width:0;font-size:15px;font-weight:var(--y-kalin);text-align:center;opacity:0;transition:opacity .25s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ust-d .bos{width:44px;flex:none}
.ust-d .il{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--marka)}
.ust-d.dolu{background:linear-gradient(rgba(10,10,10,.6),rgba(10,10,10,.6)),var(--ust-g) center 35%/cover;color:#fff} /* daralınca kapak görseli (K30) */
.ust-d.dolu .d{background:transparent;border-color:transparent;color:#fff}
.ust-d.dolu .bt{opacity:1}
.ust-d .d.on{color:var(--marka)}
.ust-d.dolu .d.on{color:var(--marka)}
.kapak{position:sticky;top:0;z-index:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 var(--kenar) 48px;color:#fff;isolation:isolate;background-size:cover;background-position:center}
.kapak::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(10,10,10,.94) 8%,rgba(10,10,10,.55) 44%,rgba(10,10,10,.05) 72%,rgba(10,10,10,.35))}
.kapak .kat{display:inline-flex;align-items:center;gap:var(--ikon-bosluk);font-size:13px;font-weight:var(--y-kalin);color:var(--marka)}
.kapak h1{margin-top:12px;font-size:31px;line-height:1.1;letter-spacing:-.028em}
.imza{margin-top:18px;display:flex;align-items:center;gap:10px;min-width:0}
.av{width:36px;height:36px;border-radius:var(--k-daire);display:grid;place-items:center;font-weight:var(--y-kalin);font-size:14px;flex:none;background:var(--marka);color:var(--siyah)}
.imza .t{min-width:0;line-height:1.25}
.imza b{display:block;font-size:14.5px;white-space:nowrap}
.imza small{display:block;font-size:12.5px;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oynat{position:absolute;right:16px;top:calc(var(--ust-guvenli) + 64px);display:flex;align-items:center;gap:10px;height:44px;padding:0 16px 0 6px;border-radius:var(--k-kart);background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:13.5px;font-weight:var(--y-kalin);color:#fff}
.oynat i{width:32px;height:32px;border-radius:var(--k-daire);background:#fff;color:var(--siyah);display:grid;place-items:center;font-size:11px;padding-left:2px}
.altyazi{padding:10px var(--kenar) 0;font-size:12px;color:var(--metin-3)}
.metin{padding:4px 0 0;font-size:var(--mb);line-height:1.62}
.spot{font-size:calc(var(--mb) + 2px);line-height:1.5;letter-spacing:-.01em}
.zaman{margin-top:16px;display:flex;gap:14px;font-size:13px;color:var(--metin-3);white-space:nowrap}
.zaman span{display:inline-flex;align-items:center;gap:6px}
.zaman i{font-size:11px}
.takip{margin-top:16px}
.takip small{display:block;font-size:12.5px;font-weight:var(--y-kalin);color:var(--metin-3);margin-bottom:8px}
.takip .ks{gap:8px;margin:0 -18px;padding:0 18px}
.takip a{flex:none;height:38px;padding:0 12px;border-radius:var(--k-ic);border:1px solid var(--cizgi);display:inline-flex;align-items:center;gap:var(--ikon-bosluk);font-size:14px;white-space:nowrap}
.takip a i{font-size:11px;color:var(--marka-metin)}
.takip a.on{background:var(--marka);border-color:var(--marka);color:var(--siyah);font-weight:var(--y-kalin)}
.takip a.on i{color:var(--siyah)}
/* K17 derinlik sekmeleri (HD-B): yapışkan, üst çubuğun altında */
.seg-kap{position:sticky;top:calc(var(--ust-guvenli) + 52px);z-index:60;background:var(--zemin);padding:12px var(--kenar)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:var(--k-kontrol);background:var(--zemin-2);position:relative}
.seg button{position:relative;z-index:1;height:46px;border-radius:var(--k-ic);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:14px;font-weight:var(--y-kalin);color:var(--metin-3)}
.seg button small{font-size:11px;font-weight:var(--y-orta)}
.seg button.etkin{color:var(--metin)}
.seg .kayar{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:var(--k-ic);background:var(--yuzey);box-shadow:var(--golge-sm);transition:transform .3s cubic-bezier(.3,.7,.2,1)}
.panel{display:none;padding:4px var(--kenar) 0}
.panel.etkin{display:block;animation:gel .28s ease}
@keyframes gel{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ai{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:var(--y-orta);color:var(--metin-3);white-space:nowrap}
.ai i{color:var(--marka-metin)}
.madde{list-style:none;margin-top:12px;display:grid;gap:10px}
.madde li{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:12px 14px;border-radius:var(--k-kontrol);background:var(--zemin-2);font-size:calc(var(--mb) - 1px);line-height:1.5;font-weight:var(--y-orta)}
.madde li i{width:24px;height:24px;border-radius:var(--k-daire);background:var(--marka);color:var(--siyah);display:grid;place-items:center;font-size:11px}
.etkisi{margin-top:10px;display:grid;grid-template-columns:28px 1fr;gap:12px;padding:16px;border-radius:var(--k-kontrol);background:var(--marka-25)}
.etkisi>i{width:28px;height:28px;border-radius:var(--k-daire);background:var(--siyah);color:var(--marka);display:grid;place-items:center;font-size:12px}
.etkisi b{display:block;font-size:12.5px;color:var(--marka-metin);letter-spacing:.06em;text-transform:uppercase}
.etkisi p{margin-top:4px;font-size:var(--mb);line-height:1.45;font-weight:var(--y-kalin)}
.gec{margin-top:16px;width:100%;height:52px;border-radius:var(--k-kontrol);border:1.5px solid var(--metin);display:flex;align-items:center;justify-content:center;gap:var(--ikon-bosluk);font-size:15px;font-weight:var(--y-kalin)}
/* K18 bölüm sekmeleri (HD-C bölümleri): içerik yerinde değişir */
.bl{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--kenar));padding:2px var(--kenar) 12px;scroll-padding-inline:var(--kenar)}
.bl::-webkit-scrollbar{display:none}
.bl button{flex:none;height:40px;padding:0 14px;border-radius:var(--k-ic);border:1px solid var(--cizgi);display:inline-flex;align-items:center;gap:var(--ikon-bosluk);font-size:14px;font-weight:var(--y-kalin);white-space:nowrap;color:var(--metin-2)}
.bl button i{font-size:12px;color:var(--marka-metin)}
.bl button.etkin{background:var(--metin);border-color:var(--metin);color:var(--zemin)}
.bl button.etkin i{color:var(--marka)}
.bk{touch-action:pan-y}
.bk>section{display:none;padding:18px;border-radius:var(--k-kart);background:var(--zemin-2)}
.bk>section.etkin{display:block;animation:gel .24s ease}
.kb{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.kb .ik{width:32px;height:32px;border-radius:var(--k-ic);background:var(--marka);color:var(--siyah);display:grid;place-items:center;font-size:13px;flex:none}
.kb h2{font-size:var(--mb);letter-spacing:-.015em}
.kb .sy{margin-left:auto;font-size:12px;color:var(--metin-3);white-space:nowrap}
.bk .duz{font-size:calc(var(--mb) - 1px);line-height:1.55}
.bk .buyuk{font-size:var(--mb);line-height:1.5;font-weight:var(--y-kalin);letter-spacing:-.015em}
.bk .madde{margin-top:14px}
.cizelge{list-style:none;position:relative}
.cizelge li{position:relative;padding:0 0 16px 30px}
.cizelge li::before{content:"";position:absolute;left:6px;top:6px;width:12px;height:12px;border-radius:var(--k-daire);border:3px solid var(--marka);background:var(--zemin-2)}
.cizelge li::after{content:"";position:absolute;left:11px;top:22px;bottom:2px;width:2px;background:var(--cizgi)}
.cizelge li:last-child::after{display:none}
.cizelge li:last-child::before{background:var(--marka)}
.cizelge b{display:block;font-size:13px;color:var(--marka-metin)}
.cizelge span{display:block;margin-top:2px;font-size:calc(var(--mb) - 1px);line-height:1.45;font-weight:var(--y-orta)}
.bk .not{margin-top:6px;font-size:calc(var(--mb) - 2px);line-height:1.5;color:var(--metin-2)}
.sir{margin-top:16px;width:100%;min-height:48px;padding:0 6px 0 14px;border-radius:var(--k-ic);background:var(--yuzey);display:flex;align-items:center;gap:var(--ikon-bosluk);font-size:14px;color:var(--metin-3);text-align:left}
.sir b{color:var(--metin)}
.sir>i{margin-left:auto;width:36px;height:36px;border-radius:var(--k-ic);background:var(--metin);color:var(--zemin);display:grid;place-items:center;font-size:12px}
.nokta{display:flex;justify-content:center;gap:6px;margin-top:12px}
.nokta i{width:6px;height:6px;border-radius:var(--k-cubuk);background:var(--cizgi);transition:width .25s,background .25s}
.nokta i.on{width:18px;background:var(--metin)}
.govde{margin-top:24px}
.govde p{margin-bottom:20px}
.govde h2{font-size:calc(var(--mb) + 4px);line-height:1.25;letter-spacing:-.015em;margin:30px 0 12px}
.govde figure{margin:28px calc(-1 * var(--kenar))}
.govde figure .gr{height:240px}
.govde figcaption{padding:10px var(--kenar) 0;font-size:12.5px;line-height:1.45;color:var(--metin-3)}
.blk{margin-top:36px}
.blk>h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.blk>h2{margin-bottom:12px}
.kaynak{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--cizgi);font-size:14px;line-height:1.4}
.kaynak i{width:20px;color:var(--metin-3);font-size:13px;margin-top:3px}
.kaynak b{display:block}
.kaynak span{color:var(--metin-3);font-size:13px}
.etiket{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--kenar));padding:0 var(--kenar)}
.etiket::-webkit-scrollbar{display:none}
.etiket a{flex:none;height:38px;padding:0 14px;display:inline-flex;align-items:center;border-radius:var(--k-ic);border:1px solid var(--cizgi);font-size:14px;white-space:nowrap}
/* yorumlar: Dada Gastro detay-v2 yorum yapısı */
.blk.rvs>h2{font-size:calc(var(--mb) + 4px);letter-spacing:-.015em;text-transform:none;margin-bottom:14px}
.rv-oz{display:grid;grid-template-columns:118px minmax(0,1fr);gap:16px;align-items:center;padding:16px;border:1px solid var(--cizgi);border-radius:var(--k-kontrol)}
.rv-s{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;padding-right:16px;border-right:1px solid var(--cizgi)}
.rv-s b{font-size:34px;line-height:1;letter-spacing:-.02em}
.rv-s small{font-size:12px;color:var(--metin-3);white-space:nowrap}
.rv-s small.ok{margin-top:4px;color:var(--metin-2);font-weight:var(--y-kalin);display:inline-flex;align-items:center;gap:5px}
.rv-s small.ok i{color:var(--marka-metin)}
.rv-bar{list-style:none;display:grid;gap:8px}
.rv-bar li{display:grid;grid-template-columns:86px minmax(0,1fr) 16px;gap:8px;align-items:center;font-size:12px;color:var(--metin-2);white-space:nowrap}
.rv-bar .tr{height:6px;border-radius:var(--k-cubuk);background:var(--zemin-2);overflow:hidden}
.rv-bar .tr i{display:block;height:100%;border-radius:var(--k-cubuk);background:var(--marka)}
.rv-bar .n{text-align:right;color:var(--metin-3)}
.rv-btn{margin-top:14px;width:100%;height:52px;border-radius:var(--k-kontrol);background:var(--marka);color:var(--siyah);display:flex;align-items:center;justify-content:center;gap:var(--ikon-bosluk);font-size:15.5px;font-weight:var(--y-kalin)}
.rv-not{margin-top:10px;display:flex;gap:8px;font-size:12.5px;line-height:1.45;color:var(--metin-3)}
.rv-not i{margin-top:2px;color:var(--marka-metin)}
.rv-f{gap:8px;margin:16px calc(-1 * var(--kenar)) 2px;padding:0 var(--kenar)}
.rv-f button{flex:none;height:38px;padding:0 12px;border-radius:var(--k-ic);border:1px solid var(--cizgi);background:var(--zemin);font-size:13.5px;font-weight:var(--y-orta);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.rv-f button span{color:var(--metin-3)}
.rv-f button.on{background:var(--marka-25);border-color:var(--marka);color:var(--marka-metin);font-weight:var(--y-kalin)}
.rv-f button.on span{color:inherit}
.rv{padding:18px 0;border-bottom:1px solid var(--cizgi)}
.rv-h{display:flex;align-items:center;gap:12px}
.rv-h .av{width:40px;height:40px;font-size:15px;background:var(--zemin);color:var(--metin-2);border:1px solid var(--cizgi);flex:none}
.rv-w{min-width:0}
.rv-w b{display:block;font-size:15px}
.rv-m{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--metin-3);white-space:nowrap}
.rv-m i{color:var(--marka-metin);font-size:11px}
.rv-m .nk{margin:0 2px}
.rv>p{margin-top:10px;font-size:calc(var(--mb) - 1px);line-height:1.55}
.rv-a{margin-top:8px;display:flex;gap:18px;margin-left:-6px}
.rv-a button{min-height:40px;padding:0 6px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:var(--y-orta);color:var(--metin-2)}
.rv-a button i{font-size:12.5px;color:var(--metin-3)}
.rv-a button b{font-weight:var(--y-kalin)}
.rv-a button.on,.rv-a button.on i{color:var(--marka-metin)}
.rv-y{margin-top:10px;padding:14px 16px;border-radius:var(--k-kontrol);background:var(--zemin-2)}
.rv-y b{display:flex;align-items:center;gap:8px;font-size:14.5px}
.rv-y .own{display:inline-flex;align-items:center;gap:5px;color:var(--marka-metin);font-size:13px}
.rv-y p{margin-top:6px;font-size:calc(var(--mb) - 2px);line-height:1.5;color:var(--metin-2)}
.rv-y small{display:block;margin-top:6px;font-size:12px;color:var(--metin-3)}
.tum-y{margin-top:6px;display:flex;align-items:center;justify-content:space-between;min-height:48px;font-size:14px;font-weight:var(--y-kalin)}
.ilgili a{display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--cizgi)}
.ilgili h3{font-size:calc(var(--mb) - 1px);line-height:1.3}
.ilgili small{display:block;margin-top:6px;font-size:12.5px;color:var(--metin-3)}
.ilgili .gr{width:76px;height:76px;border-radius:var(--k-ic)}
.ortak-alt{padding:0 var(--kenar)}
/* içerik paneli: kapağın üstüne biner, yukarı kaydırınca görselin üzerinden geçer (ana sayfa hero'su gibi yuvarlak köşe; K28) */
.yaprak{position:relative;z-index:1;margin-top:-24px;background:var(--zemin);border-radius:var(--k-kart) var(--k-kart) 0 0}
.bas-alt{padding:20px var(--kenar) 0}
.ozet-p{margin-top:16px;font-size:var(--mb);line-height:1.62}
.ozet-p+.ozet-p{margin-top:12px}
.bas-alt .zaman{margin-top:0}
.bas-alt .spot{margin-top:12px}
.bolum-kap{padding:22px var(--kenar) 0}
.bolum-kap>h2,.kyn>h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
/* kaynaklar: vurgusuz yatay şerit; 3-4'ten fazla olunca kayar */
.kyn{margin-top:30px}
.kyn>h2{padding:0 var(--kenar)}
.kyn .ks{gap:10px;padding:0 var(--kenar)}
.kyn a{flex:none;width:236px;min-height:74px;padding:12px 14px;border-radius:var(--k-ic);border:1px solid var(--cizgi);display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;scroll-snap-align:start}
.kyn a i{color:var(--metin-3);font-size:13px;margin-top:3px}
.kyn b{display:block;font-size:13.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kyn span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px;font-size:12.5px;line-height:1.4;color:var(--metin-3)}
/* hikâye modu düğmesi: tek biçim, sayfada birkaç yerde */
.hmb{margin-top:16px;width:100%;display:grid;grid-template-columns:40px minmax(0,1fr) 20px;gap:12px;align-items:center;padding:8px 14px 8px 8px;border-radius:var(--k-kontrol);background:var(--siyah);color:#fff;text-align:left}
.hmb .ik{width:40px;height:40px;border-radius:var(--k-ic);background:var(--marka);color:var(--siyah);display:grid;place-items:center;font-size:15px}
.hmb b{display:block;font-size:14.5px}
.hmb small{display:block;font-size:12px;color:rgba(255,255,255,.66)}
.hmb>i{color:var(--marka);font-size:13px}
html[data-tema="koyu"] .hmb{background:var(--yuzey-2)}
.govde .hmb{margin:6px 0 26px}
.dip{height:160px}
/* yüzen okuma çubuğu: her iki temada koyu */
.okuma{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--alt-guvenli) - 6px);z-index:80;display:flex;align-items:center;gap:2px;padding:6px;border-radius:var(--k-kart);background:var(--koyu-y);box-shadow:var(--golge-md);transition:transform .3s,opacity .3s}
.okuma button{height:48px;min-width:48px;border-radius:var(--k-kontrol);display:grid;place-items:center;color:#fff;font-size:17px}
.okuma .dinle{white-space:nowrap;display:flex;align-items:center;gap:10px;padding:0 18px 0 6px;background:var(--marka);color:var(--siyah);font-size:14.5px;font-weight:var(--y-kalin)}
.okuma .dinle i{width:36px;height:36px;border-radius:var(--k-daire);background:var(--siyah);color:var(--marka);display:grid;place-items:center;font-size:12px;padding-left:2px}
.okuma .yr{position:relative}
.okuma .yr small{position:absolute;top:6px;right:4px;min-width:18px;height:18px;padding:0 4px;border-radius:var(--k-cubuk);background:var(--marka);color:var(--siyah);font-size:10.5px;font-weight:var(--y-kalin);display:grid;place-items:center}
.okuma .aa{font-size:15px;font-weight:var(--y-kalin);letter-spacing:-.02em}
.okuma .hmd{color:var(--marka)}
.okuma.gizli{transform:translate(-50%,120px);opacity:0}
.hm-acik .okuma,.hm-acik .mo,.hm-acik .ust-d{visibility:hidden}
.perde{position:absolute;inset:0;z-index:90;background:var(--ortu);opacity:0;pointer-events:none;transition:opacity .25s}
.sayfa{position:absolute;left:0;right:0;bottom:0;z-index:91;background:var(--yuzey);border-radius:var(--k-kart) var(--k-kart) 0 0;padding:10px 20px calc(var(--alt-guvenli) + 10px);transform:translateY(105%);transition:transform .3s cubic-bezier(.3,.7,.2,1)}
.sayfa .tut{width:36px;height:5px;border-radius:var(--k-cubuk);background:var(--cizgi);margin:0 auto 14px}
.sayfa h2{font-size:18px}
.boy{margin-top:16px;display:flex;align-items:center;gap:14px}
.boy input{flex:1;accent-color:var(--siyah);height:44px}
html[data-tema="koyu"] .boy input{accent-color:var(--marka)}
.aa-acik .perde{opacity:1;pointer-events:auto}
.aa-acik .sayfa{transform:none}
</style>
</head>
<body class="detay-ekr" data-durum="acik">
<div class="ekran" id="e"></div>
<div class="ust-d" id="ust">
  <a class="d" id="geri" aria-label="Geri"><i class="fa-solid fa-chevron-left"></i></a>
  <span class="bt" id="ustbas"></span>
  <button class="d" type="button" id="kaydet" aria-label="Kaydet" aria-pressed="false"><i class="fa-solid fa-bookmark"></i></button>
  <span class="il" id="il"></span>
</div>
<nav class="okuma" id="okuma" aria-label="Okuma çubuğu"></nav>
<div class="perde" id="perde"></div>
<div class="sayfa" role="dialog" aria-label="Yazı ayarı">
  <div class="tut"></div>
  <h2>Yazı Boyutu</h2>
  <div class="boy"><span style="font-size:14px">A</span><input id="boy" type="range" min="15" max="22" step="0.5" value="16" aria-label="Yazı boyutu"><span style="font-size:22px">A</span></div>
</div>
<script>
(function(){
  var d = D.detay, $ = function(i){ return document.getElementById(i); }, Q = new URLSearchParams(location.search);
  var KAPAK = 400;
  document.title = 'Detay · ' + H.cfg.kod;
  $('geri').href = H.liste();
  $('ustbas').textContent = d.baslik;
  $('ust').style.setProperty('--ust-g', G(d.g));
  var HMD = 'data-hm-ac';
  var hm = function(alt){ return '<button class="hmb" type="button" ' + HMD + '><span class="ik"><i class="fa-solid fa-layer-group"></i></span><span><b>Hikâye modunda oku</b><small>' + alt + '</small></span><i class="fa-solid fa-chevron-right"></i></button>'; };
  var li = function(m){ return '<li><i class="fa-solid fa-check"></i><span>' + m + '</span></li>'; };
  var ai = '<span class="ai"><i class="fa-solid fa-wand-magic-sparkles"></i>Yapay zekâ ile özetlendi</span>';
  var pi = 0;
  var govde = d.govde.map(function(b){
    if (b.p) { pi++; return '<p>' + b.p + '</p>' + (pi === 2 ? hm('Bu haber 6 kartta · yaklaşık 1 dk') : ''); }
    if (b.h) return '<h2>' + b.h + '</h2>';
    return '<figure><div class="gr" style="background-image:' + G(b.gorsel) + '"></div><figcaption>' + b.altyazi + '</figcaption></figure>'; }).join('');

  /* K18 bölümler: haberin altında, sekmeli. Kişisel önce: ilk bölüm Bana etkisi */
  var BL = [
    { k: 'bana', ad: 'Bana etkisi', ik: 'fa-user', h: '<p class="duz">' + d.banaEtkisi + '</p>' +
      '<div class="takip"><small>Bu haberin konularını takip et</small><div class="ks">' + d.etiketler.map(function(t){ return '<a data-tkp><i class="fa-solid fa-plus"></i>' + t + '</a>'; }).join('') + '</div></div>' },
    { k: 'neden', ad: 'Neden önemli', ik: 'fa-circle-exclamation', h: '<p class="buyuk">' + d.nedenOnemli + '</p>' },
    { k: 'sonra', ad: 'Bundan sonra', ik: 'fa-forward', h: '<ol class="cizelge"><li><b>4 Aralık Perşembe</b><span>İlk toplantı: veri paylaşımı, rakam beklenmiyor</span></li><li><b>Aralık boyunca</b><span>En az dört toplantı</span></li><li><b>Yılın son haftası</b><span>Kararın açıklanması</span></li><li><b>1 Ocak 2027</b><span>Yeni asgari ücret geçerli</span></li></ol><p class="not">' + d.bundanSonra + '</p>' }
  ];
  var bolumler = '<section class="bolum-kap"><div class="bl" role="tablist" aria-label="Haberin bölümleri">' + BL.map(function(b, i){ return '<button type="button" role="tab" data-b="' + i + '"><i class="fa-solid ' + b.ik + '"></i>' + b.ad + '</button>'; }).join('') + '</div>' +
    '<div class="bk" id="bk">' + BL.map(function(b, i){
      var s = BL[i + 1];
      return '<section role="tabpanel" data-bp="' + i + '"><div class="kb"><span class="ik"><i class="fa-solid ' + b.ik + '"></i></span><h2>' + b.ad + '</h2><span class="sy tnum">' + (i + 1) + ' / ' + BL.length + '</span></div>' + b.h +
        (s ? '<button class="sir" type="button" data-b="' + (i + 1) + '">Sıradaki: <b>' + s.ad + '</b><i class="fa-solid fa-arrow-right"></i></button>' : hm('Hepsi 6 kartta, dokunarak geç')) + '</section>'; }).join('') +
    '</div><div class="nokta" aria-hidden="true">' + BL.map(function(){ return '<i></i>'; }).join('') + '</div></section>';

  var kapak = '<header class="kapak" id="kapak" style="height:' + KAPAK + 'px;background-image:' + G(d.g) + '">' +
    '<button class="oynat" type="button"><i class="fa-solid fa-play"></i>Video · ' + d.video + '</button>' +
    '<span class="kat"><i class="fa-solid fa-newspaper"></i>' + d.yol.join(' · ') + '</span><h1>' + d.baslik + '</h1>' +
    '<div class="imza"><span class="av">' + d.yazar.charAt(0) + '</span><span class="t"><b>' + d.yazar + '</b><small>' + d.unvan + '</small></span></div></header>';
  var basAlt = '<div class="bas-alt"><div class="zaman"><span><i class="fa-solid fa-clock"></i>' + d.tarih.replace(/ \d{4}$/, '') + ' · ' + d.saat + '</span><span><i class="fa-solid fa-rotate"></i>' + d.guncelleme + ' Güncellendi</span><span><i class="fa-solid fa-book-open"></i>' + d.sure + '</span></div>' +
    '<p class="spot">' + d.spot + '</p></div>';
  var seg = '<div class="seg-kap"><div class="seg" role="tablist" aria-label="Okuma derinliği"><span class="kayar" id="kayar"></span>' +
    '<button type="button" role="tab" data-d="0">15 sn<small>3 madde</small></button>' +
    '<button type="button" role="tab" data-d="1">1 dk<small>Özet</small></button>' +
    '<button type="button" role="tab" data-d="2">Tam metin<small>' + d.sure + '</small></button></div></div>';
  var p0 = '<section class="panel" data-p="0">' + ai + '<ul class="madde">' + d.ozet.map(li).join('') + '</ul>' +
    '</section>';
  var p1 = '<section class="panel" data-p="1">' + ai + '<ul class="madde">' + d.ozet.map(li).join('') + '</ul>' +
    '<p class="ozet-p">' + d.govde[0].p + '</p><p class="ozet-p">' + d.govde[1].p + '</p>' +
    '<button class="gec" type="button" data-git="2">Haberin tamamını oku<i class="fa-solid fa-arrow-right"></i></button></section>';
  var p2 = '<section class="panel" data-p="2"><article class="metin"><div class="govde">' + govde + '</div><p class="altyazi" style="padding:0">Kapak: ' + d.altyazi + '</p></article></section>';
  var kyn = '<section class="kyn"><h2>Kaynaklar · ' + d.kaynaklar.length + '</h2><div class="ks">' + d.kaynaklar.map(function(k){ return '<a><i class="fa-solid fa-file-lines"></i><span style="display:block;margin:0;color:inherit"><b>' + k.kurum + '</b><span>' + k.aciklama + '</span></span></a>'; }).join('') + '</div></section>';
  /* yorumlar (K31): Dada Gastro detay-v2 yorum yapısının aynısı; yıldız yerine haberde okur özeti */
  function yrm(y){
    return '<article class="rv"><div class="rv-h"><span class="av">' + y.ad.charAt(0) + '</span><div class="rv-w"><b>' + y.ad + '</b><span class="rv-m"><i class="fa-solid fa-award"></i>' + y.rozet + '<span class="nk">·</span>' + y.zaman + '</span></div></div>' +
      '<p>' + y.metin + '</p><div class="rv-a"><button type="button" data-begen><i class="fa-solid fa-thumbs-up"></i><span>Beğen</span><b class="tnum">' + y.begeni + '</b></button>' +
      '<button type="button"><i class="fa-solid fa-flag"></i><span>Bildir</span></button><button type="button"><i class="fa-solid fa-comment"></i><span>Yanıtla</span></button></div>';
  }
  var Y = d.yorumlar, yorumlar = '', begeni = 0, rozet = {};
  Y.forEach(function(y, i){
    begeni += y.begeni; rozet[y.rozet] = (rozet[y.rozet] || 0) + 1;
    if (y.rozet === 'Editör') return;
    var r = Y[i + 1] && Y[i + 1].rozet === 'Editör' ? Y[i + 1] : null;
    yorumlar += yrm(y) + (r ? '<div class="rv-y"><b>Dada Haber <span class="own"><i class="fa-solid fa-pen-nib"></i>Editör</span></b><p>' + r.metin + '</p><small>' + r.zaman + '</small></div>' : '') + '</article>';
  });
  var ozet = '<div class="rv-oz"><div class="rv-s"><b class="tnum">' + Y.length + '</b><small>yorum</small><small class="ok"><i class="fa-solid fa-thumbs-up"></i>' + begeni + ' beğeni</small><small>1 editör yanıtı</small></div>' +
    '<ul class="rv-bar">' + Object.keys(rozet).map(function(k){ return '<li><span>' + k + '</span><span class="tr"><i style="width:' + (rozet[k] / Y.length * 100) + '%"></i></span><span class="n tnum">' + rozet[k] + '</span></li>'; }).join('') + '</ul></div>';
  var yaz = H.uye
    ? '<button class="rv-btn" type="button"><i class="fa-solid fa-pen"></i><span>Yorum yaz</span></button><p class="rv-not"><i class="fa-solid fa-circle-info"></i>Yorumlar denetim sonrası yayınlanır.</p>'
    : '<button class="rv-btn" type="button"><i class="fa-solid fa-right-to-bracket"></i><span>Yorum yapmak için giriş yap</span></button><p class="rv-not"><i class="fa-solid fa-circle-info"></i>Habere yorum yazmak ve yorumlara katılmak için Dada Haber hesabına giriş yapman gerekiyor. Yorumları okumak serbest.</p>';
  var suz = '<div class="rv-f ks"><button class="on" type="button">Tümü <span>' + Y.length + '</span></button><button type="button">En çok beğenilen</button><button type="button">Editör yanıtı <span>1</span></button><button type="button">Düzenli okur <span>' + (rozet['Düzenli okur'] || 0) + '</span></button></div>';
  var alt = '<div class="ortak-alt"><section class="blk rvs" id="yorumlar"><h2>Yorumlar (' + Y.length + ')</h2>' + ozet + yaz + suz + yorumlar +
    '<a class="tum-y">Bütün yorumları oku<i class="fa-solid fa-chevron-right"></i></a></section>' +
    '<section class="blk ilgili"><h2>Sıradaki Haberler</h2>' + d.ilgili.map(function(x){ return '<a href="' + H.detay() + '"><div><h3>' + x.baslik + '</h3><small>' + x.kat + ' · ' + x.sure + '</small></div><div class="gr" style="background-image:' + G(x.g) + '"></div></a>'; }).join('') + '</section></div>';
  $('e').innerHTML = kapak + '<div class="yaprak">' + basAlt + seg + p0 + p1 + p2 + bolumler + kyn + alt + '<div class="dip"></div></div>';
  $('okuma').innerHTML = '<button class="dinle" type="button"><i class="fa-solid fa-play"></i>Dinle · ' + d.dinle + '</button>' +
    '<button class="hmd" type="button" ' + HMD + ' aria-label="Hikâye modunda oku"><i class="fa-solid fa-layer-group"></i></button>' +
    '<button class="yr" type="button" id="yrd" aria-label="Yorumlar, ' + d.yorumSayisi + '"><i class="fa-solid fa-comment"></i><small>' + d.yorumSayisi + '</small></button><button type="button" aria-label="Paylaş"><i class="fa-solid fa-share-nodes"></i></button><button class="aa" type="button" aria-label="Yazı boyutu" id="aa">Aa</button>';

  var e = $('e'), segK = e.querySelector('.seg-kap');
  /* derinlik değişince içerik yerinde değişir; sekmeler üste yapışmışsa yeni içeriğin başı sekmelerin hemen altında kalır */
  function derinlik(n){
    e.querySelectorAll('.seg button').forEach(function(b){ var on = +b.dataset.d === n; b.classList.toggle('etkin', on); b.setAttribute('aria-selected', on); });
    e.querySelectorAll('.panel').forEach(function(p){ p.classList.toggle('etkin', +p.dataset.p === n); });
    $('kayar').style.transform = 'translateX(' + (n * 100) + '%)';
    var ust = segK.offsetTop + segK.offsetParent.offsetTop; if (e.scrollTop > ust) e.scrollTop = ust;
  }
  var bs = 0;
  function bolum(n){
    bs = Math.max(0, Math.min(BL.length - 1, n));
    e.querySelectorAll('.bl button').forEach(function(b){ var on = +b.dataset.b === bs; b.classList.toggle('etkin', on); b.setAttribute('aria-selected', on);
      if (on) { var r = b.parentNode; if (b.offsetLeft < r.scrollLeft + 16 || b.offsetLeft + b.offsetWidth > r.scrollLeft + r.clientWidth - 16) r.scrollLeft = b.offsetLeft - 16; } });
    e.querySelectorAll('.bk>section').forEach(function(p){ p.classList.toggle('etkin', +p.dataset.bp === bs); });
    e.querySelectorAll('.nokta i').forEach(function(x, i){ x.classList.toggle('on', i === bs); });
  }
  /* bölüm kartında yana kaydırma: sonraki / önceki bölüm */
  var x0 = null, y0 = 0;
  $('bk').addEventListener('pointerdown', function(ev){ x0 = ev.clientX; y0 = ev.clientY; });
  $('bk').addEventListener('pointerup', function(ev){ if (x0 == null) return; var dx = ev.clientX - x0, dy = ev.clientY - y0; x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) bolum(bs + (dx < 0 ? 1 : -1)); });

  document.addEventListener('click', function(ev){
    var t;
    if ((t = ev.target.closest('[data-begen]'))) { var on = t.classList.toggle('on'), n = t.querySelector('span'); n.textContent = +n.textContent + (on ? 1 : -1); }
    if (ev.target.closest('[' + HMD + ']')) HikayeModu.ac();
    if ((t = ev.target.closest('[data-tkp]'))) { var on = t.classList.toggle('on'); t.firstChild.className = 'fa-solid ' + (on ? 'fa-check' : 'fa-plus'); }
    if ((t = ev.target.closest('.seg button'))) derinlik(+t.dataset.d);
    if ((t = ev.target.closest('[data-b]'))) bolum(+t.dataset.b);
    if ((t = ev.target.closest('[data-git]'))) derinlik(+t.dataset.git);
  });
  var ust = $('ust'), ok = $('okuma'), son = 0;
  function kaydir(){
    var t = e.scrollTop, dolu = t > KAPAK - 120;
    ust.classList.toggle('dolu', dolu);
    if (!document.body.classList.contains('hm-acik')) document.body.setAttribute('data-durum', 'acik');
    $('il').style.width = Math.min(100, t / Math.max(1, e.scrollHeight - e.clientHeight) * 100) + '%';
    if (t > son + 8 && t > KAPAK + 100) ok.classList.add('gizli'); else if (t < son - 8) ok.classList.remove('gizli');
    son = t;
  }
  e.addEventListener('scroll', kaydir, { passive: true });
  window.HikayeModuKapandi = kaydir;
  $('kaydet').addEventListener('click', function(){ var on = this.getAttribute('aria-pressed') !== 'true'; this.setAttribute('aria-pressed', on); this.classList.toggle('on', on); });
  $('yrd').addEventListener('click', function(){ var y = $('yorumlar'); e.scrollTop = y.offsetTop + y.offsetParent.offsetTop - 120; });
  $('aa').addEventListener('click', function(){ document.body.classList.add('aa-acik'); });
  $('perde').addEventListener('click', function(){ document.body.classList.remove('aa-acik'); });
  $('boy').addEventListener('input', function(){ document.documentElement.style.setProperty('--mb', this.value + 'px'); });
  H.oynatici();
  derinlik({ '1dk': 1, 'tam': 2 }[Q.get('derinlik')] || 0);
  bolum(Math.max(0, BL.map(function(b){ return b.k; }).indexOf(Q.get('bolum'))));
  if (Q.get('kay')) { e.scrollTop = +Q.get('kay'); kaydir(); }
  if (Q.get('boy')) { document.documentElement.style.setProperty('--mb', Q.get('boy') + 'px'); $('boy').value = Q.get('boy'); }
  if (Q.get('aa') === '1') document.body.classList.add('aa-acik');
  if (Q.get('mod') === 'hikaye') HikayeModu.ac(+Q.get('kart') || 1);
})();
</script>
</body>
</html>

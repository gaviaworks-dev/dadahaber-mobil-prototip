<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>Kök · Ana sayfa</title>
<link rel="stylesheet" href="../_ortak/cerceve.css">
<link rel="stylesheet" href="../_ortak/marka.css">
<link rel="stylesheet" href="../_ortak/hikaye.css">
<link rel="stylesheet" href="hibrit.css">
<script src="../_ortak/icerik.js"></script>
<script src="../_ortak/cerceve.js"></script>
<script src="../_ortak/icerik-ek.js"></script>
<script src="hibrit.js"></script>
<style>
/* KÖK ANA SAYFA (K22): HB-4 "Kişisel önce" tabanı, Yasin Bey'in kurallarıyla tek sayfa.
   Hero (Dada Gastro mobil ana sayfa hero mantığı: tam genişlik görsel, üstte logo ve ikonlar, karşılama + baskı, altta kayan manşet bilgisi ve noktalar)
   → hikâye şeridi (ilk ekrana sığar) → zebra bantlar. Bölümler yalnız iki kalıpta: A = yana kayan büyük kartlar, B = alt alta liste; dönüşümlü.
   Öne çıkan bölümler Gündem · Spor · Finans · Savunma (DADAHABER-10 sırası); Kadın · Dünya · Kampüs · Keşfet aşağıda "Diğer Bölümler".
   Sıra ileride panelden yönetilir (KOK_SIRA). ?uye=0 misafir. */
:root{--kart:var(--zemin-2)}
.ekran{background:var(--zemin)}
/* ---------- hero ---------- */
.hero-k{position:relative;padding-bottom:3px}
.hilal{position:absolute;left:0;right:0;top:0;bottom:0;border-radius:0 0 var(--k-kart) var(--k-kart);background:var(--marka)} /* hero altında marka sarısı hilal şerit (K30) */
.hero{position:relative;z-index:1;height:500px;border-radius:0 0 var(--k-kart) var(--k-kart);overflow:hidden;color:#fff;background:var(--siyah)}
.hero-ray{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.hero-ray::-webkit-scrollbar{display:none}
.hero-ray>a{position:relative;flex:none;width:100%;height:100%;scroll-snap-align:start;background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:flex-end;padding:0 var(--kenar) 46px}
.hero-ray>a::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.12) 34%,rgba(0,0,0,.1) 46%,rgba(0,0,0,.86) 84%)}
.hero-ray>a>*{position:relative}
.hero-ray .et{display:inline-flex;align-items:center;gap:var(--ikon-bosluk);font-size:13px;font-weight:var(--y-kalin);color:var(--marka)}
.hero-ray .et span{color:rgba(255,255,255,.8);font-weight:var(--y-orta)}
.hero-ray h2{margin-top:8px;font-size:26px;line-height:1.14;letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty}
.hero-ray .yz{margin-top:10px;display:flex;align-items:center;gap:var(--ikon-bosluk);font-size:13px;color:rgba(255,255,255,.8);white-space:nowrap}
.hero-ray .yz .av{width:22px;height:22px;border-radius:var(--k-daire);background:#fff;color:var(--siyah);display:grid;place-items:center;font-size:11px;font-weight:var(--y-kalin)}
.hero-ust{position:absolute;left:0;right:0;top:var(--ust-guvenli);z-index:2;padding:0 var(--kenar);pointer-events:none}
.hero-ust>*{pointer-events:auto}
.hero-ust .sr{height:48px;display:flex;align-items:center;gap:8px}
.hero-ust .logo{height:25px;margin-right:auto}
.hero-ust .dd{color:#fff;background:var(--cam);border:1px solid var(--cam-cizgi);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.hero-ust .dd.av{background:var(--marka);border-color:var(--marka);color:var(--siyah)}
.hero-ust .gir{height:40px;padding:0 14px;border-radius:var(--k-kontrol);background:#fff;color:var(--siyah);font-size:14px;font-weight:var(--y-kalin);display:inline-flex;align-items:center;gap:var(--ikon-bosluk)}
.hero-ust .gun{margin-top:14px;font-size:13px;color:rgba(255,255,255,.8);font-weight:var(--y-orta)}
.hero-ust h1{margin-top:4px;font-size:30px;line-height:1.08;letter-spacing:-.025em}
.hero-ust .ebr{margin-top:10px;display:inline-flex;align-items:center;gap:var(--ikon-bosluk);height:32px;padding:0 12px;border-radius:var(--k-ic);background:var(--cam);border:1px solid var(--cam-cizgi);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:13px;font-weight:var(--y-kalin);white-space:nowrap}
.hero-ust .ebr i{color:var(--marka)}
.hero-ust .ebr em{font-style:normal;font-weight:var(--y-orta);color:rgba(255,255,255,.75)}
.hero .nk{position:absolute;left:var(--kenar);bottom:22px;z-index:2;display:flex;gap:6px;pointer-events:none}
.hero .nk i{width:6px;height:6px;border-radius:var(--k-cubuk);background:rgba(255,255,255,.45);transition:width .25s,background .25s}
.hero .nk i.on{width:20px;background:var(--marka)}
.hero .sy{position:absolute;right:var(--kenar);bottom:16px;z-index:2;font-size:12px;font-weight:var(--y-kalin);color:rgba(255,255,255,.8);pointer-events:none}
/* hero geçilince beliren üst çubuk */
.ust-k{position:absolute;left:0;right:0;top:0;z-index:70;height:calc(var(--ust-guvenli) + 48px);padding:var(--ust-guvenli) var(--kenar) 0;display:flex;align-items:center;gap:0;color:#fff;
  background:linear-gradient(rgba(10,10,10,.6),rgba(10,10,10,.6)),var(--ust-g) center 30%/cover;
  opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .2s,transform .2s}
.ust-k.acik{opacity:1;transform:none;pointer-events:auto}
.ust-k .logo{height:22px;margin-right:auto}
.ust-k .bk{font-size:12.5px;font-weight:var(--y-kalin);color:rgba(255,255,255,.85);white-space:nowrap;display:inline-flex;align-items:center;gap:var(--ikon-bosluk)}
.ust-k .bk i{color:var(--marka)}
.ust-k .dd{color:#fff}
.ust-k .dd.av{background:var(--marka);color:var(--siyah)}
.ust-k .bk{margin-left:8px} /* ikon düğmeleri bitişik (44px alanlar); zil eklenince sığması için (K35) */
/* hikâye şeridi ana sayfada hep görünür: üst çubuğun altına yapışır, yapışınca küçülür */
.bant.hk-b{position:sticky;top:calc(var(--ust-guvenli) + 48px);z-index:65;background:var(--zemin);transition:padding .2s}
.bant.hk-b.yapisik{padding:2px 0 4px;border-bottom:1px solid var(--cizgi);box-shadow:var(--golge-sm)}
.hk-b .hk-f{transition:width .2s,height .2s}
.hk-b.yapisik .hk-f{width:40px;height:40px}
.hk-b.yapisik .hk-f i{display:none}
.hk-b.yapisik .hk-o{width:50px;gap:2px}
.hk-b.yapisik .hk-a{font-size:10.5px;max-width:50px}
/* menü (K31): sağdan çekmece, Dada Gastro ortak menüsünün yapısı */
.perde-m{position:absolute;inset:0;z-index:90;background:var(--ortu);opacity:0;pointer-events:none;transition:opacity .25s}
.menu{position:absolute;top:0;right:0;bottom:0;z-index:91;width:86%;display:flex;flex-direction:column;background:var(--yuzey);transform:translateX(102%);transition:transform .32s cubic-bezier(.3,.7,.2,1);box-shadow:var(--golge-md)}
.menu-acik .perde-m{opacity:1;pointer-events:auto}
.menu-acik .menu{transform:none}
.menu .mu{flex:none;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--ust-guvenli) + 4px) var(--kenar) 8px}
.menu .mu .logo{height:24px}
.menu .mu .dd{color:var(--metin)}
.menu .mi{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:0 var(--kenar) calc(var(--alt-guvenli) + 16px)}
.mh{padding:14px;border-radius:var(--k-kontrol);background:var(--zemin-2)}
.mh .mr{display:block;font-size:17px}
.mh p{margin-top:4px;font-size:13.5px;line-height:1.45;color:var(--metin-2)}
.mh-g{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mh-g a{height:44px;border-radius:var(--k-kontrol);display:flex;align-items:center;justify-content:center;gap:var(--ikon-bosluk);font-size:14.5px;font-weight:var(--y-kalin);background:var(--yuzey);border:1px solid var(--cizgi)}
.mh-g a.a{background:var(--marka);border-color:var(--marka);color:var(--siyah)}
.mh-u{display:flex;align-items:center;gap:12px}
.mh-u .av{width:44px;height:44px;border-radius:var(--k-daire);background:var(--marka);color:var(--siyah);display:grid;place-items:center;font-size:17px;font-weight:var(--y-kalin);flex:none}
.mh-u .t{flex:1;min-width:0}
.mh-u b{display:block;font-size:16px}
.mh-u small{display:flex;align-items:center;gap:var(--ikon-bosluk);font-size:12.5px;color:var(--marka-metin);font-weight:var(--y-kalin);white-space:nowrap}
.mh-u .pr{display:inline-flex;align-items:center;gap:var(--ikon-bosluk);min-height:44px;font-size:13px;font-weight:var(--y-kalin);white-space:nowrap}
.mh-u .pr i{font-size:10px}
.mh-k{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mh-k a{position:relative;min-height:68px;padding:10px 4px;border-radius:var(--k-ic);background:var(--yuzey);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--ikon-bosluk);font-size:12px;font-weight:var(--y-kalin);text-align:center;line-height:1.2}
.mh-k a i{font-size:16px;color:var(--marka-metin)}
.mh-k .n{position:absolute;top:8px;right:12px;min-width:18px;height:18px;padding:0 5px;border-radius:var(--k-cubuk);background:var(--anlik);color:#fff;font-size:10.5px;display:grid;place-items:center}
.mn{margin-top:8px}
.mn .mt{display:block;margin:18px 0 4px;font-size:11.5px;font-weight:var(--y-kalin);letter-spacing:.12em;text-transform:uppercase;color:var(--metin-3)}
.ms,.ma summary{display:flex;align-items:center;gap:14px;min-height:50px;padding:0 10px;border-radius:var(--k-ic);font-size:15.5px;font-weight:var(--y-orta);list-style:none;cursor:pointer}
.ma summary::-webkit-details-marker{display:none}
.ms>i:first-child,.ma summary>i:first-child{width:20px;text-align:center;font-size:15px;color:var(--metin-2)}
.ms span,.ma summary span{flex:1;min-width:0}
.ms.on{background:var(--marka-25);font-weight:var(--y-kalin)}
.ms.on>i:first-child{color:var(--marka-metin)}
.ms em{font-style:normal;font-size:12.5px;color:var(--metin-3)}
.ms .cn{flex:none;display:inline-flex;align-items:center;gap:var(--ikon-bosluk);font-size:12px;font-weight:var(--y-kalin);color:var(--anlik)}
.ms .cv,.ma .cv{font-size:12px;color:var(--metin-3);transition:transform .2s}
.ma[open] .cv{transform:rotate(180deg)}
.ma[open] summary{font-weight:var(--y-kalin)}
.mc{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 12px 44px}
.mc a{height:36px;padding:0 14px;border-radius:var(--k-ic);border:1px solid var(--cizgi);display:inline-flex;align-items:center;font-size:14px;white-space:nowrap}
.mc a.tm{width:100%;border:0;padding:0;height:44px;justify-content:space-between;font-weight:var(--y-kalin);color:var(--marka-metin)}
.mc a.tm i{font-size:10px}
.mf{margin-top:16px;padding-top:12px;border-top:1px solid var(--cizgi)}
.mf .ms span{font-size:14.5px}
/* kurumsal bağlantılar: tek satır, yana kayan şerit (Beyar) */
.mf .mf-bag{margin:4px calc(-1 * var(--kenar)) 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 var(--kenar);scroll-padding-inline:var(--kenar)}
.mf .mf-bag::-webkit-scrollbar{display:none}
.mf .mf-bag a{flex:none;min-height:44px;padding:0 12px;border-radius:var(--k-ic);background:var(--zemin-2);display:inline-flex;align-items:center;font-size:13px;color:var(--metin-2);white-space:nowrap}
/* ---------- zebra bantlar ---------- */
.bant{padding:26px 0}
.bant.ton{background:var(--zemin-2);--kart:var(--yuzey)}
.bant.hk-b{padding:4px 0 10px}
.bant .bb{margin-bottom:10px}
.bant .kt-tek{margin:0 var(--kenar)}
.bant .kt-tek+.kt-tek{margin-top:12px}
.bant .sd-ray a,.bant .kt.sen{background:var(--kart)}
.bant .sen .cp span{background:var(--zemin)}
.bant.ton .sen .cp span{background:var(--zemin-2)}
/* A: yana kayan büyük kartlar */
.ka{gap:12px;padding:0 var(--kenar)}
.ka>a{flex:none;width:300px;scroll-snap-align:start;display:flex;flex-direction:column}
.ka .gr{height:188px;border-radius:var(--k-kontrol);position:relative}
.ka .gr .md{position:absolute;left:10px;bottom:10px;height:28px;padding:0 10px;border-radius:var(--k-ic);background:var(--cam);border:1px solid var(--cam-cizgi);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-size:12px;font-weight:var(--y-kalin);display:inline-flex;align-items:center;gap:var(--ikon-bosluk)}
.ka .et{margin-top:12px;font-size:12.5px;font-weight:var(--y-kalin);color:var(--marka-metin);white-space:nowrap}
.ka h3{margin-top:12px;font-size:19px;line-height:1.24;letter-spacing:-.015em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ka .meta,.kb .meta{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--metin-3);white-space:nowrap}
/* B: alt alta liste */
.kb{list-style:none;padding:0 var(--kenar)}
.kb li+li a{border-top:1px solid var(--cizgi)}
.kb a{display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:14px;align-items:center;padding:14px 0}
.kb .et{font-size:12px;font-weight:var(--y-kalin);color:var(--marka-metin);white-space:nowrap}
.kb h3{margin-top:0;font-size:16px;line-height:1.3;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kb .gr{width:88px;height:88px;border-radius:var(--k-ic)}
.kb li:first-child a{padding-top:2px}
.kb.dg a{grid-template-columns:40px minmax(0,1fr) 16px;gap:12px;padding:12px 0}
.kb.dg .bi{width:40px;height:40px;border-radius:var(--k-ic);display:grid;place-items:center;background:var(--marka-25);color:var(--marka-metin);font-size:15px}
.kb.dg b{display:block;font-size:15px}
.kb.dg span.t{min-width:0}
.kb.dg small{display:block;margin-top:2px;font-size:13.5px;color:var(--metin-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb.dg>li>a>i{font-size:12px;color:var(--metin-3)}
/* ayraçlar: sade, kompakt */
.ky{margin:0 var(--kenar);min-height:64px;padding:10px 14px 10px 10px;border-radius:var(--k-kontrol);background:var(--kart);display:flex;align-items:center;gap:12px}
.ky+.ky{margin-top:10px}
.ky .ik{width:44px;height:44px;border-radius:var(--k-ic);background:var(--marka-25);color:var(--marka-metin);display:grid;place-items:center;font-size:17px;flex:none}
.ky .t{min-width:0;flex:1}
.ky .t small{display:block;font-size:12px;color:var(--metin-3);white-space:nowrap}
.ky .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ky .ay{width:1px;height:auto;align-self:stretch;margin:4px 0;background:var(--cizgi);flex:none}
.ky .sg{margin-left:auto;text-align:right;flex:none}
.ky .sg b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.ky .sg small{display:block;font-size:12px;color:var(--metin-3)}
.ky .hv{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.ky .hv>div{min-width:0}
.ky .hv i.d{font-size:16px;color:var(--metin-2)}
.yy2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 var(--kenar)}
.kk{min-width:0;padding:12px 14px;border-radius:var(--k-kontrol);background:var(--kart);display:flex;flex-direction:column;gap:8px}
.kk .u{display:flex;align-items:center;gap:var(--ikon-bosluk);font-size:12.5px;font-weight:var(--y-kalin);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kk .u i{font-size:12px;color:var(--marka-metin)}
.hv2{display:flex;align-items:stretch;gap:10px;min-width:0}
.hv2>span:not(.bol){min-width:0}
.hv2 small{display:block;font-size:11.5px;color:var(--metin-3);white-space:nowrap}
.hv2 b{display:block;margin-top:1px;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hv2 .bol{width:1px;align-self:stretch;background:var(--cizgi);flex:none}
.py{gap:10px;padding:0 var(--kenar)}
.py>a{flex:none;width:150px;padding:12px 14px;border-radius:var(--k-kontrol);background:var(--kart);scroll-snap-align:start}
.py small{display:block;font-size:12.5px;color:var(--metin-3);white-space:nowrap}
.py b{display:block;margin-top:4px;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.py em{display:block;margin-top:2px;font-style:normal;font-size:12.5px;font-weight:var(--y-kalin)}
.py em.y{color:var(--artis)}
.py em.d{color:var(--azalis)}
.bant .pd-ray{padding:0 var(--kenar);margin-top:0}
.kz{gap:12px;padding:0 var(--kenar)}
.kz>a{flex:none;width:250px;height:340px;scroll-snap-align:start;border-radius:var(--k-kart);overflow:hidden;background:var(--marka);color:var(--siyah);display:flex;flex-direction:column;position:relative}
.kz .gr{height:50%;flex:none}
.kz .av{position:absolute;left:16px;top:calc(50% - 26px);width:52px;height:52px;border-radius:var(--k-daire);background:var(--siyah);color:var(--marka);display:grid;place-items:center;font-size:17px;font-weight:var(--y-kalin);outline:4px solid var(--marka)}
.kz .ic{flex:1;min-height:0;display:flex;flex-direction:column;padding:34px 16px 16px;position:relative}
.kz .tr{position:absolute;right:16px;top:14px;font-size:22px;opacity:.25}
.kz h4{font-size:18px;line-height:1.22;letter-spacing:-.015em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kz .yz{margin-top:auto;display:block;min-width:0}
.kz .yz b{display:block;font-size:14px;white-space:nowrap}
.kz .yz small{display:block;font-size:12.5px;color:rgba(18,18,18,.68);white-space:nowrap}
/* takım: üye → canlı maç kutusu; misafir → giriş çağrısı */
.tk-et{display:flex;align-items:center;gap:var(--ikon-bosluk);padding:0 var(--kenar);margin:18px 0 10px;font-size:13px;font-weight:var(--y-kalin);white-space:nowrap}
.tk-et i{color:var(--marka-metin);font-size:12px}
.tk-et .canli-et{margin-left:auto}
.cg{margin:0 var(--kenar);padding:14px;border-radius:var(--k-kart);border:1.5px dashed var(--cizgi);display:flex;align-items:center;gap:12px}
.cg .ik{width:44px;height:44px;border-radius:var(--k-kontrol);background:var(--kart);display:grid;place-items:center;font-size:18px;color:var(--marka-metin);flex:none}
.cg .t{flex:1;min-width:0}
.cg b{display:block;font-size:15px}
.cg small{display:block;margin-top:2px;font-size:12.5px;color:var(--metin-3)}
.cg a{height:40px;padding:0 14px;border-radius:var(--k-kontrol);background:var(--metin);color:var(--zemin);font-size:14px;font-weight:var(--y-kalin);display:inline-flex;align-items:center;gap:var(--ikon-bosluk);white-space:nowrap}
</style>
</head>
<body data-durum="acik">
<div class="ekran" id="ekran"></div>
<div class="ust-k" id="ustk"></div>
<div class="perde-m" id="perde-m"></div>
<nav class="menu" id="menu" aria-label="Menü"></nav>
<script>
(function(){
  var B = H.B, AY = H.AY, d = H.detay(), Q = new URLSearchParams(location.search);
  document.title = 'Kök · Ana sayfa · ' + (H.uye ? 'Üye' : 'Misafir');
  function bul(ad){ return D.bolumler.filter(function(b){ return b.ad === ad; })[0]; }
  function meta(h){ return H.meta([h.yazar, h.sure]); }
  function bas(b, ek){ return '<div class="bb"><h2><span class="bi"><i class="fa-solid ' + b.ikon + '"></i></span>' + b.ad + '</h2><a href="' + H.liste() + '">' + (ek || 'Tümü') + '<i class="fa-solid fa-chevron-right"></i></a></div>'; }

  /* Hero: manşet slaytları + karşılama ve baskı */
  var MENU_D = '<button class="dd" type="button" data-menu aria-label="Menü"><i class="fa-solid fa-bars"></i></button>';
  var bk = H.baski(), gun = D.simdi.gun + ', ' + D.simdi.tarih.replace(' 2026', '') + ' · ' + H.saat();
  function hero(){
    return '<div class="hero-k"><span class="hilal" aria-hidden="true"></span><header class="hero"><div class="hero-ray" id="hr">' + D.manset.map(function(m){
        return '<a href="' + d + '" style="background-image:' + G(m.g) + '"><span class="et"><i class="fa-solid ' + m.ikon + '"></i>' + m.kat + '<span>· ' + m.sure + '</span></span><h2>' + m.baslik + '</h2>' +
          '<span class="yz"><span class="av">' + m.yazar.charAt(0) + '</span>' + m.yazar + '</span></a>'; }).join('') + '</div>' +
      '<div class="hero-ust"><div class="sr"><span class="logo" role="img" aria-label="Dada Haber"></span>' +
        '<a class="dd" aria-label="Ara"><i class="fa-solid fa-magnifying-glass"></i></a>' +
        (H.uye ? '<a class="dd av" aria-label="Hesabım">' + D.uye.ad.charAt(0) + '</a>' : '<a class="gir"><i class="fa-solid fa-right-to-bracket"></i>Giriş yap</a>') + MENU_D + '</div>' +
        '<div class="gun">' + gun + '</div><h1>İyi günler' + (H.uye ? ', ' + D.uye.ad : '') + '</h1>' +
        '<span class="ebr"><i class="fa-solid ' + bk.ikon + '"></i>' + bk.ad + '<em>· sonraki ' + bk.sonraki + '</em></span></div>' +
      '<div class="nk" id="nk" aria-hidden="true">' + D.manset.map(function(_, i){ return '<i' + (i === 0 ? ' class="on"' : '') + '></i>'; }).join('') + '</div>' +
      '<span class="sy tnum" id="sy">1 / ' + D.manset.length + '</span></header></div>';
  }
  /* A: yana kayan büyük kartlar */
  function A(ad){
    var b = bul(ad);
    return bas(b) + '<div class="ka ks">' + b.haberler.slice(0, 6).map(function(h){
      return '<a href="' + d + '"><div class="gr" style="background-image:' + G(h.g) + '">' + (h.medya ? '<span class="md"><i class="fa-solid fa-play"></i>' + h.medya + '</span>' : '') + '</div>' +
        '<h3>' + h.baslik + '</h3>' + meta(h) + '</a>'; }).join('') + '</div>';
  }
  /* B: alt alta liste */
  function Bl(ad){
    var b = bul(ad);
    return bas(b) + '<ul class="kb">' + b.haberler.slice(0, 4).map(function(h){
      return '<li><a href="' + d + '"><div><h3>' + h.baslik + '</h3>' + meta(h) + '</div><div class="gr" style="background-image:' + G(h.g) + '"></div></a></li>'; }).join('') + '</ul>';
  }
  /* Diğer Bölümler: bölüm başına tek satır (B kalıbı) */
  function diger(adlar){
    return '<div class="bb"><h2><span class="bi"><i class="fa-solid fa-shapes"></i></span>Diğer Bölümler</h2></div><ul class="kb dg">' + adlar.map(function(ad){ var b = bul(ad);
      return '<li><a href="' + H.liste() + '"><span class="bi"><i class="fa-solid ' + b.ikon + '"></i></span><span class="t"><b>' + b.ad + '</b><small>' + b.haberler[0].baslik + '</small></span><i class="fa-solid fa-chevron-right"></i></a></li>'; }).join('') + '</ul>';
  }
  /* kişisel: Bugün Senin İçin (üye) + takım */
  function kisisel(){
    var m = D.mac;
    var takim = H.uye
      ? '<div class="tk-et"><i class="fa-solid fa-futbol"></i>Takımın · ' + m.ev + H.canli() + '</div>' + B.mac()
      : '<div class="cg"><span class="ik"><i class="fa-solid fa-futbol"></i></span><span class="t"><b>Takımını seç</b><small>Canlı maçı ve skoru burada görmek için</small></span><a><i class="fa-solid fa-right-to-bracket"></i>Giriş yap</a></div>';
    return (H.uye ? B.senin('buyuk').replace('kt-tek sik', 'kt-tek') : '') + takim;
  }
  /* hava ve namaz: ayrı ayrı, bölüm aralarında tek satır kutu (K30) */
  function hava(){
    var h = D.hava, y = h.gunler[0];
    return '<a class="ky"><span class="ik"><i class="fa-solid ' + h.ikon + '"></i></span><span class="hv"><span class="t"><small>' + h.sehir + ' · Bugün</small><b>' + h.derece + '° ' + h.durum + '</b></span><span class="ay"></span>' +
      '<span class="t"><small>Yarın</small><b>' + y.y + '° / ' + y.d + '°</b></span><i class="fa-solid ' + y.ikon + ' d"></i></span></a>';
  }
  function namaz(){
    var n = D.namaz;
    return '<a class="ky"><span class="ik"><i class="fa-solid fa-mosque"></i></span><span class="t"><small>' + n.sehir + ' · Namaz vakti</small><b>' + n.siradaki + ' ezanı ' + n.saat + '</b></span>' +
      '<span class="sg"><b>' + n.kalan.replace(':', ' sa ') + ' dk</b><small>kaldı</small></span></a>';
  }
  function piyasa(){
    var p = D.piyasa;
    return '<div class="bb"><h2><span class="bi"><i class="fa-solid fa-chart-column"></i></span>Piyasalar</h2><span class="not">' + p.guncelleme + ' · 15 dk gecikmeli</span></div><div class="py ks">' +
      p.liste.map(function(x){ return '<a><small>' + x.ad + '</small><b>' + x.deger + '</b><em class="' + x.yon + '">' + (x.yon === 'y' ? '▲' : '▼') + ' %' + x.degisim + '</em></a>'; }).join('') + '</div>';
  }
  function sd(){ return B.sd('ray').replace('<section class="bl sik">', '').replace(/<\/section>$/, ''); }
  function podcast(){ return '<div class="bb"><h2><span class="bi"><i class="fa-solid fa-podcast"></i></span>Podcast</h2><a>Tümü<i class="fa-solid fa-chevron-right"></i></a></div><div class="pd-ray ks">' +
    D.podcast.map(function(p){ return '<a><span class="gr" style="background-image:' + G(p.g) + '"><i class="fa-solid fa-play"></i></span><span><small>' + p.seri + '</small><b class="iki">' + p.baslik + '</b><em>' + p.no + ' · ' + p.sure + '</em></span></a>'; }).join('') + '</div>'; }
  /* Köşe Yazıları (K26): marka sarısı kart, görsel kartın üst yarısı, yazar baş harfi görselin kenarına biner */
  function kose(){ return '<div class="bb"><h2><span class="bi"><i class="fa-solid fa-feather-pointed"></i></span>Köşe Yazıları</h2><a>Yazarlar<i class="fa-solid fa-chevron-right"></i></a></div><div class="kz ks">' +
    D.koseYazilari.map(function(k){ return '<a><span class="gr" style="background-image:' + G(k.g) + '"></span><span class="av">' + k.ad.split(' ').map(function(x){ return x.charAt(0); }).join('') + '</span>' +
      '<span class="ic"><i class="fa-solid fa-quote-left tr" aria-hidden="true"></i><h4>' + k.baslik + '</h4><span class="yz"><b>' + k.ad + '</b><small>' + k.unvan + '</small></span></span></a>'; }).join('') + '</div>'; }
  function akis(){ return B.akis().replace('<section class="bl">', '').replace(/<\/section>$/, '').replace('>Akış</h2>', '>Akış<small>· kısa videolar</small></h2>'); }

  /* Sayfa sırası (panelden yönetilecek; K22). Her satır bir bant; bantlar sırayla düz / tonlu. */
  var KOK_SIRA = [
    ['hikaye', function(){ return '<div data-hikaye-serit></div>'; }],
    ['sd', sd],
    ['kisisel', kisisel],
    ['Gündem', function(){ return Bl('Gündem'); }],
    ['hava', hava],
    ['Spor', function(){ return A('Spor'); }],
    ['spiker', function(){ return B.spiker('serit').replace('kt-tek sik', 'kt-tek'); }],
    ['Finans', function(){ return Bl('Finans'); }],
    ['piyasa', piyasa],
    ['Savunma', function(){ return A('Savunma'); }],
    ['namaz', namaz],
    ['akis', akis],
    ['diger', function(){ return diger(['Kadın', 'Dünya', 'Kampüs', 'Keşfet']); }],
    ['kose', kose],
    ['podcast', podcast]
  ];
  var z = 0;
  document.getElementById('ekran').innerHTML = hero() + KOK_SIRA.map(function(s){
    if (s[0] === 'hikaye') return '<section class="bant hk-b">' + s[1]() + '</section>';
    return '<section class="bant' + (z++ % 2 === 0 ? ' ton' : '') + '" data-b="' + s[0] + '">' + s[1]() + '</section>';
  }).join('') + '<div class="son"></div>';

  /* hero slayt sayacı; kapakta durum çubuğu açık */
  var hr = document.getElementById('hr'), nk = document.getElementById('nk').children, sy = document.getElementById('sy'), e = document.getElementById('ekran');
  hr.addEventListener('scroll', function(){ var i = Math.round(hr.scrollLeft / hr.clientWidth); [].forEach.call(nk, function(x, j){ x.className = j === i ? 'on' : ''; }); sy.textContent = (i + 1) + ' / ' + D.manset.length; }, { passive: true });
  document.getElementById('ustk').innerHTML = '<span class="logo" role="img" aria-label="Dada Haber"></span><span class="bk"><i class="fa-solid ' + bk.ikon + '"></i>' + bk.kisa + '</span>' +
    '<a class="dd" aria-label="Ara"><i class="fa-solid fa-magnifying-glass"></i></a>' + (H.uye ? '<a class="dd av" aria-label="Hesabım">' + D.uye.ad.charAt(0) + '</a>' : '<a class="dd" aria-label="Giriş yap"><i class="fa-solid fa-right-to-bracket"></i></a>') + MENU_D;
  /* menü (K31): Dada Gastro ortak menüsünün yapısı: sağdan çekmece; hesap kartı; ikonlu, açılır alt başlıklı liste; altta ayar ve kurumsal.
     Alt başlıklar DADAHABER-10'dan (her bölümün ilk sütunu). */
  var ALT = { 'Gündem': ['Siyaset', 'Toplum', 'Hukuk', 'Güvenlik', 'Çevre ve Afet', 'Yerel Haberler'], 'Spor': ['Futbol', 'Basketbol', 'Voleybol', 'Canlı Skor', 'Puan Durumu', 'Transfer'],
    'Finans': ['Piyasa Ekranı', 'Döviz', 'Altın', 'Borsa', 'Kişisel Finans', 'Enflasyon'], 'Kadın': ['Kadın Gündemi', 'Kadın Hakları', 'Kadın Sağlığı', 'Ev ve Yaşam'],
    'Savunma': ['Millî Projeler', 'İHA ve SİHA', 'Hava Platformları', 'Millî Güvenlik', 'NATO'], 'Dünya': ['Avrupa', 'Orta Doğu', 'Amerika', 'Asya Pasifik', 'Diplomasi'],
    'Kampüs': ['YKS', 'KPSS', 'Burslar', 'Staj', 'Kariyer'], 'Keşfet': ['Teknoloji', 'Bilim', 'Sağlık', 'Kültür ve Sanat', 'Dada Özet', 'Günün 5\'i'] };
  var M = document.getElementById('menu'), ok = '<i class="fa-solid fa-chevron-right"></i>';
  var hesap = H.uye
    ? '<div class="mh"><div class="mh-u"><span class="av">' + D.uye.ad.charAt(0) + '</span><span class="t"><b>' + D.uye.ad + '</b><small><i class="fa-solid fa-fire"></i>' + D.uye.seri + ' günlük okuma serisi</small></span><a class="pr">Profilim' + ok + '</a></div>' +
      '<div class="mh-k"><a><i class="fa-solid fa-bookmark"></i>Kaydedilenler</a><a><i class="fa-solid fa-heart"></i>Takiplerim</a><a><i class="fa-solid fa-bell"></i>Bildirimler<span class="n">3</span></a></div></div>'
    : '<div class="mh"><b class="mr">Merhaba</b><p>Haberleri kaydetmek, konuları takip etmek ve yorum yazmak için giriş yap.</p><div class="mh-g"><a class="a"><i class="fa-solid fa-right-to-bracket"></i>Giriş yap</a><a class="b">Üye ol</a></div></div>';
  var sat = function(ik, ad, ek, cls){ return '<a class="ms' + (cls ? ' ' + cls : '') + '"><i class="fa-solid ' + ik + '"></i><span>' + ad + '</span>' + (ek || '') + '</a>'; };
  M.innerHTML = '<div class="mu"><span class="logo" role="img" aria-label="Dada Haber"></span><button class="dd" type="button" data-menu-kapat aria-label="Menüyü kapat"><i class="fa-solid fa-xmark"></i></button></div><div class="mi">' + hesap +
    '<nav class="mn">' + sat('fa-house', 'Ana Sayfa', '', 'on') +
      '<span class="mt">Bölümler</span>' + D.bolumler.map(function(b){ return '<details class="ma"><summary><i class="fa-solid ' + b.ikon + '"></i><span>' + b.ad + '</span><i class="fa-solid fa-chevron-down cv"></i></summary>' +
        '<div class="mc"><a class="tm" href="' + H.liste() + '">Bütün ' + b.ad + ' haberleri' + ok + '</a>' + (ALT[b.ad] || []).map(function(x){ return '<a>' + x + '</a>'; }).join('') + '</div></details>'; }).join('') +
      '<span class="mt">Dinle ve izle</span>' + sat('fa-headphones', 'Haber Dinle', '<span class="cn"><span class="canli-nokta"></span>Yayında</span>') + sat('fa-mobile-screen-button', 'Akış', '<em>12 video</em>') + sat('fa-podcast', 'Podcast') + sat('fa-circle-play', 'Video Haber') + sat('fa-camera', 'Foto Fokus') + sat('fa-chart-pie', 'İnfografik') +
      '<span class="mt">Dada</span>' + sat('fa-feather-pointed', 'Yazarlar') + sat('fa-bolt', 'Son Dakika') + sat('fa-calendar-day', 'Gündem Takvimi') + sat('fa-message', 'Görüş Bildir') + '</nav>' +
    '<div class="mf"><a class="ms"><i class="fa-solid fa-circle-half-stroke"></i><span>Görünüm: <b>Sistem</b></span><i class="fa-solid fa-chevron-down cv"></i></a><a class="ms"><i class="fa-solid fa-font"></i><span>Yazı boyutu: <b>Orta</b></span><i class="fa-solid fa-chevron-down cv"></i></a>' +
      '<div class="mf-bag"><a>Hakkımızda</a><a>Künye</a><a>İletişim</a><a>Gizlilik Politikası</a></div></div></div>';
  document.addEventListener('click', function(ev){
    if (ev.target.closest('[data-menu]')) document.body.classList.add('menu-acik');
    if (ev.target.closest('[data-menu-kapat]') || ev.target.id === 'perde-m') document.body.classList.remove('menu-acik');
  });
  /* hero geçilince üst çubuk o anki manşet görseliyle belirir; hikâye şeridi üst çubuğun altına yapışır ve küçülür (K30) */
  var ustk = document.getElementById('ustk'), hk = e.querySelector('.hk-b');
  function gorsel(){ var i = Math.round(hr.scrollLeft / hr.clientWidth); ustk.style.setProperty('--ust-g', G(D.manset[i].g)); }
  hr.addEventListener('scroll', gorsel, { passive: true }); gorsel();
  function kay(){ var v = e.scrollTop > 380; document.body.setAttribute('data-durum', 'acik'); ustk.classList.toggle('acik', v); hk.classList.toggle('yapisik', e.scrollTop >= e.querySelector('.hero-k').offsetHeight - ustk.offsetHeight - 1); }
  e.addEventListener('scroll', kay, { passive: true });
  H.altCubuk('ana');
  H.oynatici();
  H.raylar();
  if (Q.get('kay')) e.scrollTop = +Q.get('kay');
  kay();
  if (Q.get('menu') === '1') document.body.classList.add('menu-acik');
})();
</script>
<script src="../_ortak/hikaye.js"></script>
</body>

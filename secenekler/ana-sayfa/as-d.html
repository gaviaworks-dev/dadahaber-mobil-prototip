<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>AS-D · Kart destesi · Dada Haber</title>
<link rel="stylesheet" href="../_ortak/cerceve.css">
<link rel="stylesheet" href="../_ortak/marka.css">
<link rel="stylesheet" href="../_ortak/hikaye.css">
<script src="../_ortak/icerik.js"></script>
<script src="../_ortak/cerceve.js"></script>
<script src="../_ortak/icerik-ek.js"></script>
<script src="../_ortak/hikaye.js"></script>
<style>
/* AS-D · Kart destesi: her haber tam ekran kart, dikey kaydırmayla kart kart. Liste kipi tek dokunuşla. */
.ekran{scroll-snap-type:y mandatory;background:#000}
html.tam .ekran{scroll-snap-type:none}

/* Üst katman: logo + Kartlar/Liste anahtarı (cam yalnız kontrol katmanında) */
.ust{position:absolute;left:0;right:0;top:var(--ust-guvenli);z-index:70;height:52px;padding:0 var(--kenar);display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.ust>*{pointer-events:auto}
.ust .logo{height:24px}
.anahtar{display:grid;grid-template-columns:1fr 1fr;height:44px;padding:4px;border-radius:var(--k-kart);background:var(--cam);border:1px solid var(--cam-cizgi);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.anahtar button{height:36px;min-width:76px;border-radius:var(--k-kontrol);font-size:13px;font-weight:var(--y-kalin);color:rgba(255,255,255,.75);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.anahtar button[aria-pressed="true"]{background:#fff;color:#121212}
body.liste-kipi .anahtar{background:var(--zemin-2);border-color:var(--cizgi)}
body.liste-kipi .anahtar button{color:var(--metin-3)}
body.liste-kipi .anahtar button[aria-pressed="true"]{background:var(--yuzey);color:var(--metin);box-shadow:var(--golge)}

/* Tam ekran kart */
.kart{position:relative;height:844px;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;cursor:pointer;color:#fff}
.kart>.gr{position:absolute;inset:0}
.kart::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 34%,rgba(0,0,0,.72) 58%,rgba(0,0,0,.92) 100%)}
.kart-ic{position:absolute;left:0;right:0;bottom:calc(56px + var(--alt-guvenli) + 18px);z-index:2;padding:0 72px 0 var(--kenar)}
.cip{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:var(--k-ic);background:var(--cam);border:1px solid var(--cam-cizgi);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:12px;font-weight:var(--y-kalin);letter-spacing:.1em;text-transform:uppercase}
.cip i{color:var(--marka)}
.medya{margin-left:6px;letter-spacing:0;text-transform:none;font-weight:var(--y-kalin)}
.kart h2{margin-top:12px;font-size:26px;line-height:1.14;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;font-weight:var(--y-kalin);letter-spacing:-.02em;text-wrap:pretty}
.ozet{margin-top:14px;border-radius:var(--k-kart);padding:12px 14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ozet-et{font-size:11px;font-weight:var(--y-kalin);letter-spacing:.12em;text-transform:uppercase;color:var(--marka);display:flex;align-items:center;gap:8px}
.ozet ul{list-style:none;margin-top:8px;display:grid;gap:6px}
.ozet li{display:flex;gap:8px;font-size:14.5px;line-height:1.38;color:rgba(255,255,255,.92)}
.ozet li::before{content:"";flex:0 0 6px;height:6px;margin-top:7px;border-radius:var(--k-cubuk);background:var(--marka)}
.meta{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,.78);white-space:nowrap;overflow:hidden}
.meta .av{width:24px;height:24px;border-radius:var(--k-daire);background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:11px;font-weight:var(--y-kalin);color:#fff;flex:0 0 auto}
.meta i{color:var(--marka);font-size:11px}
.meta .ay{width:3px;height:3px;border-radius:var(--k-daire);background:rgba(255,255,255,.5);flex:0 0 auto}
.tam-haber{margin-top:16px;height:48px;width:100%;border-radius:var(--k-kart);background:#fff;color:#121212;font-size:15px;font-weight:var(--y-kalin);display:flex;align-items:center;justify-content:center;gap:8px}

/* Sağ eylem sütunu: başparmak bölgesinde */
.eylem{position:absolute;right:10px;bottom:calc(56px + var(--alt-guvenli) + 18px);z-index:3;display:flex;flex-direction:column;gap:14px;align-items:center}
.eylem button{width:48px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:var(--y-orta);color:#fff}
.eylem button span.d{width:48px;height:48px;border-radius:var(--k-kart);background:var(--cam);border:1px solid var(--cam-cizgi);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;font-size:18px}
.eylem button.dinle span.d{background:var(--marka);border-color:transparent;color:#121212}

/* Sıra göstergesi */
.sira{position:absolute;right:16px;top:calc(var(--ust-guvenli) + 64px);z-index:3;display:flex;flex-direction:column;gap:5px;align-items:center}
.sira i{display:block;width:4px;height:18px;border-radius:var(--k-cubuk);background:rgba(255,255,255,.35)}
.sira i.ok{background:var(--marka);height:28px}
.sira b{margin-top:4px;font-size:11px;font-weight:var(--y-kalin);color:#fff;letter-spacing:.04em}

/* Kapanış kartı: temaya uyar */
.kapanis{position:relative;height:844px;scroll-snap-align:start;background:var(--zemin);color:var(--metin);display:flex;flex-direction:column;justify-content:center;padding:0 24px calc(56px + var(--alt-guvenli))}
.kapanis::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 45% at 50% 18%,rgba(var(--marka-rgb),.22),transparent 70%);pointer-events:none}
.kapanis>*{position:relative}
.bitti{width:72px;height:72px;border-radius:var(--k-buyuk);background:var(--marka);color:#121212;display:grid;place-items:center;font-size:30px}
.kapanis h2{margin-top:22px;font-size:30px;line-height:1.1;font-weight:var(--y-kalin);letter-spacing:-.02em}
.kapanis p{margin-top:10px;font-size:15px;line-height:1.5;color:var(--metin-2)}
.kapanis .say{margin-top:22px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kapanis .say i{height:4px;border-radius:var(--k-cubuk);background:var(--marka)}
.kd{margin-top:14px;height:52px;border-radius:var(--k-kart);font-size:15px;font-weight:var(--y-kalin);display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.kd.bir{margin-top:26px;background:var(--metin);color:var(--zemin)}
.kd.iki{border:1px solid var(--cizgi);background:var(--yuzey)}
.kd.iki i{color:var(--marka-metin)}
.kapanis small{margin-top:18px;font-size:12.5px;color:var(--metin-3);text-align:center}

/* Liste kipi (anahtarın ikinci hali): temaya uyar */
.liste{display:none;position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;background:var(--zemin);padding:calc(var(--ust-guvenli) + 60px) var(--kenar) calc(56px + var(--alt-guvenli) + 20px)}
.liste::-webkit-scrollbar{display:none}
body.liste-kipi .liste{display:block}
body.liste-kipi .ekran{display:none}
.liste h1{font-size:28px;font-weight:var(--y-kalin);letter-spacing:-.02em}
.liste .alt-b{font-size:13px;color:var(--metin-3);margin-top:2px}
.ls{display:grid;grid-template-columns:28px 1fr 84px;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--cizgi);cursor:pointer}
.ls .n{font-size:15px;font-weight:var(--y-kalin);color:var(--marka-metin)}
.ls .k{font-size:11px;font-weight:var(--y-kalin);letter-spacing:.1em;text-transform:uppercase;color:var(--metin-3)}
.ls h3{margin-top:3px;font-size:15.5px;line-height:1.3;font-weight:var(--y-kalin)}
.ls .gr{width:84px;height:84px;border-radius:var(--k-kart)}
.liste .son-d{margin-top:24px}
.liste .son-d h2{font-size:18px;font-weight:var(--y-kalin);display:flex;align-items:center;gap:8px}
.liste .son-d h2 i{color:var(--anlik);font-size:15px}
.sdl{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--cizgi);font-size:14.5px;line-height:1.35;font-weight:var(--y-orta)}
.sdl b{color:var(--marka-metin);font-size:13.5px}

/* Alt gezinme: kart kipinde koyu cam, liste kipinde temaya uyar */
.alt{position:absolute;left:0;right:0;bottom:0;z-index:80;padding-bottom:var(--alt-guvenli);background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.65));}
body.kapanista .alt,body.liste-kipi .alt{background:color-mix(in srgb,var(--yuzey) 90%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--cizgi)}
.alt nav{height:56px;display:grid;grid-template-columns:repeat(4,1fr)}
.alt a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;font-weight:var(--y-orta);color:rgba(255,255,255,.7);min-height:44px}
.alt a i{font-size:19px}
.alt a[aria-current="page"]{color:#fff}
.alt a[aria-current="page"] i{color:var(--marka)}
body.kapanista .alt a,body.liste-kipi .alt a{color:var(--metin-3)}
body.kapanista .alt a[aria-current="page"],body.liste-kipi .alt a[aria-current="page"]{color:var(--metin)}
html:not([data-tema="koyu"]) body.kapanista .alt a[aria-current="page"] i,html:not([data-tema="koyu"]) body.liste-kipi .alt a[aria-current="page"] i{color:var(--metin)}
.alt .vurgu{width:20px;height:3px;border-radius:var(--k-cubuk);background:var(--marka)}
/* Kart kipinde hikâye şeridi fotoğrafın üstünde: üstten aşağı solan koyu katman (durum çubuğu, logo ve şerit okunur), daireler küçük */
.hk-d{position:absolute;left:0;right:0;top:0;z-index:65;padding-top:calc(var(--ust-guvenli) + 48px);padding-bottom:36px;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.5) 45%,rgba(0,0,0,.18) 78%,rgba(0,0,0,0) 100%)}
.hk-d .hk{pointer-events:auto;gap:10px;padding-top:6px}
.hk-d .hk-o{width:58px;gap:7px}
.hk-d .hk-f{width:48px;height:48px;outline-offset:2.5px}
.hk-d .hk-f i{width:18px;height:18px;font-size:8px;right:-5px;bottom:-5px;box-shadow:0 0 0 2px rgba(0,0,0,.6)}
.hk-d .hk-a{font-size:11.5px}
body:not(.kart-kipi) .hk-d{display:none}
.hk-l .hk{padding-left:0;padding-right:0;scroll-padding-inline:0}
</style>
</head>
<body class="kart-kipi" data-durum="acik" data-ec="acik">
<div class="ust">
  <span class="logo" role="img" aria-label="Dada Haber"></span>
  <div class="anahtar" role="group" aria-label="Görünüm">
    <button aria-pressed="true" data-kip="kart"><i class="fa-solid fa-layer-group"></i>Kartlar</button>
    <button aria-pressed="false" data-kip="liste"><i class="fa-solid fa-list"></i>Liste</button>
  </div>
</div>

<div class="hk-d" data-hikaye-serit data-zemin="koyu"></div>
<main class="ekran" id="ekran" aria-label="Manşet kartları"></main>

<section class="liste" id="liste" aria-label="Manşet listesi">
  <div class="hk-l" data-hikaye-serit></div>
  <h1>Bugünün Manşeti</h1>
  <p class="alt-b" id="liste-alt"></p>
  <div id="liste-ic"></div>
  <div class="son-d"><h2><i class="fa-solid fa-bolt"></i>Son Dakika</h2><div id="sdl"></div></div>
</section>

<div class="alt">
  <nav aria-label="Ana gezinme">
    <a href="#" aria-current="page"><i class="fa-solid fa-layer-group"></i>Özet<span class="vurgu"></span></a>
    <a href="#"><i class="fa-solid fa-mobile-screen"></i>Akış</a>
    <a href="#"><i class="fa-solid fa-magnifying-glass"></i>Ara</a>
    <a href="#"><i class="fa-solid fa-user"></i>Hesabım</a>
  </nav>
</div>

<script>
(function(){
  var D = window.D, M = D.manset;
  /* 15 sn Dada Özet maddesi yalnızca D.ozet'te karşılığı olan manşetlerde (uydurma yok) */
  var oz = { 0: D.ozet[0], 3: D.ozet[2] };
  function bas(ad){ return ad.split(' ').map(function(p){ return p[0]; }).join('').slice(0,2); }
  var h = M.map(function(x, i){
    var o = oz[i];
    var ozet = o ? '<div class="ozet"><div class="ozet-et"><i class="fa-solid fa-stopwatch"></i>15 saniyede</div><ul>' +
      o.maddeler.map(function(m){ return '<li>' + m + '</li>'; }).join('') + '</ul></div>' : '';
    var sira = M.map(function(_, j){ return '<i class="' + (j === i ? 'ok' : '') + '"></i>'; }).join('');
    return '<article class="kart" data-kart data-acik="1">' +
      '<div class="gr" data-g="' + x.g + '"></div>' +
      '<div class="sira" aria-hidden="true">' + sira + '<b class="tnum">' + (i+1) + '/' + M.length + '</b></div>' +
      '<div class="kart-ic"><span class="cip"><i class="fa-solid ' + x.ikon + '"></i>' + x.kat + (x.medya ? '<span class="medya">· ' + x.medya[0] + '</span>' : '') + '</span>' +
      '<h2>' + x.baslik + '</h2>' + ozet +
      '<div class="meta"><span class="av">' + bas(x.yazar) + '</span><span class="tek">' + x.yazar + '</span><span class="ay"></span>' +
      '<span class="ik"><i class="fa-solid fa-clock"></i>' + x.sure + '</span><span class="ay"></span><span class="ik tnum"><i class="fa-solid fa-eye"></i>' + x.izlenme + '</span></div>' +
      '<button class="tam-haber">Tam haber<i class="fa-solid fa-arrow-right"></i></button></div>' +
      '<div class="eylem"><button class="dinle"><span class="d"><i class="fa-solid fa-headphones"></i></span>Dinle</button>' +
      '<button><span class="d"><i class="fa-solid fa-bookmark"></i></span>Kaydet</button>' +
      '<button><span class="d"><i class="fa-solid fa-share-nodes"></i></span>Paylaş</button></div></article>';
  }).join('');
  h += '<section class="kapanis" id="kapanis"><div class="bitti"><i class="fa-solid fa-check"></i></div>' +
    '<h2>Günün akışı<br>burada bitiyor.</h2><p>Manşetteki beş haberin sonuna geldin. Ayrıntı istersen listeye geç ya da günün özetini dinle.</p>' +
    '<div class="say" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>' +
    '<button class="kd bir" data-kip="liste"><i class="fa-solid fa-list"></i>Bütün haberleri listede gör</button>' +
    '<button class="kd iki"><i class="fa-solid fa-headphones"></i>Günün 5\'ini dinle · ' + D.gunun5.dinleme + '</button>' +
    '<small>Yeni manşet geldiğinde destenin başına eklenir</small></section>';
  document.getElementById('ekran').innerHTML = h;

  /* Liste kipi */
  document.getElementById('liste-alt').textContent = D.simdi.gun + ', ' + D.simdi.tarih + ' · ' + D.simdi.saat;
  document.getElementById('liste-ic').innerHTML = M.map(function(x, i){
    return '<article class="ls" data-kart><span class="n tnum">' + (i+1) + '</span><div><span class="k">' + x.kat + ' · ' + x.sure + '</span><h3 class="uc">' + x.baslik + '</h3></div><div class="gr" data-g="' + x.g + '"></div></article>';
  }).join('');
  document.getElementById('sdl').innerHTML = D.sonDakika.slice(0,4).map(function(x){
    return '<div class="sdl"><b class="tnum">' + x.saat + '</b><span class="iki">' + x.baslik + '</span></div>';
  }).join('');

  /* Kartlar ↔ Liste */
  var body = document.body;
  function kip(k){
    body.classList.toggle('liste-kipi', k === 'liste');
    body.classList.toggle('kart-kipi', k === 'kart');
    document.querySelectorAll('.anahtar button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.kip === k); });
    durum();
  }
  document.addEventListener('click', function(e){ var b = e.target.closest('[data-kip]'); if (b) kip(b.dataset.kip); });

  /* Durum çubuğu ve alt çubuk: görselli kartta açık, kapanış ve liste kipinde temaya uyar */
  var koyu = document.documentElement.getAttribute('data-tema') === 'koyu';
  var ekran = document.getElementById('ekran');
  function durum(){
    var kap = body.classList.contains('liste-kipi') || ekran.scrollTop > (M.length - 0.5) * 844;
    body.classList.toggle('kapanista', kap && !body.classList.contains('liste-kipi'));
    if (kap){ if (koyu){ body.dataset.durum = 'acik'; body.dataset.ec = 'acik'; } else { delete body.dataset.durum; delete body.dataset.ec; } }
    else { body.dataset.durum = 'acik'; body.dataset.ec = 'acik'; }
  }
  ekran.addEventListener('scroll', durum, { passive: true });
  if (document.documentElement.classList.contains('tam')) { body.classList.add('kapanista'); }
  /* ?kip=liste → liste kipinde aç (seçenek sayfası ve denetim için) */
  if (new URLSearchParams(location.search).get('kip') === 'liste') kip('liste');
})();
</script>
</body>
</html>
